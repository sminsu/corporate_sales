- name: new_customers_by_month
  question: 12월 신규 고객 알려줘
  description: '고객 마스터의 최초등록년월일 기준 특정 월 신규 등록 고객 수를 조회합니다. 모집고객 실테이블이 별도로 확정되지 않은 경우 "모집고객"으로 임의 해석하지 않습니다.

    '
  sql: "SELECT\n  SUBSTRING(최초등록년월일, 1, 6) AS 기준년월,\n  COUNT(DISTINCT 고객식별자) AS 신규고객수\nFROM card_system.tbdaaat01\nWHERE SUBSTRING(최초등록년월일,\
    \ 1, 6) = '{기준년월}'\nGROUP BY SUBSTRING(최초등록년월일, 1, 6)\n"
  parameters:
    기준년월:
      type: string
      description: 신규 등록 기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202512'
  tags:
  - 신규고객
  - 가입고객
  - 등록고객
  - 고객
  - 월별
  - tbdaaat01
  - 파라미터
- name: new_female_customers_by_month
  question: 12월 신규 고객 중에서 여성 고객을 뽑아줘
  description: '고객 마스터에서 특정 월 신규 등록 고객 중 여성 고객 목록을 조회합니다. 여성 조건은 성별구분코드=''2''를 기본으로 사용합니다.

    '
  sql: "SELECT\n  고객식별자,\n  고객관리번호,\n  성별구분코드,\n  개인기업구분코드,\n  고객상태구분코드,\n  최초등록년월일\nFROM card_system.tbdaaat01\nWHERE SUBSTRING(최초등록년월일,\
    \ 1, 6) = '{기준년월}'\n  AND 성별구분코드 = '2'\nORDER BY 최초등록년월일 DESC, 고객식별자\nLIMIT {limit}\n"
  parameters:
    기준년월:
      type: string
      description: 신규 등록 기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202512'
    limit:
      type: integer
      description: 상세 목록 제한 건수
      default: '100'
  tags:
  - 신규고객
  - 여성
  - 성별
  - 상세목록
  - tbdaaat01
  - 파라미터
- name: new_customers_gender_distribution
  question: 12월 신규 고객을 성별로 나눠서 보여줘
  description: '특정 월 신규 등록 고객을 성별구분코드별로 집계합니다. 성별 조건을 WHERE로 제한하지 않고 GROUP BY에 포함합니다.

    '
  sql: "SELECT\n  SUBSTRING(최초등록년월일, 1, 6) AS 기준년월,\n  성별구분코드,\n  COUNT(DISTINCT 고객식별자) AS 고객수\nFROM card_system.tbdaaat01\n\
    WHERE SUBSTRING(최초등록년월일, 1, 6) = '{기준년월}'\nGROUP BY SUBSTRING(최초등록년월일, 1, 6), 성별구분코드\nORDER BY 성별구분코드\n"
  parameters:
    기준년월:
      type: string
      description: 신규 등록 기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202512'
  tags:
  - 신규고객
  - 성별
  - 분포
  - 집계
  - tbdaaat01
  - 파라미터
- name: new_corporate_customers_female_representative
  question: 12월 신규 기업고객 중 대표자가 여성인 고객을 보여줘
  description: '기업고객 마스터의 최초등록년월일 기준 신규 기업고객을 잡고, 기업대표자고객식별자로 고객 마스터를 조인해 대표자 성별을 필터링합니다.

    '
  sql: "SELECT\n  a.고객식별자 AS 기업고객식별자,\n  a.가맹점명 AS 기업명,\n  a.본사사업자등록번호,\n  a.최초등록년월일,\n  b.고객식별자 AS 대표자고객식별자,\n  b.성별구분코드\
    \ AS 대표자성별구분코드\nFROM card_system.tbdaaat14 a\nJOIN card_system.tbdaaat01 b\n  ON a.기업대표자고객식별자 = b.고객식별자\nWHERE SUBSTRING(a.최초등록년월일,\
    \ 1, 6) = '{기준년월}'\n  AND b.성별구분코드 = '2'\nORDER BY a.최초등록년월일 DESC, a.고객식별자\nLIMIT {limit}\n"
  parameters:
    기준년월:
      type: string
      description: 기업고객 신규 등록 기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202512'
    limit:
      type: integer
      description: 상세 목록 제한 건수
      default: '100'
  tags:
  - 기업고객
  - 신규등록
  - 대표자
  - 여성
  - 성별
  - JOIN
  - tbdaaat14
  - tbdaaat01
  - 파라미터
- name: corporate_customer_usage_by_registration_month
  question: 신규 기업고객의 이후 월별 카드 이용금액을 보여줘
  description: '기업고객 등록월과 월별 이용월을 분리해서 분석합니다. 기업고객 조건은 tbdaaat14, 이용금액은 tmdaa2e17을 사용합니다.

    '
  sql: "SELECT\n  SUBSTRING(a.최초등록년월일, 1, 6) AS 등록기준년월,\n  b.기준년월 AS 이용기준년월,\n  COUNT(DISTINCT a.고객식별자) AS 기업고객수,\n  SUM(b.금월일시불이용금액\
    \ + b.금월할부이용금액 + b.금월ca이용금액) AS 총이용금액\nFROM card_system.tbdaaat14 a\nJOIN card_system.tmdaa2e17 b\n  ON a.고객식별자 = b.고객식별자\n\
    WHERE SUBSTRING(a.최초등록년월일, 1, 6) = '{등록기준년월}'\n  AND b.기준년월 BETWEEN '{이용기간_시작}' AND '{이용기간_종료}'\nGROUP BY SUBSTRING(a.최초등록년월일,\
    \ 1, 6), b.기준년월\nORDER BY b.기준년월\n"
  parameters:
    등록기준년월:
      type: string
      description: 기업고객 등록 기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202512'
    이용기간_시작:
      type: string
      description: 이용 기준 시작월 (YYYYMM)
      required: true
      sample_values:
      - '202512'
    이용기간_종료:
      type: string
      description: 이용 기준 종료월 (YYYYMM)
      required: true
      sample_values:
      - '202601'
  tags:
  - 기업고객
  - 신규등록
  - 이용금액
  - 월별
  - 복합질의
  - JOIN
  - tbdaaat14
  - tmdaa2e17
  - 파라미터
- name: monthly_corporate_card_usage
  question: 월별 법인카드 이용금액 추이를 보여줘
  sql: "SELECT\n  기준년월,\n  SUM(금월이용합계금액) AS 총이용금액,\n  SUM(금월일시불이용금액) AS 일시불이용금액,\n  SUM(금월할부이용금액) AS 할부이용금액,\n  SUM(금월ca이용금액)\
    \ AS CA이용금액\nFROM card_system.tmdaa3e16\nWHERE 개인기업구분코드 = '2'\nGROUP BY 기준년월\nORDER BY 기준년월\n"
  tags:
  - 이용금액
  - 월별
  - 법인카드
  - 시계열
- name: daily_sales_amount
  question: 일별 매출금액을 알려줘
  sql: "SELECT\n  전표매출년월일,\n  COUNT(DISTINCT 매출전표번호) AS 매출건수,\n  SUM(매출금액) AS 총매출금액\nFROM card_system.tbdaabt30\nWHERE 개인기업구분코드\
    \ = '2'\n  AND (전표취소구분코드 IS NULL OR 전표취소구분코드 = '0')\nGROUP BY 전표매출년월일\nORDER BY 전표매출년월일\n"
  tags:
  - 매출
  - 일별
  - 시계열
- name: sales_by_industry
  question: 업종별 매출금액을 보여줘
  sql: "SELECT\n  b.업종대분류코드명,\n  b.가맹점업종명,\n  SUM(a.매출금액) AS 총매출금액,\n  COUNT(DISTINCT a.매출전표번호) AS 매출건수\nFROM card_system.tbdaabt30\
    \ a\nJOIN card_system.tbdaadb17 b\n  ON a.가맹점업종코드 = b.가맹점업종코드\nWHERE a.개인기업구분코드 = '2'\n  AND (a.전표취소구분코드 IS NULL OR a.전표취소구분코드\
    \ = '0')\nGROUP BY b.업종대분류코드명, b.가맹점업종명\nORDER BY 총매출금액 DESC\n"
  tags:
  - 업종
  - 매출
  - JOIN
- name: top_merchants_by_revenue
  question: 매출 상위 10개 가맹점은?
  sql: "SELECT\n  a.가맹점번호,\n  a.가맹점명,\n  b.가맹점업종명,\n  SUM(a.가맹점일시불매출금액 + a.가맹점할부매출금액) AS 총매출금액,\n  SUM(a.가맹점일시불매출건수 + a.가맹점할부매출건수)\
    \ AS 총매출건수,\n  AVG(a.신용카드가맹점수수료율) AS 평균수수료율\nFROM card_system.tmdaa5e11 a\nJOIN card_system.tbdaadb17 b\n  ON a.가맹점업종코드\
    \ = b.가맹점업종코드\nGROUP BY a.가맹점번호, a.가맹점명, b.가맹점업종명\nORDER BY 총매출금액 DESC\nLIMIT 10\n"
  tags:
  - 가맹점
  - 랭킹
  - TOP-N
- name: merchant_monthly_trend
  question: 가맹점 월별 매출 추이를 보여줘
  sql: "SELECT\n  기준년월,\n  SUM(가맹점일시불매출금액 + 가맹점할부매출금액) AS 총매출금액,\n  SUM(가맹점일시불매출건수 + 가맹점할부매출건수) AS 총매출건수,\n  SUM(가맹점수입수수료)\
    \ AS 수수료수입\nFROM card_system.tmdaa5e11\nGROUP BY 기준년월\nORDER BY 기준년월\n"
  tags:
  - 가맹점
  - 월별
  - 시계열
- name: merchant_yoy_growth
  question: 가맹점 전년대비 매출 성장률은?
  sql: "SELECT\n  가맹점번호,\n  가맹점명,\n  SUM(금년가맹점신용판매매출금액) AS 금년매출,\n  SUM(전년가맹점신용판매매출금액) AS 전년매출,\n  CASE\n    WHEN SUM(전년가맹점신용판매매출금액)\
    \ > 0\n    THEN (SUM(금년가맹점신용판매매출금액) - SUM(전년가맹점신용판매매출금액))::FLOAT\n         / SUM(전년가맹점신용판매매출금액)\n    ELSE NULL\n  END\
    \ AS 전년대비성장률\nFROM card_system.tmdaa5e11\nGROUP BY 가맹점번호, 가맹점명\nHAVING SUM(전년가맹점신용판매매출금액) > 0\nORDER BY 전년대비성장률 DESC\n"
  tags:
  - 가맹점
  - 성장률
  - YoY
- name: review_approval_rate
  question: 기업카드 심사 승인율은 얼마야?
  sql: "SELECT\n  COUNT(DISTINCT 신청서접수번호) AS 총심사건수,\n  COUNT(DISTINCT CASE WHEN 카드처리결과구분코드 = '01' THEN 신청서접수번호 END) AS 승인건수,\n\
    \  COUNT(DISTINCT CASE WHEN 카드처리결과구분코드 = '02' THEN 신청서접수번호 END) AS 거절건수,\n  COUNT(DISTINCT CASE WHEN 카드처리결과구분코드 = '01'\
    \ THEN 신청서접수번호 END)::FLOAT\n    / NULLIF(COUNT(DISTINCT 신청서접수번호), 0) AS 승인율\nFROM card_system.tbdaaaf23\n"
  tags:
  - 심사
  - 승인율
  - 비율
- name: review_by_credit_grade
  question: 신용등급별 심사 현황을 보여줘
  sql: "SELECT\n  신용평가등급코드 AS 신용등급,\n  COUNT(DISTINCT 신청서접수번호) AS 심사건수,\n  COUNT(DISTINCT CASE WHEN 카드처리결과구분코드 = '01' THEN\
    \ 신청서접수번호 END) AS 승인건수,\n  AVG(최종부여한도금액) AS 평균부여한도,\n  AVG(자산총계금액) AS 평균자산총계,\n  AVG(매출금액) AS 평균매출\nFROM card_system.tbdaaaf23\n\
    WHERE 신용평가등급코드 IS NOT NULL\nGROUP BY 신용평가등급코드\nORDER BY 신용평가등급코드\n"
  tags:
  - 심사
  - 신용등급
  - 집계
- name: delinquency_status
  question: 기업별 연체 현황을 보여줘
  sql: "SELECT\n  상호명,\n  사업자등록번호,\n  SUM(총한도금액) AS 총한도,\n  SUM(카드이용합계금액) AS 총이용금액,\n  SUM(연체금액) AS 연체금액,\n  CASE\n    WHEN\
    \ SUM(카드이용합계금액) > 0\n    THEN SUM(연체금액)::FLOAT / SUM(카드이용합계금액)\n    ELSE 0\n  END AS 연체율\nFROM card_system.tbdaaha97\n\
    WHERE 연체금액 > 0\nGROUP BY 상호명, 사업자등록번호\nORDER BY 연체금액 DESC\n"
  tags:
  - 연체
  - 여신
  - 리스크
- name: credit_utilization
  question: 기업별 한도 사용률은?
  sql: "SELECT\n  상호명,\n  사업자등록번호,\n  SUM(총한도금액) AS 총한도,\n  SUM(카드이용합계금액) AS 총이용금액,\n  CASE\n    WHEN SUM(총한도금액) > 0\n   \
    \ THEN SUM(카드이용합계금액)::FLOAT / SUM(총한도금액)\n    ELSE 0\n  END AS 한도사용률\nFROM card_system.tbdaaha97\nGROUP BY 상호명, 사업자등록번호\n\
    ORDER BY 한도사용률 DESC\n"
  tags:
  - 한도
  - 사용률
  - 여신
- name: fee_rate_by_industry
  question: 업종별 평균 수수료율은?
  sql: "SELECT\n  b.업종대분류코드명,\n  b.가맹점업종명,\n  AVG(a.신용카드가맹점수수료율) AS 평균신용수수료율,\n  AVG(a.체크카드수수료율) AS 평균체크수수료율,\n  SUM(a.가맹점수입수수료)\
    \ AS 수수료수입합계\nFROM card_system.tmdaa5e11 a\nJOIN card_system.tbdaadb17 b\n  ON a.가맹점업종코드 = b.가맹점업종코드\nGROUP BY b.업종대분류코드명,\
    \ b.가맹점업종명\nORDER BY 수수료수입합계 DESC\n"
  tags:
  - 수수료
  - 업종
  - 분석
- name: corporate_customer_card_holdings
  question: 기업고객별 카드 보유 현황을 보여줘
  sql: "SELECT\n  고객식별자,\n  기업검색명 AS 기업명,\n  SUM(유효신용카드수) AS 유효신용카드,\n  SUM(유효체크카드수) AS 유효체크카드,\n  SUM(기업보유실물카드수) AS 실물카드수,\n\
    \  SUM(금월일시불이용금액 + 금월할부이용금액 + 금월ca이용금액) AS 당월총이용금액\nFROM card_system.tmdaa2e17\nGROUP BY 고객식별자, 기업검색명\nORDER BY 당월총이용금액\
    \ DESC\n"
  tags:
  - 고객
  - 카드보유
  - 이용금액
- name: sales_target_individual_merchant_no_personal_card
  question: 개인사업자 가맹점주 영업추진 대상(개인카드 미보유) 추출해줘
  description: '특정 업종의 개인사업자 가맹점 중 대표자가 유효 개인카드(신용/체크)를 보유하지 않은 영업추진 대상을 추출합니다. 월 가맹점 매출금액도 함께 조회합니다.

    '
  sql: "SELECT\n    a.기준년월,\n    a.가맹점번호,\n    a.가맹점명,\n    a.사업자등록번호,\n    a.대표고객식별자,\n    a.가맹점업종코드,\n    a.가맹점관리부점코드,\n\
    \    a.가맹점거래정지상태구분코드,\n    COALESCE(c.가맹점일시불매출금액, 0) + COALESCE(c.가맹점할부매출금액, 0) AS 월가맹점매출금액\nFROM card_system.tmdaa5d01\
    \ a\nLEFT JOIN card_system.tmdaa3e16 b\n    ON  a.대표고객식별자 = b.고객식별자\n    AND a.기준년월      = b.기준년월\n    AND b.개인기업구분코드\
    \       = '1'\n    AND b.상품중분류구분코드     IN ('CP01', 'CP04')\n    AND (b.유효신용카드여부 = '1' OR b.유효체크카드여부 = '1')\nLEFT JOIN\
    \ card_system.tmdaa5e11 c\n    ON  a.가맹점번호 = c.가맹점번호\n    AND a.기준년월   = c.기준년월\nWHERE\n    a.가맹점업종코드 IN ({업종코드목록})\n\
    \    AND a.가맹점거래정지상태구분코드 IN ('1', '2')\n    AND a.가맹점사업주체구분코드 = '1'\n    AND b.고객식별자 IS NULL\nORDER BY\n    a.기준년월 DESC,\n\
    \    월가맹점매출금액 DESC\n"
  parameters:
    업종코드목록:
      type: list
      description: 대상 가맹점 업종코드 목록 (쉼표 구분)
      default: '''7005'',''5605'',''7002'',''7003'',''7007'''
      sample_values:
      - '''7005'',''5605'',''7002'',''7003'',''7007'''
      - '''7005'',''7002'''
    기준년월:
      type: string
      description: 조회 기준년월 (YYYYMM). 미지정 시 전체 기간.
      required: false
  tags:
  - 영업추진
  - 개인사업자
  - 가맹점
  - 개인카드미보유
  - 영업대상
  - 추출
- name: card_delinquency_by_grade
  question: 카드등급별 연체 현황은?
  sql: "SELECT\n  카드등급구분코드,\n  COUNT(DISTINCT 카드구분키번호) AS 카드수,\n  SUM(금월이용합계금액) AS 총이용금액,\n  SUM(연체원금) AS 총연체원금,\n  CASE\n\
    \    WHEN SUM(금월이용합계금액) > 0\n    THEN SUM(연체원금)::FLOAT / SUM(금월이용합계금액)\n    ELSE 0\n  END AS 연체율\nFROM card_system.tmdaa3e16\n\
    WHERE 개인기업구분코드 = '2'\nGROUP BY 카드등급구분코드\nORDER BY 총연체원금 DESC\n"
  tags:
  - 연체
  - 카드등급
  - 비율
- name: sales_by_industry_period
  question: 특정 기간 업종별 법인카드 매출을 분석해줘
  description: '기간과 업종 필터를 지정하여 업종별 매출금액/건수를 분석합니다. 법인카드(개인기업구분코드=''2'') 정상거래만 대상입니다.

    '
  sql: "SELECT\n  b.업종대분류코드명,\n  b.가맹점업종명,\n  SUM(a.매출금액) AS 총매출금액,\n  COUNT(DISTINCT a.매출전표번호) AS 매출건수,\n  AVG(a.매출금액) AS\
    \ 건당평균금액\nFROM card_system.tbdaabt30 a\nJOIN card_system.tbdaadb17 b\n  ON a.가맹점업종코드 = b.가맹점업종코드\nWHERE a.개인기업구분코드 = '2'\n\
    \  AND (a.전표취소구분코드 IS NULL OR a.전표취소구분코드 = '0')\n  AND a.전표매출년월일 BETWEEN '{기간_시작}' AND '{기간_종료}'\nGROUP BY b.업종대분류코드명,\
    \ b.가맹점업종명\nORDER BY 총매출금액 DESC\nLIMIT {limit}\n"
  parameters:
    기간_시작:
      type: string
      description: 시작 기준년월일 (YYYYMMDD). YYYYMM 입력 시 뒤에 '01' 자동 추가.
      required: true
      sample_values:
      - '20250301'
      - '20260101'
    기간_종료:
      type: string
      description: 종료 기준년월일 (YYYYMMDD). YYYYMM 입력 시 뒤에 '31' 자동 추가.
      required: true
      sample_values:
      - '20250331'
      - '20260430'
    limit:
      type: integer
      description: 결과 행수 제한
      default: '20'
  tags:
  - 업종
  - 매출
  - 기간필터
  - 법인카드
  - 파라미터
- name: top_merchants_by_revenue_period
  question: 특정 기간 매출 상위 가맹점을 조회해줘
  description: '기간/업종/가맹점명 필터를 지정하여 매출 상위 가맹점 순위를 조회합니다.

    '
  sql: "SELECT\n  a.가맹점번호,\n  a.가맹점명,\n  b.가맹점업종명,\n  b.업종대분류코드명,\n  SUM(a.가맹점일시불매출금액 + a.가맹점할부매출금액) AS 총매출금액,\n  SUM(a.가맹점일시불매출건수\
    \ + a.가맹점할부매출건수) AS 총매출건수,\n  AVG(a.신용카드가맹점수수료율) AS 평균수수료율\nFROM card_system.tmdaa5e11 a\nJOIN card_system.tbdaadb17 b\n\
    \  ON a.가맹점업종코드 = b.가맹점업종코드\nWHERE a.기준년월 BETWEEN '{기간_시작}' AND '{기간_종료}'\nGROUP BY a.가맹점번호, a.가맹점명, b.가맹점업종명, b.업종대분류코드명\n\
    ORDER BY 총매출금액 DESC\nLIMIT {limit}\n"
  parameters:
    기간_시작:
      type: string
      description: 시작 기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202501'
      - '202601'
    기간_종료:
      type: string
      description: 종료 기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202503'
      - '202604'
    limit:
      type: integer
      description: 상위 N개 결과
      default: '10'
  tags:
  - 가맹점
  - 랭킹
  - 매출
  - 기간필터
  - TOP-N
  - 파라미터
- name: corporate_delinquency_detail
  question: 특정 기업의 연체 상세 현황을 보여줘
  description: '기업명/기간으로 필터링하여 월별 연체 상세 현황(한도, 이용금액, 연체금액, 연체율)을 조회합니다.

    '
  sql: "SELECT\n  작업기준년월,\n  상호명,\n  사업자등록번호,\n  기업계열명,\n  SUM(총한도금액) AS 총한도,\n  SUM(카드이용합계금액) AS 총이용금액,\n  SUM(신용판매이용금액)\
    \ AS 신용판매이용,\n  SUM(할부이용금액) AS 할부이용,\n  SUM(ca이용금액) AS CA이용,\n  SUM(연체금액) AS 연체금액,\n  CASE\n    WHEN SUM(카드이용합계금액) > 0\n\
    \    THEN ROUND((SUM(연체금액)::FLOAT / SUM(카드이용합계금액)) * 100, 2)\n    ELSE 0\n  END AS 연체율_퍼센트\nFROM card_system.tbdaaha97\n\
    WHERE 상호명 LIKE '%{기업명}%'\nGROUP BY 작업기준년월, 상호명, 사업자등록번호, 기업계열명\nORDER BY 작업기준년월 DESC\n"
  parameters:
    기업명:
      type: string
      description: 기업 상호명 (부분일치 검색)
      required: true
      sample_values:
      - 삼성
      - 현대
      - LG
    기간_시작:
      type: string
      description: 시작 작업기준년월 (YYYYMM)
      required: false
    기간_종료:
      type: string
      description: 종료 작업기준년월 (YYYYMM)
      required: false
  tags:
  - 연체
  - 기업
  - 상세
  - 월별
  - 여신
  - 파라미터
- name: review_approval_by_period
  question: 특정 기간의 기업카드 심사 승인율을 분석해줘
  description: '기간/신용등급/기업규모 필터를 지정하여 심사 승인 현황을 분석합니다.

    '
  sql: "SELECT\n  신용평가등급코드 AS 신용등급,\n  고객군형태구분코드 AS 고객유형,\n  COUNT(DISTINCT 신청서접수번호) AS 총심사건수,\n  COUNT(DISTINCT CASE WHEN\
    \ 카드처리결과구분코드 = '01' THEN 신청서접수번호 END) AS 승인건수,\n  COUNT(DISTINCT CASE WHEN 카드처리결과구분코드 = '02' THEN 신청서접수번호 END) AS 거절건수,\n\
    \  ROUND(COUNT(DISTINCT CASE WHEN 카드처리결과구분코드 = '01' THEN 신청서접수번호 END)::FLOAT\n        / NULLIF(COUNT(DISTINCT 신청서접수번호),\
    \ 0) * 100, 2) AS 승인율_퍼센트,\n  AVG(최종부여한도금액) AS 평균부여한도,\n  AVG(자산총계금액) AS 평균자산총계\nFROM card_system.tbdaaaf23\nWHERE 최종심사년월일\
    \ BETWEEN '{기간_시작}' AND '{기간_종료}'\nGROUP BY 신용평가등급코드, 고객군형태구분코드\nORDER BY 신용평가등급코드, 고객군형태구분코드\n"
  parameters:
    기간_시작:
      type: string
      description: 시작 심사년월일 (YYYYMMDD). YYYYMM 입력 시 '01' 자동 추가.
      required: true
      sample_values:
      - '20250101'
      - '20260101'
    기간_종료:
      type: string
      description: 종료 심사년월일 (YYYYMMDD). YYYYMM 입력 시 '31' 자동 추가.
      required: true
      sample_values:
      - '20251231'
      - '20260430'
    신용등급:
      type: string
      description: 특정 신용평가등급코드 필터
      required: false
  tags:
  - 심사
  - 승인율
  - 기간필터
  - 신용등급
  - 고객유형
  - 파라미터
- name: card_brand_usage_analysis
  question: 카드 브랜드별 법인카드 이용 현황을 분석해줘
  description: '카드 브랜드(VISA, Master, 국내 등)별로 법인카드 이용금액/건수를 분석합니다.

    '
  sql: "SELECT\n  카드브랜드구분코드 AS 카드브랜드,\n  COUNT(DISTINCT 카드구분키번호) AS 카드수,\n  SUM(금월이용합계건수) AS 총이용건수,\n  SUM(금월이용합계금액) AS 총이용금액,\n\
    \  SUM(금월일시불이용금액) AS 일시불이용,\n  SUM(금월할부이용금액) AS 할부이용,\n  SUM(금월ca이용금액) AS CA이용,\n  ROUND(SUM(금월이용합계금액)::FLOAT / NULLIF(SUM(금월이용합계건수),\
    \ 0), 0) AS 건당평균금액\nFROM card_system.tmdaa3e16\nWHERE 개인기업구분코드 = '2'\n  AND 기준년월 BETWEEN '{기간_시작}' AND '{기간_종료}'\nGROUP\
    \ BY 카드브랜드구분코드\nORDER BY 총이용금액 DESC\n"
  parameters:
    기간_시작:
      type: string
      description: 시작 기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202501'
      - '202601'
    기간_종료:
      type: string
      description: 종료 기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202512'
      - '202604'
  tags:
  - 카드브랜드
  - VISA
  - Master
  - 이용금액
  - 법인카드
  - 파라미터
- name: merchant_sales_comparison
  question: 특정 가맹점의 매출 추이를 보여줘
  description: '가맹점명으로 검색하여 해당 가맹점의 월별 매출 추이(일시불/할부/수수료)를 조회합니다.

    '
  sql: "SELECT\n  a.기준년월,\n  a.가맹점번호,\n  a.가맹점명,\n  b.가맹점업종명,\n  SUM(a.가맹점일시불매출금액) AS 일시불매출,\n  SUM(a.가맹점할부매출금액) AS 할부매출,\n\
    \  SUM(a.가맹점일시불매출금액 + a.가맹점할부매출금액) AS 총매출금액,\n  SUM(a.가맹점일시불매출건수 + a.가맹점할부매출건수) AS 총매출건수,\n  SUM(a.가맹점수입수수료) AS 수수료수입,\n\
    \  AVG(a.신용카드가맹점수수료율) AS 평균수수료율\nFROM card_system.tmdaa5e11 a\nJOIN card_system.tbdaadb17 b\n  ON a.가맹점업종코드 = b.가맹점업종코드\n\
    WHERE a.가맹점명 LIKE '%{가맹점명}%'\nGROUP BY a.기준년월, a.가맹점번호, a.가맹점명, b.가맹점업종명\nORDER BY a.기준년월\n"
  parameters:
    가맹점명:
      type: string
      description: 가맹점명 (부분일치 검색)
      required: true
      sample_values:
      - 스타벅스
      - CU
      - GS25
    기간_시작:
      type: string
      description: 시작 기준년월 (YYYYMM)
      required: false
    기간_종료:
      type: string
      description: 종료 기준년월 (YYYYMM)
      required: false
  tags:
  - 가맹점
  - 매출추이
  - 월별
  - 시계열
  - 검색
  - 파라미터
- name: corporate_credit_risk_summary
  question: 기업 계열별 여신 리스크 현황을 보여줘
  description: '기업계열별로 총한도, 이용금액, 연체금액, 한도사용률, 연체율을 종합 분석합니다.

    '
  sql: "SELECT\n  기업계열명,\n  COUNT(DISTINCT 사업자등록번호) AS 기업수,\n  SUM(총한도금액) AS 총한도,\n  SUM(카드이용합계금액) AS 총이용금액,\n  SUM(연체금액)\
    \ AS 총연체금액,\n  CASE\n    WHEN SUM(총한도금액) > 0\n    THEN ROUND((SUM(카드이용합계금액)::FLOAT / SUM(총한도금액)) * 100, 2)\n    ELSE 0\n\
    \  END AS 한도사용률_퍼센트,\n  CASE\n    WHEN SUM(카드이용합계금액) > 0\n    THEN ROUND((SUM(연체금액)::FLOAT / SUM(카드이용합계금액)) * 100, 2)\n\
    \    ELSE 0\n  END AS 연체율_퍼센트\nFROM card_system.tbdaaha97\nWHERE 기업계열명 IS NOT NULL\n  AND 작업기준년월 BETWEEN '{기간_시작}' AND\
    \ '{기간_종료}'\nGROUP BY 기업계열명\nORDER BY 총이용금액 DESC\nLIMIT {limit}\n"
  parameters:
    기간_시작:
      type: string
      description: 시작 작업기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202501'
      - '202601'
    기간_종료:
      type: string
      description: 종료 작업기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202512'
      - '202604'
    limit:
      type: integer
      description: 결과 행수 제한
      default: '20'
  tags:
  - 계열사
  - 여신
  - 리스크
  - 한도사용률
  - 연체율
  - 파라미터
- name: online_offline_sales_ratio
  question: 온라인/오프라인 매출 비율을 분석해줘
  description: '특정 기간의 법인카드 온라인/오프라인 거래 비율을 업종별로 분석합니다.

    '
  sql: "SELECT\n  b.업종대분류코드명,\n  a.온라인거래여부,\n  COUNT(DISTINCT a.매출전표번호) AS 거래건수,\n  SUM(a.매출금액) AS 총매출금액,\n  ROUND(AVG(a.매출금액),\
    \ 0) AS 건당평균금액\nFROM card_system.tbdaabt30 a\nJOIN card_system.tbdaadb17 b\n  ON a.가맹점업종코드 = b.가맹점업종코드\nWHERE a.개인기업구분코드\
    \ = '2'\n  AND (a.전표취소구분코드 IS NULL OR a.전표취소구분코드 = '0')\n  AND a.전표매출년월일 BETWEEN '{기간_시작}' AND '{기간_종료}'\nGROUP BY b.업종대분류코드명,\
    \ a.온라인거래여부\nORDER BY b.업종대분류코드명, a.온라인거래여부\n"
  parameters:
    기간_시작:
      type: string
      description: 시작 기준년월일 (YYYYMMDD). YYYYMM 입력 시 '01' 자동 추가.
      required: true
      sample_values:
      - '20250301'
      - '20260101'
    기간_종료:
      type: string
      description: 종료 기준년월일 (YYYYMMDD). YYYYMM 입력 시 '31' 자동 추가.
      required: true
      sample_values:
      - '20250331'
      - '20260430'
  tags:
  - 온라인
  - 오프라인
  - 매출비율
  - 업종별
  - 법인카드
  - 파라미터
- name: installment_analysis
  question: 할부 거래 현황을 분석해줘
  description: '특정 기간의 법인카드 할부 거래를 할부개월 구간별로 분석합니다.

    '
  sql: "SELECT\n  CASE\n    WHEN 할부기간개월수 = 0 THEN '일시불'\n    WHEN 할부기간개월수 BETWEEN 1 AND 3 THEN '1~3개월'\n    WHEN 할부기간개월수 BETWEEN\
    \ 4 AND 6 THEN '4~6개월'\n    WHEN 할부기간개월수 BETWEEN 7 AND 12 THEN '7~12개월'\n    ELSE '12개월 초과'\n  END AS 할부구간,\n  COUNT(DISTINCT\
    \ 매출전표번호) AS 거래건수,\n  SUM(매출금액) AS 총매출금액,\n  ROUND(AVG(매출금액), 0) AS 건당평균금액,\n  ROUND(AVG(할부기간개월수), 1) AS 평균할부개월\nFROM\
    \ card_system.tbdaabt30\nWHERE 개인기업구분코드 = '2'\n  AND (전표취소구분코드 IS NULL OR 전표취소구분코드 = '0')\n  AND 전표매출년월일 BETWEEN '{기간_시작}'\
    \ AND '{기간_종료}'\nGROUP BY\n  CASE\n    WHEN 할부기간개월수 = 0 THEN '일시불'\n    WHEN 할부기간개월수 BETWEEN 1 AND 3 THEN '1~3개월'\n  \
    \  WHEN 할부기간개월수 BETWEEN 4 AND 6 THEN '4~6개월'\n    WHEN 할부기간개월수 BETWEEN 7 AND 12 THEN '7~12개월'\n    ELSE '12개월 초과'\n  END\n\
    ORDER BY 총매출금액 DESC\n"
  parameters:
    기간_시작:
      type: string
      description: 시작 기준년월일 (YYYYMMDD). YYYYMM 입력 시 '01' 자동 추가.
      required: true
      sample_values:
      - '20250101'
      - '20260101'
    기간_종료:
      type: string
      description: 종료 기준년월일 (YYYYMMDD). YYYYMM 입력 시 '31' 자동 추가.
      required: true
      sample_values:
      - '20251231'
      - '20260430'
  tags:
  - 할부
  - 할부개월
  - 거래분석
  - 법인카드
  - 파라미터
- name: corporate_customer_monthly_usage
  question: 특정 기업의 월별 카드 이용 내역을 보여줘
  description: '기업검색명으로 검색하여 해당 기업의 월별 카드 이용 상세(일시불/할부/CA/주유/국세 등)를 조회합니다.

    '
  sql: "SELECT\n  기준년월,\n  고객식별자,\n  기업검색명,\n  SUM(유효신용카드수) AS 유효신용카드,\n  SUM(유효체크카드수) AS 유효체크카드,\n  SUM(금월일시불이용금액) AS 일시불이용,\n\
    \  SUM(금월할부이용금액) AS 할부이용,\n  SUM(금월ca이용금액) AS CA이용,\n  SUM(금월일시불이용금액 + 금월할부이용금액 + 금월ca이용금액) AS 총이용금액,\n  SUM(금월주유이용금액)\
    \ AS 주유이용,\n  SUM(금월국세이용금액 + 금월지방세이용금액) AS 세금납부,\n  SUM(금월4대보험이용금액) AS 보험납부\nFROM card_system.tmdaa2e17\nWHERE 기업검색명 LIKE\
    \ '%{기업명}%'\nGROUP BY 기준년월, 고객식별자, 기업검색명\nORDER BY 기준년월 DESC\n"
  parameters:
    기업명:
      type: string
      description: 기업검색명 (부분일치 검색)
      required: true
      sample_values:
      - 삼성
      - 현대
      - KB
    기간_시작:
      type: string
      description: 시작 기준년월 (YYYYMM)
      required: false
    기간_종료:
      type: string
      description: 종료 기준년월 (YYYYMM)
      required: false
  tags:
  - 기업고객
  - 월별
  - 이용내역
  - 상세
  - 검색
  - 파라미터
- name: region_top_enterprise_merchants
  question: 최근 기준일 기준 지역별 기업영업 가맹점 전월 매입 상위 지역은?
  sql: "SELECT\n  한글시도명,\n  한글시군구명,\n  COUNT(DISTINCT 가맹점번호) AS 가맹점수,\n  SUM(COALESCE(전월일시불매입금액, 0) + COALESCE(전월할부매입금액, 0))\
    \ AS 전월매입금액,\n  SUM(COALESCE(전월일시불매입건수, 0) + COALESCE(전월할부매입건수, 0)) AS 전월매입건수,\n  AVG(신용카드가맹점수수료율) AS 평균수수료율\nFROM card_system.tbdaaus01\n\
    WHERE 기준년월일 = (SELECT MAX(기준년월일) FROM card_system.tbdaaus01)\n  AND COALESCE(가맹점거래정지여부, 'N') <> 'Y'\n  AND COALESCE(휴폐업여부,\
    \ 'N') <> 'Y'\nGROUP BY 한글시도명, 한글시군구명\nORDER BY 전월매입금액 DESC\nLIMIT 20\n"
  tags:
  - 기업영업
  - 가맹점
  - 지역
  - 전월매입
  - 랭킹
- name: marketing_industry_card_portfolio
  question: 마케팅 업종 대분류별 유효 기업카드 수와 전월 매입금액을 보여줘
  sql: "SELECT\n  마케팅업종대분류구분명,\n  COUNT(DISTINCT 가맹점번호) AS 가맹점수,\n  SUM(COALESCE(유효기업신용카드수, 0)) AS 유효기업신용카드수,\n  SUM(COALESCE(유효기업체크카드수,\
    \ 0)) AS 유효기업체크카드수,\n  SUM(COALESCE(전월일시불매입금액, 0) + COALESCE(전월할부매입금액, 0)) AS 전월매입금액\nFROM card_system.tbdaaus01\nWHERE\
    \ 기준년월일 = (SELECT MAX(기준년월일) FROM card_system.tbdaaus01)\nGROUP BY 마케팅업종대분류구분명\nORDER BY 전월매입금액 DESC\n"
  tags:
  - 기업영업
  - 업종
  - 카드수
  - 전월매입
- name: special_debt_by_asset_quality
  question: 기업 특수채권을 자산건전성별로 요약해줘
  sql: "SELECT\n  기준년,\n  자산건전성분류구분코드,\n  COUNT(DISTINCT 특수채권관리번호) AS 특수채권건수,\n  SUM(특수채권편입원금) AS 편입원금,\n  SUM(COALESCE(특수채권편입원금,\
    \ 0) + COALESCE(특수채권편입수수료, 0) + COALESCE(특수채권편입이자, 0) + COALESCE(특수채권편입연체료, 0) + COALESCE(특수채권편입가지급금, 0)) AS 편입잔액,\n \
    \ AVG(연체회차) AS 평균연체회차\nFROM card_system.tmdaaus01\nWHERE 개인기업구분코드 = '2'\nGROUP BY 기준년, 자산건전성분류구분코드\nORDER BY 기준년, 편입잔액\
    \ DESC\n"
  tags:
  - 기업영업
  - 특수채권
  - 자산건전성
  - 연체
- name: allowance_monthly_cost_rate
  question: 월별 기업 대손충당금률과 평균 PD/LGD를 계산해줘
  sql: "SELECT\n  기준년월,\n  SUM(원화대출잔액) AS 원화대출잔액,\n  SUM(기대대손충당금) AS 기대대손충당금,\n  AVG(기대1년PD율) AS 평균PD율,\n  AVG(충당금기대LGD율)\
    \ AS 평균LGD율,\n  SUM(기대대손충당금)::FLOAT / NULLIF(SUM(원화대출잔액), 0) AS 대손충당금률\nFROM card_system.tbmewcm94\nWHERE 개인기업구분코드 = '2'\n\
    GROUP BY 기준년월\nORDER BY 기준년월\n"
  tags:
  - 기업영업
  - 대손충당금
  - PD
  - LGD
  - 리스크비용률
- name: merchant_risk_combined_customer_month
  question: 월별 가맹점 포트폴리오와 대손충당금을 고객 기준으로 같이 봐줘
  sql: "WITH merchant_customer_month AS (\n  SELECT\n    기준년월,\n    기업고객식별자 AS 고객식별자,\n    COUNT(DISTINCT 가맹점번호) AS 가맹점수,\n\
    \    SUM(COALESCE(전월일시불매입금액, 0) + COALESCE(전월할부매입금액, 0)) AS 전월매입금액\n  FROM card_system.tbmaisd06\n  GROUP BY 기준년월, 기업고객식별자\n\
    ), allowance_customer_month AS (\n  SELECT\n    기준년월,\n    고객식별자,\n    SUM(원화대출잔액) AS 원화대출잔액,\n    SUM(기대대손충당금) AS 기대대손충당금\n\
    \  FROM card_system.tbmewcm94\n  WHERE 개인기업구분코드 = '2'\n  GROUP BY 기준년월, 고객식별자\n)\nSELECT\n  m.기준년월,\n  COUNT(DISTINCT\
    \ m.고객식별자) AS 기업고객수,\n  SUM(m.가맹점수) AS 가맹점수,\n  SUM(m.전월매입금액) AS 전월매입금액,\n  SUM(a.원화대출잔액) AS 원화대출잔액,\n  SUM(a.기대대손충당금)\
    \ AS 기대대손충당금,\n  SUM(a.기대대손충당금)::FLOAT / NULLIF(SUM(a.원화대출잔액), 0) AS 대손충당금률\nFROM merchant_customer_month m\nLEFT JOIN\
    \ allowance_customer_month a\n  ON m.기준년월 = a.기준년월\n AND m.고객식별자 = a.고객식별자\nGROUP BY m.기준년월\nORDER BY m.기준년월\n"
  tags:
  - 기업영업
  - 가맹점
  - 충당금
  - 고객월
  - 조인
