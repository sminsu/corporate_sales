  - 활성 업종 목록은 tbdaadb17.사용여부 = '1' 조건을 기본으로 둡니다.
  sql_pattern: "SELECT\n  가맹점업종코드,\n  가맹점업종명,\n  업종대분류코드명\nFROM card_system.tbdaadb17\nWHERE 사용여부 = '1'\nORDER BY 가맹점업종코드\n"
- intent: 개인기업카드_기본_유효카드조회
  when_user_says:
  - 개인 기업카드 기본
