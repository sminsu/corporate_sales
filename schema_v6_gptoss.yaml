- name: corporate_limit_low_utilization_members
  question: KB국민 기업카드 보유회원 중 한도 2천만원 이상이고 한도 소진율 50% 미만인 기업회원 명단을 알려줘
  description: 기준월 현재 기업카드를 보유하고 총한도금액이 기준 이상이며 한도소진율이 기준 미만인 기업회원 명단을 조회합니다. 한도소진율은 1 - 잔여한도/총한도로 계산합니다.
  sql: |
    WITH base AS (
      SELECT
        a.고객식별자,
        a.사업자등록번호,
        a.기업명,
        a.기준년월,
        COALESCE(a.기업총한도금액, 0) AS 기업총한도금액,
        COALESCE(a.기업총잔여한도금액, 0) AS 기업총잔여한도금액,
        CASE
          WHEN COALESCE(a.기업총한도금액, 0) = 0 THEN 0
          ELSE 1 - (COALESCE(a.기업총잔여한도금액, 0) / CAST(COALESCE(a.기업총한도금액, 0) AS DOUBLE))
        END AS 한도소진율
      FROM card_system.tmdaa1d12 a
      WHERE a.기준년월 = '{기준년월}'
        AND a."year" = SUBSTRING('{기준년월}', 1, 4)
        AND a."month" = SUBSTRING('{기준년월}', 5, 2)
        AND (COALESCE(a.유효기업신용카드수, 0) + COALESCE(a.유효기업체크카드수, 0)) > 0
        AND COALESCE(a.기업총한도금액, 0) >= {한도금액}
    )
    SELECT
      고객식별자,
      사업자등록번호,
      기업명,
      기준년월,
      기업총한도금액,
      기업총잔여한도금액,
      한도소진율
    FROM base
    WHERE 한도소진율 < {한도소진율}
    ORDER BY 한도소진율 ASC, 기업총한도금액 DESC
    LIMIT {limit}
  parameters:
    기준년월:
      type: string
      description: 한도와 카드 보유 여부를 판단할 기준년월(YYYYMM)
      required: true
      default: '202604'
      sample_values:
      - '202604'
    한도금액:
      type: integer
      description: 기업 총한도 하한 기준
      default: '20000000'
    한도소진율:
      type: number
      description: 한도소진율 상한 기준. 50%는 0.5
      default: '0.5'
    limit:
      type: integer
      description: 상세 목록 제한 건수
      default: '100'
  tags:
