semantic_join_graph:
  safe_paths:
  - name: sales_to_industry
    from_entity: sales_slip
    to_entity: industry
    join_type: many_to_one
    sql: a.가맹점업종코드 = b.가맹점업종코드
    use_when:
    - 업종별 매출
    - 업종대분류별 거래
    - MCC/업종명 표시
  - name: sales_to_merchant
    from_entity: sales_slip
    to_entity: merchant_master
    join_type: many_to_one
    sql: a.가맹점번호 = b.가맹점번호
    caution: merchant_master는 실적기준년월일 스냅샷이므로 기간 정합성이 필요하면 날짜 조건을 추가합니다.
  - name: sales_to_corporate_customer
    from_entity: sales_slip
    to_entity: corporate_customer
    join_type: many_to_one
    sql: a.기업고객식별자 = b.고객식별자
  - name: merchant_performance_to_industry
    from_entity: merchant_monthly_performance
    to_entity: industry
    join_type: many_to_one
    sql: a.가맹점업종코드 = b.가맹점업종코드
  - name: merchant_performance_to_merchant_master
    from_entity: merchant_monthly_performance
    to_entity: merchant_master
    join_type: many_to_one
    sql: a.가맹점번호 = b.가맹점번호
    use_when:
    - 월별 가맹점 실적에 대표고객식별자, 기업고객식별자, 결제계좌, 사업주체구분을 붙일 때
    caution: merchant_master는 일단위 스냅샷이므로 정확한 일자 정합성이 필요한 질문이면 실적기준년월일 조건을 함께 검토합니다.
  - name: merchant_performance_to_merchant_monthly
    from_entity: merchant_monthly_performance
    to_entity: merchant_monthly_master
    join_type: one_to_one
    sql: a.가맹점번호 = b.가맹점번호 AND a.기준년월 = b.기준년월
  - name: merchant_master_to_personal_card_account
    from_entity: merchant_master
    to_entity: card_account
    join_type: one_to_many
    sql: a.대표고객식별자 = b.본인고객식별자
    use_when:
    - 가맹점 대표자 개인카드 소지 여부
    - 개인카드 미보유 가맹점 영업대상
    caution: 유효 KB 개인카드는 b.실제카드만료년월일 > '{카드만료기준일}' AND b.KB카드BC카드구분코드 = '1' AND b.개인기업구분코드 = '1' 조건을 사용합니다.
  - name: merchant_master_to_corporate_card_account
    from_entity: merchant_master
    to_entity: card_account
    join_type: one_to_many
    sql: a.기업고객식별자 = b.본인고객식별자
    use_when:
    - 가맹점 기업고객 기업카드 소지 여부
    - 기업카드 미보유 가맹점 영업대상
    caution: 유효 KB 기업카드는 b.실제카드만료년월일 > '{카드만료기준일}' AND b.KB카드BC카드구분코드 = '1' AND b.개인기업구분코드 = '2' 조건을 사용합니다.
  - name: corporate_customer_to_customer
    from_entity: corporate_customer
    to_entity: customer
    join_type: many_to_one
    sql: a.기업대표자고객식별자 = b.고객식별자
    use_when:
    - 대표자 성별
    - 대표자 고객속성
  - name: corporate_review_to_corporate_customer
    from_entity: corporate_review
    to_entity: corporate_customer
    join_type: many_to_one
    sql: a.본사사업자등록번호 = b.본사사업자등록번호
  - name: corporate_monthly_to_corporate_customer
    from_entity: corporate_customer_monthly
    to_entity: corporate_customer
    join_type: many_to_one
    sql: a.고객식별자 = b.고객식별자
  - name: card_monthly_to_corporate_customer
    from_entity: card_monthly
    to_entity: corporate_customer
    join_type: many_to_one
    sql: a.고객식별자 = b.고객식별자
  - name: credit_exposure_to_corporate_customer
    from_entity: credit_exposure
    to_entity: corporate_customer
    join_type: many_to_one
    sql: a.사업자등록번호 = b.본사사업자등록번호
  - name: merchant_daily_to_merchant_monthly
    from_entity: merchant_enrichment_daily
    to_entity: merchant_enrichment_monthly
    join_type: many_to_one
    sql: a.가맹점번호 = b.가맹점번호 AND SUBSTRING(a.기준년월일, 1, 6) = b.기준년월
    use_when:
    - 일별 가맹점 속성과 월별 가맹점 기준을 함께 비교
  - name: merchant_to_special_debt_by_customer
    from_entity: merchant_enrichment_daily
    to_entity: special_debt_monthly
    join_type: one_to_many
    sql: a.기업고객식별자 = b.고객식별자
    caution: 가맹점과 특수채권은 고객식별자 기준 조인입니다. 한 기업고객이 여러 가맹점/채권을 가질 수 있으므로 집계 전 중복을 확인합니다.
    use_when:
    - 가맹점 기업고객의 특수채권 보유 여부
    - 기업영업 포트폴리오와 연체 리스크 결합
  - name: special_debt_to_allowance
    from_entity: special_debt_monthly
    to_entity: allowance_monthly_detail
    join_type: many_to_many_cautious
    sql: a.고객식별자 = b.고객식별자 AND a.회계계정과목코드 = b.회계계정과목코드 AND a.기준년 = SUBSTRING(b.기준년월, 1, 4)
    caution: 두 테이블 모두 원장성/월별성 데이터라 고객 단위 직접 조인은 중복 집계 위험이 있습니다. 고객-계정-기간으로 사전 집계 후 조인합니다.
    use_when:
    - 특수채권과 대손충당금의 고객/계정 단위 비교
    - 리스크 비용률 분석
  - name: merchant_monthly_to_allowance_by_customer
    from_entity: merchant_enrichment_monthly
    to_entity: allowance_monthly_detail
    join_type: one_to_many
    sql: a.기업고객식별자 = b.고객식별자 AND a.기준년월 = b.기준년월
    caution: 가맹점 월별 스냅샷과 충당금 명세를 고객-월 기준으로 결합합니다. 가맹점 수가 많은 고객은 중복 가능성이 있어 고객-월 집계 후 사용합니다.
canonical_metrics:
- name: 법인카드총이용금액
  domain: 매출분석
  source_entity: sales_slip
  source_table: tbdaabt30
  grain: 매출전표 1건
  expression: SUM(CASE WHEN 개인기업구분코드 = '2' THEN 매출금액 ELSE 0 END)
  preferred_expression_with_filters: SUM(매출금액)
  required_filters:
  - 개인기업구분코드 = '2'
  - (전표취소구분코드 IS NULL OR 전표취소구분코드 = '0')
  default_time_dimension: 전표매출년월일
  additive: true
  unit: KRW
  synonyms:
  - 법인이용금액
  - 기업카드이용액
  - 법인카드매출
  - 총매출금액
  preferred_dimensions:
  - 전표매출년월일
  - 기준년월
  - 가맹점업종코드
  - 카드브랜드구분코드
  - 온라인거래여부
- name: 전표매출건수
  domain: 매출분석
  source_entity: sales_slip
  source_table: tbdaabt30
  expression: COUNT(DISTINCT 매출전표번호)
  required_filters:
  - 개인기업구분코드 = '2'
  - (전표취소구분코드 IS NULL OR 전표취소구분코드 = '0')
  default_time_dimension: 전표매출년월일
  additive: false
  unit: count
  synonyms:
  - 거래건수
  - 매출건수
  - 이용건수
- name: 건당평균전표금액
