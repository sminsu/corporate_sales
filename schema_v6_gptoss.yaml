- name: merchant_card_possession_performance
  question: 202512 기준 개인카드 미보유 가맹점의 업종명과 실적을 보여줘
  description: '가맹점 기본정보, 활성 업종명, 기준년월 월별 실적, 대표자 개인카드 및 기업고객 기업카드 소지 여부를 함께 조회합니다. SAS reference의 1~8번 쿼리를 PostgreSQL CTE
    패턴으로 정리한 기준 예시입니다.

    '
  sql: "WITH upjong AS (\n  SELECT\n    가맹점업종코드,\n    가맹점업종명,\n    업종대분류코드명\n  FROM card_system.tbdaadb17\n  WHERE 사용여부 =\
    \ '1'\n),\ngm_base AS (\n  SELECT\n    a.가맹점신규년월일 AS 등록년월일,\n    a.가맹점번호,\n    a.기업고객식별자,\n    a.대표고객식별자 AS 개인고객식별자,\n\
    \    a.가맹점명,\n    a.사업자등록번호,\n    a.가맹점업종코드,\n    b.가맹점업종명,\n    b.업종대분류코드명,\n    a.가맹점사업주체구분코드,\n    a.현금카드결제기관구분코드 AS\
    \ 가맹점결제계좌,\n    a.신용카드가맹점수수료율,\n    a.체크카드가맹점수수료율,\n    a.가맹점관리부점코드,\n    a.가맹점상태구분코드\n  FROM card_system.tbdaadt01 a\n\
    \  LEFT JOIN upjong b\n    ON a.가맹점업종코드 = b.가맹점업종코드\n),\ngm_perf AS (\n  SELECT\n    기준년월,\n    가맹점번호,\n    COALESCE(가맹점일시불매출금액,\
    \ 0) + COALESCE(가맹점할부매출금액, 0) AS 당월매출금액,\n    최근1년가맹점매출금액,\n    최근1년가맹점매출건수,\n    최근3개월가맹점매출금액,\n    최근3개월가맹점매출건수,\n \
    \   가맹점상태구분코드\n  FROM card_system.tmdaa5e11\n  WHERE 기준년월 = '{기준년월}'\n),\ncard_base AS (\n  SELECT DISTINCT\n    본인고객식별자,\n\
    \    개인기업구분코드,\n    카드결제기관구분코드,\n    상품중분류구분코드,\n    CASE WHEN 카드결제기관구분코드 = '004' THEN '1' ELSE '0' END AS KB카드계좌여부\n\
    \  FROM card_system.tbdaaat05\n  WHERE 실제카드만료년월일 > '{카드만료기준일}'\n    AND KB카드BC카드구분코드 = '1'\n),\njoined AS (\n  SELECT\n\
    \    g.등록년월일,\n    p.기준년월,\n    g.가맹점번호,\n    g.가맹점명,\n    g.사업자등록번호,\n    g.가맹점업종코드,\n    g.가맹점업종명,\n    g.업종대분류코드명,\n\
    \    g.개인고객식별자,\n    g.기업고객식별자,\n    CASE WHEN c1.본인고객식별자 IS NOT NULL THEN '1' ELSE '0' END AS 개인카드소지여부,\n    CASE WHEN\
    \ c2.본인고객식별자 IS NOT NULL THEN '1' ELSE '0' END AS 기업카드소지여부,\n    p.당월매출금액,\n    p.최근3개월가맹점매출금액,\n    p.최근3개월가맹점매출건수,\n\
    \    p.최근1년가맹점매출금액,\n    p.최근1년가맹점매출건수,\n    g.신용카드가맹점수수료율,\n    g.체크카드가맹점수수료율,\n    g.가맹점결제계좌,\n    g.가맹점관리부점코드,\n  \
    \  COALESCE(p.가맹점상태구분코드, g.가맹점상태구분코드) AS 가맹점상태구분코드\n  FROM gm_base g\n  LEFT JOIN gm_perf p\n    ON g.가맹점번호 = p.가맹점번호\n\
    \  LEFT JOIN card_base c1\n    ON g.개인고객식별자 = c1.본인고객식별자\n   AND c1.개인기업구분코드 = '1'\n  LEFT JOIN card_base c2\n    ON g.기업고객식별자\
    \ = c2.본인고객식별자\n   AND c2.개인기업구분코드 = '2'\n)\nSELECT\n  등록년월일,\n  기준년월,\n  가맹점번호,\n  가맹점명,\n  사업자등록번호,\n  가맹점업종코드,\n  가맹점업종명,\n\
    \  업종대분류코드명,\n  개인고객식별자,\n  기업고객식별자,\n  개인카드소지여부,\n  기업카드소지여부,\n  당월매출금액,\n  최근3개월가맹점매출금액,\n  최근3개월가맹점매출건수,\n  최근1년가맹점매출금액,\n\
    \  최근1년가맹점매출건수,\n  신용카드가맹점수수료율,\n  체크카드가맹점수수료율,\n  가맹점결제계좌,\n  가맹점관리부점코드,\n  가맹점상태구분코드\nFROM joined\nWHERE 개인카드소지여부 =\
    \ '0'\nORDER BY 당월매출금액 DESC NULLS LAST, 가맹점번호\nLIMIT {limit}\n"
  parameters:
    기준년월:
      type: string
      description: 가맹점 실적 기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202512'
    카드만료기준일:
      type: string
      description: 유효 카드 판단 기준일 (YYYYMMDD). 없으면 기준년월 월말일 사용
      required: false
      sample_values:
      - '20251231'
    보유구분:
      type: string
      description: 전체, 개인카드보유, 개인카드미보유, 기업카드보유, 기업카드미보유, 둘다보유, 둘다미보유
      required: false
      sample_values:
      - 개인카드미보유
      - 기업카드미보유
    limit:
      type: integer
      description: 상세 목록 제한 건수
      default: '100'
  tags:
  - 가맹점
  - 업종
