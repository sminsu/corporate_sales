- name: merchant_corporate_sales_target_no_corporate_card
  question: 당사 가맹점 중 월 매출액 1억원 이상이고 법인사업자이며 KB국민 기업카드를 보유하지 않은 기업회원 명단을 알려줘
  description: 기업영업 가맹점 일별 풍성화 테이블에서 기준월 월 매출액이 기준 이상이고 법인사업자이며 유효 기업 신용/체크카드를 보유하지 않은 가맹점/기업회원 후보를 조회합니다.
  sql: |
    SELECT
      a.기업고객식별자 AS 고객식별자,
      a.사업자등록번호,
      a.가맹점번호,
      a.가맹점명,
      a.한글시도명,
      a.한글시군구명,
      a.가맹점업종코드,
      a.MCC업종코드,
      COALESCE(a.가맹점총지급금액, 0) AS 월매출액,
      COALESCE(a.유효기업신용카드수, 0) AS 유효기업신용카드수,
      COALESCE(a.유효기업체크카드수, 0) AS 유효기업체크카드수
    FROM card_system.tbdaaus01 a
    WHERE SUBSTRING(a.기준년월일, 1, 6) = '{기준년월}'
      AND a."year" = SUBSTRING('{기준년월}', 1, 4)
      AND a."month" = SUBSTRING('{기준년월}', 5, 2)
      AND COALESCE(a.가맹점총지급금액, 0) >= {월매출금액}
      AND a.가맹점사업주체구분코드 = '2'
      AND COALESCE(a.유효기업신용카드수, 0) = 0
      AND COALESCE(a.유효기업체크카드수, 0) = 0
      AND COALESCE(a.휴폐업여부, '0') = '0'
    ORDER BY 월매출액 DESC
    LIMIT {limit}
  parameters:
    기준년월:
      type: string
      description: 가맹점 월 매출 판단 기준년월(YYYYMM)
      required: true
      default: '202604'
      sample_values:
      - '202604'
    월매출금액:
      type: integer
      description: 월 매출액 하한 기준
      default: '100000000'
    limit:
      type: integer
      description: 상세 목록 제한 건수
      default: '100'
