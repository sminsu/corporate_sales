metrics:
- name: 신규고객수
  description: '신규 고객 수: 고객 마스터(tbdaaat01)의 최초등록년월일 기준으로 신규 등록된 고유 고객 수. "신규/가입/등록 고객" 표현은 기본적으로 이 메트릭을 사용합니다.

    '
  sql: COUNT(DISTINCT 고객식별자)
  source_table: tbdaaat01
  type: count
  time_dimension: 최초등록년월일
  time_transform: SUBSTRING(최초등록년월일, 1, 6)
  synonyms:
  - 가입고객수
  - 등록고객수
  - 신규등록고객수
- name: 신규기업고객수
  description: '신규 기업고객 수: 기업고객 마스터(tbdaaat14)의 최초등록년월일 기준 신규 등록 기업고객 수. 법인/기업고객의 신규 등록을 묻는 경우 사용합니다.

    '
  sql: COUNT(DISTINCT 고객식별자)
  source_table: tbdaaat14
  type: count
  time_dimension: 최초등록년월일
  time_transform: SUBSTRING(최초등록년월일, 1, 6)
  synonyms:
  - 신규법인고객수
  - 등록기업고객수
  - 신규기업수
- name: 기업고객월총이용금액
  description: '기업고객 월별 총 이용금액: 기업고객-월 집계 테이블의 일시불/할부/CA 이용금액 합계. 기업고객의 월별 이용 추이나 등록월 이후 이용금액 분석에 우선 사용합니다.

    '
  sql: SUM(금월일시불이용금액 + 금월할부이용금액 + 금월ca이용금액)
  source_table: tmdaa2e17
  type: currency_krw
  time_dimension: 기준년월
  synonyms:
  - 기업고객총이용금액
  - 기업고객월별이용금액
  - 기업고객이용액
- name: 건당평균전표금액
  description: '매출전표 기준 거래 1건당 평균 금액. 매출전표 상세(tbdaabt30)에서 법인 정상거래의 매출금액 합계를 고유 매출전표 건수로 나눕니다.

    '
  sql: SUM(매출금액)::FLOAT / NULLIF(COUNT(DISTINCT 매출전표번호), 0)
  source_table: tbdaabt30
  type: currency_krw
  time_dimension: 전표매출년월일
  required_filters:
  - 개인기업구분코드 = '2'
  - 전표취소구분코드 IS NULL OR 전표취소구분코드 = '0'
  synonyms:
  - 건당평균금액
  - 평균거래금액
  - 객단가
- name: 심사거절건수
  description: '심사 거절 건수: 카드처리결과구분코드 = ''02''인 신청서접수번호의 고유 건수'
  sql: COUNT(DISTINCT CASE WHEN 카드처리결과구분코드 = '02' THEN 신청서접수번호 END)
  source_table: tbdaaaf23
  type: count
  time_dimension: 최종심사년월일
  synonyms:
  - 거절건수
  - 반려건수
- name: 한도사용률
  description: '한도 사용률: 카드이용합계금액 / 총한도금액'
  sql: SUM(카드이용합계금액)::FLOAT / NULLIF(SUM(총한도금액), 0)
  source_table: tbdaaha97
  type: ratio
  time_dimension: 작업기준년월
  synonyms:
  - 한도소진율
  - 이용률
- name: 법인카드총이용금액
  description: '법인카드 총 이용금액: 기업(법인) 카드의 매출전표 매출금액 합계. 반드시 개인기업구분코드 = ''2'' 조건을 포함해야 합니다.

    '
  sql: SUM(CASE WHEN 개인기업구분코드 = '2' THEN 매출금액 ELSE 0 END)
  source_table: tbdaabt30
  type: currency_krw
