    - 카드결제기관구분코드
    - 상품중분류구분코드
    - KB카드계좌여부
  rules:
  - 유효 카드 판단은 실제카드만료년월일 > 기준일 조건을 사용합니다.
  - KB카드만 볼 때는 KB카드BC카드구분코드 = '1' 조건을 사용합니다.
  - KB카드계좌여부는 카드결제기관구분코드 = '004'이면 '1', 아니면 '0'으로 계산합니다.
  - 개인카드만 볼 때는 개인기업구분코드 = '1', 기업카드만 볼 때는 개인기업구분코드 = '2'를 추가합니다.
  sql_pattern: "SELECT DISTINCT\n  본인고객식별자,\n  개인기업구분코드,\n  카드결제기관구분코드,\n  상품중분류구분코드,\n  CASE WHEN 카드결제기관구분코드 = '004' THEN\
    \ '1' ELSE '0' END AS KB카드계좌여부\nFROM card_system.tbdaaat05\nWHERE 실제카드만료년월일 > '{카드만료기준일}'\n  AND KB카드BC카드구분코드 = '1'\n"
- intent: 가맹점_업종명_실적_카드소지_통합조회
  when_user_says:
  - 가맹점 업종명 실적 카드 소지 여부
  - 개인카드 미보유 가맹점
  - 기업카드 미보유 영업대상
  - 가맹점 월매출과 대표자 카드 보유
  - 가맹점 기본 업종 실적을 같이 보여줘
  primary_table: tbdaadt01
  join_tables:
  - tbdaadb17
  - tmdaa5e11
  - tbdaaat05
  join_rule: tbdaadt01.가맹점업종코드 = tbdaadb17.가맹점업종코드; tbdaadt01.가맹점번호 = tmdaa5e11.가맹점번호; tbdaadt01.대표고객식별자 = tbdaaat05.본인고객식별자;
    tbdaadt01.기업고객식별자 = tbdaaat05.본인고객식별자
  recommended_columns:
    merchant_base:
    - 가맹점신규년월일 AS 등록년월일
    - 가맹점번호
    - 기업고객식별자
    - 대표고객식별자 AS 개인고객식별자
    - 가맹점명
    - 사업자등록번호
    - 가맹점업종코드
    - 가맹점사업주체구분코드
    - 현금카드결제기관구분코드 AS 가맹점결제계좌
    - 신용카드가맹점수수료율
    - 체크카드가맹점수수료율
    - 가맹점관리부점코드
    - 가맹점상태구분코드
    industry:
    - tbdaadb17.사용여부 = '1'
    - 가맹점업종명
    - 업종대분류코드명
    performance:
    - tmdaa5e11.기준년월 = '{기준년월}'
    - COALESCE(가맹점일시불매출금액, 0) + COALESCE(가맹점할부매출금액, 0) AS 당월매출금액
    - 최근1년가맹점매출금액
    - 최근1년가맹점매출건수
    - 최근3개월가맹점매출금액
    - 최근3개월가맹점매출건수
    card_base:
    - 실제카드만료년월일 > '{카드만료기준일}'
    - KB카드BC카드구분코드 = '1'
    - 개인기업구분코드 = '1' for 개인카드
    - 개인기업구분코드 = '2' for 기업카드
  rules:
  - 업종 CTE 이름은 upjong을 사용하고, SAS 원문의 upping/gm_step1 누락 같은 오타는 보정합니다.
  - 가맹점 등록일 표시는 tbdaadt01.가맹점신규년월일 AS 등록년월일을 기본으로 사용합니다.
  - 당월매출금액은 COALESCE(가맹점일시불매출금액, 0) + COALESCE(가맹점할부매출금액, 0)로 계산합니다.
  - 개인카드 소지 여부는 대표고객식별자(개인고객식별자)와 tbdaaat05.본인고객식별자를 조인합니다.
  - 기업카드 소지 여부는 기업고객식별자와 tbdaaat05.본인고객식별자를 조인합니다.
  - 실적이 필요한 질문은 기준년월이 핵심 파라미터입니다. 카드만료기준일이 없으면 기준년월의 월말일을 사용합니다.
  sql_pattern: "WITH upjong AS (\n  SELECT\n    가맹점업종코드,\n    가맹점업종명,\n    업종대분류코드명\n  FROM card_system.tbdaadb17\n  WHERE\
    \ 사용여부 = '1'\n),\ngm_base AS (\n  SELECT\n    a.가맹점신규년월일 AS 등록년월일,\n    a.가맹점번호,\n    a.기업고객식별자,\n    a.대표고객식별자 AS 개인고객식별자,\n\
    \    a.가맹점명,\n    a.사업자등록번호,\n    a.가맹점업종코드,\n    b.가맹점업종명,\n    b.업종대분류코드명,\n    a.가맹점사업주체구분코드,\n    a.현금카드결제기관구분코드 AS\
    \ 가맹점결제계좌,\n    a.신용카드가맹점수수료율,\n    a.체크카드가맹점수수료율,\n    a.가맹점관리부점코드,\n    a.가맹점상태구분코드\n  FROM card_system.tbdaadt01 a\n\
    \  LEFT JOIN upjong b\n    ON a.가맹점업종코드 = b.가맹점업종코드\n),\ngm_perf AS (\n  SELECT\n    기준년월,\n    가맹점번호,\n    COALESCE(가맹점일시불매출금액,\
    \ 0) + COALESCE(가맹점할부매출금액, 0) AS 당월매출금액,\n    최근1년가맹점매출금액,\n    최근1년가맹점매출건수,\n    최근3개월가맹점매출금액,\n    최근3개월가맹점매출건수,\n \
    \   가맹점상태구분코드\n  FROM card_system.tmdaa5e11\n  WHERE 기준년월 = '{기준년월}'\n),\ncard_base AS (\n  SELECT DISTINCT\n    본인고객식별자,\n\
    \    개인기업구분코드\n  FROM card_system.tbdaaat05\n  WHERE 실제카드만료년월일 > '{카드만료기준일}'\n    AND KB카드BC카드구분코드 = '1'\n)\nSELECT\n\
    \  g.등록년월일,\n  p.기준년월,\n  g.가맹점번호,\n  g.가맹점명,\n  g.사업자등록번호,\n  g.가맹점업종코드,\n  g.가맹점업종명,\n  g.업종대분류코드명,\n  g.개인고객식별자,\n\
    \  g.기업고객식별자,\n  CASE WHEN c1.본인고객식별자 IS NOT NULL THEN '1' ELSE '0' END AS 개인카드소지여부,\n  CASE WHEN c2.본인고객식별자 IS NOT NULL\
    \ THEN '1' ELSE '0' END AS 기업카드소지여부,\n  p.당월매출금액,\n  p.최근3개월가맹점매출금액,\n  p.최근3개월가맹점매출건수,\n  p.최근1년가맹점매출금액,\n  p.최근1년가맹점매출건수,\n\
    \  g.신용카드가맹점수수료율,\n  g.체크카드가맹점수수료율,\n  g.가맹점결제계좌,\n  g.가맹점관리부점코드,\n  COALESCE(p.가맹점상태구분코드, g.가맹점상태구분코드) AS 가맹점상태구분코드\n\
    FROM gm_base g\nLEFT JOIN gm_perf p\n  ON g.가맹점번호 = p.가맹점번호\nLEFT JOIN card_base c1\n  ON g.개인고객식별자 = c1.본인고객식별자\n AND\
    \ c1.개인기업구분코드 = '1'\nLEFT JOIN card_base c2\n  ON g.기업고객식별자 = c2.본인고객식별자\n AND c2.개인기업구분코드 = '2'\nORDER BY p.당월매출금액 DESC\
    \ NULLS LAST, g.가맹점번호\nLIMIT {limit}\n"
- intent: 지역별 기업영업 가맹점 성과
  when_user_says:
  - 지역별 가맹점 전월 매입
  - 시도별 기업카드 가맹점 실적
  - 영업지역별 가맹점 지급금액
  rules:
  - 가맹점 실적은 기본적으로 tbdaaus01을 사용합니다.
  - 월별 추이가 필요하면 기준년월일에서 SUBSTRING(기준년월일, 1, 6)을 사용하거나 tbmaisd06을 사용합니다.
  - 휴폐업/거래정지 제외 요청이 있으면 휴폐업여부, 가맹점거래정지여부 필터를 적용합니다.
  sql_pattern: "SELECT\n  한글시도명,\n  한글시군구명,\n  COUNT(DISTINCT 가맹점번호) AS 가맹점수,\n  SUM(COALESCE(전월일시불매입금액, 0) + COALESCE(전월할부매입금액,\
    \ 0)) AS 전월매입금액,\n  SUM(COALESCE(전월일시불매입건수, 0) + COALESCE(전월할부매입건수, 0)) AS 전월매입건수,\n  AVG(신용카드가맹점수수료율) AS 평균수수료율\nFROM\
    \ card_system.tbdaaus01\nWHERE 기준년월일 BETWEEN '{시작일}' AND '{종료일}'\nGROUP BY 한글시도명, 한글시군구명\nORDER BY 전월매입금액 DESC\nLIMIT\
    \ {limit}\n"
  primary_table: tbdaaus01
- intent: 기업 특수채권 리스크 분석
  when_user_says:
  - 기업 특수채권 편입 현황
  - 자산건전성별 특채 잔액
  - 연체회차별 편입원금
  rules:
  - 기업 기준 질문은 개인기업구분코드 = '2' 필터를 적용합니다.
  - 특수채권편입잔액은 원금+수수료+이자+연체료+가지급금 합계입니다.
  sql_pattern: "SELECT\n  기준년,\n  자산건전성분류구분코드,\n  COUNT(DISTINCT 특수채권관리번호) AS 특수채권건수,\n  SUM(특수채권편입원금) AS 편입원금,\n  SUM(COALESCE(특수채권편입원금,\
    \ 0) + COALESCE(특수채권편입수수료, 0) + COALESCE(특수채권편입이자, 0) + COALESCE(특수채권편입연체료, 0) + COALESCE(특수채권편입가지급금, 0)) AS 편입잔액,\n \
    \ AVG(연체회차) AS 평균연체회차\nFROM card_system.tmdaaus01\nWHERE 개인기업구분코드 = '2'\nGROUP BY 기준년, 자산건전성분류구분코드\nORDER BY 기준년, 편입잔액\
    \ DESC\n"
  primary_table: tmdaaus01
- intent: 기업영업 대손충당금 및 리스크비용률
  when_user_says:
  - 기업 대손충당금률
  - 월별 리스크비용
  - PD LGD 충당금 분석
  rules:
  - 기업 기준 질문은 개인기업구분코드 = '2' 필터를 적용합니다.
  - 대손충당금률은 기대대손충당금 / 원화대출잔액입니다.
  - PD/LGD는 단순 합산하지 말고 평균 또는 잔액가중 평균 여부를 질문 의도에 맞춰 선택합니다.
  sql_pattern: "SELECT\n  기준년월,\n  상품코드,\n  SUM(원화대출잔액) AS 원화대출잔액,\n  SUM(기대대손충당금) AS 기대대손충당금,\n  AVG(기대1년PD율) AS 평균PD율,\n\
    \  AVG(충당금기대LGD율) AS 평균LGD율,\n  SUM(기대대손충당금)::FLOAT / NULLIF(SUM(원화대출잔액), 0) AS 대손충당금률\nFROM card_system.tbmewcm94\nWHERE\
    \ 개인기업구분코드 = '2'\nGROUP BY 기준년월, 상품코드\nORDER BY 기준년월, 기대대손충당금 DESC\n"
  primary_table: tbmewcm94
verified_queries:
- name: corporate_card_active_no_usage_members
  question: KB국민 기업카드를 보유하고 있지만 최근 기간 이용이 없는 기업회원 명단을 알려줘
  description: 기업회원 월별 풍성화 테이블에서 기준월 현재 유효 기업카드를 보유한 기업 중 지정 기간 동안 신용/체크카드 이용금액이 없는 기업회원 명단을 조회합니다. SAS/Oracle 원문은 Athena용 SELECT 패턴으로 변환했습니다.
  sql: |
    SELECT
      a.사업자등록번호,
      a.기업명
    FROM card_system.tmdaa1d12 a
    WHERE a.기준년월 = '{기준년월}'
      AND a."year" = SUBSTRING('{기준년월}', 1, 4)
      AND a."month" = SUBSTRING('{기준년월}', 5, 2)
      AND (COALESCE(a.유효기업신용카드수, 0) + COALESCE(a.유효기업체크카드수, 0)) > 0
      AND NOT EXISTS (
        SELECT 1
        FROM card_system.tmdaa1d12 b
        WHERE b.고객식별자 = a.고객식별자
          AND b.기준년월 BETWEEN '{기간_시작}' AND '{기간_종료}'
          AND (b."year" || b."month") BETWEEN '{기간_시작}' AND '{기간_종료}'
          AND (COALESCE(b.금월신용카드이용금액, 0) + COALESCE(b.금월체크카드이용금액, 0)) > 0
      )
