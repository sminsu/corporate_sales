- name: 가맹점전년대비성장률
  description: 가맹점 매출 전년대비 성장률
  sql: '(SUM(금년가맹점신용판매매출금액) - SUM(전년가맹점신용판매매출금액))::FLOAT / NULLIF(SUM(전년가맹점신용판매매출금액), 0)

    '
  source_table: tmdaa5e11
  type: ratio
  time_dimension: 기준년월
  synonyms:
  - 매출성장률
  - 전년대비
  - YoY
- name: 기업가맹점전월매입금액
  description: 일시불과 할부를 합산한 기업영업 가맹점 전월 매입금액
  sql: SUM(COALESCE(전월일시불매입금액, 0) + COALESCE(전월할부매입금액, 0))
  source_table: tbdaaus01
  type: sum
  unit: KRW
  synonyms:
  - 전월매입
  - 가맹점매입
  - 매입금액
- name: 기업가맹점전월매입건수
  description: 일시불과 할부를 합산한 기업영업 가맹점 전월 매입건수
  sql: SUM(COALESCE(전월일시불매입건수, 0) + COALESCE(전월할부매입건수, 0))
  source_table: tbdaaus01
  type: count
  unit: count
  synonyms:
  - 전월매입건수
  - 가맹점매입건수
- name: 가맹점총지급금액합계
  description: 가맹점에 지급된 총 금액의 합계
  sql: SUM(가맹점총지급금액)
  source_table: tbdaaus01
  type: sum
  unit: KRW
  synonyms:
  - 총지급금액
  - 가맹점지급액
- name: 유효기업카드수
  description: 유효 기업 신용카드와 체크카드 수 합계
  sql: SUM(COALESCE(유효기업신용카드수, 0) + COALESCE(유효기업체크카드수, 0))
  source_table: tbdaaus01
  type: count
  unit: count
  synonyms:
  - 유효법인카드수
  - 기업카드수
- name: 특수채권편입잔액
  description: 특수채권 편입 원금, 수수료, 이자, 연체료, 가지급금을 합산한 잔액
  sql: SUM(COALESCE(특수채권편입원금, 0) + COALESCE(특수채권편입수수료, 0) + COALESCE(특수채권편입이자, 0) + COALESCE(특수채권편입연체료, 0) + COALESCE(특수채권편입가지급금,
    0))
  source_table: tmdaaus01
  type: sum
  unit: KRW
  synonyms:
  - 특채잔액
  - 특수채권금액
- name: 기대대손충당금합계
  description: 월별 기대 대손충당금 합계
  sql: SUM(기대대손충당금)
  source_table: tbmewcm94
  type: sum
  unit: KRW
  synonyms:
  - 대손충당금
  - 충당금
- name: 대손충당금률
  description: 원화대출잔액 대비 기대대손충당금 비율
  sql: SUM(기대대손충당금)::FLOAT / NULLIF(SUM(원화대출잔액), 0)
  source_table: tbmewcm94
  type: ratio
  unit: ratio
  synonyms:
  - 충당금률
  - 대손비용률
  - 리스크비용률
glossary:
- term: 법인카드
  canonical: 개인기업구분코드 = '2'인 카드
  description: 기업(법인) 명의로 발급된 카드. 개인기업구분코드가 '2'인 레코드
  aliases:
  - 기업카드
  - 법인신용카드
  - corporate card
- term: CA
  canonical: 현금서비스(Cash Advance)
  description: 카드를 이용한 현금 인출 서비스. ca이용금액, ca수수료 등의 컬럼에서 사용
  aliases:
  - 현금서비스
  - Cash Advance
  - 캐시어드밴스
- term: 가맹점
  canonical: 카드 결제를 받는 상점
  description: KB카드와 가맹 계약을 맺고 카드 결제를 수용하는 업소
  aliases:
  - merchant
  - 상점
  - 매장
  - 업소
- term: 매입
  canonical: 카드사가 매출전표를 접수하여 정산 처리하는 행위
  description: 가맹점의 카드 거래를 카드사가 승인 후 정산 처리. 매입건수/매입금액으로 집계
  aliases:
  - acquisition
  - 전표매입
- term: 일시불
  canonical: 할부 없이 1회 전액 결제
  description: 할부기간개월수 = 0 또는 카드매출유형 중 일시불에 해당하는 거래
  aliases:
  - 일괄결제
  - lump sum
- term: 연체
  canonical: 결제 기한 경과 후 미납 상태
  description: 카드 이용 대금을 결제일까지 납부하지 않은 상태. 연체원금, 연체금액, 연체회차로 관리
  aliases:
  - 미납
  - delinquency
  - overdue
- term: MCC
  canonical: Merchant Category Code
  description: 국제 표준 가맹점 업종 분류 코드. mcc업종코드 컬럼에 저장
  aliases:
  - MCC코드
  - 업종분류코드
- term: 수수료
  canonical: 가맹점이 카드사에 지불하는 결제 대행 수수료
  description: 거래금액 대비 일정 비율(수수료율)로 산정. 신용카드/체크카드별 별도 수수료율 적용
  aliases:
  - 가맹점수수료
  - merchant fee
  - 결제수수료
- term: 부점
  canonical: 영업점/지점
  description: 카드사의 영업 관리 단위. 관리부점코드, 모집부점코드 등으로 참조
  aliases:
  - 영업점
  - 지점
  - 부점코드
  - branch
- term: KCIS
  canonical: 한국신용정보원
  description: 금융권 신용정보 집중/관리 기관. tbdaaha97 테이블의 여신 정보 출처
  aliases:
  - 한국신용정보원
  - 신용정보원
- term: KIS
  canonical: 한국신용평가
  description: 기업 신용등급 평가기관. kis신용등급코드/kis신용평점 컬럼에서 사용
  aliases:
  - 한국신용평가
  - KIS등급
- term: CRS
  canonical: Credit Rating System (신용등급평가시스템)
  description: 카드사 자체 신용등급 평가 시스템. crs 관련 컬럼들에서 사용
  aliases:
  - 신용등급시스템
  - Credit Rating
- term: 심사
  canonical: 기업카드 발급 심사 (tbdaaaf23)
  description: 기업카드 발급 신청에 대한 신용 심사 과정. 승인/거절 결과와 부여한도 결정
  aliases:
  - 신용심사
  - 카드심사
  - 발급심사
  - credit review
- term: 한도
  canonical: 카드 이용 가능 최대 금액
  description: 기업카드의 이용 가능 한도. 최종부여한도금액, 가맹점월승인한도금액 등
  aliases:
  - 이용한도
  - 신용한도
  - 승인한도
  - credit limit
- term: 전표
  canonical: 매출전표 (tbdaabt30)
  description: 카드 거래 발생 시 생성되는 거래 기록. 매출전표번호로 식별
  aliases:
  - 매출전표
  - 거래전표
  - slip
- term: 기준년월
  canonical: 데이터 스냅샷 기준 시점 (YYYYMM 형식)
  description: 월별 집계/스냅샷 테이블의 기준 시점. YYYYMM 형식의 VARCHAR
  aliases:
  - 기준월
  - 기준시점
  sql_hint: '기준년월 형식은 ''YYYYMM''입니다. 예: ''202604'''
- term: 기준년월일
  canonical: 데이터 스냅샷 기준 시점 (YYYYMMDD 형식)
  description: 일별 스냅샷 테이블의 기준 시점. YYYYMMDD 형식의 VARCHAR
  aliases:
  - 기준일
  sql_hint: '기준년월일 형식은 ''YYYYMMDD''입니다. 예: ''20260416'''
- term: 신규 고객
  canonical: 고객 최초 등록일 기준 신규 고객
  description: 실제 모집 테이블이 확정되지 않은 경우 고객 마스터(tbdaaat01)의 최초등록년월일 기준 신규 등록 고객으로만 해석합니다.
  aliases:
  - 신규고객
  - 가입고객
  - 등록고객
  sql_hint: 신규/가입/등록 고객 질의는 tbdaaat01.최초등록년월일을 사용합니다. '모집고객'은 별도 실테이블이 없으면 임의 매핑하지 말고 추가 확인이 필요합니다.
- term: 여성 고객
  canonical: 성별구분코드 = '2'
  description: 성별 코드 기준 여성 고객. 실제 코드 사전이 있으면 그 값을 우선합니다.
  aliases:
  - 여성
  - 여자
  - 여자고객
  - female
  sql_hint: 여성 조건은 성별구분코드 = '2'를 기본값으로 사용합니다.
- term: 기업영업
  canonical: 기업영업
  description: 기업고객과 연결된 가맹점, 기업카드 보유, 전월 매입, 지급금액, 채권/충당금 리스크를 함께 보는 영업 관리 관점
  aliases:
  - 법인영업
  - 기업고객영업
  - B2B영업
- term: 전월매입금액
  canonical: 기업가맹점전월매입금액
  description: 가맹점 기준 전월 일시불 매입금액과 할부 매입금액의 합계
  aliases: []
- term: 유효기업카드수
  canonical: 유효기업카드수
  description: 유효 기업 신용카드 수와 유효 기업 체크카드 수의 합계. 기준일/월 스냅샷성 지표입니다.
  aliases: []
- term: 특수채권편입잔액
  canonical: 특수채권편입잔액
  description: 특수채권 편입 원금, 수수료, 이자, 연체료, 가지급금 합계
  aliases: []
- term: 대손충당금률
  canonical: 대손충당금률
  description: 기대대손충당금을 원화대출잔액으로 나눈 비율
  aliases: []
query_references:
- intent: 신규등록고객_월별_기본조회
  when_user_says:
  - 12월 신규 고객 알려줘
  - 12월 가입 고객 수
  - 2025년 12월 등록고객
  - 월별 신규 고객 추이
  primary_table: tbdaaat01
  recommended_columns:
    time_filter: SUBSTRING(최초등록년월일, 1, 6) = '{기준년월}'
    metric: COUNT(DISTINCT 고객식별자) AS 신규고객수
    display:
    - 기준년월
    - 신규고객수
  rules:
  - 신규/가입/등록 고객은 tbdaaat01.최초등록년월일을 기준으로 해석합니다.
  - 모집고객이라는 표현은 실테이블이 확정되지 않았으므로 tbdaaat01로 임의 치환하지 않습니다.
  - 월 조건은 YYYYMM 형식으로 변환합니다.
  sql_pattern: "SELECT\n  SUBSTRING(최초등록년월일, 1, 6) AS 기준년월,\n  COUNT(DISTINCT 고객식별자) AS 신규고객수\nFROM card_system.tbdaaat01\n\
    WHERE SUBSTRING(최초등록년월일, 1, 6) = '{기준년월}'\nGROUP BY SUBSTRING(최초등록년월일, 1, 6)\n"
- intent: 신규등록고객_성별필터
  when_user_says:
  - 12월 신규 고객 중 여성 고객을 뽑아줘
  - 가입 고객 중 여자 고객만 보여줘
  - 여성 신규 고객 수
  - 등록고객을 성별로 나눠줘
  primary_table: tbdaaat01
  recommended_columns:
    filters:
    - 성별구분코드 = '2' for 여성
    - 성별구분코드 = '1' for 남성
    metric: COUNT(DISTINCT 고객식별자)
    display:
    - 기준년월
    - 성별구분코드
    - 고객수
  rules:
  - 여성/남성 조건은 tbdaaat01.성별구분코드를 사용합니다.
  - 성별별 분포를 묻는 경우 WHERE 성별 조건을 걸지 말고 GROUP BY 성별구분코드를 사용합니다.
- intent: 기업고객_신규등록_대표자성별
  when_user_says:
  - 12월 신규 기업고객 중 대표자가 여성인 고객
  - 여성 대표자 기업고객
  - 신규 법인고객 중 여성 대표자
  primary_table: tbdaaat14
  join_tables:
  - tbdaaat01
  join_rule: tbdaaat14.기업대표자고객식별자 = tbdaaat01.고객식별자
  recommended_columns:
    time_filter: SUBSTRING(tbdaaat14.최초등록년월일, 1, 6) = '{기준년월}'
    gender_filter: tbdaaat01.성별구분코드 = '2'
    metric: COUNT(DISTINCT tbdaaat14.고객식별자) AS 기업고객수
  rules:
  - 기업 자체의 성별이 아니라 대표자 성별을 묻는 경우 tbdaaat14.기업대표자고객식별자로 tbdaaat01을 조인합니다.
  - 기업고객 수는 tbdaaat14.고객식별자 distinct count를 사용합니다.
- intent: 기업고객_월별이용_복합질의
  when_user_says:
  - 신규 기업고객의 이후 카드 이용금액
  - 기업고객 중 여성 대표자의 월별 이용금액
  - 기업고객 등록월과 이용월을 같이 보여줘
  primary_table: tbdaaat14
  join_tables:
  - tmdaa2e17
  - tbdaaat01
  join_rule: tbdaaat14.고객식별자 = tmdaa2e17.고객식별자; tbdaaat14.기업대표자고객식별자 = tbdaaat01.고객식별자
  recommended_columns:
    registration_month: SUBSTRING(tbdaaat14.최초등록년월일, 1, 6)
    usage_month: tmdaa2e17.기준년월
    usage_metric: SUM(tmdaa2e17.금월일시불이용금액 + tmdaa2e17.금월할부이용금액 + tmdaa2e17.금월ca이용금액)
  rules:
  - 등록월과 이용월은 서로 다른 시간축이므로 SELECT alias를 명확히 분리합니다.
  - 이용금액은 tmdaa2e17의 월별 기업고객 집계 컬럼을 우선 사용합니다.
- intent: 기업심사_조건결합_복합질의
  when_user_says:
  - 여성 대표자 기업의 심사 승인율
  - 신규 기업고객의 심사 승인 현황
  - 특정 기간 기업고객 심사와 한도
  primary_table: tbdaaaf23
  join_tables:
  - tbdaaat14
  - tbdaaat01
  join_rule: tbdaaaf23.본사사업자등록번호 = tbdaaat14.본사사업자등록번호; tbdaaat14.기업대표자고객식별자 = tbdaaat01.고객식별자
  recommended_columns:
    approval_metric: COUNT(DISTINCT CASE WHEN tbdaaaf23.카드처리결과구분코드 = '01' THEN tbdaaaf23.신청서접수번호 END)
    approval_rate: 승인건수 / 전체심사건수
    limit_metric: AVG(tbdaaaf23.최종부여한도금액)
  rules:
  - 심사 승인/거절은 tbdaaaf23.카드처리결과구분코드를 사용합니다.
  - 기업/대표자 조건은 tbdaaat14/tbdaaat01 조인으로 보강합니다.
- intent: 활성_가맹점업종_코드명_조회
  when_user_says:
  - 업종 코드명 알려줘
  - 가맹점 업종코드와 업종명
  - 사용 중인 가맹점 업종 목록
  - 업종명 코드 매핑
  primary_table: tbdaadb17
