    expr: 사업자등록번호
    data_type: VARCHAR
  - name: 기업명
    description: 기업 고객명
    expr: 기업명
    data_type: VARCHAR
    synonyms:
    - 법인명
    - 회사명
  - name: 법인고객식별자
    description: 법인 고객 식별자
    expr: 법인고객식별자
    data_type: VARCHAR
  - name: 대표자고객식별자
    description: 대표자 고객 식별자
    expr: 대표자고객식별자
    data_type: VARCHAR
  - name: 대표가맹점번호
