model_info:
  name: kb_card_corporate_sales_gptoss
  description: "gpt-oss 기반 Text2SQL을 위한 KB카드 법인영업 시맨틱 모델. 법인카드 발급/이용 실적, 가맹점 매출, 기업 신용심사, 연체 현황 등에 대한 질의를 지원합니다. Snowflake\
    \ Semantic View 형식을 참고해 지표, 차원, 관계, 업무 규칙을 분리하지만 실제 SQL은 PostgreSQL 계열 dialect로 생성합니다.\n    schema_v7_enterprise_sales_gptoss.yaml의\
    \ 기업영업 가맹점/채권/충당금 테이블과 예시를 병합한 단일 실행 schema입니다."
  database: card_system
  schema: card_system
  dialect: postgres
  target_llm: gpt-oss
  semantic_engine: none
  source_schema_file: schema_v5.yaml
  version: 2.1-merged-gptoss
  updated_at: '2026-05-22'
  change_summary: "v6_gptoss는 기존 v5의 테이블/관계/verified query를 보존하면서, gpt-oss가 질문 라우팅, 지표 선택, 조인 경로 선택, 시간축 선택을 안정적으로 수행하도록 canonical\
    \ semantic layer를 앞단에 추가했습니다. 2026-05-22에는 SAS reference 기반으로 가맹점 기본/업종/월실적/개인·기업카드 소지 여부 패턴을 추가했습니다. Snowflake 엔진은 사용하지\
    \ 않으며, Snowflake Semantic View의 구조적 장점만 반영합니다.\n    schema_v7의 기업영업 4개 테이블(tbdaaus01, tmdaaus01, tbmewcm94, tbmaisd06),\
    \ 도메인, 메트릭, reference, verified query를 중복 없이 병합했습니다. 원천 타입/시스템 갱신일시 등 질의 활용도가 낮은 메타데이터는 제외했습니다."
llm_semantic_contract:
  purpose: '사용자의 자연어 질문을 안전한 읽기 전용 SQL로 변환하기 위한 LLM 실행 규약. 이 섹션은 Snowflake Semantic View의 의미 모델링 방식을 LLM 프롬프트 친화적으로 재구성한 것입니다.

    '
  sql_output_rules:
  - 항상 SELECT 또는 WITH로 시작하는 읽기 전용 SQL만 생성합니다.
  - 모든 실제 테이블명에는 card_system. prefix를 붙입니다.
  - SELECT *를 사용하지 말고 필요한 컬럼과 집계값만 명시합니다.
  - 사용자 질문에 없는 테이블, 컬럼, 업무 개념을 임의로 만들지 않습니다.
  - 테이블 alias를 쓰는 경우 모든 조인/필터/집계 컬럼에 alias를 붙입니다.
  - 분모가 있는 비율 지표는 NULLIF(분모, 0)를 사용합니다.
  - 금액 비율을 퍼센트로 보여달라고 한 경우에만 * 100 또는 ROUND(..., 2)를 적용합니다.
  - 여부 컬럼은 실제 코드값이 확정되지 않은 경우 Y/N을 단정하지 말고 사용자의 조건 또는 sample query를 우선합니다.
  evidence_priority:
  - '1순위: verified_queries 중 의미가 가장 가까운 예시'
  - '2순위: query_references의 intent/rules/sql_pattern'
  - '3순위: canonical_metrics의 공식 정의'
  - '4순위: semantic_entities와 semantic_join_graph'
  - '5순위: tables의 컬럼 설명과 glossary'
  ambiguity_policy:
  - 기간이 필요한 질문인데 기간이 없으면 전체 기간 SQL을 만들 수 있지만, 결과 해석에서 전체 기간임을 명시합니다.
  - 신규/가입/등록 고객은 기본적으로 tbdaaat01.최초등록년월일 기준입니다.
  - 기업고객 신규/등록은 tbdaaat14.최초등록년월일 기준입니다.
  - 대표자 성별 조건은 기업 자체 컬럼이 아니라 tbdaaat14.기업대표자고객식별자 -> tbdaaat01.고객식별자 조인으로 처리합니다.
  - 모집고객, 대손비용, 모집채널처럼 실테이블이 확정되지 않은 용어는 임의 매핑하지 않습니다.
  - 기업영업 가맹점 실적 질문은 기본적으로 tbdaaus01을 사용합니다.
  - 월별 가맹점 추이 질문은 기준년월이 있는 tbmaisd06을 우선하고, 일별 기준은 tbdaaus01의 기준년월일을 사용합니다.
  - 특수채권/연체/편입원금 질문은 tmdaaus01을 사용합니다.
  - 대손충당금/PD/LGD/리스크비용률 질문은 tbmewcm94를 사용합니다.
  - 기업 기준 질문은 가능한 경우 개인기업구분코드 = '2'를 적용합니다.
  - 가맹점과 충당금/특수채권을 조인할 때는 기업고객식별자/고객식별자 기준 중복 집계 위험을 고려해 사전 집계합니다.
