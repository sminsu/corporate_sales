- name: corporate_card_churned_after_usage_members
  question: KB국민 기업카드를 과거 이용했지만 현재 탈퇴 또는 해지한 기업회원 명단을 알려줘
  description: 지정 기간 중 기업카드 이용 이력이 있으나 기준월 현재 유효 기업 신용/체크카드 수가 0인 기업회원 명단과 마지막 이용월, 최근 기간 총 이용금액을 조회합니다.
  sql: |
    WITH base AS (
      SELECT
        b.고객식별자,
        b.사업자등록번호,
        b.기업명,
        b.기준년월,
        COALESCE(b.금월신용카드이용금액, 0) + COALESCE(b.금월체크카드이용금액, 0) AS 이용금액,
        COALESCE(b.유효기업신용카드수, 0) + COALESCE(b.유효기업체크카드수, 0) AS 카드수
      FROM card_system.tmdaa1d12 b
      WHERE b.기준년월 BETWEEN '{기간_시작}' AND '{기간_종료}'
        AND (b."year" || b."month") BETWEEN '{기간_시작}' AND '{기간_종료}'
    ),
    curr AS (
      SELECT
        고객식별자,
        사업자등록번호,
        기업명,
        기준년월,
        기준년월일,
        유효기업신용카드수,
        유효기업체크카드수
      FROM (
        SELECT
          c.고객식별자,
          c.사업자등록번호,
          c.기업명,
          c.기준년월,
          c.기준년월일,
          c.유효기업신용카드수,
          c.유효기업체크카드수,
          ROW_NUMBER() OVER (
            PARTITION BY c.고객식별자
            ORDER BY c.기준년월일 DESC
          ) AS rn
        FROM card_system.tmdaa1d12 c
        WHERE c.기준년월 = '{기준년월}'
          AND c."year" = SUBSTRING('{기준년월}', 1, 4)
          AND c."month" = SUBSTRING('{기준년월}', 5, 2)
      )
      WHERE rn = 1
    ),
    agg AS (
      SELECT
        고객식별자,
        MAX(CASE WHEN 이용금액 > 0 THEN 기준년월 END) AS 마지막이용월,
        SUM(이용금액) AS 최근기간총이용금액,
        MAX(CASE WHEN 이용금액 > 0 THEN 1 ELSE 0 END) AS 이용이력존재
      FROM base
      GROUP BY 고객식별자
    )
    SELECT
      c.사업자등록번호,
      c.기업명,
      a.마지막이용월,
      a.최근기간총이용금액
    FROM curr c
    JOIN agg a
      ON c.고객식별자 = a.고객식별자
    WHERE (COALESCE(c.유효기업신용카드수, 0) + COALESCE(c.유효기업체크카드수, 0)) = 0
      AND a.이용이력존재 = 1
    ORDER BY a.마지막이용월 DESC, a.최근기간총이용금액 DESC
    LIMIT {limit}
  parameters:
    기준년월:
      type: string
      description: 현재 탈퇴/해지 여부를 판단할 기준년월(YYYYMM)
      required: true
      default: '202604'
      sample_values:
      - '202604'
    기간_시작:
      type: string
      description: 과거 이용 이력 집계 시작 기준년월(YYYYMM)
      required: true
      default: '202511'
      sample_values:
      - '202511'
    기간_종료:
      type: string
      description: 과거 이용 이력 집계 종료 기준년월(YYYYMM)
      required: true
      default: '202604'
      sample_values:
      - '202604'
    limit:
      type: integer
      description: 상세 목록 제한 건수
      default: '100'
  tags:
