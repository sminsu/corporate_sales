    expr: 금월신용카드이용금액
    data_type: NUMERIC
    default_aggregation: sum
    unit: KRW
  - name: 금월체크카드이용금액
    description: 해당 기준월의 기업 체크카드 이용금액
    expr: 금월체크카드이용금액
    data_type: NUMERIC
    default_aggregation: sum
    unit: KRW
  - name: 기업총한도금액
