- name: tmdaaus01
  physical_table: card_system.tmdaaus01
  description: '기업 및 개인/기업 회원의 특수채권 편입 원장성 테이블입니다. 특수채권관리번호, 고객식별자, 개인기업구분코드, 최초/현재 연체 발생일과 회차, 편입 원금/수수료/이자/연체료, 자산건전성 분류를
