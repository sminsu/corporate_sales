  - name: 실제카드만료년월일
    description: 카드 실제 만료일. 유효 카드 판단 기준일보다 큰 경우 유효 카드로 봅니다.
    expr: 실제카드만료년월일
    data_type: VARCHAR
    synonyms:
    - 카드만료일
    - 만료년월일
    - 유효카드기준일
  dimensions:
  - name: 본인고객식별자
    description: 카드 본인 고객 식별자
    expr: 본인고객식별자
    data_type: VARCHAR
    synonyms:
    - 카드보유고객식별자
    - 소지자고객식별자
  - name: 개인기업구분코드
    description: 카드 보유자의 개인/기업 구분 코드. 일반적으로 개인카드='1', 기업카드='2' 기준으로 사용합니다.
    expr: 개인기업구분코드
    data_type: VARCHAR
    synonyms:
    - 개인기업구분
    - 개인카드기업카드구분
  - name: 카드결제기관구분코드
    description: 카드 결제기관 구분 코드. '004'이면 KB카드 계좌 여부를 1로 표시합니다.
    expr: 카드결제기관구분코드
    data_type: VARCHAR
    synonyms:
    - 결제기관구분코드
    - 카드결제계좌
  - name: 상품중분류구분코드
    description: 카드 상품 중분류 구분 코드
    expr: 상품중분류구분코드
    data_type: VARCHAR
    synonyms:
    - 상품중분류
  - name: KB카드BC카드구분코드
    description: KB카드/BC카드 구분 코드. KB카드 기준은 '1'입니다.
    expr: KB카드BC카드구분코드
    data_type: VARCHAR
    synonyms:
    - KB카드구분
    - KB카드여부
  filters:
  - name: 유효KB카드
    description: 기준일 이후 만료되는 KB카드
    expr: 실제카드만료년월일 > '{카드만료기준일}' AND KB카드BC카드구분코드 = '1'
    synonyms:
    - 유효카드
    - KB카드
  - name: 개인카드
    description: 개인카드 보유자
    expr: 개인기업구분코드 = '1'
    synonyms:
    - 개인카드소지
  - name: 기업카드
    description: 기업카드 보유자
    expr: 개인기업구분코드 = '2'
    synonyms:
    - 기업카드소지
    - 법인카드소지
