    expr: 기준년월일
    data_type: VARCHAR
  athena_partition:
    source_time_dimension: 기준년월
    source_format: YYYYMM
    keys:
    - name: year
      format: YYYY
      data_type: string
    - name: month
      format: MM
      data_type: string
  dimensions:
  - name: 고객식별자
    description: 기업/법인 고객 고유 식별자
    expr: 고객식별자
    data_type: VARCHAR
    synonyms:
    - 기업고객식별자
    - 법인고객식별자
  - name: 사업자등록번호
