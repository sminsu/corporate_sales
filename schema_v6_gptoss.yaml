- name: tbdaaat05
  physical_table: card_system.tbdaaat05
  description: '개인/기업 카드 기본 테이블. 한 행은 카드 보유자와 카드 상품/결제기관 조합의 기본 속성을 나타냅니다. 가맹점 대표자의 개인카드 소지 여부와 기업고객의 기업카드 소지 여부를 판단할 때 사용합니다.

    '
