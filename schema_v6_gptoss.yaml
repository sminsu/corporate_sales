  - KB카드 계좌 여부
  - 카드 만료일 기준 보유자
  primary_table: tbdaaat05
  recommended_columns:
    filters:
    - 실제카드만료년월일 > '{카드만료기준일}'
    - KB카드BC카드구분코드 = '1'
    display:
