- name: new_customers_by_month
  question: 12월 신규 고객 알려줘
  description: |
    고객 마스터의 최초등록년월일 기준 특정 월 신규 등록 고객 수를 조회합니다. 모집고객 실테이블이 별도로 확정되지 않은 경우 "모집고객"으로 임의 해석하지 않습니다.
  sql: |
    SELECT
      SUBSTRING(최초등록년월일, 1, 6) AS 기준년월,
      COUNT(DISTINCT 고객식별자) AS 신규고객수
    FROM card_system.tbdaaat01
    WHERE SUBSTRING(최초등록년월일, 1, 6) = '{기준년월}'
    GROUP BY SUBSTRING(최초등록년월일, 1, 6)
  parameters:
    기준년월:
      type: string
      description: 신규 등록 기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202512'
  tags:
  - 신규고객
  - 가입고객
  - 등록고객
  - 고객
  - 월별
  - tbdaaat01
  - 파라미터
- name: new_female_customers_by_month
  question: 12월 신규 고객 중에서 여성 고객을 뽑아줘
  description: |
    고객 마스터에서 특정 월 신규 등록 고객 중 여성 고객 목록을 조회합니다. 여성 조건은 성별구분코드='2'를 기본으로 사용합니다.
  sql: |
    SELECT
      고객식별자,
      고객관리번호,
      성별구분코드,
      개인기업구분코드,
      고객상태구분코드,
      최초등록년월일
    FROM card_system.tbdaaat01
    WHERE SUBSTRING(최초등록년월일, 1, 6) = '{기준년월}'
      AND 성별구분코드 = '2'
    ORDER BY 최초등록년월일 DESC, 고객식별자
    LIMIT {limit}
  parameters:
    기준년월:
      type: string
      description: 신규 등록 기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202512'
    limit:
      type: integer
      description: 상세 목록 제한 건수
      default: '100'
  tags:
  - 신규고객
  - 여성
  - 성별
  - 상세목록
  - tbdaaat01
  - 파라미터
- name: new_customers_gender_distribution
  question: 12월 신규 고객을 성별로 나눠서 보여줘
  description: |
    특정 월 신규 등록 고객을 성별구분코드별로 집계합니다. 성별 조건을 WHERE로 제한하지 않고 GROUP BY에 포함합니다.
  sql: |
    SELECT
      SUBSTRING(최초등록년월일, 1, 6) AS 기준년월,
      성별구분코드,
      COUNT(DISTINCT 고객식별자) AS 고객수
    FROM card_system.tbdaaat01
    WHERE SUBSTRING(최초등록년월일, 1, 6) = '{기준년월}'
    GROUP BY SUBSTRING(최초등록년월일, 1, 6), 성별구분코드
    ORDER BY 성별구분코드
  parameters:
    기준년월:
      type: string
      description: 신규 등록 기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202512'
  tags:
  - 신규고객
  - 성별
  - 분포
  - 집계
  - tbdaaat01
  - 파라미터
- name: new_corporate_customers_female_representative
  question: 12월 신규 기업고객 중 대표자가 여성인 고객을 보여줘
  description: |
    기업고객 마스터의 최초등록년월일 기준 신규 기업고객을 잡고, 기업대표자고객식별자로 고객 마스터를 조인해 대표자 성별을 필터링합니다.
  sql: |
    SELECT
      a.고객식별자 AS 기업고객식별자,
      a.가맹점명 AS 기업명,
      a.본사사업자등록번호,
      a.최초등록년월일,
      b.고객식별자 AS 대표자고객식별자,
      b.성별구분코드 AS 대표자성별구분코드
    FROM card_system.tbdaaat14 a
    JOIN card_system.tbdaaat01 b
      ON a.기업대표자고객식별자 = b.고객식별자
    WHERE SUBSTRING(a.최초등록년월일, 1, 6) = '{기준년월}'
      AND b.성별구분코드 = '2'
    ORDER BY a.최초등록년월일 DESC, a.고객식별자
    LIMIT {limit}
  parameters:
    기준년월:
      type: string
      description: 기업고객 신규 등록 기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202512'
    limit:
      type: integer
      description: 상세 목록 제한 건수
      default: '100'
  tags:
  - 기업고객
  - 신규등록
  - 대표자
  - 여성
  - 성별
  - JOIN
  - tbdaaat14
  - tbdaaat01
  - 파라미터
- name: corporate_customer_usage_by_registration_month
  question: 신규 기업고객의 이후 월별 카드 이용금액을 보여줘
  description: |
    기업고객 등록월과 월별 이용월을 분리해서 분석합니다. 기업고객 조건은 tbdaaat14, 이용금액은 tmdaa2e17을 사용합니다.
  sql: |
    SELECT
      SUBSTRING(a.최초등록년월일, 1, 6) AS 등록기준년월,
      b.기준년월 AS 이용기준년월,
      COUNT(DISTINCT a.고객식별자) AS 기업고객수,
      SUM(b.금월일시불이용금액 + b.금월할부이용금액 + b.금월ca이용금액) AS 총이용금액
    FROM card_system.tbdaaat14 a
    JOIN card_system.tmdaa2e17 b
      ON a.고객식별자 = b.고객식별자
    WHERE SUBSTRING(a.최초등록년월일, 1, 6) = '{등록기준년월}'
      AND b.기준년월 BETWEEN '{이용기간_시작}' AND '{이용기간_종료}'
    GROUP BY SUBSTRING(a.최초등록년월일, 1, 6), b.기준년월
    ORDER BY b.기준년월
  parameters:
    등록기준년월:
      type: string
      description: 기업고객 등록 기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202512'
    이용기간_시작:
      type: string
      description: 이용 기준 시작월 (YYYYMM)
      required: true
      sample_values:
      - '202512'
    이용기간_종료:
      type: string
      description: 이용 기준 종료월 (YYYYMM)
      required: true
      sample_values:
      - '202601'
  tags:
  - 기업고객
  - 신규등록
  - 이용금액
  - 월별
  - 복합질의
  - JOIN
  - tbdaaat14
  - tmdaa2e17
  - 파라미터
- name: daily_sales_amount
  question: 일별 매출금액을 알려줘
  sql: |
    SELECT
      전표매출년월일,
      COUNT(DISTINCT 매출전표번호) AS 매출건수,
      SUM(매출금액) AS 총매출금액
    FROM card_system.tbdaabt30
    WHERE 개인기업구분코드 = '2'
      AND (전표취소구분코드 IS NULL OR 전표취소구분코드 = '0')
    GROUP BY 전표매출년월일
    ORDER BY 전표매출년월일
  tags:
  - 매출
  - 일별
  - 시계열
- name: merchant_monthly_trend
  question: 가맹점 월별 매출 추이를 보여줘
  sql: |
    SELECT
      기준년월,
      SUM(가맹점일시불매출금액 + 가맹점할부매출금액) AS 총매출금액,
      SUM(가맹점일시불매출건수 + 가맹점할부매출건수) AS 총매출건수,
      SUM(가맹점수입수수료) AS 수수료수입
    FROM card_system.tmdaa5e11
    GROUP BY 기준년월
    ORDER BY 기준년월
  tags:
  - 가맹점
  - 월별
  - 시계열
- name: merchant_yoy_growth
  question: 가맹점 전년대비 매출 성장률은?
  sql: |
    SELECT
      가맹점번호,
      가맹점명,
      SUM(금년가맹점신용판매매출금액) AS 금년매출,
      SUM(전년가맹점신용판매매출금액) AS 전년매출,
      CASE
        WHEN SUM(전년가맹점신용판매매출금액) > 0
        THEN (SUM(금년가맹점신용판매매출금액) - SUM(전년가맹점신용판매매출금액))::FLOAT
             / SUM(전년가맹점신용판매매출금액)
        ELSE NULL
      END AS 전년대비성장률
    FROM card_system.tmdaa5e11
    GROUP BY 가맹점번호, 가맹점명
    HAVING SUM(전년가맹점신용판매매출금액) > 0
    ORDER BY 전년대비성장률 DESC
  tags:
  - 가맹점
  - 성장률
  - YoY
- name: review_by_credit_grade
  question: 신용등급별 심사 현황을 보여줘
  sql: |
    SELECT
      신용평가등급코드 AS 신용등급,
      COUNT(DISTINCT 신청서접수번호) AS 심사건수,
      COUNT(DISTINCT CASE WHEN 카드처리결과구분코드 = '01' THEN 신청서접수번호 END) AS 승인건수,
      AVG(최종부여한도금액) AS 평균부여한도,
      AVG(자산총계금액) AS 평균자산총계,
      AVG(매출금액) AS 평균매출
    FROM card_system.tbdaaaf23
    WHERE 신용평가등급코드 IS NOT NULL
    GROUP BY 신용평가등급코드
    ORDER BY 신용평가등급코드
  tags:
  - 심사
  - 신용등급
  - 집계
- name: fee_rate_by_industry
  question: 업종별 평균 수수료율은?
  sql: |
    SELECT
      b.업종대분류코드명,
      b.가맹점업종명,
      AVG(a.신용카드가맹점수수료율) AS 평균신용수수료율,
      AVG(a.체크카드수수료율) AS 평균체크수수료율,
      SUM(a.가맹점수입수수료) AS 수수료수입합계
    FROM card_system.tmdaa5e11 a
    JOIN card_system.tbdaadb17 b
      ON a.가맹점업종코드 = b.가맹점업종코드
    GROUP BY b.업종대분류코드명, b.가맹점업종명
    ORDER BY 수수료수입합계 DESC
  tags:
  - 수수료
  - 업종
  - 분석
- name: corporate_customer_card_holdings
  question: 기업고객별 카드 보유 현황을 보여줘
  sql: |
    SELECT
      고객식별자,
      기업검색명 AS 기업명,
      SUM(유효신용카드수) AS 유효신용카드,
      SUM(유효체크카드수) AS 유효체크카드,
      SUM(기업보유실물카드수) AS 실물카드수,
      SUM(금월일시불이용금액 + 금월할부이용금액 + 금월ca이용금액) AS 당월총이용금액
    FROM card_system.tmdaa2e17
    GROUP BY 고객식별자, 기업검색명
    ORDER BY 당월총이용금액 DESC
  tags:
  - 고객
  - 카드보유
  - 이용금액
- name: sales_target_individual_merchant_no_personal_card
  question: 개인사업자 가맹점주 영업추진 대상(개인카드 미보유) 추출해줘
  description: |
    특정 업종의 개인사업자 가맹점 중 대표자가 유효 개인카드(신용/체크)를 보유하지 않은 영업추진 대상을 추출합니다. 월 가맹점 매출금액도 함께 조회합니다.
  sql: |
    SELECT
        a.기준년월,
        a.가맹점번호,
        a.가맹점명,
        a.사업자등록번호,
        a.대표고객식별자,
        a.가맹점업종코드,
        a.가맹점관리부점코드,
        a.가맹점거래정지상태구분코드,
        COALESCE(c.가맹점일시불매출금액, 0) + COALESCE(c.가맹점할부매출금액, 0) AS 월가맹점매출금액
    FROM card_system.tmdaa5d01 a
    LEFT JOIN card_system.tmdaa3e16 b
        ON  a.대표고객식별자 = b.고객식별자
        AND a.기준년월      = b.기준년월
        AND b.개인기업구분코드       = '1'
        AND b.상품중분류구분코드     IN ('CP01', 'CP04')
        AND (b.유효신용카드여부 = '1' OR b.유효체크카드여부 = '1')
    LEFT JOIN card_system.tmdaa5e11 c
        ON  a.가맹점번호 = c.가맹점번호
        AND a.기준년월   = c.기준년월
    WHERE
        a.가맹점업종코드 IN ({업종코드목록})
        AND a.가맹점거래정지상태구분코드 IN ('1', '2')
        AND a.가맹점사업주체구분코드 = '1'
        AND b.고객식별자 IS NULL
    ORDER BY
        a.기준년월 DESC,
        월가맹점매출금액 DESC
  parameters:
    업종코드목록:
      type: list
      description: 대상 가맹점 업종코드 목록 (쉼표 구분)
      default: '''7005'',''5605'',''7002'',''7003'',''7007'''
      sample_values:
      - '''7005'',''5605'',''7002'',''7003'',''7007'''
      - '''7005'',''7002'''
    기준년월:
      type: string
      description: 조회 기준년월 (YYYYMM). 미지정 시 전체 기간.
      required: false
  tags:
  - 영업추진
  - 개인사업자
  - 가맹점
  - 개인카드미보유
  - 영업대상
  - 추출
- name: sales_by_industry_period
  question: 특정 기간 업종별 법인카드 매출을 분석해줘
  description: |
    기간과 업종 필터를 지정하여 업종별 매출금액/건수를 분석합니다. 법인카드(개인기업구분코드='2') 정상거래만 대상입니다.
  sql: |
    SELECT
      b.업종대분류코드명,
      b.가맹점업종명,
      SUM(a.매출금액) AS 총매출금액,
      COUNT(DISTINCT a.매출전표번호) AS 매출건수,
      AVG(a.매출금액) AS 건당평균금액
    FROM card_system.tbdaabt30 a
    JOIN card_system.tbdaadb17 b
      ON a.가맹점업종코드 = b.가맹점업종코드
    WHERE a.개인기업구분코드 = '2'
      AND (a.전표취소구분코드 IS NULL OR a.전표취소구분코드 = '0')
      AND a.전표매출년월일 BETWEEN '{기간_시작}' AND '{기간_종료}'
    GROUP BY b.업종대분류코드명, b.가맹점업종명
    ORDER BY 총매출금액 DESC
    LIMIT {limit}
  parameters:
    기간_시작:
      type: string
      description: 시작 기준년월일 (YYYYMMDD). YYYYMM 입력 시 뒤에 '01' 자동 추가.
      required: true
      sample_values:
      - '20250301'
      - '20260101'
    기간_종료:
      type: string
      description: 종료 기준년월일 (YYYYMMDD). YYYYMM 입력 시 뒤에 '31' 자동 추가.
      required: true
      sample_values:
      - '20250331'
      - '20260430'
    limit:
      type: integer
      description: 결과 행수 제한
      default: '20'
  tags:
  - 업종
  - 매출
  - 기간필터
  - 법인카드
  - 파라미터
- name: top_merchants_by_revenue_period
  question: 특정 기간 매출 상위 가맹점을 조회해줘
  description: |
    기간/업종/가맹점명 필터를 지정하여 매출 상위 가맹점 순위를 조회합니다.
  sql: |
    SELECT
      a.가맹점번호,
      a.가맹점명,
      b.가맹점업종명,
      b.업종대분류코드명,
      SUM(a.가맹점일시불매출금액 + a.가맹점할부매출금액) AS 총매출금액,
      SUM(a.가맹점일시불매출건수 + a.가맹점할부매출건수) AS 총매출건수,
      AVG(a.신용카드가맹점수수료율) AS 평균수수료율
    FROM card_system.tmdaa5e11 a
    JOIN card_system.tbdaadb17 b
      ON a.가맹점업종코드 = b.가맹점업종코드
    WHERE a.기준년월 BETWEEN '{기간_시작}' AND '{기간_종료}'
    GROUP BY a.가맹점번호, a.가맹점명, b.가맹점업종명, b.업종대분류코드명
    ORDER BY 총매출금액 DESC
    LIMIT {limit}
  parameters:
    기간_시작:
      type: string
      description: 시작 기준년월 (YYYYMM)
      required: true
      sample_values:
