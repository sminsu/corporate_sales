- name: corporate_delinquency_detail
  question: 특정 기업의 연체 상세 현황을 보여줘
  description: |
    기업명/기간으로 필터링하여 월별 연체 상세 현황(한도, 이용금액, 연체금액, 연체율)을 조회합니다.
  sql: |
    SELECT
      작업기준년월,
      상호명,
      사업자등록번호,
      기업계열명,
      SUM(총한도금액) AS 총한도,
      SUM(카드이용합계금액) AS 총이용금액,
      SUM(신용판매이용금액) AS 신용판매이용,
      SUM(할부이용금액) AS 할부이용,
      SUM(ca이용금액) AS CA이용,
      SUM(연체금액) AS 연체금액,
      CASE
        WHEN SUM(카드이용합계금액) > 0
        THEN ROUND((SUM(연체금액)::FLOAT / SUM(카드이용합계금액)) * 100, 2)
        ELSE 0
      END AS 연체율_퍼센트
    FROM card_system.tbdaaha97
    WHERE 상호명 LIKE '%{기업명}%'
    GROUP BY 작업기준년월, 상호명, 사업자등록번호, 기업계열명
    ORDER BY 작업기준년월 DESC
  parameters:
    기업명:
      type: string
      description: 기업 상호명 (부분일치 검색)
      required: true
      sample_values:
      - 삼성
      - 현대
      - LG
    기간_시작:
      type: string
      description: 시작 작업기준년월 (YYYYMM)
      required: false
    기간_종료:
      type: string
      description: 종료 작업기준년월 (YYYYMM)
      required: false
  tags:
  - 연체
  - 기업
  - 상세
  - 월별
  - 여신
  - 파라미터
- name: review_approval_by_period
  question: 특정 기간의 기업카드 심사 승인율을 분석해줘
  description: |
    기간/신용등급/기업규모 필터를 지정하여 심사 승인 현황을 분석합니다.
  sql: |
    SELECT
      신용평가등급코드 AS 신용등급,
      고객군형태구분코드 AS 고객유형,
      COUNT(DISTINCT 신청서접수번호) AS 총심사건수,
      COUNT(DISTINCT CASE WHEN 카드처리결과구분코드 = '01' THEN 신청서접수번호 END) AS 승인건수,
      COUNT(DISTINCT CASE WHEN 카드처리결과구분코드 = '02' THEN 신청서접수번호 END) AS 거절건수,
      ROUND(COUNT(DISTINCT CASE WHEN 카드처리결과구분코드 = '01' THEN 신청서접수번호 END)::FLOAT
            / NULLIF(COUNT(DISTINCT 신청서접수번호), 0) * 100, 2) AS 승인율_퍼센트,
      AVG(최종부여한도금액) AS 평균부여한도,
      AVG(자산총계금액) AS 평균자산총계
    FROM card_system.tbdaaaf23
    WHERE 최종심사년월일 BETWEEN '{기간_시작}' AND '{기간_종료}'
    GROUP BY 신용평가등급코드, 고객군형태구분코드
    ORDER BY 신용평가등급코드, 고객군형태구분코드
  parameters:
    기간_시작:
      type: string
      description: 시작 심사년월일 (YYYYMMDD). YYYYMM 입력 시 '01' 자동 추가.
      required: true
      sample_values:
      - '20250101'
      - '20260101'
    기간_종료:
      type: string
      description: 종료 심사년월일 (YYYYMMDD). YYYYMM 입력 시 '31' 자동 추가.
      required: true
      sample_values:
      - '20251231'
      - '20260430'
    신용등급:
      type: string
      description: 특정 신용평가등급코드 필터
      required: false
  tags:
  - 심사
  - 승인율
  - 기간필터
  - 신용등급
  - 고객유형
  - 파라미터
- name: card_brand_usage_analysis
  question: 카드 브랜드별 법인카드 이용 현황을 분석해줘
  description: |
    카드 브랜드(VISA, Master, 국내 등)별로 법인카드 이용금액/건수를 분석합니다.
  sql: |
    SELECT
      카드브랜드구분코드 AS 카드브랜드,
      COUNT(DISTINCT 카드구분키번호) AS 카드수,
      SUM(금월이용합계건수) AS 총이용건수,
      SUM(금월이용합계금액) AS 총이용금액,
      SUM(금월일시불이용금액) AS 일시불이용,
      SUM(금월할부이용금액) AS 할부이용,
      SUM(금월ca이용금액) AS CA이용,
      ROUND(SUM(금월이용합계금액)::FLOAT / NULLIF(SUM(금월이용합계건수), 0), 0) AS 건당평균금액
    FROM card_system.tmdaa3e16
    WHERE 개인기업구분코드 = '2'
      AND 기준년월 BETWEEN '{기간_시작}' AND '{기간_종료}'
    GROUP BY 카드브랜드구분코드
    ORDER BY 총이용금액 DESC
  parameters:
    기간_시작:
      type: string
      description: 시작 기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202501'
      - '202601'
    기간_종료:
      type: string
      description: 종료 기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202512'
      - '202604'
  tags:
  - 카드브랜드
  - VISA
  - Master
  - 이용금액
  - 법인카드
  - 파라미터
- name: merchant_sales_comparison
  question: 특정 가맹점의 매출 추이를 보여줘
  description: |
    가맹점명으로 검색하여 해당 가맹점의 월별 매출 추이(일시불/할부/수수료)를 조회합니다.
  sql: |
    SELECT
      a.기준년월,
      a.가맹점번호,
      a.가맹점명,
      b.가맹점업종명,
      SUM(a.가맹점일시불매출금액) AS 일시불매출,
      SUM(a.가맹점할부매출금액) AS 할부매출,
      SUM(a.가맹점일시불매출금액 + a.가맹점할부매출금액) AS 총매출금액,
      SUM(a.가맹점일시불매출건수 + a.가맹점할부매출건수) AS 총매출건수,
      SUM(a.가맹점수입수수료) AS 수수료수입,
      AVG(a.신용카드가맹점수수료율) AS 평균수수료율
    FROM card_system.tmdaa5e11 a
    JOIN card_system.tbdaadb17 b
      ON a.가맹점업종코드 = b.가맹점업종코드
    WHERE a.가맹점명 LIKE '%{가맹점명}%'
    GROUP BY a.기준년월, a.가맹점번호, a.가맹점명, b.가맹점업종명
    ORDER BY a.기준년월
  parameters:
    가맹점명:
      type: string
      description: 가맹점명 (부분일치 검색)
      required: true
      sample_values:
      - 스타벅스
      - CU
      - GS25
    기간_시작:
      type: string
      description: 시작 기준년월 (YYYYMM)
      required: false
    기간_종료:
      type: string
      description: 종료 기준년월 (YYYYMM)
      required: false
  tags:
  - 가맹점
  - 매출추이
  - 월별
  - 시계열
  - 검색
  - 파라미터
- name: corporate_credit_risk_summary
  question: 기업 계열별 여신 리스크 현황을 보여줘
  description: |
    기업계열별로 총한도, 이용금액, 연체금액, 한도사용률, 연체율을 종합 분석합니다.
  sql: |
    SELECT
      기업계열명,
      COUNT(DISTINCT 사업자등록번호) AS 기업수,
      SUM(총한도금액) AS 총한도,
      SUM(카드이용합계금액) AS 총이용금액,
      SUM(연체금액) AS 총연체금액,
      CASE
        WHEN SUM(총한도금액) > 0
        THEN ROUND((SUM(카드이용합계금액)::FLOAT / SUM(총한도금액)) * 100, 2)
        ELSE 0
      END AS 한도사용률_퍼센트,
      CASE
        WHEN SUM(카드이용합계금액) > 0
        THEN ROUND((SUM(연체금액)::FLOAT / SUM(카드이용합계금액)) * 100, 2)
        ELSE 0
      END AS 연체율_퍼센트
    FROM card_system.tbdaaha97
    WHERE 기업계열명 IS NOT NULL
      AND 작업기준년월 BETWEEN '{기간_시작}' AND '{기간_종료}'
    GROUP BY 기업계열명
    ORDER BY 총이용금액 DESC
    LIMIT {limit}
  parameters:
    기간_시작:
      type: string
      description: 시작 작업기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202501'
      - '202601'
    기간_종료:
      type: string
      description: 종료 작업기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202512'
      - '202604'
    limit:
      type: integer
      description: 결과 행수 제한
      default: '20'
  tags:
  - 계열사
  - 여신
  - 리스크
  - 한도사용률
  - 연체율
  - 파라미터
- name: online_offline_sales_ratio
  question: 온라인/오프라인 매출 비율을 분석해줘
  description: |
    특정 기간의 법인카드 온라인/오프라인 거래 비율을 업종별로 분석합니다.
  sql: |
    SELECT
      b.업종대분류코드명,
      a.온라인거래여부,
      COUNT(DISTINCT a.매출전표번호) AS 거래건수,
      SUM(a.매출금액) AS 총매출금액,
      ROUND(AVG(a.매출금액), 0) AS 건당평균금액
    FROM card_system.tbdaabt30 a
    JOIN card_system.tbdaadb17 b
      ON a.가맹점업종코드 = b.가맹점업종코드
    WHERE a.개인기업구분코드 = '2'
      AND (a.전표취소구분코드 IS NULL OR a.전표취소구분코드 = '0')
      AND a.전표매출년월일 BETWEEN '{기간_시작}' AND '{기간_종료}'
    GROUP BY b.업종대분류코드명, a.온라인거래여부
    ORDER BY b.업종대분류코드명, a.온라인거래여부
  parameters:
    기간_시작:
      type: string
      description: 시작 기준년월일 (YYYYMMDD). YYYYMM 입력 시 '01' 자동 추가.
      required: true
      sample_values:
      - '20250301'
      - '20260101'
    기간_종료:
      type: string
      description: 종료 기준년월일 (YYYYMMDD). YYYYMM 입력 시 '31' 자동 추가.
      required: true
      sample_values:
      - '20250331'
      - '20260430'
  tags:
  - 온라인
  - 오프라인
  - 매출비율
  - 업종별
  - 법인카드
  - 파라미터
- name: installment_analysis
  question: 할부 거래 현황을 분석해줘
  description: |
    특정 기간의 법인카드 할부 거래를 할부개월 구간별로 분석합니다.
  sql: |
    SELECT
      CASE
        WHEN 할부기간개월수 = 0 THEN '일시불'
        WHEN 할부기간개월수 BETWEEN 1 AND 3 THEN '1~3개월'
        WHEN 할부기간개월수 BETWEEN 4 AND 6 THEN '4~6개월'
        WHEN 할부기간개월수 BETWEEN 7 AND 12 THEN '7~12개월'
        ELSE '12개월 초과'
      END AS 할부구간,
      COUNT(DISTINCT 매출전표번호) AS 거래건수,
      SUM(매출금액) AS 총매출금액,
      ROUND(AVG(매출금액), 0) AS 건당평균금액,
      ROUND(AVG(할부기간개월수), 1) AS 평균할부개월
    FROM card_system.tbdaabt30
    WHERE 개인기업구분코드 = '2'
      AND (전표취소구분코드 IS NULL OR 전표취소구분코드 = '0')
      AND 전표매출년월일 BETWEEN '{기간_시작}' AND '{기간_종료}'
    GROUP BY
      CASE
        WHEN 할부기간개월수 = 0 THEN '일시불'
        WHEN 할부기간개월수 BETWEEN 1 AND 3 THEN '1~3개월'
        WHEN 할부기간개월수 BETWEEN 4 AND 6 THEN '4~6개월'
        WHEN 할부기간개월수 BETWEEN 7 AND 12 THEN '7~12개월'
        ELSE '12개월 초과'
      END
    ORDER BY 총매출금액 DESC
  parameters:
    기간_시작:
      type: string
      description: 시작 기준년월일 (YYYYMMDD). YYYYMM 입력 시 '01' 자동 추가.
      required: true
      sample_values:
      - '20250101'
      - '20260101'
    기간_종료:
      type: string
      description: 종료 기준년월일 (YYYYMMDD). YYYYMM 입력 시 '31' 자동 추가.
      required: true
      sample_values:
      - '20251231'
      - '20260430'
  tags:
  - 할부
  - 할부개월
  - 거래분석
  - 법인카드
  - 파라미터
- name: corporate_customer_monthly_usage
  question: 특정 기업의 월별 카드 이용 내역을 보여줘
  description: |
    기업검색명으로 검색하여 해당 기업의 월별 카드 이용 상세(일시불/할부/CA/주유/국세 등)를 조회합니다.
  sql: |
    SELECT
      기준년월,
      고객식별자,
      기업검색명,
      SUM(유효신용카드수) AS 유효신용카드,
      SUM(유효체크카드수) AS 유효체크카드,
      SUM(금월일시불이용금액) AS 일시불이용,
      SUM(금월할부이용금액) AS 할부이용,
      SUM(금월ca이용금액) AS CA이용,
      SUM(금월일시불이용금액 + 금월할부이용금액 + 금월ca이용금액) AS 총이용금액,
      SUM(금월주유이용금액) AS 주유이용,
      SUM(금월국세이용금액 + 금월지방세이용금액) AS 세금납부,
      SUM(금월4대보험이용금액) AS 보험납부
    FROM card_system.tmdaa2e17
    WHERE 기업검색명 LIKE '%{기업명}%'
    GROUP BY 기준년월, 고객식별자, 기업검색명
    ORDER BY 기준년월 DESC
  parameters:
    기업명:
      type: string
      description: 기업검색명 (부분일치 검색)
      required: true
      sample_values:
      - 삼성
      - 현대
      - KB
    기간_시작:
      type: string
      description: 시작 기준년월 (YYYYMM)
      required: false
    기간_종료:
      type: string
      description: 종료 기준년월 (YYYYMM)
      required: false
  tags:
  - 기업고객
  - 월별
  - 이용내역
  - 상세
  - 검색
  - 파라미터
- name: region_top_enterprise_merchants
  question: 최근 기준일 기준 지역별 기업영업 가맹점 전월 매입 상위 지역은?
  sql: |
    SELECT
      한글시도명,
      한글시군구명,
      COUNT(DISTINCT 가맹점번호) AS 가맹점수,
      SUM(COALESCE(전월일시불매입금액, 0) + COALESCE(전월할부매입금액, 0)) AS 전월매입금액,
      SUM(COALESCE(전월일시불매입건수, 0) + COALESCE(전월할부매입건수, 0)) AS 전월매입건수,
      AVG(신용카드가맹점수수료율) AS 평균수수료율
    FROM card_system.tbdaaus01
    WHERE 기준년월일 = (SELECT MAX(기준년월일) FROM card_system.tbdaaus01)
      AND COALESCE(가맹점거래정지여부, 'N') <> 'Y'
      AND COALESCE(휴폐업여부, 'N') <> 'Y'
    GROUP BY 한글시도명, 한글시군구명
    ORDER BY 전월매입금액 DESC
    LIMIT 20
  tags:
  - 기업영업
  - 가맹점
  - 지역
  - 전월매입
  - 랭킹
- name: marketing_industry_card_portfolio
  question: 마케팅 업종 대분류별 유효 기업카드 수와 전월 매입금액을 보여줘
  sql: |
    SELECT
      마케팅업종대분류구분명,
      COUNT(DISTINCT 가맹점번호) AS 가맹점수,
      SUM(COALESCE(유효기업신용카드수, 0)) AS 유효기업신용카드수,
      SUM(COALESCE(유효기업체크카드수, 0)) AS 유효기업체크카드수,
      SUM(COALESCE(전월일시불매입금액, 0) + COALESCE(전월할부매입금액, 0)) AS 전월매입금액
    FROM card_system.tbdaaus01
    WHERE 기준년월일 = (SELECT MAX(기준년월일) FROM card_system.tbdaaus01)
    GROUP BY 마케팅업종대분류구분명
    ORDER BY 전월매입금액 DESC
  tags:
  - 기업영업
  - 업종
  - 카드수
  - 전월매입
- name: special_debt_by_asset_quality
  question: 기업 특수채권을 자산건전성별로 요약해줘
  sql: |
    SELECT
      기준년,
      자산건전성분류구분코드,
      COUNT(DISTINCT 특수채권관리번호) AS 특수채권건수,
      SUM(특수채권편입원금) AS 편입원금,
      SUM(COALESCE(특수채권편입원금, 0) + COALESCE(특수채권편입수수료, 0) + COALESCE(특수채권편입이자, 0) + COALESCE(특수채권편입연체료, 0) + COALESCE(특수채권편입가지급금, 0)) AS 편입잔액,
      AVG(연체회차) AS 평균연체회차
    FROM card_system.tmdaaus01
    WHERE 개인기업구분코드 = '2'
    GROUP BY 기준년, 자산건전성분류구분코드
    ORDER BY 기준년, 편입잔액 DESC
  tags:
  - 기업영업
  - 특수채권
  - 자산건전성
  - 연체
- name: allowance_monthly_cost_rate
  question: 월별 기업 대손충당금률과 평균 PD/LGD를 계산해줘
  sql: |
    SELECT
      기준년월,
      SUM(원화대출잔액) AS 원화대출잔액,
      SUM(기대대손충당금) AS 기대대손충당금,
      AVG(기대1년PD율) AS 평균PD율,
      AVG(충당금기대LGD율) AS 평균LGD율,
      SUM(기대대손충당금)::FLOAT / NULLIF(SUM(원화대출잔액), 0) AS 대손충당금률
    FROM card_system.tbmewcm94
    WHERE 개인기업구분코드 = '2'
    GROUP BY 기준년월
    ORDER BY 기준년월
  tags:
  - 기업영업
  - 대손충당금
  - PD
  - LGD
  - 리스크비용률
- name: merchant_risk_combined_customer_month
  question: 월별 가맹점 포트폴리오와 대손충당금을 고객 기준으로 같이 봐줘
  sql: |
    WITH merchant_customer_month AS (
      SELECT
        기준년월,
        기업고객식별자 AS 고객식별자,
        COUNT(DISTINCT 가맹점번호) AS 가맹점수,
        SUM(COALESCE(전월일시불매입금액, 0) + COALESCE(전월할부매입금액, 0)) AS 전월매입금액
      FROM card_system.tbmaisd06
      GROUP BY 기준년월, 기업고객식별자
    ), allowance_customer_month AS (
      SELECT
        기준년월,
        고객식별자,
        SUM(원화대출잔액) AS 원화대출잔액,
        SUM(기대대손충당금) AS 기대대손충당금
      FROM card_system.tbmewcm94
      WHERE 개인기업구분코드 = '2'
      GROUP BY 기준년월, 고객식별자
    )
    SELECT
      m.기준년월,
      COUNT(DISTINCT m.고객식별자) AS 기업고객수,
      SUM(m.가맹점수) AS 가맹점수,
      SUM(m.전월매입금액) AS 전월매입금액,
      SUM(a.원화대출잔액) AS 원화대출잔액,
      SUM(a.기대대손충당금) AS 기대대손충당금,
      SUM(a.기대대손충당금)::FLOAT / NULLIF(SUM(a.원화대출잔액), 0) AS 대손충당금률
    FROM merchant_customer_month m
    LEFT JOIN allowance_customer_month a
      ON m.기준년월 = a.기준년월
     AND m.고객식별자 = a.고객식별자
    GROUP BY m.기준년월
    ORDER BY m.기준년월
  tags:
  - 기업영업
  - 가맹점
  - 충당금
  - 고객월
  - 조인
