  - from: tbdaaat01
    to: tbmaisd06
    type: one_to_many
    join_expr: "tbdaaat01.고객식별자 = tbmaisd06.고객식별자 AND tbdaaat01.고객관리번호 = tbmaisd06.고객관리번호"
    description: "고객기본 -> 특수채권 (부실채권 편입 내역)."
  - from: tbdaaat03
    to: tbmewcm94
    type: one_to_many
    join_expr: "tbdaaat03.회원일련번호 = tbmewcm94.회원일련번호"
