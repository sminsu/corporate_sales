      - name: 금월무이자할부이용금액
        expr: 금월무이자할부이용금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 금월에 무이자할부서비스로 할부 매출이 발생한 이용금액
      - name: 금월유이자할부이용금액
        expr: 금월유이자할부이용금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 금월에 유이자할부서비스로 할부 매출이 발생한 이용금액
      - name: 금월부분무이자할부이용금액
        expr: 금월부분무이자할부이용금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 금월에 부분무이자할부서비스로 할부 매출이 발생한 이용금액
      - name: 금월직불카드이용건수
        expr: 금월직불카드이용건수
        data_type: BIGINT
        description: MFX월카드통합실적집계의 금월에 직불카드로 매출이 발생한 이용건수
      - name: 금월직불카드이용금액
        expr: 금월직불카드이용금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 금월에 카드종류 중 직불카드로 매출이 발생한 이용금액
      - name: 금월프리패스카드이용금액
        expr: 금월프리패스카드이용금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 금월에 프리패스카드로 매출이 발생한 이용금액
      - name: 금월체크카드이용금액
        expr: 금월체크카드이용금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 금월기준 발생한 회원의 체크카드 이용 매출 금액
      - name: 금월플러스카드이용금액
        expr: 금월플러스카드이용금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 금월에 플러스카드로 매출이 발생한 이용금액
      - name: 금월체크카드소액신용이용금액
        expr: 금월체크카드소액신용이용금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 금월에 소액신용결제 서비스가 등록된 체크카드로 매출이 발생한 이용금액
      - name: 금월체크카드소액신용채권잔액
        expr: 금월체크카드소액신용채권잔액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 금월기준 소액신용결제 서비스가 등록된 체크카드의 채권잔액(연체원금+미청구원금)
      - name: 금월듀얼페이먼트이용금액
        expr: 금월듀얼페이먼트이용금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 금월에 듀얼페이먼트서비스 매출이 발생한 이용금액
      - name: 금월바우처정부지원금액
        expr: 금월바우처정부지원금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 금월기준 회원의 바우처서비스에 대한 바우처정부지원 이용금액
      - name: 금월바우처신용정부지원금액
        expr: 금월바우처신용정부지원금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 금월 바우처 전표중 신용카드로 발생한 매출금액 중 정부가 지원하는 금액
      - name: 금월바우처체크정부지원금액
        expr: 금월바우처체크정부지원금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 금월 바우처 전표중 체크카드로 발생한 매출금액 중 정부가 지원하는 금액
      - name: 금월할부수수료
        expr: 금월할부수수료
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 금월 할부 매출에서 발생된 수수료금액
      - name: 금월CA수수료
        expr: 금월CA수수료
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 금월 단기카드대출(현금서비스) 매출에서 발생된 수수료금액
      - name: 연체회차
        expr: 연체회차
        data_type: BIGINT
        description: MFX월카드통합실적집계의 청구된 회차의 잔액이 남아 연체된 경우의 회차를 관리함
      - name: 연체원금
        expr: 연체원금
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 만기경과,기한이익상실등의 사유로 발생한 원금 연체 금액을 관리한다.
      - name: 일시불연체원금
        expr: 일시불연체원금
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 일시불 매출 중 연체된 원금
      - name: 할부연체원금
        expr: 할부연체원금
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 할부 매출 중 연체된 원금
      - name: CA연체원금
        expr: CA연체원금
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 단기카드대출(현금서비스)매출 중 연체된 원금
      - name: CA할부연체원금
        expr: CA할부연체원금
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 단기카드매출(현금서비스)할부 매출 중 연체된 원금
      - name: 리볼빙일시불연체원금
        expr: 리볼빙일시불연체원금
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 리볼빙일시불 매출 중 연체된 원금
      - name: 리볼빙CA연체원금
        expr: 리볼빙CA연체원금
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 리볼빙 현금서비스 매출 중 연체된 원금
      - name: 금월선택결제서비스이용금액
        expr: 금월선택결제서비스이용금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 금월 매입된 신용/체크 선택결제서비스로 매출이 발생한 이용금액
      - name: 금월대외실적미포함금액
        expr: 금월대외실적미포함금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 금월 대외실적 미포함 금액에 대한 합계를 나타낸다. - 은행 리브NEXT 카드 사용분
      - name: 금월복합상환할부이용금액
        expr: 금월복합상환할부이용금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 금월에 복합상환방식 할부서비스로 할부 매출이 발생한 이용금액
    time_dimensions:
      - name: 기준년월
        expr: 기준년월
        data_type: VARCHAR
        description: "MFX월카드통합실적집계의 카드의 통합 실적을 집계하는 기준이 되는 기준년월 정보로 집계된 카드의 통합 실적은 해당 년월(기준년월)에 발생한 데이터를 집계한다."
        synonyms: [년월, 월, 기준월]
      - name: 카드만료년월일
        expr: 카드만료년월일
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드 유효기간의 종료일
      - name: 실제카드만료년월일
        expr: 실제카드만료년월일
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드가 실제만료(만료년월이 적용 되었거나 해지년월이 적용)되는 최종년월일
      - name: 이전카드만료년월일
        expr: 이전카드만료년월일
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드가 해지및 갱신으로인해 만료년월이 변경될경우 변경되기 이전의 만료년월일을 말함
      - name: 카드신규발급년월일
        expr: 카드신규발급년월일
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드가 신규로 발급된 일자이다.
      - name: 최종카드발급년월일
        expr: 최종카드발급년월일
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 상품에 해당하는 카드가 최종 카드발급 접수된 일자이다.
      - name: 카드교부년월일
        expr: 카드교부년월일
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 해당카드를 발급받고 영업점에서 교부한 일자이다.
      - name: 카드반송년월일
        expr: 카드반송년월일
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 고객이 카드 실물을 반송한 일자이다.
      - name: 해지년월일
        expr: 해지년월일
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드가 해지된 년월일
      - name: 신청서접수년월일
        expr: 신청서접수년월일
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드신청 또는 카드한도의 신청서 정보를 접수 처리(온라인,배치)한 일자
      - name: 결제일
        expr: 결제일
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드대금납부 결제일
      - name: 회원최초신규발급년월일
        expr: 회원최초신규발급년월일
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 회원이 최초로 카드를 신규발급한 년월일
      - name: 연체발생년월일
        expr: 연체발생년월일
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 연체발생한 년월일 관리

  - name: tmdaa5d01
    physical_table: card_system.tmdaa5d01
    korean_name: 가맹점월스냅샷
    description: "가맹점정보기본(tbdaadt01)의 월별 스냅샷 테이블. 한 행은 특정 기준년월 시점의 하나의 가맹점을 의미한다. 가맹점 식별·상태·업종·수수료율(브랜드별) 등 가맹점 속성을 월 단위로 보관해, 월별 가맹점 현황·시계열 분석에 사용한다."
    grain: 기준년월 × 가맹점번호 1건 (가맹점 월말 스냅샷)
    primary_key: [기준년월, 가맹점번호]
    synonyms: [가맹점월별, 가맹점스냅샷, 월별가맹점]
    dimensions:
      - name: 가맹점번호
        expr: 가맹점번호
        data_type: VARCHAR
        description: MFX월가맹점정보기본시점정보의KB카드와 가맹점 계약을 체결한 사업장에 부여하는 식별번호
        synonyms: [가맹점ID, 가맹점코드]
      - name: 기업고객식별자
        expr: 기업고객식별자
        data_type: VARCHAR
        description: MFX월가맹점정보기본시점정보의KB카드의 고객에게 부여하는 10자리 식별번호중 기업고객에 대한 식별번호
      - name: 기업고객관리번호
        expr: 기업고객관리번호
        data_type: VARCHAR
        description: MFX월가맹점정보기본시점정보의개인이 아닌 기업체에 대한 고객관리번호
      - name: 대표고객식별자
        expr: 대표고객식별자
        data_type: VARCHAR
        description: MFX월가맹점정보기본시점정보의GBH고객식별자이벤트응모내역 엔티티에서 관리되는 대표고객의 고객식별자이다.
      - name: 대표고객관리번호
        expr: 대표고객관리번호
        data_type: VARCHAR
        description: MFX월가맹점정보기본시점정보의GBH고객식별자이벤트응모내역 엔티티에서 관리되는 대표고객식별자의 일련번호이다.
      - name: 가맹점상태구분코드
        expr: 가맹점상태구분코드
        data_type: VARCHAR
        description: MFX월가맹점정보기본시점정보의가맹점의 상태 표시 코드
      - name: 법인등록번호
        expr: 법인등록번호
        data_type: VARCHAR
        description: 개인의 주민등록번호처럼 법인 설립 시 주어지는 고유번호. 법인등기부등본,사업자등록증으로 확인
        synonyms: [법인번호]
      - name: 사업자등록번호
        expr: 사업자등록번호
        data_type: VARCHAR
        description: MFX월가맹점정보기본시점정보의개인기업 또는 법인의 사업자등록증번호
        synonyms: [사업자번호, 사업자등록]
      - name: 가맹점명
        expr: 가맹점명
        data_type: VARCHAR
        description: MFX월가맹점정보기본시점정보의당사와 가맹점 계약을 체결한 사업장의 명칭
        synonyms: [가맹점이름, 상호, 상호명]
      - name: 영문가맹점명
        expr: 영문가맹점명
        data_type: VARCHAR
        description: MFX월가맹점정보기본시점정보의가맹점명에 대한 영문명칭
      - name: 한글가맹점명
        expr: 한글가맹점명
        data_type: VARCHAR
        description: MFX월가맹점정보기본시점정보의일반적인 가맹점명외에 영문도 한글로 변환한 가맹점명
      - name: 가맹점업종코드
        expr: 가맹점업종코드
        data_type: VARCHAR
        description: MFX월가맹점정보기본시점정보의가맹점업종코드관리
      - name: MCC업종코드
        expr: MCC업종코드
        data_type: VARCHAR
        description: MFX월가맹점정보기본시점정보의MCC(Merchant Category Code) 업종코를 가맹점의 업종코드
      - name: 가맹점신청서번호
