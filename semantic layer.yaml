        expr: 공용전표사용여부
        data_type: VARCHAR
        description: "신용판매 매출에 대한 공용전표 사용여부(0:일반전표,1:공용전표)"
      - name: 고액승인가맹점여부
        expr: 고액승인가맹점여부
        data_type: VARCHAR
        description: 가맹점 고액승인 대상 여부
      - name: 사고발생가맹점여부
        expr: 사고발생가맹점여부
        data_type: VARCHAR
        description: 거래정지된 카드, 미승인전표, 수기매출전표 등으로 전표매입이 발생되어 회원의 클레임이 발생한 가맹점의 여부임
      - name: 통신판매수기판매가맹점여부
        expr: 통신판매수기판매가맹점여부
        data_type: VARCHAR
