  - from: tbdaabt30
    to: tbdaabf07
    type: many_to_one
    join_expr: "tbdaabt30.MCC업종코드 = tbdaabf07.MCC업종코드"
    description: "매출전표 -> MCC업종코드 마스터 (전표 업종명 참조)."

  # ── 가맹점 마스터 ↔ 가맹점 스냅샷/실적 ──
  - from: tbdaadt01
