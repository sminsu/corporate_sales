        expr: 한글상품명
        data_type: VARCHAR
        description: KB카드에서 취급하는 상품을 한글로 정의한 상품명을 의미한다.
      - name: 영문상품명
        expr: 영문상품명
        data_type: VARCHAR
        description: KB카드에서 취급하는 상품을 영어로 정의한 상품명을 의미한다.
      - name: 상품대분류구분코드
        expr: 상품대분류구분코드
        data_type: VARCHAR
        description: KB카드 전사차원에서 상품의 대분류를 구분하여 정의한 코드를 관리한다.
      - name: 상품중분류구분코드
        expr: 상품중분류구분코드
        data_type: VARCHAR
        description: KB카드 전사차원에서 상품의 대분류 하위 중분류를 구분하여 정의한 코드를 관리한다.
      - name: 카드등급그룹코드
        expr: 카드등급그룹코드
        data_type: VARCHAR
        description: KB카드사의 카드상품 등급에 대한 분류의 그룹핑 코드
      - name: 상품번호
        expr: 상품번호
        data_type: VARCHAR
        description: 상품을 식별하기 위해 부여한 일련의 번호를 관리한다.
      - name: 대표카드상품코드
        expr: 대표카드상품코드
        data_type: VARCHAR
        description: 카드상품 중 동일한 계열의 상품을 대표하는 카드상품코드
      - name: 대표카드상품명
        expr: 대표카드상품명
        data_type: VARCHAR
        description: 카드상품 중 동일한 계열의 상품을 대표하는 카드의 상품명
      - name: 카드상품사업단위구분코드
        expr: 카드상품사업단위구분코드
        data_type: VARCHAR
        description: 카드상품을 범용, 제휴, 공공 등의 사업단위로 분류하여 구분한 코드
      - name: 고객안내상품명
        expr: 고객안내상품명
        data_type: VARCHAR
        description: 고객에게 안내되는 카드 상품 명칭이다.
      - name: 통장장표인자상품명
        expr: 통장장표인자상품명
        data_type: VARCHAR
        description: 상품의 공식적인 명칭과 별도로 통장 또는 장표에 인자하기 위한 상품명
      - name: 상품상태구분코드
        expr: 상품상태구분코드
        data_type: VARCHAR
        description: 상품의 라이프사이클을 관리하기 위한 상태분류 정보
      - name: 상품등록부점코드
        expr: 상품등록부점코드
        data_type: VARCHAR
        description: 상품을 등록한 부점코드 정보이다.
      - name: 상품개발부점코드
        expr: 상품개발부점코드
        data_type: VARCHAR
        description: 상품을 개발한 부점코드 정보이다.
      - name: 상품관리부점코드
        expr: 상품관리부점코드
        data_type: VARCHAR
        description: 상품을 관리하는 부점코드 정보이다.
      - name: BC카드관리구분코드
        expr: BC카드관리구분코드
        data_type: VARCHAR
        description: 동남카드/비씨카드 를 구분하는 코드
      - name: BC카드제휴코드
        expr: BC카드제휴코드
        data_type: VARCHAR
        description: BC사에서 관리하는 BC제휴코드
      - name: 개인기업구분코드
        expr: 개인기업구분코드
        data_type: VARCHAR
        description: 개인 또는 기업을 구분하는 코드
      - name: 상품요약내용
        expr: 상품요약내용
        data_type: VARCHAR
        description: 상품의 컨셉, 제공하는 서비스 등을 요약하여 기술한 내용
    time_dimensions:
      - name: 상품판매시작년월일
        expr: 상품판매시작년월일
        data_type: VARCHAR
        description: 상품을 판매하기 시작한 년월일을 관리한다
      - name: 상품판매종료년월일
        expr: 상품판매종료년월일
        data_type: VARCHAR
        description: 상품을 판매종료한 년월일을 관리한다
      - name: 해제년월일
        expr: 해제년월일
        data_type: VARCHAR
        description: 정상거래에 대해서 해제거래를 발생한 일자 정보를 관리함

  - name: tbdaadb17
    physical_table: card_system.tbdaadb17
    korean_name: 가맹점업종코드
    description: "당사 가맹점 사업장의 업종코드 마스터. 한 행은 하나의 가맹점업종코드를 의미하며, 가맹점업종명·업종 대/중분류·MCC업종코드 매핑·표준산업분류코드 등을 담는다. 가맹점/매출의 업종명을 해석하는 코드 사전으로 사용한다."
    grain: 가맹점업종코드 1건 (가맹점 업종 마스터)
    primary_key: [가맹점업종코드]
    synonyms: [가맹점업종, 업종, 업종명, 업종사전]
    dimensions:
      - name: 가맹점업종코드
        expr: 가맹점업종코드
        data_type: VARCHAR
        description: 당사 가맹점에 대한 사업장 업종코드
      - name: 사용여부
        expr: 사용여부
        data_type: VARCHAR
        description: "가맹점업종코드에 대한 사용여부(0:미사용, 1;사용)"
      - name: 가맹점업종대분류구분코드
        expr: 가맹점업종대분류구분코드
        data_type: VARCHAR
        description: 가맹점 업종코드를 대분류로 구분한 코드로서 의생활, 식생활, 주거생활, 유통등으로 구분함
      - name: 가맹점업종중분류구분코드
        expr: 가맹점업종중분류구분코드
        data_type: VARCHAR
        description: 가맹점 업종코드의 대분류 하위에 중분류로 구분한 코드로써 의류, 직물/침구류, 휴게음식점등으로 구분
      - name: 가맹점업종중분류구분일련번호
        expr: 가맹점업종중분류구분일련번호
        data_type: DECIMAL
        description: 동일한 가맹점업종중분류구분코드에 대해 이를 구분하기 위한 일련의 번호
      - name: 업종대분류코드명
        expr: 업종대분류코드명
        data_type: VARCHAR
        description: 가맹점 업종에 대한 구분코드중 대분류 업종코드에 대한 명칭
      - name: 가맹점업종명
        expr: 가맹점업종명
        data_type: VARCHAR
        description: 가맹점 업종에 대한 상세한 명칭
        synonyms: [업종, 업종명]
      - name: MCC업종코드
        expr: MCC업종코드
        data_type: VARCHAR
        description: 국제적으로 통용되는 가맹점의 업종코드
      - name: 공동망정산용업종코드
        expr: 공동망정산용업종코드
        data_type: VARCHAR
        description: 카드 공동망의 정산용업종코드 값
      - name: BC카드업종코드
        expr: BC카드업종코드
        data_type: VARCHAR
        description: BC카드사에서 BC카드 가맹점에 부여하는 업종코드
      - name: 기업회원업종구분코드
        expr: 기업회원업종구분코드
        data_type: VARCHAR
        description: 기업회원의 업종을 상세히 구분하는 코드. 교육기관의 경우 초등교육기관, 중등교육기관, 고등교육기관, 특수학교및 외국인학교 등으로 구분되어 있음
      - name: 표준산업대분류코드
        expr: 표준산업대분류코드
        data_type: VARCHAR
        description: 정부에서 제공하는 산업분류코드의 대분류코드
      - name: 표준산업분류코드
        expr: 표준산업분류코드
        data_type: VARCHAR
        description: 정부에서 제공하는 산업분류코드
      - name: KIB대상여부
        expr: KIB대상여부
        data_type: VARCHAR
        description: 해당 업종이 KIB(키인블럭)으로 등록된 대상인지 여부
      - name: 할부가능여부
        expr: 할부가능여부
        data_type: VARCHAR
        description: 해당 업종이 할부판매가 가능한지의 여부
      - name: 가맹점유형구분코드
        expr: 가맹점유형구분코드
        data_type: VARCHAR
        description: 가맹점의 유형이 일반가맹점인지, 통판가맹점인지, 여행인지 보험인지등을 구분하는 코드
      - name: 자동심사방문대상여부
        expr: 자동심사방문대상여부
        data_type: VARCHAR
        description: "업종코드에 대하여 자동 심사 방문 대상 사업장 여부(0:자동심방비대상, 1:자동심방대상)"
      - name: 선취후취구분코드
        expr: 선취후취구분코드
        data_type: VARCHAR
        description: 정산에 대하여 선취 또는 후취 구분코드
      - name: 슬라이딩적용여부
        expr: 슬라이딩적용여부
        data_type: VARCHAR
        description: 해당업종이 슬라이딩(가맹점의 수수료를 매출실적에 따라 변동적으로 적용하는 내역)처리에 대한 적용 받는지의 여부
      - name: 가맹점업종적용범위기준내용
        expr: 가맹점업종적용범위기준내용
        data_type: VARCHAR
        description: 가맹점업종에 적용되는 기준되는 범위를 기술
      - name: 소득공제대상여부
        expr: 소득공제대상여부
        data_type: VARCHAR
        description: "해당 업종코드가맹점에 대해 소득공제가 대상인지의 여부 / 급여소득자에게 제공되는 신용카드 소득공제의 금액을 산정할 때 포함되는 금액인지 아닌지 여부를 의미한다"
      - name: EDC특약대상여부
        expr: EDC특약대상여부
        data_type: VARCHAR
        description: 해당업종이 EDC 특약 대상인지의 여부
      - name: 키인EDC매입제한여부
        expr: 키인EDC매입제한여부
        data_type: VARCHAR
        description: 해당업종이 키인EDC전표에 대한 매입 제한을 받는지의 여부
      - name: 간이과세대상여부
        expr: 간이과세대상여부
        data_type: VARCHAR
        description: 해당업종이 국세청 간이과세대상 적용인지의 여부
      - name: 수수료율개별산정업종여부
        expr: 수수료율개별산정업종여부
        data_type: VARCHAR
        description: 해당업종이 신수수율 산정시 개별로 적용받는지의 여부
      - name: 가맹점수수료율그룹번호
        expr: 가맹점수수료율그룹번호
        data_type: VARCHAR
        description: 가맹점에 대한 수수료 원가 및 수수료율이 동일한 가맹점의 집합체에 부여 하는 그룹번호
      - name: 가맹점업종관리내용
        expr: 가맹점업종관리내용
        data_type: VARCHAR
        description: 해당 업종코드에 대한 특이사항 또는 관리가 필요한 내용을 기술
      - name: 최초등록직원번호
        expr: 최초등록직원번호
        data_type: VARCHAR
        description: 최초등록 담당자의 사용자번호
    measures:
      - name: 할부가능개월수
        expr: 할부가능개월수
        data_type: BIGINT
        description: 해당 업종의 최대할부가능개월수
      - name: 신용카드가맹점수수료율
        expr: 신용카드가맹점수수료율
        data_type: DECIMAL
        description: 가맹점 당사 카드 수수료율
      - name: 체크카드가맹점수수료율
        expr: 체크카드가맹점수수료율
        data_type: DECIMAL
        description: 체크카드에 부여하는 당사 수수료율
      - name: VISA카드수수료율
        expr: VISA카드수수료율
        data_type: DECIMAL
        description: VISA카드 사용시 일정비율로 부과하는 수수료에 대한 산정비
      - name: MASTER카드수수료율
        expr: MASTER카드수수료율
        data_type: DECIMAL
        description: MASTER카드 사용시 일정비율로 부과하는 수수료에 대한 산정비
      - name: JCB카드수수료율
        expr: JCB카드수수료율
        data_type: DECIMAL
        description: JCB카드 사용시 일정비율로 부과하는 수수료에 대한 산정비
      - name: AMEX카드수수료율
        expr: AMEX카드수수료율
        data_type: DECIMAL
        description: AMEX카드 사용으로 발생하는 수수료율
      - name: 공동망가맹점정산수수료율
        expr: 공동망가맹점정산수수료율
        data_type: DECIMAL
        description: 공동망 가맹점정산시 부여하는 정산용 수수료율
      - name: 전표건당수수료
        expr: 전표건당수수료
        data_type: DECIMAL
        description: 가맹점수수료 산출기준중 매출전표건당 수수료금액을 책정하는경우 해당 수수료
      - name: UPI카드수수료율
        expr: UPI카드수수료율
        data_type: DECIMAL
        description: UPI카드 사용시 일정비율로 부과하는 수수료에 대한 산정비
      - name: 위챗페이수수료율
        expr: 위챗페이수수료율
        data_type: DECIMAL
        description: WeChat 페이로 결제시 일정비율로 부과하는 수수료에 대한 산정비
      - name: 대금지급주기일수
        expr: 대금지급주기일수
        data_type: BIGINT
        description: 가맹점에게 신판 판매대금을 지급하는 주기. 전표매입일로 부터 1일 후, 2일후, 3일후 등.
      - name: 승인한도금액
        expr: 승인한도금액
        data_type: DECIMAL
        description: 가맹점 거래 승인 한도금액
      - name: KIB한도금액
        expr: KIB한도금액
        data_type: DECIMAL
        description: KIB(키인블럭)으로 제한되는 최대사용금액
      - name: VISA카드한도금액
        expr: VISA카드한도금액
        data_type: DECIMAL
        description: VISA카드를 사용 및 취급할 수 있는 최대한도금액
      - name: MASTER카드한도금액
        expr: MASTER카드한도금액
        data_type: DECIMAL
        description: MASTER카드를 사용 및 취급할 수 있는 최대한도금액
      - name: JCB카드한도금액
        expr: JCB카드한도금액
        data_type: DECIMAL
        description: JCB카드를 사용 및 취급할 수 있는 최대한도금액
      - name: AMEX카드한도금액
