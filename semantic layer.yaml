      - name: 최초발급KB카드여부
        expr: 최초발급KB카드여부
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 해당카드가 회원이 발급받은 KB카드중 최초카드인지 여부
      - name: 최초발급BC카드여부
        expr: 최초발급BC카드여부
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 해당카드가 회원이 발급받은 KB비씨카드중 최초카드인지 여부
      - name: 모바일카드여부
        expr: 모바일카드여부
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드상품이 모바일카드인지를 판단하는 여부이다.
      - name: 회원자격코드
        expr: 회원자격코드
        data_type: VARCHAR
