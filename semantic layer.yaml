      - name: 회수방법구분코드
        expr: 회수방법구분코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 결제 대금 회수방법구분코드
      - name: 카드결제기관구분코드
        expr: 카드결제기관구분코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드결제계좌의 기관구분코드
      - name: 자택우편번호
        expr: 자택우편번호
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 자택주소의 우편번호
      - name: 직장우편번호
        expr: 직장우편번호
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 직장주소의 우편번호
