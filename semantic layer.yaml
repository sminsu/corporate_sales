  - name: tmdaa5e11
    physical_table: card_system.tmdaa5e11
    korean_name: 가맹점월실적
    description: "가맹점의 월별 실적을 집계하는 대형 팩트 테이블. 한 행은 특정 기준년월에 집계된 하나의 가맹점 실적을 의미한다. 매출금액·매출건수·수수료(브랜드별)·온오프라인 매출 등 가맹점 단위의 월별 매출 성과 지표를 광범위하게 담아, 가맹점별 월 매출·수수료 분석에 사용한다."
    grain: 기준년월 × 가맹점번호 1건 (가맹점 월 실적)
    primary_key: [기준년월, 가맹점번호]
    synonyms: [가맹점실적, 가맹점월별실적, 가맹점매출, 가맹점월]
    dimensions:
      - name: 가맹점번호
        expr: 가맹점번호
        data_type: VARCHAR
        description: MFX월가맹점실적집계의KB카드와 가맹점 계약을 체결한 사업장에 부여하는 식별번호
        synonyms: [가맹점ID, 가맹점코드]
      - name: 사업자등록번호
        expr: 사업자등록번호
        data_type: VARCHAR
        description: MFX월가맹점실적집계의개인기업 또는 법인의 사업자등록증번호
        synonyms: [사업자번호, 사업자등록]
      - name: 가맹점사업주체구분코드
        expr: 가맹점사업주체구분코드
        data_type: VARCHAR
        description: MFX월가맹점실적집계의가맹점의 사업주체가 개인사업자인지 법인사업자(법인포함)인지를 구분하는코드
      - name: 기업고객식별자
        expr: 기업고객식별자
        data_type: VARCHAR
        description: MFX월가맹점실적집계의KB카드의 고객에게 부여하는 10자리 식별번호중 기업고객에 대한 식별번호
      - name: 기업고객관리번호
        expr: 기업고객관리번호
        data_type: VARCHAR
        description: MFX월가맹점실적집계의개인이 아닌 기업체에 대한 고객관리번호
      - name: 대표고객식별자
        expr: 대표고객식별자
        data_type: VARCHAR
        description: MFX월가맹점실적집계의해당 가맹점의 대표자의 교객식별자이다.
