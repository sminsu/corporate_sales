      - name: 가맹점대금지급통화구분코드
        expr: 가맹점대금지급통화구분코드
        data_type: VARCHAR
        description: 가맹점 대금지급시 미화 또는 원화등 통용되고 있는 화폐를 구분하는 코드
      - name: 우체국특약여부
        expr: 우체국특약여부
        data_type: VARCHAR
        description: 가맹점의 우체국 특약등록 여부
      - name: 해외지급보류처리제외여부
        expr: 해외지급보류처리제외여부
        data_type: VARCHAR
        description: 해외 지급보류 처리제외 가맹점 여부
      - name: 승인검증생략구분코드
        expr: 승인검증생략구분코드
        data_type: VARCHAR
        description: 전표매입시 승인번호 검증에 대한 관리 코드
      - name: 복수가맹점등록여부
        expr: 복수가맹점등록여부
        data_type: VARCHAR
        description: 동일 사업자등록번호로 복수개의 가맹점 보유여부
      - name: 전표매입거절구분코드
        expr: 전표매입거절구분코드
        data_type: VARCHAR
        description: 해당 전표매입시 매입이 거절된 시기를 구분하는코드(온라인거절,센터처리거절 등)
      - name: 수기할부매입거절여부
        expr: 수기할부매입거절여부
        data_type: VARCHAR
        description: 수기 할부 매출에 대한 매입거절 여부
      - name: 가맹점수수료구분코드
        expr: 가맹점수수료구분코드
        data_type: VARCHAR
        description: 가맹점수수료 적용 관리 코드
      - name: 선취후취구분코드
        expr: 선취후취구분코드
        data_type: VARCHAR
