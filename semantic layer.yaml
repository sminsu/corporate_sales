# =============================================================================
# 3. METRICS - 비즈니스 메트릭 정의
# =============================================================================
metrics:
  # ── 매출/이용 메트릭 ──
  - name: 카드매출금액
    description: "매출전표 기준 카드 이용(매출) 총금액. 취소건은 제외하고 집계한다."
    sql: "SUM(tbdaabt30.\"매출금액\")"
    source_table: tbdaabt30
    unit: 원
    time_dimension: 기준년월
    synonyms: ["매출", "매출액", "이용금액", "카드이용금액", "총매출"]
  - name: 매출건수
    description: "매출전표 건수. 카드 이용 거래 건수를 의미한다."
    sql: "COUNT(tbdaabt30.\"매출전표번호\")"
    source_table: tbdaabt30
    unit: 건
    time_dimension: 기준년월
    synonyms: ["거래건수", "이용건수", "전표건수"]
  - name: 가맹점월매출금액
    description: "가맹점월실적 기준 가맹점별 월 매출 합계."
    sql: "SUM(tmdaa5e11.\"금년가맹점신용판매매출금액\")"
    source_table: tmdaa5e11
    unit: 원
    time_dimension: 기준년월
    synonyms: ["가맹점매출", "가맹점이용금액", "가맹점매출액"]
  - name: 해외매출금액
    description: "해외매출전표 기준 해외 카드 이용 금액 합계."
    sql: "SUM(tbdaabt08.\"매출금액\")"
    source_table: tbdaabt08
    unit: 원
    time_dimension: 기준년월
    synonyms: ["해외이용금액", "해외매출", "해외사용액"]

  # ── 카드/회원 메트릭 ──
  - name: 유효신용카드수
    description: "회원이 보유한 유효 신용카드 매수 합계."
    sql: "SUM(tbdaaat03.\"유효신용카드수\")"
    source_table: tbdaaat03
    unit: 매
    synonyms: ["신용카드수", "유효카드수", "카드보유수"]
  - name: 회원수
    description: "회원기본 기준 고유 회원 수."
    sql: "COUNT(DISTINCT tbdaaat03.\"회원일련번호\")"
    source_table: tbdaaat03
    unit: 명
    synonyms: ["회원숫자", "회원인원", "고객수"]
  - name: 카드별월이용금액
    description: "카드월실적 기준 카드 1장의 월 이용금액."
    sql: "SUM(tmdaa3e16.\"금월이용합계금액\")"
    source_table: tmdaa3e16
    unit: 원
    time_dimension: 기준년월
    synonyms: ["카드이용금액", "월이용금액", "카드사용액"]

  # ── 가맹점 메트릭 ──
  - name: 가맹점수
    description: "가맹점기본 기준 고유 가맹점 수. 거래정지가 아닌 활성 가맹점만 셀 때는 활성가맹점 필터를 함께 적용한다."
    sql: "COUNT(DISTINCT tbdaadt01.\"가맹점번호\")"
    source_table: tbdaadt01
    unit: 개
    synonyms: ["가맹점개수", "가맹점숫자", "점포수"]
  - name: 신용카드가맹점수수료율
    description: "가맹점월실적 기준 신용카드 가맹점 수수료율(평균)."
    sql: "AVG(tmdaa5e11.\"신용카드가맹점수수료율\")"
    source_table: tmdaa5e11
    unit: "%"
    synonyms: ["수수료율", "가맹점수수료", "수수료"]

  # ── 여신/연체/충당금 메트릭 ──
  - name: 총여신한도금액
    description: "기업고객일별기본 기준 고객의 여신한도금액 합계."
    sql: "SUM(tbdaa1d12.\"기업총한도금액\")"
    source_table: tbdaa1d12
    unit: 원
    synonyms: ["여신한도", "한도금액", "총한도"]
  - name: 연체회원수
    description: "카드연체일별 기준 연체가 발생한 고유 회원 수."
    sql: "COUNT(DISTINCT tddaa3l01.\"회원일련번호\")"
    source_table: tddaa3l01
    unit: 명
    synonyms: ["연체자수", "연체고객수", "연체인원"]
  - name: 특수채권편입원금
    description: "특수채권(부실채권) 편입 원금 합계."
    sql: "SUM(tbmaisd06.\"특수채권편입원금\")"
    source_table: tbmaisd06
    unit: 원
    synonyms: ["부실채권원금", "특수채권원금", "상각원금"]
  - name: 기대대손충당금
    description: "대손충당금 테이블 기준 기대 대손충당금 합계 (IFRS9 기대신용손실)."
    sql: "SUM(tbmewcm94.\"기대대손충당금\")"
    source_table: tbmewcm94
    unit: 원
    synonyms: ["대손충당금", "충당금", "기대손실", "ECL"]

# =============================================================================
# 4. GLOSSARY - 비즈니스 용어 사전
# =============================================================================
glossary:
  - term: "법인카드"
    canonical: "개인기업구분코드 = '2' 인 카드/회원"
    description: "기업(법인) 명의로 발급·이용되는 카드. 개인기업구분코드가 '2'(기업)인 레코드를 의미한다."
    aliases: ["기업카드", "법인", "기업"]
    sql_hint: "법인/기업 조건은 \"개인기업구분코드\" = '2' 를 사용한다."
  - term: "개인카드"
    canonical: "개인기업구분코드 = '1' 인 카드/회원"
    description: "개인 명의로 발급된 카드. 개인기업구분코드가 '1'(개인)인 레코드."
    aliases: ["개인", "개인회원"]
    sql_hint: "개인 조건은 \"개인기업구분코드\" = '1' 을 사용한다."
  - term: "활성가맹점"
    canonical: "가맹점거래정지여부 = 'N' 인 가맹점"
    description: "거래정지 상태가 아닌(영업 중인) 가맹점."
    aliases: ["정상가맹점", "거래중가맹점", "영업중가맹점"]
    sql_hint: "활성 조건은 (\"가맹점거래정지여부\" = 'N' OR \"가맹점거래정지여부\" IS NULL) 를 사용한다."
  - term: "연체"
    canonical: "연체회차 > 0 또는 연체발생년월일 존재"
    description: "카드/여신 대금을 약정일까지 상환하지 못한 상태. 카드연체일별(tddaa3l01)의 연체회차/연체일수로 판단한다."
    aliases: ["연체상태", "미납", "delinquency"]
    sql_hint: "연체 조건은 \"신용카드연체회차\" > 0 또는 \"연체일수\" > 0 으로 본다."
  - term: "신규고객"
    canonical: "해당 기준년월에 최초 등록된 고객"
    description: "특정 기준년월/년월일에 신규로 등록·발급된 고객 또는 카드."
    aliases: ["신규", "신규등록", "신규회원", "신규발급"]
    sql_hint: "신규는 등록년월일/신규발급년월일이 조회 기간에 속하는 레코드를 사용한다."
  - term: "기준년월"
    canonical: "YYYYMM 형식의 집계 기준 월"
    description: "월별 집계 테이블의 시점 기준. 'YYYYMM' 6자리 문자열이다. (예: '202512')"
    aliases: ["년월", "월", "기준월", "집계월"]
    sql_hint: "월 조건은 \"기준년월\" = '202512' 형식, 기간은 BETWEEN '202501' AND '202512'."
  - term: "기준년월일"
    canonical: "YYYYMMDD 형식의 일자 기준"
    description: "일별 스냅샷 테이블의 시점 기준. 'YYYYMMDD' 8자리 문자열."
    aliases: ["기준일", "일자", "날짜", "기준일자"]
    sql_hint: "일자 조건은 \"기준년월일\" = '20251231' 형식을 사용한다."

# =============================================================================
# 5. QUERY REFERENCES - 질의별 컬럼/필터/조인 선택 지침
# =============================================================================
query_references:
  - intent: 월별_카드매출_조회
    when_user_says:
      - "이번달 카드 매출 알려줘"
      - "월별 매출 추이"
      - "12월 카드 이용금액"
    primary_table: tbdaabt30
    join_tables: [tbdaadt01, tbdaadb17]
    join_rule: "매출전표(tbdaabt30)를 가맹점번호로 tbdaadt01과, 업종명이 필요하면 가맹점업종코드로 tbdaadb17과 조인한다."
    recommended_columns:
      기간필터: "\"기준년월\" = 'YYYYMM' 또는 BETWEEN 으로 기간 지정"
      매출금액: "SUM(\"매출금액\")"
      그룹핑: "\"기준년월\" 기준 GROUP BY"
    rules:
      - "월별 추이는 \"기준년월\"로 GROUP BY 하고 ORDER BY \"기준년월\"."
      - "취소 매출 제외가 필요하면 카드매출유형/매출전표종류 구분코드를 확인한다."
    sql_pattern: |
      SELECT "기준년월", SUM("매출금액") AS "총매출금액"
      FROM card_system.tbdaabt30
      WHERE "기준년월" BETWEEN '202501' AND '202512'
      GROUP BY "기준년월"
      ORDER BY "기준년월"

  - intent: 가맹점별_매출순위
    when_user_says:
      - "매출 상위 가맹점"
      - "가맹점 매출 순위"
      - "매출 많은 가맹점 TOP 10"
    primary_table: tmdaa5e11
    join_tables: [tbdaadt01, tbdaadb17]
    join_rule: "가맹점월실적(tmdaa5e11)을 가맹점번호로 가맹점기본(tbdaadt01)과 조인해 가맹점명을 가져온다."
    recommended_columns:
      가맹점명: "tbdaadt01.\"가맹점명\""
      매출: "SUM(tmdaa5e11.\"금년가맹점신용판매매출금액\")"
      정렬: "매출 기준 DESC, LIMIT N"
    rules:
      - "순위 질의는 ORDER BY 매출 DESC + LIMIT 을 사용한다."
      - "특정 월이면 \"기준년월\" 필터를 적용한다."
    sql_pattern: |
      SELECT m."가맹점번호", g."가맹점명", SUM(m."금년가맹점신용판매매출금액") AS "매출금액"
      FROM card_system.tmdaa5e11 m
      JOIN card_system.tbdaadt01 g ON m."가맹점번호" = g."가맹점번호"
      WHERE m."기준년월" = '202512'
      GROUP BY m."가맹점번호", g."가맹점명"
      ORDER BY "매출금액" DESC
      LIMIT 10

  - intent: 업종별_매출
    when_user_says:
      - "업종별 매출"
      - "어떤 업종이 매출이 많아"
      - "업종별 이용금액"
    primary_table: tbdaabt30
    join_tables: [tbdaadt01, tbdaadb17]
    join_rule: "매출전표 -> 가맹점기본(가맹점번호) -> 가맹점업종코드 마스터(가맹점업종코드)로 조인해 업종명을 가져온다."
    recommended_columns:
      업종명: "tbdaadb17.\"가맹점업종명\""
      매출: "SUM(tbdaabt30.\"매출금액\")"
    rules:
      - "업종명은 tbdaadb17.\"가맹점업종명\"을 사용한다."
    sql_pattern: |
      SELECT b."가맹점업종명", SUM(s."매출금액") AS "매출금액"
      FROM card_system.tbdaabt30 s
      JOIN card_system.tbdaadt01 g ON s."가맹점번호" = g."가맹점번호"
      JOIN card_system.tbdaadb17 b ON g."가맹점업종코드" = b."가맹점업종코드"
      WHERE s."기준년월" = '202512'
      GROUP BY b."가맹점업종명"
      ORDER BY "매출금액" DESC

  - intent: 연체현황_조회
    when_user_says:
      - "연체 현황 알려줘"
      - "연체 회원 수"
      - "연체 금액"
    primary_table: tddaa3l01
    join_tables: [tbdaaat03, tbdaaat01]
    join_rule: "카드연체일별(tddaa3l01)을 회원일련번호로 회원기본/고객기본과 조인한다."
    recommended_columns:
      연체조건: "\"신용카드연체회차\" > 0"
      연체회원수: "COUNT(DISTINCT \"회원일련번호\")"
    rules:
      - "연체 여부는 연체회차/연체일수 > 0 으로 판단한다."
      - "특정 일자 시점은 \"기준년월일\" 필터를 적용한다."
    sql_pattern: |
      SELECT "기준년월일", COUNT(DISTINCT "회원일련번호") AS "연체회원수"
      FROM card_system.tddaa3l01
      WHERE "기준년월일" = '20251231' AND "신용카드연체회차" > 0
      GROUP BY "기준년월일"

  - intent: 기업고객_여신한도
    when_user_says:
      - "기업 여신 한도"
      - "법인 고객 한도 현황"
      - "여신한도 큰 기업"
    primary_table: tbdaa1d12
    join_tables: [tbdaaat01]
    join_rule: "기업고객일별기본(tbdaa1d12)을 고객식별자로 고객기본(tbdaaat01)과 조인해 기업명을 가져온다."
    recommended_columns:
      기업명: "tbdaa1d12.\"기업명\""
      한도: "tbdaa1d12.\"기업총한도금액\""
    rules:
      - "특정 일자 스냅샷이므로 \"기준년월일\" 필터를 적용한다."
    sql_pattern: |
      SELECT "고객식별자", "기업명", "기업총한도금액"
      FROM card_system.tbdaa1d12
      WHERE "기준년월일" = '20251231'
      ORDER BY "기업총한도금액" DESC
      LIMIT 20

# =============================================================================
# 6. VERIFIED QUERIES - 검증된 질의 예시 (Few-Shot)
# =============================================================================
verified_queries:
  - name: monthly_card_sales
    question: "2025년 월별 카드 매출 추이 보여줘"
    description: "기준년월별 카드 매출 합계 추이"
    tags: [매출, 월별, 추이, 카드매출]
    parameters:
      기간_시작: "{기간_시작}"
      기간_종료: "{기간_종료}"
    sql: |
      SELECT "기준년월", SUM("매출금액") AS "총매출금액"
      FROM card_system.tbdaabt30
      WHERE "기준년월" BETWEEN '202501' AND '202512'
      GROUP BY "기준년월"
      ORDER BY "기준년월"

  - name: top_merchants_by_revenue
    question: "지난달 매출 상위 가맹점 10곳 알려줘"
    description: "가맹점월실적 기준 매출 상위 가맹점 TOP N"
    tags: [가맹점, 매출, 순위, TOP, 상위]
    parameters:
      기준년월: "{기준년월}"
      limit: 10
    sql: |
      SELECT m."가맹점번호", g."가맹점명", SUM(m."금년가맹점신용판매매출금액") AS "매출금액"
      FROM card_system.tmdaa5e11 m
      JOIN card_system.tbdaadt01 g ON m."가맹점번호" = g."가맹점번호"
      WHERE m."기준년월" = '202512'
      GROUP BY m."가맹점번호", g."가맹점명"
      ORDER BY "매출금액" DESC
      LIMIT 10

  - name: sales_by_industry
    question: "업종별 매출 비중 알려줘"
    description: "매출전표를 가맹점/업종 마스터와 조인한 업종별 매출"
    tags: [업종, 매출, 업종별]
    parameters:
      기준년월: "{기준년월}"
    sql: |
      SELECT b."가맹점업종명", SUM(s."매출금액") AS "매출금액"
      FROM card_system.tbdaabt30 s
      JOIN card_system.tbdaadt01 g ON s."가맹점번호" = g."가맹점번호"
      JOIN card_system.tbdaadb17 b ON g."가맹점업종코드" = b."가맹점업종코드"
      WHERE s."기준년월" = '202512'
      GROUP BY b."가맹점업종명"
      ORDER BY "매출금액" DESC

  - name: delinquency_member_count
    question: "이번달 말 카드 연체 회원 수 알려줘"
    description: "카드연체일별 기준 연체 회원 수"
    tags: [연체, 회원수, 연체현황]
    parameters:
      기준년월일: "{기준년월일}"
    sql: |
      SELECT "기준년월일", COUNT(DISTINCT "회원일련번호") AS "연체회원수"
      FROM card_system.tddaa3l01
      WHERE "기준년월일" = '20251231' AND "신용카드연체회차" > 0
      GROUP BY "기준년월일"

  - name: corporate_credit_limit_top
    question: "여신한도가 큰 기업고객 상위 20곳"
    description: "기업고객일별기본 기준 여신한도 상위 기업"
    tags: [여신, 한도, 기업, 법인]
    parameters:
      기준년월일: "{기준년월일}"
      limit: 20
    sql: |
      SELECT "고객식별자", "기업명", "기업총한도금액"
      FROM card_system.tbdaa1d12
      WHERE "기준년월일" = '20251231'
      ORDER BY "기업총한도금액" DESC
      LIMIT 20

  - name: corporate_provision_summary
    question: "이번달 대손충당금 총액 알려줘"
    description: "대손충당금 테이블 기준 기대 대손충당금 합계"
    tags: [충당금, 대손, 리스크]
    parameters:
      기준년월: "{기준년월}"
    sql: |
      SELECT "기준년월", SUM("기대대손충당금") AS "기대대손충당금합계"
      FROM card_system.tbmewcm94
      WHERE "기준년월" = '202512'
      GROUP BY "기준년월"

  - name: special_debt_summary
    question: "특수채권 편입 원금 합계 보여줘"
    description: "특수채권(부실채권) 편입 원금 집계"
    tags: [특수채권, 부실채권, 상각, 원금]
    parameters:
      기준년: "{기준년}"
    sql: |
      SELECT "기준년", SUM("특수채권편입원금") AS "특수채권편입원금합계"
      FROM card_system.tbmaisd06
      WHERE "기준년" = '2025'
      GROUP BY "기준년"

  - name: active_merchant_count_by_industry
    question: "업종별 활성 가맹점 수"
    description: "거래정지가 아닌 활성 가맹점을 업종별로 집계"
    tags: [가맹점, 업종, 활성, 가맹점수]
    parameters: {}
    sql: |
      SELECT b."가맹점업종명", COUNT(DISTINCT g."가맹점번호") AS "가맹점수"
      FROM card_system.tbdaadt01 g
      JOIN card_system.tbdaadb17 b ON g."가맹점업종코드" = b."가맹점업종코드"
      WHERE (g."가맹점거래정지여부" = 'N' OR g."가맹점거래정지여부" IS NULL)
      GROUP BY b."가맹점업종명"
      ORDER BY "가맹점수" DESC

  - name: corporate_member_card_holdings
    question: "법인 회원의 유효 신용카드 보유 수"
    description: "법인(기업) 회원의 유효 신용카드 매수 합계"
    tags: [법인, 기업, 카드보유, 유효카드]
    parameters: {}
    sql: |
      SELECT SUM("유효신용카드수") AS "유효신용카드수합계", COUNT(DISTINCT "회원일련번호") AS "회원수"
      FROM card_system.tbdaaat03
      WHERE "개인기업구분코드" = '2'

  - name: overseas_sales_by_month
    question: "월별 해외 카드 이용금액 추이"
    description: "해외매출전표 기준 월별 해외 이용금액"
    tags: [해외, 매출, 월별, 해외이용]
    parameters:
      기간_시작: "{기간_시작}"
      기간_종료: "{기간_종료}"
    sql: |
      SELECT "기준년월", SUM("매출금액") AS "해외매출금액"
      FROM card_system.tbdaabt08
      WHERE "기준년월" BETWEEN '202501' AND '202512'
      GROUP BY "기준년월"
      ORDER BY "기준년월"
