        description: KB카드와 가맹점 계약을 체결한 사업장에 부여하는 식별번호
        synonyms: [가맹점ID, 가맹점코드]
      - name: 소유자고객식별자
        expr: 소유자고객식별자
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 소유자고객식별자를관리한다.
      - name: 소유자고객관리번호
        expr: 소유자고객관리번호
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 소유자고객관리번호를관리한다.
      - name: 본인고객식별자
        expr: 본인고객식별자
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 고객자신에 대한 식별자
      - name: 본인고객관리번호
        expr: 본인고객관리번호
        data_type: VARCHAR
        description: 카드에 해당하는 소유자에 따른 본인고객관리번호이다.
      - name: KB카드BC카드구분코드
        expr: KB카드BC카드구분코드
        data_type: VARCHAR
        description: KB카드와 BC카드를 구분하는코드이다.
      - name: 개인기업구분코드
        expr: 개인기업구분코드
