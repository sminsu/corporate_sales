        data_type: VARCHAR
        description: 국세청 압류대상 사업장 여부
      - name: ONUS가맹점여부
        expr: ONUS가맹점여부
        data_type: VARCHAR
        description: ONUS 가맹점인지에 대한 여부.
      - name: 대금지급보류등록가맹점여부
        expr: 대금지급보류등록가맹점여부
        data_type: VARCHAR
