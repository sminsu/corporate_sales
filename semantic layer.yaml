        expr: 카드브랜드구분코드
        data_type: VARCHAR
        description: "카드브랜드구분코드 1:로칼(국민) 2:마스터 3:비자 4:JCB"
      - name: 카드소유자구분코드
        expr: 카드소유자구분코드
        data_type: VARCHAR
        description: 카드 소유자 유형 (본인/가족/대표/공용/개별)
      - name: 카드등급구분코드
        expr: 카드등급구분코드
        data_type: VARCHAR
        description: 신용카드의 등급을 구분하는 코드이다.
      - name: 카드칩구분코드
        expr: 카드칩구분코드
        data_type: VARCHAR
        description: "카드자재 칩 탑재 및 종류 구분코드 (1:칩무 2:RF 3:IC 4:RF + IC)를 나타낸 코드이다."
      - name: 카드환율적용구분코드
        expr: 카드환율적용구분코드
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 환율적용관리 코드
      - name: 우수고객서비스구분코드
        expr: 우수고객서비스구분코드
        data_type: VARCHAR
        description: 관리회계에서 사용하는 우수고객서비스구분코드 속성을 관리한다.
      - name: 등록부점코드
        expr: 등록부점코드
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 등록처리한 부점코드이다.
      - name: 직업구분코드
        expr: 직업구분코드
        data_type: VARCHAR
        description: 직업정보를 구분하는 코드이다.
      - name: 선취후취구분코드
        expr: 선취후취구분코드
        data_type: VARCHAR
        description: 선취나 후취 등을 구분하는 코드이다.
      - name: 매입자료구분코드
        expr: 매입자료구분코드
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 매입전표의 자료 종류
      - name: RF매체구분코드
        expr: RF매체구분코드
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 RF기관을 관리하는 코드
      - name: 교통매체코드
        expr: 교통매체코드
        data_type: VARCHAR
        description: 전표 매입시 교통매체를 구분하는 코드이다.
      - name: 전표참조번호
        expr: 전표참조번호
        data_type: VARCHAR
        description: 공동망에서 거래된 매출전표의 당사,타사의 참조번호로 전문을 통해 여신협회에 송수신된다.
      - name: 전자서명전표여부
        expr: 전자서명전표여부
        data_type: VARCHAR
        description: 전자적으로 서명한 전표인지의 여부
      - name: RF차량번호
        expr: RF차량번호
        data_type: VARCHAR
        description: RF사업자로부터 수신한 후불교통/하이패스 이용차량의 번호
      - name: 호스트DDC여부
        expr: 호스트DDC여부
        data_type: VARCHAR
        description: "VAN사의 매출전표접수자료 및 매입반송자료 데이터에 기재된 호스트DDC여부 / HOST DDC는 가맹점에서 신판내역을 VAN으로 전송하고 VAN에서 카드사로 전송하는 일련의 업무 방식을 말함."
      - name: 바우처신용구분코드
        expr: 바우처신용구분코드
        data_type: VARCHAR
        description: 바우처 전표를 구분하기위한 코드이다.
      - name: 항공권번호
        expr: 항공권번호
        data_type: VARCHAR
        description: BSP항공 매출전표 매입처리시 사용되는 항공권번호
      - name: 출발항공지역코드
        expr: 출발항공지역코드
        data_type: VARCHAR
        description: BSP매출전표 매입시 관리되는 항공권 출발지역코드
      - name: 도착항공지역코드
        expr: 도착항공지역코드
        data_type: VARCHAR
        description: BSP매출전표 매입시 관리되는 항공권 도착지역코드
      - name: 항공기탑승시각
        expr: 항공기탑승시각
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 승객이 항공기에 탑승한 시각
      - name: 바우처서비스유형코드
        expr: 바우처서비스유형코드
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 바우처서비스유형
      - name: 청구회수바우처사업구분코드
        expr: 청구회수바우처사업구분코드
        data_type: VARCHAR
        description: 바우처사업을 구분하는 코드 / 바우처 국고지원시 아이사랑전표와 국방복지전표를 구분하기 위한 용도로 국방복지기금바우처, 아이사랑바우처를 구분한다.
      - name: 가상카드구분코드
        expr: 가상카드구분코드
        data_type: VARCHAR
        description: 가상으로 일회성 또는 한시적으로 사용한 가상카드의 구분코드이다.
      - name: 온라인거래여부
        expr: 온라인거래여부
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 온라인 거래 여부식별값
      - name: 가맹점우편번호
        expr: 가맹점우편번호
        data_type: VARCHAR
        description: 가맹점이 소재한 주소가 속해있는 우편담당구역
      - name: 정부구매카드고객번호
        expr: 정부구매카드고객번호
        data_type: VARCHAR
        description: "고객을 식별할 수 있는 고유번호 (주민등록번호,운전면허번호,외국인등록번호,사업자등록번호 등) 중 - 1.사업자번호(10) - / 정부구매번호[정부구매출납관서코드(11)+지출목코드(4)+브랜드구분/회사구분(1) = 16] - / 정부구매카드번호[정부구매출납관서코드(11)+지출목코드(4)+카드구분번호(4) = 19] (암호화 미대상)을 관리한다."
      - name: 아파트코드
        expr: 아파트코드
        data_type: VARCHAR
        description: 카드결제로 자동납부 신청이 가능한 아파트코드를 관리한다
      - name: 가상카드번호
        expr: 가상카드번호
        data_type: VARCHAR
        description: 가상으로 일회성 또는 한시적으로 사용하는 카드번호
      - name: 자동납부아파트동호코드
        expr: 자동납부아파트동호코드
        data_type: VARCHAR
        description: 자동납부를 위해서 외부기관에서 수신 받은 아파트의 동/호 정보를 관리 하기 위한 코드
      - name: 자동납부구분코드
        expr: 자동납부구분코드
        data_type: VARCHAR
        description: 자동납부를 구분하는 코드를 관리한다.
      - name: 자동납부구분명
        expr: 자동납부구분명
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 자동납부 구분코드의 코드명
      - name: 통신요금자동납부전화번호
        expr: 통신요금자동납부전화번호
        data_type: VARCHAR
        description: 통신요금 자동납부시 고객전화번호를 말한다.
      - name: 배치작업내용
        expr: 배치작업내용
        data_type: VARCHAR
        description: 배치작업시 영역별 데이터 구분할수있는 내용
      - name: 업무유형구분코드
        expr: 업무유형구분코드
        data_type: VARCHAR
        description: KB당사 매출(매입)전표상의 업무 유형을 관리하기 위한 매입전표의 업무유형관리코드
      - name: 카드론거래매체구분코드
        expr: 카드론거래매체구분코드
        data_type: VARCHAR
        description: 카드론 신청, 소개 시 인입되는 매체가 마케팅톡, Liiv Mate LGU+ 고객,테블릿브런치 등 인지를 구분하는 코드
      - name: 앱구분코드
        expr: 앱구분코드
        data_type: VARCHAR
        description: 간편결제구분을 위한 SWIPE구분코드를 포함하는 상위개념의 앱결제 구분코드
      - name: 가맹점명
        expr: 가맹점명
        data_type: VARCHAR
        description: 해당 전표를 사용한 가맹점명 정보를 나타낸다. VAN사에서 보낸 전문 데이터를 가공없이 적재한다.
        synonyms: [가맹점이름, 상호, 상호명]
      - name: PG입점업체사업자등록번호
        expr: PG입점업체사업자등록번호
        data_type: VARCHAR
        description: 승인전표 내역의 PG가맹점 입점업체 사업자등록번호를 나타낸다.
      - name: 대외실적미포함대상여부
        expr: 대외실적미포함대상여부
        data_type: VARCHAR
        description: 대외 실적 집계시 포함하지않는 대상을 나타낸다. - 알파영(리브NEXT) 카드
      - name: 가맹점수수료율구분코드
        expr: 가맹점수수료율구분코드
        data_type: VARCHAR
        description: 가맹점에 적용되는 신용, 체크, 해외, 공동망수수료율 등을 분류하는 구분
    measures:
      - name: 매출금액
        expr: 매출금액
        data_type: DECIMAL
        description: 회원이 사용하여 발생된 매출에 대한 금액 정보를 관리함
        synonyms: [매출, 매출액, 이용금액]
      - name: 봉사료
        expr: 봉사료
        data_type: DECIMAL
        description: 매출전표상의 봉사료
      - name: 매출미화금액
        expr: 매출미화금액
        data_type: DECIMAL
        description: 접수기관 또는 가맹점에서 매입요청한 매출전표의 미화금액
      - name: 미화봉사료
        expr: 미화봉사료
        data_type: DECIMAL
        description: 접수기관 또는 가맹점에서 매입요청한 매출전표의 미화 봉사료(TIP)
      - name: 할부기간개월수
        expr: 할부기간개월수
        data_type: BIGINT
        description: 처리대상 매출건의 할부기간 개월수
      - name: 할부수수료율
        expr: 할부수수료율
        data_type: DECIMAL
        description: 할부 매출에서 발생된 수수료율이다.
      - name: CA수수료율
        expr: CA수수료율
        data_type: DECIMAL
        description: 단기카드대출(현금서비스)에 대한 수수료율 (24.01부터 소급적용)
      - name: CA수수료
        expr: CA수수료
        data_type: DECIMAL
        description: 단기카드대출(현금서비스) 시점에 발생된 수수료 (24.01부터 소급적용)
      - name: 카드승인금액
        expr: 카드승인금액
        data_type: DECIMAL
        description: MFX_KB카드전표입력내역의 카드승인 처리된 금액
      - name: 취소매출현금환입금액
        expr: 취소매출현금환입금액
        data_type: DECIMAL
        description: 취소매출전표 단말매입시 가맹점대금중 현금으로 환입된 금액
      - name: 가맹점수수료율
        expr: 가맹점수수료율
        data_type: DECIMAL
        description: 매출전표 매입시 가맹점이 카드사에 지급해야 할 수수료율을 관리
      - name: 가맹점수수료
        expr: 가맹점수수료
        data_type: DECIMAL
        description: "매출전표 매입시 매출금액을 기준으로 가맹점수수료율을 반영하여 산출한 가맹점이 카드사에게 지급하는 수수료 / 카드사는 매출금액에서 가맹점수수료를 차감한 금액을 대금지급처리"
      - name: RF이용건수
        expr: RF이용건수
        data_type: BIGINT
        description: RF매출전표 매입시 해당건이 포함하는 RF이용건수
      - name: 출산장려지원금액
        expr: 출산장려지원금액
        data_type: DECIMAL
        description: 고운맘카드가 사용되었을때 정부에서 지원된 출산장려지원금액
      - name: 소득공제제외대상금액
        expr: 소득공제제외대상금액
        data_type: DECIMAL
        description: 소득공제 산정제외대상 금액을 관리하는 항목
      - name: 원천징수소득세금액
        expr: 원천징수소득세금액
        data_type: DECIMAL
        description: 매출전표에서 아이사랑등 바우쳐 관련 특정 매출에 적용되는 소득세 합계를 의미.
      - name: 원천징수주민세금액
        expr: 원천징수주민세금액
        data_type: DECIMAL
        description: 매출전표에서 아이사랑등 바우쳐 관련 특정 매출에 적용되는 주민세의 합계를 의미.
      - name: 최종CA수수료율
        expr: 최종CA수수료율
        data_type: DECIMAL
        description: "할인수수료율을 적용한 최종/실질 CA수수료율을 나타낸다(24.01부터 소급적용) . ※ 산출방식 : CA수수료율 · (100 - 할인수수료율) / 100"
      - name: 해외서비스원화수수료
        expr: 해외서비스원화수수료
        data_type: DECIMAL
        description: 해외서비스(거래)이용시 부여되는 원화수수료 금액 (24.01부터 소급적용)
      - name: 부가가치세
        expr: 부가가치세
        data_type: DECIMAL
        description: 세법에 근거하여 재화의 10%에 해당하는 세액이다 (BF151전문에서 수신받은 세금)
    time_dimensions:
      - name: 기준년월
        expr: 기준년월
        data_type: VARCHAR
        description: KB카드전표입력의 매입년월일 기준으로 생성 되는 기준년월
        synonyms: [년월, 월, 기준월]
      - name: 전표매입년월일
        expr: 전표매입년월일
        data_type: VARCHAR
        description: 카드전표의 매입이 발생한 년월일
      - name: 매출전표접수년월일
        expr: 매출전표접수년월일
        data_type: VARCHAR
        description: "접수기관(VAN, RF교통기관, 직라인 등)으로부터 일괄매입DATA를 전송받아 원장에 반영하는 일자 / 가맹점으로부터 매출전표를 접수후 영업점에서 온라인 매입을 등록한 일자"
      - name: 전표매출년월일
        expr: 전표매출년월일
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 카드전표의 매출년월일
