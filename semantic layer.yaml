      - name: 이원화통합한도등급코드
        expr: 이원화통합한도등급코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 이원화 고객의 통합한도 등급코드
      - name: 이원화CA한도등급코드
        expr: 이원화CA한도등급코드
        data_type: VARCHAR
