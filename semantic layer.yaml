        expr: 그룹사정보제공동의구분코드
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의고객의 정보를 KB그룹사에 제공하는것에 대한 동의여부를 구분코드로 정의한다.
      - name: 비계좌선불카드단독보유여부
        expr: 비계좌선불카드단독보유여부
        data_type: VARCHAR
        description: "MFX월고객정보기본시점정보의 비계좌 선불카드만을 보유하고 있는지를 나타낸다.※ 선불전자지급수단을 충전계정(결제계좌)으로 하는 선불카드(은행의 리브포켓, 당사의 머니 등)"
      - name: 외국인여부
        expr: 외국인여부
        data_type: VARCHAR
        description: 고객이 외국인인지에 대한 내용을 관리한다.
    measures:
      - name: 월소득금액
        expr: 월소득금액
        data_type: DECIMAL
        description: 고객의 월소득금액
      - name: 자택발송물반송횟수
        expr: 자택발송물반송횟수
        data_type: BIGINT
        description: MFX월고객정보기본시점정보의자택에 발송물이 반송된 횟수를 관리
      - name: 직장발송물반송횟수
        expr: 직장발송물반송횟수
        data_type: BIGINT
        description: MFX월고객정보기본시점정보의직장에 발송물이 반송된 횟수를 관리
    time_dimensions:
      - name: 기준년월
        expr: 기준년월
        data_type: VARCHAR
        description: "MFX월고객정보기본시점정보의고객정보기본 테이블의 월 스냅샷을 생성하기 위해 사용하는 일자 정보로 해당 기준년월의 말일자 시점의 데이터를 보관한다."
        synonyms: [년월, 월, 기준월]
      - name: 등록년월일
        expr: 등록년월일
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의해당테이블에 데이터가 등록된 년월일
      - name: 최초등록년월일
        expr: 최초등록년월일
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의국민카드에 고객으로 처음 등록한 일자(년월일)
      - name: 사망년월일
        expr: 사망년월일
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의 사망한 기준이 되는 년/월/일이다
      - name: 사망해제년월일
        expr: 사망해제년월일
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의사망으로 등록된이후 사망 상태가 해제된 년월일
      - name: 기념년월일
        expr: 기념년월일
        data_type: VARCHAR
        description: 생일,기일,결혼기념일 등의 고객별 기념일을 년월일로 관리
      - name: 결혼기념년월일
        expr: 결혼기념년월일
        data_type: VARCHAR
        description: 고객의 결혼기념에 해당하는 일자이다.

  - name: tmdaa3e16
    physical_table: card_system.tmdaa3e16
    korean_name: 카드월실적
    description: "카드의 월별 통합 실적을 집계하는 대형 팩트 테이블. 한 행은 특정 기준년월에 발생한 하나의 카드 실적을 의미한다. 이용금액·이용건수·연체원금·한도·평점(ASS/BSS) 등 카드 단위의 월별 성과·리스크 지표를 광범위하게 담아, 카드별 월 이용·연체·한도 분석에 사용한다."
    grain: 기준년월 × 회원일련번호 × 카드구분키번호 1건 (카드 월 통합 실적)
    primary_key: [기준년월, 회원일련번호, 카드구분키번호]
    synonyms: [카드실적, 카드월별실적, 카드월, 카드이용실적]
    dimensions:
      - name: 회원일련번호
        expr: 회원일련번호
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 당사(KB국민카드)와 계약한 회원을 관리하는 식별번호
        synonyms: [회원번호, 회원ID]
      - name: 카드구분키번호
        expr: 카드구분키번호
        data_type: VARCHAR
        description: "MFX월카드통합실적집계의 회원별로 부여되는 일련번호에 카드상품 또는 계약별로 추가되는 일련번호이다.2. 기본적으로 카드브랜드구분코드 + 일련번호로 구성된다."
      - name: 카드식별자
        expr: 카드식별자
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 KB카드에서 발급하는 카드의 카드번호를 대체하여 식별하기 위한 중복되지 않는 값
      - name: 카드BIN번호
        expr: 카드BIN번호
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드의 발급사를 구분하는 BIN번호이다.
      - name: 고객식별자
        expr: 고객식별자
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 KB카드의 고객에게 부여하는 10자리 번호체계로 각 고객을 고유하게 식별할 수 있음
        synonyms: [고객ID, 고객번호]
      - name: 고객관리번호
        expr: 고객관리번호
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 고객식별자의 하위 5자리 번호체계
      - name: 카드소유자구분코드
        expr: 카드소유자구분코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드 소유자 유형(본인/가족/대표/공용/개별)
      - name: 개인기업구분코드
        expr: 개인기업구분코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 개인 또는 기업을 구분하는 코드
      - name: 본인카드구분키번호
        expr: 본인카드구분키번호
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 가족 또는 사업자/사업장카드일 경우 본인 또는 대표에 해당하는 카드구분키번호이다.
      - name: 본인고객식별자
        expr: 본인고객식별자
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 고객자신에 대한 식별자
      - name: 본인고객관리번호
        expr: 본인고객관리번호
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드에 해당하는 소유자에 따른 본인고객관리번호이다.
      - name: 카드브랜드구분코드
        expr: 카드브랜드구분코드
        data_type: VARCHAR
        description: "MFX월카드통합실적집계의 카드브랜드구분코드1:로칼(국민)2:마스터3:비자4:JCB"
      - name: 카드등급구분코드
        expr: 카드등급구분코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드의 등급을 관리하는 구분코드
      - name: 상품중분류구분코드
        expr: 상품중분류구분코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 KB카드 전사차원에서 상품의 대분류 하위 중분류를 구분하여 정의한 코드를 관리한다.
      - name: 카드등급그룹코드
        expr: 카드등급그룹코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 KB카드사의 카드상품 등급에 대한 분류의 그룹핑 코드
      - name: 상품코드
        expr: 상품코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 상품대분류+상품중분류+템플릿코드별 상품에 대해 고유하게 부여한 일련번호이다
      - name: 제휴관리번호
        expr: 제휴관리번호
        data_type: VARCHAR
        description: "MFX월카드통합실적집계의 제휴사에서 관리를 원할하게 하기 위해 고객에게 제공한 관리번호이다.(아시아나항공, GS번호, 대한항공, ABC번호 등...)"
      - name: 관리부점코드
        expr: 관리부점코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 고객이나 채권,가맹점 등을 관리하는 부점코드
      - name: CA한도등급코드
        expr: CA한도등급코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 단기카드대출(현금서비스)을 받을 수 있는 한도의 등급코드
      - name: 통합한도등급코드
        expr: 통합한도등급코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 현금서비스를 포함하여 부여한 총 한도등급코드
      - name: 최초발급유효카드여부
        expr: 최초발급유효카드여부
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 회원이 보유하고 있는 유효카드 중 최초발급카드 여부
      - name: 최초발급카드여부
        expr: 최초발급카드여부
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 해당카드가 회원이 소지하고있는 카드중 최초발급된 카드인지 여부
      - name: 유효신용카드여부
        expr: 유효신용카드여부
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드가 만료년월일이 경과하지 않고 통합한도가 존재하는 유효한 신용카드인지여부
      - name: 유효체크카드여부
        expr: 유효체크카드여부
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 체크카드가 만료년월일이 경과하지 않은 유효한 체크카드인지여부
      - name: 입력부점코드
        expr: 입력부점코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 입력을 발생 시킨 부점코드
      - name: 역할유형구분코드
        expr: 역할유형구분코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 권유자 역할 유형 코드(배우자/직원/알바/..)
      - name: 권유자번호
        expr: 권유자번호
        data_type: VARCHAR
        description: "MFX월카드통합실적집계의 회원가입신청서 작성시 권유 모집인 식별을 위해 사용하는 번호 역할구분과 모집인번호가 조합 권유자식별자 -모집인구분(역할유형구분코드) +모집인번호(모집인식별내용(M) + 모집인코드)"
      - name: 카드거래매체구분코드
        expr: 카드거래매체구분코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 거래 매체별 종류
      - name: 카드교부희망부점코드
        expr: 카드교부희망부점코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드 교부시 고객이 희망(요청)하는 부점코드
      - name: 카드실물보유부점코드
        expr: 카드실물보유부점코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드를 실물 부유하고 있는 영업점부점코드이다.
      - name: 자동갱신비대상사유구분코드
        expr: 자동갱신비대상사유구분코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드 자동갱신 대상에서 제외된 사유를 구분하는 코드
      - name: 발급유형구분코드
        expr: 발급유형구분코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 신규발급, 재발급, 자동갱신 등 발급유형을 구분하는 코드
      - name: 교부유형구분코드
        expr: 교부유형구분코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드 교부방법 종류(인편/우편/지점방문/등등)
      - name: 카드도난분실발급여부
        expr: 카드도난분실발급여부
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드를 도난 분실시 거래정지를 등록하고 재발급 받은 여부이다.
      - name: 교체카드여부
        expr: 교체카드여부
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드 만료일이 되어서 갱신된 경우와 분실/도난으로 카드를 교체한 여부이다.
      - name: 카드등급변경여부
        expr: 카드등급변경여부
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드 재발급 또는 갱신시 카드등급을 변경하여 받은 여부이다.
      - name: 갱신카드여부
        expr: 갱신카드여부
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드 만료일에 갱신발급 받은 여부이다.
      - name: CD기기능구분코드
        expr: CD기기능구분코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 CD기능 연결 계좌를 구분하는 코드(결제계좌/별도계좌)
      - name: 발급유형구분시기구분코드
        expr: 발급유형구분시기구분코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 선발급, 즉시, 일괄, 점자, 무선발급등 발급유형구분에 대한 시기구분코드
      - name: 카드정보변경유형일련번호
        expr: 카드정보변경유형일련번호
        data_type: VARCHAR
