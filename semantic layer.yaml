  - name: tbdaadt01
    physical_table: card_system.tbdaadt01
    korean_name: 가맹점기본
    description: "당사와 가맹점 계약을 체결한 사업장의 기본 정보를 관리하는 가맹점 마스터 테이블. 한 행은 하나의 가맹점(가맹점번호)을 의미한다. 가맹점명·사업자/법인등록번호·가맹점업종·MCC업종·기업/대표 고객식별자·가맹점상태·등록/신규 년월일 등 가맹점 식별 및 분류 속성을 담는다. 가맹점 기준 분석의 마스터 테이블이다."
    grain: 가맹점번호 1건 (가맹점 마스터)
    primary_key: [가맹점번호]
    synonyms: [가맹점, 가맹점마스터, 가맹점정보, 사업장]
    dimensions:
      - name: 가맹점번호
        expr: 가맹점번호
        data_type: VARCHAR
        description: KB카드와 가맹점 계약을 체결한 사업장에 부여하는 식별번호
        synonyms: [가맹점ID, 가맹점코드]
      - name: 기업고객식별자
        expr: 기업고객식별자
        data_type: VARCHAR
        description: KB카드의 고객에게 부여하는 10자리 식별번호중 기업고객에 대한 식별번호
      - name: 기업고객관리번호
        expr: 기업고객관리번호
        data_type: VARCHAR
        description: 개인이 아닌 기업체에 대한 고객관리번호
      - name: 대표고객식별자
        expr: 대표고객식별자
        data_type: VARCHAR
        description: GBH고객식별자이벤트응모내역 엔티티에서 관리되는 대표고객의 고객식별자이다.
      - name: 대표고객관리번호
        expr: 대표고객관리번호
        data_type: VARCHAR
        description: GBH고객식별자이벤트응모내역 엔티티에서 관리되는 대표고객식별자의 일련번호이다.
      - name: 가맹점상태구분코드
        expr: 가맹점상태구분코드
        data_type: VARCHAR
        description: 가맹점의 상태 표시 코드
      - name: 법인등록번호
        expr: 법인등록번호
        data_type: VARCHAR
        description: 개인의 주민등록번호처럼 법인 설립 시 주어지는 고유번호. 법인등기부등본,사업자등록증으로 확인
        synonyms: [법인번호]
      - name: 사업자등록번호
        expr: 사업자등록번호
        data_type: VARCHAR
        description: 개인기업 또는 법인의 사업자등록증번호
        synonyms: [사업자번호, 사업자등록]
      - name: 가맹점명
        expr: 가맹점명
