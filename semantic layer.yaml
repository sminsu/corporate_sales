  - name: tbdccam02
    physical_table: card_system.tbdccam02
    korean_name: 회원거래정지월집계
    description: "회원 거래정지 실적을 월 시점으로 집계한 테이블. 한 행은 특정 기준년월 시점의 하나의 거래정지 건을 의미한다. 카드거래정지사유·거래정지코드(명)·연체거래정지 여부·거래정지 등재년월일을 담아, 월별 거래정지 추이 분석에 사용한다."
    grain: 기준년월 × 기준년월일 × 고객 × 거래정지일련번호 1건
    primary_key: [기준년월, 기준년월일, 고객식별자, 고객관리번호, 거래정지일련번호]
    synonyms: [거래정지집계, 월거래정지, 거래정지현황]
    dimensions:
      - name: 고객식별자
        expr: 고객식별자
        data_type: VARCHAR
        description: KB카드의 고객에게 부여하는 10자리 번호체계로 각 고객을 고유하게 식별할 수 있음
        synonyms: [고객ID, 고객번호]
      - name: 고객관리번호
        expr: 고객관리번호
        data_type: VARCHAR
        description: 고객식별자의 하위 5자리 번호체계
      - name: 거래정지일련번호
        expr: 거래정지일련번호
        data_type: DECIMAL
        description: 거래정지 정보를 관리하기 위해 부여한 일련번호
      - name: 카드거래정지사유구분코드
        expr: 카드거래정지사유구분코드
        data_type: VARCHAR
        description: 카드거래 정지의 사유를 관리하기 위한 코드이다.
      - name: 회원일련번호
        expr: 회원일련번호
        data_type: VARCHAR
        description: 당사(KB국민카드)와 계약한 회원을 관리하는 식별번호
        synonyms: [회원번호, 회원ID]
      - name: 거래정지코드
        expr: 거래정지코드
        data_type: VARCHAR
        description: 거래정지를 구분한 코드로 본원장은 회원에 대한 거래정지코드를 의미한다.
      - name: 거래정지코드명
        expr: 거래정지코드명
        data_type: VARCHAR
        description: 거래정지 코드에 대한 정의 정보를 관리한다.
      - name: 연체거래정지여부
        expr: 연체거래정지여부
        data_type: VARCHAR
        description: "거래정지 회원 중 연체로 인한 거래정지 회원인지에 대한 여부 (※025:이용대금연체, 026:여신연체, 058:개인/기업간연체, 072:소액연체, 074:KCB/KED타사연체)"
    time_dimensions:
      - name: 기준년월
        expr: 기준년월
        data_type: VARCHAR
        description: 회원거래정지 실적을 집계하기 위해 적용하는 일자정보(기준년월)로 해당 시점의 회원거래정지에 대한 상태를 집계하는 기준이 된다.
        synonyms: [년월, 월, 기준월]
      - name: 기준년월일
        expr: 기준년월일
        data_type: VARCHAR
        description: 회원거래정지 실적을 집계하기 위해 적용하는 일자정보(기준년월일)이며 기준년월에 적재되는 일자시점을 관리한다.
        synonyms: [기준일, 일자, 날짜]
      - name: 거래정지등재년월일
        expr: 거래정지등재년월일
        data_type: VARCHAR
        description: 거래정지를 등재한 년월일을 관리하는 원천단의 시스템일자정보를 관리한다.

  - name: tbmaisd06
    physical_table: card_system.tbmaisd06
    korean_name: 특수채권
    description: "부실채권(특수채권) 편입 내역을 관리하는 테이블. 한 행은 하나의 특수채권 편입 건을 의미한다. 특수채권 편입 기준년월일, 최초/현재 연체발생년월일·연체회차, 특수채권 편입 원금·수수료·이자·연체료 등을 담아 부실채권·상각채권 분석에 사용한다."
    grain: 기준년 × 특수채권관리번호 × 고객 1건 (특수채권 편입 건)
    primary_key: [기준년, 특수채권관리번호, 고객식별자, 고객관리번호]
    synonyms: [특수채권, 부실채권, 상각채권, 악성채권]
    dimensions:
      - name: 특수채권관리번호
        expr: 특수채권관리번호
        data_type: VARCHAR
        description: 특수채권(대손상각 승인된 원리금 및 부대채권과 법적절차에 의하여 원금을 전액 충당후 회수하지 못한 미수이자채권) 식별하기 위한 번호
      - name: 고객식별자
        expr: 고객식별자
        data_type: VARCHAR
        description: KB카드의 고객에게 부여하는 10자리 번호체계로 각 고객을 고유하게 식별할 수 있음
        synonyms: [고객ID, 고객번호]
      - name: 고객관리번호
        expr: 고객관리번호
        data_type: VARCHAR
        description: 고객식별자의 하위 5자리 번호체계
      - name: KB카드BC카드구분코드
        expr: KB카드BC카드구분코드
        data_type: VARCHAR
        description: KB카드와 BC카드를 구분하는코드
      - name: 회계계정과목코드
        expr: 회계계정과목코드
        data_type: VARCHAR
        description: 거래 내용을 원장에 기록 계정하기 위해 규정된 거래 내용의 종류
      - name: 특수채권편입전채권관리번호
        expr: 특수채권편입전채권관리번호
        data_type: VARCHAR
        description: 특수채권 편입시 연체채권의 채권관리번호를 의미한다.
      - name: 회원일련번호
        expr: 회원일련번호
        data_type: VARCHAR
        description: 당사(KB국민카드)와 계약한 회원을 관리하는 식별번호
        synonyms: [회원번호, 회원ID]
      - name: 개인기업구분코드
        expr: 개인기업구분코드
        data_type: VARCHAR
        description: 개인 또는 기업을 구분하는 코드
      - name: 채권관리부점코드
        expr: 채권관리부점코드
        data_type: VARCHAR
        description: 연체채권 및 특수채권을 관리하는 부점을 말한다.
      - name: 자산건전성분류구분코드
        expr: 자산건전성분류구분코드
        data_type: VARCHAR
        description: 자산의 건전성을 정상/요주의/고정/회수의문/추정손실 등으로 나누어 관리하는 코드
      - name: 카드론평가상품구분코드
        expr: 카드론평가상품구분코드
        data_type: VARCHAR
        description: 카드론 평가정보반영 대상 상품구분
      - name: 연체채권종류구분코드
        expr: 연체채권종류구분코드
        data_type: VARCHAR
        description: 연채권에 대한 종류(카드특채, 여신특채, 사고채권 등)을 구분하는 코드 체계
      - name: 상품대분류구분코드
        expr: 상품대분류구분코드
        data_type: VARCHAR
        description: KB카드 전사차원에서 상품의 대분류를 구분하여 정의한 코드를 관리한다.
    measures:
      - name: 최초연체회차
        expr: 최초연체회차
        data_type: BIGINT
        description: 최초 연체발생 시점의 연체회차
      - name: 연체회차
        expr: 연체회차
        data_type: BIGINT
        description: 금일 기준의 연체회차를 관리
      - name: 특수채권편입원금
        expr: 특수채권편입원금
        data_type: DECIMAL
        description: 영업점에서 특수채권으로 편입되어진 원금
      - name: 특수채권편입수수료
        expr: 특수채권편입수수료
        data_type: DECIMAL
        description: 특수채권 편입시 연체채권의 수수료를 의미한다.
      - name: 특수채권편입이자
        expr: 특수채권편입이자
        data_type: DECIMAL
        description: 영업점에서 특수채권으로 편입되어진 이자
      - name: 특수채권편입연체료
        expr: 특수채권편입연체료
        data_type: DECIMAL
        description: 영업점에서 특수채권으로 편입되어진 연체료
      - name: 특수채권편입가지급금
        expr: 특수채권편입가지급금
        data_type: DECIMAL
        description: 특수채권 편입시 연체채권의 가지급금를 의미한다.
      - name: 전월말최초연체회차
        expr: 전월말최초연체회차
        data_type: BIGINT
        description: 월말시점의 최초연체회차를 관리
      - name: 일시불편입원금
        expr: 일시불편입원금
        data_type: DECIMAL
        description: 일시불 채권의 대손상각(자산의 손비처리) 후 특수채권으로 편입되는 원금
      - name: 할부편입원금
        expr: 할부편입원금
        data_type: DECIMAL
        description: 할부 채권의 대손상각(자산의 손비처리) 후 특수채권으로 편입되는 원금
      - name: CA편입원금
        expr: CA편입원금
        data_type: DECIMAL
        description: 단기카드대출(현금서비스) 채권의 대손상각(자산의 손비처리) 후 특수채권으로 편입되는 원금
      - name: 리볼빙일시불편입원금
        expr: 리볼빙일시불편입원금
        data_type: DECIMAL
        description: 리볼빙 일시불 채권의 대손상각(자산의 손비처리) 후 특수채권으로 편입되는 원금
      - name: 리볼빙CA편입원금
        expr: 리볼빙CA편입원금
        data_type: DECIMAL
        description: 리볼빙 단기카드대출 채권의 대손상각(자산의 손비처리) 후 특수채권으로 편입되는 원금
    time_dimensions:
      - name: 기준년
        expr: 기준년
        data_type: VARCHAR
        description: 특수채권 편입 내역을 적재하는 작업의 배치 기준년
      - name: 특수채권편입기준년월일
        expr: 특수채권편입기준년월일
        data_type: VARCHAR
        description: 연체채권 상각 후 특수채권 편입된 년월일을 의미한다.
      - name: 최초연체발생년월일
        expr: 최초연체발생년월일
        data_type: VARCHAR
        description: 최초로 연체가 발생한 년월일 관리
      - name: 연체발생년월일
        expr: 연체발생년월일
        data_type: VARCHAR
        description: 연체발생한 년월일 관리
      - name: 회원최초신규발급년월일
        expr: 회원최초신규발급년월일
        data_type: VARCHAR
        description: 회원이 최초로 카드를 신규발급한 년월일
      - name: 전월말최초연체발생년월일
        expr: 전월말최초연체발생년월일
        data_type: VARCHAR
        description: 전월말 시점의 최초연체발생년월일

  - name: tbmewcm94
    physical_table: card_system.tbmewcm94
    korean_name: 대손충당금
    description: "대손충당금 산출 내역을 관리하는 테이블. 한 행은 특정 기준년월의 하나의 충당금 산출 단위를 의미한다. 회원일련번호·상품코드·회계계정과목, 원화대출잔액, 기대 1년 PD율·LGD율, 기대 대손충당금 등을 담아 충당금/대손 리스크 분석(IFRS9 기대신용손실 등)에 사용한다."
    grain: 기준년월 × 충당금식별번호 × 차주구분 1건 (충당금 산출 단위)
    primary_key: [기준년월, 충당금식별번호, 충당금차주구분코드]
    synonyms: [충당금, 대손충당금, 대손, PD, LGD, 기대손실]
    dimensions:
      - name: 충당금식별번호
        expr: 충당금식별번호
        data_type: VARCHAR
        description: 대손충당금개별자산(여신,카드등)을unique하게인식할수있도록동일한구분원칙에의해생성시킨식별자
      - name: 충당금차주구분코드
        expr: 충당금차주구분코드
        data_type: VARCHAR
        description: "충당금익스포져분류에따라차주 01:개인카드 02:기업카드 03:카드론 04:할부금융 05:팩토링개인 06:팩토링기업 07:기타금융자산"
      - name: 회원일련번호
        expr: 회원일련번호
        data_type: VARCHAR
        description: 카드회원일련번호(카드시스템관리.8자리)
        synonyms: [회원번호, 회원ID]
      - name: 충당금채권관리번호
        expr: 충당금채권관리번호
        data_type: VARCHAR
        description: "IFRS대손충당금 산출대상인 대여금 및 수취채권을 식별하고 관리하기위한 번호 (신용카드,할부금융,팩토링,리스,일반여신,KDSB채권,외화사모사채,비원장성 여신,BS계정관리여신,특수채권등의 여신 또는 채권관리번호)"
      - name: 충당금산출계정관리구분코드
        expr: 충당금산출계정관리구분코드
        data_type: VARCHAR
        description: "카드자산에대한충당금산출단위를구분하여관리하는코드(이월/미이월을구분,유이자할부/무이자할부를구분)(ISBI100000000.KB카드할부대급금(유이자할부),ISIF100000000.KB카드할부대급금(무이자할부),ISBI200000000.BC카드할부대급금(유이자할부)등)"
      - name: 회계계정과목코드
        expr: 회계계정과목코드
        data_type: VARCHAR
        description: 회계적인 사건을 기록하기 위해 사전에 회계기준에 의해 정의한 코드를 의미한다 (KB카드계리 및 결산을위한 계정과목코드)
      - name: 상품코드
        expr: 상품코드
        data_type: VARCHAR
        description: "상품대분류+상품중분류+템플릿코드별상품에대해고유하게부여한일련번호이다(상품팩토리의상품코드를관리함) (ex상품대분류코드(2)||상품중분류코드(2)||상품템플릿코드(2)||상품번호(5)"
      - name: 금융회계구분코드
        expr: 금융회계구분코드
        data_type: VARCHAR
        description: "자산의회계처리에따른구분을입/출력하는항목 '0'해당무 '1'일반여신 '2'기타금융자산 '3'당기손익인식금융자산 '4'매도가능금융자산 '5'만기보유금융자산 '6'지분법적용투자주식 '7'파생상품 '8'비금융자산 '9'난외"
      - name: 고객식별자
        expr: 고객식별자
        data_type: VARCHAR
        description: "고객에게부여되는중복되지않는고객의식별자이다.구성:고객유형구분(1)+일련번호(8)+체크디지트(1)고객유형구분:0~6개인,7~8기업,9예비"
        synonyms: [고객ID, 고객번호]
      - name: 개인기업구분코드
        expr: 개인기업구분코드
        data_type: VARCHAR
        description: 카드자산의개인또는기업을구분하는코드 0해당무 1개인 2기업 3공용
      - name: 유효회원구분코드
        expr: 유효회원구분코드
        data_type: VARCHAR
        description: 해당회원의무효,유효회원구분0무효1유효
    measures:
      - name: 원화대출잔액
        expr: 원화대출잔액
        data_type: DECIMAL
        description: 해당익스포져의원화대출잔액
      - name: 기대1년PD율
        expr: 기대1년PD율
        data_type: DECIMAL
        description: (대손충당금산출보정월명세기본) 1년 경험 PD적용값
      - name: 충당금기대LGD율
        expr: 충당금기대LGD율
        data_type: DECIMAL
        description: (대손충당금산출보정월명세기본) 경험LGD적용값
      - name: 기대대손충당금
        expr: 기대대손충당금
        data_type: DECIMAL
        description: 충당금평가방법(개별/집합)에따라서B/S에적용할해당계좌의최종기대대손충당금액
    time_dimensions:
      - name: 기준년월
        expr: 기준년월
        data_type: VARCHAR
        description: 해당 데이터의 기준년월로 결정 및 판단의 기준이 되는 년월
        synonyms: [년월, 월, 기준월]
      - name: 대출신규년월일
        expr: 대출신규년월일
        data_type: VARCHAR
        description: 대출 계약이 발생한 신규년월일 값 (yyyymmdd)
      - name: 대출만기년월일
        expr: 대출만기년월일
        data_type: VARCHAR
        description: 대출계좌의만기일자를관리한다

  - name: tddaa3d01
    physical_table: card_system.tddaa3d01
    korean_name: 카드일별기본
    description: "카드 기본 정보의 일자별 스냅샷 테이블. 한 행은 특정 기준년월일에 관측된 하나의 카드를 의미한다. tbdaaat05(회원카드기본)과 유사한 카드 속성을 일자 시점으로 보관해, 특정 일자 시점의 카드 보유/상태 분석에 사용한다."
    grain: 기준년월일 × 회원일련번호 × 카드구분키번호 1건 (카드 일별 스냅샷)
    primary_key: [기준년월일, 회원일련번호, 카드구분키번호]
    synonyms: [카드일별, 카드스냅샷, 일별카드]
    dimensions:
      - name: 회원일련번호
        expr: 회원일련번호
        data_type: VARCHAR
        description: 당사(KB국민카드)와 계약한 회원을 관리하는 식별번호
        synonyms: [회원번호, 회원ID]
      - name: 카드구분키번호
        expr: 카드구분키번호
        data_type: VARCHAR
        description: 회원별로 부여되는 일련번호에 카드상품 또는 계약별로 추가되는 일련번호이다. / 기본적으로 카드브랜드구분코드 + 일련번호로 구성된다.
      - name: 개인기업구분코드
        expr: 개인기업구분코드
        data_type: VARCHAR
        description: 개인 또는 기업을 구분하는 코드
      - name: 카드소유자구분코드
        expr: 카드소유자구분코드
        data_type: VARCHAR
        description: 카드 소유자 유형 (본인/가족/대표/공용/개별)
      - name: 본인카드구분키번호
        expr: 본인카드구분키번호
        data_type: VARCHAR
        description: 가족 또는 사업자/사업장카드일 경우 본인 또는 대표에 해당하는 카드구분키번호이다.
      - name: 소유자고객식별자
        expr: 소유자고객식별자
        data_type: VARCHAR
        description: 소유자고객식별자를관리한다.
      - name: 소유자고객관리번호
        expr: 소유자고객관리번호
        data_type: VARCHAR
        description: 소유자고객관리번호를관리한다.
      - name: 본인고객식별자
        expr: 본인고객식별자
        data_type: VARCHAR
        description: 고객자신에 대한 식별자
      - name: 본인고객관리번호
        expr: 본인고객관리번호
        data_type: VARCHAR
        description: 카드에 해당하는 소유자에 따른 본인고객관리번호이다.
      - name: 최종카드식별자
        expr: 최종카드식별자
        data_type: VARCHAR
        description: 카드상품에 해당하는 카드 중 재발급, 갱신시 최종카드를 나타내는 식별자이다.
      - name: 최종카드상세일련번호
        expr: 최종카드상세일련번호
        data_type: DECIMAL
        description: 연회비환급삭제의 기준이 되는 최종 발급 카드번호의 상세일련번호
      - name: 상품코드
        expr: 상품코드
        data_type: VARCHAR
        description: 상품대분류+상품중분류+템플릿코드별 상품에 대해 고유하게 부여한 일련번호이다
      - name: 상품대분류구분코드
        expr: 상품대분류구분코드
        data_type: VARCHAR
        description: KB카드 전사차원에서 상품의 대분류를 구분하여 정의한 코드를 관리한다.
      - name: 상품중분류구분코드
        expr: 상품중분류구분코드
        data_type: VARCHAR
        description: KB카드 전사차원에서 상품의 대분류 하위 중분류를 구분하여 정의한 코드를 관리한다.
      - name: 카드등급그룹코드
        expr: 카드등급그룹코드
        data_type: VARCHAR
        description: KB카드사의 카드상품 등급에 대한 분류의 그룹핑 코드
      - name: 제휴코드
        expr: 제휴코드
        data_type: VARCHAR
        description: 상품코드의 마지막 5자리로 정의, 상품코드를 그대로 사용함으로 별도 목록성 테이블은 관리하지 않고, 코드로 표기하고자 함
      - name: 카드브랜드구분코드
        expr: 카드브랜드구분코드
        data_type: VARCHAR
        description: "카드브랜드구분코드 1:로칼(국민) 2:마스터 3:비자 4:JCB"
      - name: KB카드BC카드구분코드
        expr: KB카드BC카드구분코드
        data_type: VARCHAR
        description: KB카드와 BC카드를 구분하는코드
      - name: 카드등급구분코드
        expr: 카드등급구분코드
        data_type: VARCHAR
        description: 카드의 등급을 구분하는코드(일반,실버,골드,플래티늄 등)
      - name: 알파원카드여부
        expr: 알파원카드여부
        data_type: VARCHAR
        description: 알파원카드로 등록된 카드인지에 대한 여부
      - name: 카드BIN번호
        expr: 카드BIN번호
        data_type: VARCHAR
        description: 카드의 발급사를 구분하는 BIN 번호이다.
      - name: 구카드식별자
        expr: 구카드식별자
        data_type: VARCHAR
        description: 이전 카드에 해당하는 카드식별지이다.
      - name: 유효신용카드여부
        expr: 유효신용카드여부
        data_type: VARCHAR
        description: 카드가 만료년월일이 경과하지 않고 통합한도가 존재하는 유효한 신용카드인지여부
      - name: 유효체크카드여부
        expr: 유효체크카드여부
        data_type: VARCHAR
        description: 체크카드가 만료년월일이 경과하지 않은 유효한 체크카드인지여부
      - name: 결제정보이원화구분코드
        expr: 결제정보이원화구분코드
        data_type: VARCHAR
        description: 카드 결제단위 청구방식이 통합 및 이원화하고 있는지를 구분하는 코드 (KB카드/KB비씨카드,신용카드/체크카드,일반카드/특정카드)
      - name: 카드결제기관구분코드
        expr: 카드결제기관구분코드
        data_type: VARCHAR
        description: 카드결제계좌의 기관구분코드
      - name: 청구번호
        expr: 청구번호
        data_type: VARCHAR
        description: 회원일련번호+청구일련번호
      - name: 지로코드
        expr: 지로코드
        data_type: VARCHAR
        description: 금융결제원에서 대한민국에 소재하는 금융기관의 각 본지점에 부여하는 번호
      - name: 회수방법구분코드
        expr: 회수방법구분코드
        data_type: VARCHAR
        description: 결제 대금 회수방법구분코드
      - name: 청구지주소구분코드
        expr: 청구지주소구분코드
        data_type: VARCHAR
        description: 자택, 직장,이메일 등 청구지 주소를 구분하는 코드
      - name: 카드이용한도구분코드
        expr: 카드이용한도구분코드
        data_type: VARCHAR
        description: 카드별 이용한도를 구분하는 코드
      - name: 카드당한도사용여부
        expr: 카드당한도사용여부
        data_type: VARCHAR
        description: 카드에 해당하는 한도를 카드당 한도를 사용할지에 대한 여부
      - name: 부서사업장한도사용여부
        expr: 부서사업장한도사용여부
        data_type: VARCHAR
        description: 카드에 해당하는 한도를 부서사업장한도를 사용할지에 대한 여부
      - name: 통합한도등급코드
        expr: 통합한도등급코드
        data_type: VARCHAR
        description: 현금서비스를 포함하여 부여한 총 한도등급코드
      - name: CA한도등급코드
        expr: CA한도등급코드
        data_type: VARCHAR
        description: 단기카드대출(현금서비스)을 받을 수 있는 한도의 등급코드
      - name: 역할유형구분코드
        expr: 역할유형구분코드
        data_type: VARCHAR
        description: 권유자 역할 유형 코드 (배우자/직원/알바/..)
      - name: 권유자번호
        expr: 권유자번호
        data_type: VARCHAR
        description: "회원가입신청서 작성시 권유 모집인 식별을 위해 사용하는 번호 역할구분과 모집인번호가 조합 권유자식별자 -모집인구분(역할유형구분코드) +모집인번호(모집인식별내용(M) + 모집인코드)"
      - name: 모집부점코드
        expr: 모집부점코드
        data_type: VARCHAR
        description: 신용카드, 가맹점, 자동납부 신청을 모집한 부점코드
      - name: 입력부점코드
        expr: 입력부점코드
        data_type: VARCHAR
        description: 입력을 발생 시킨 부점코드
      - name: 관리부점코드
        expr: 관리부점코드
        data_type: VARCHAR
        description: 고객이나 채권,가맹점 등을 관리하는 부점코드
      - name: 리볼빙대상여부
        expr: 리볼빙대상여부
        data_type: VARCHAR
        description: 회원 카드상품별 리볼빙 대상인지를 판단하는 여부이다.
      - name: 교체카드여부
        expr: 교체카드여부
        data_type: VARCHAR
        description: 카드 만료일이 되어서 갱신된 경우와 분실/도난으로 카드를 교체한 여부이다.
      - name: 카드등급변경여부
        expr: 카드등급변경여부
        data_type: VARCHAR
        description: 카드 재발급 또는 갱신시 카드등급을 변경하여 받은 여부이다.
      - name: 갱신카드여부
        expr: 갱신카드여부
        data_type: VARCHAR
        description: 카드 만료일에 갱신발급 받은 여부이다.
      - name: 카드우선발급여부
        expr: 카드우선발급여부
        data_type: VARCHAR
        description: 카드 제작시 우선(긴급) 발급을 하기 위한 여부이다.
      - name: 모바일카드여부
        expr: 모바일카드여부
        data_type: VARCHAR
        description: 카드상품이 모바일카드인지를 판단하는 여부이다.
      - name: 자동갱신비대상사유구분코드
        expr: 자동갱신비대상사유구분코드
        data_type: VARCHAR
        description: 카드 자동갱신 대상에서 제외된 사유를 구분하는 코드
      - name: 카드정보변경유형일련번호
        expr: 카드정보변경유형일련번호
        data_type: VARCHAR
        description: "카드의 정보변경 내용을 구분하는 카드처리유형구분코드(발급비청구, 비밀번호변경, 사용등록, 카드해지 등)중 카드해지에 대한 상세사유이다. (03:연회비관련 불만,04:당행카드2개이상소지,11:거래정지관련 불만 등등)"
      - name: BC카드관리구분코드
        expr: BC카드관리구분코드
        data_type: VARCHAR
        description: 동남카드/비씨카드 를 구분하는 코드
      - name: 제휴관리번호
        expr: 제휴관리번호
        data_type: VARCHAR
        description: 제휴사에서 관리를 원할하게 하기 위해 고객에게 제공한 관리번호이다.(아시아나항공, GS번호, 대한항공, ABC번호 등...)
      - name: 신청서접수번호
        expr: 신청서접수번호
        data_type: VARCHAR
        description: "카드(개인,기업),한도(개인,기업),가맹점,장기카드대출 신청서 접수단위로 부여되는 번호 / 각 업무별 용어사용 예시 -카드신청서접수번호 -한도신청서접수번호 -가맹점신청서접수번호 -카드론신청서접수번호"
      - name: 신청서접수대상여부
        expr: 신청서접수대상여부
        data_type: VARCHAR
        description: 카드신청시 신청서로 들어온 대상인지를 판단하는 여부이다.
      - name: 카드신청서이미지저장여부
        expr: 카드신청서이미지저장여부
        data_type: VARCHAR
        description: 카드신청서를 이미지로 저장되어 있는지 여부
      - name: 카드거래매체구분코드
        expr: 카드거래매체구분코드
        data_type: VARCHAR
        description: 거래 매체별 종류
      - name: 교부유형구분코드
        expr: 교부유형구분코드
        data_type: VARCHAR
        description: 카드 교부방법 종류 (인편/우편/지점방문/등등)
      - name: 발급유형구분시기구분코드
        expr: 발급유형구분시기구분코드
        data_type: VARCHAR
        description: 카드가 발급된 유형및 시기를 분류한 구분코드(선발급,즉시발급,일괄발급 등)
      - name: 발급유형구분코드
        expr: 발급유형구분코드
        data_type: VARCHAR
        description: 카드의 발급유형을 구분하는 코드(신규발급,재발급 등)
      - name: 카드도난분실발급여부
        expr: 카드도난분실발급여부
        data_type: VARCHAR
        description: 카드를 도난 분실시 거래정지를 등록하고 재발급 받은 여부이다.
      - name: 유선발급구분코드
        expr: 유선발급구분코드
        data_type: VARCHAR
        description: 카드 유선 발급 구분 (임시/재발급/교체..)
      - name: 발송기관구분코드
        expr: 발송기관구분코드
        data_type: VARCHAR
        description: 회원에게 카드를 발송해주는 기관구분코드
      - name: 수령지주소구분코드
        expr: 수령지주소구분코드
        data_type: VARCHAR
        description: 자택, 직장, 제3청구지 등 카드 수령시 수령지 주소를 구분하는 코드
      - name: 카드교부희망부점코드
        expr: 카드교부희망부점코드
        data_type: VARCHAR
        description: 카드 교부시 고객이 희망(요청)하는 부점코드
      - name: 카드실물보유부점코드
        expr: 카드실물보유부점코드
        data_type: VARCHAR
        description: 카드를 실물 부유하고 있는 영업점부점코드이다.
      - name: 실물보유구분코드
        expr: 실물보유구분코드
        data_type: VARCHAR
        description: 실물 카드 보유/미보유 구분
      - name: CD기기능구분코드
        expr: CD기기능구분코드
        data_type: VARCHAR
        description: CD기능 연결 계좌를 구분하는 코드 (결제계좌/별도계좌)
      - name: CD상태구분코드
        expr: CD상태구분코드
        data_type: VARCHAR
        description: CD기능 등록/해지 상태 구분코드
      - name: 카드신용체크이원화구분코드
        expr: 카드신용체크이원화구분코드
        data_type: VARCHAR
        description: 카드의 결제단위가 신용카드/체크카드이원화 인지 통합인지 구분하는코드
      - name: 카드일반특정이원화구분코드
        expr: 카드일반특정이원화구분코드
        data_type: VARCHAR
        description: 카드의 결제단위가 일반카드/특정카드이원화 인지 통합인지 구분하는 코드 이다.
      - name: 결제다원화카드여부
        expr: 결제다원화카드여부
        data_type: VARCHAR
        description: 결제계좌 다원화를 이용하는 회원에 대한 카드 여부를 나타낸다.
      - name: 고객선택자재구분코드
        expr: 고객선택자재구분코드
        data_type: VARCHAR
        description: 카드를 신청시 고객이 선택한 상품의 제휴코드이다. (자재구분코드)
      - name: 비계좌선불카드여부
        expr: 비계좌선불카드여부
        data_type: VARCHAR
        description: 비계좌 선불카드 여부 인지를 나타낸다. ※ 선불전자지급수단을 충전계정(결제계좌)으로 하는 선불카드 (은행의 리브포켓, 당사의 머니 등)
      - name: 유효비계좌선불카드여부
        expr: 유효비계좌선불카드여부
        data_type: VARCHAR
        description: 유효한 비계좌 선불카드인지를 나타난다.
    measures:
      - name: 기업카드신용한도금액
        expr: 기업카드신용한도금액
        data_type: DECIMAL
        description: 기업(법인, 사업자, 사업장)카드의 카드별로 부여된 신용한도 금액을 의미한다.
      - name: 카드반송회차
        expr: 카드반송회차
        data_type: BIGINT
        description: 카드를 발송하고 다양한 사유에 의해 반송된 회차이다.
    time_dimensions:
      - name: 기준년월일
        expr: 기준년월일
        data_type: VARCHAR
        description: 카드정보 데이터를 매일 시점의 스냅샷 데이터를 생성하기 위해 사용하는 일자 정보로 해당 기준년월일의 카드정보기본 데이터를 적재한다.
        synonyms: [기준일, 일자, 날짜]
      - name: 결제일
        expr: 결제일
        data_type: VARCHAR
        description: 회원이 사용한 카드대금이 매월 결제되는 일
      - name: 카드신규발급년월일
        expr: 카드신규발급년월일
        data_type: VARCHAR
        description: 카드가 신규로 발급된 일자이다.
      - name: 최종카드발급년월일
        expr: 최종카드발급년월일
        data_type: VARCHAR
        description: 상품에 해당하는 카드가 최종 카드발급 접수된 일자이다.
      - name: 등록년월일
        expr: 등록년월일
        data_type: VARCHAR
        description: 해당테이블에 데이터가 등록된 년월일
      - name: 카드만료년월일
        expr: 카드만료년월일
        data_type: VARCHAR
        description: 카드 유효기간의 종료일
      - name: 이전카드만료년월일
        expr: 이전카드만료년월일
        data_type: VARCHAR
        description: 카드가 해지및 갱신으로인해 만료년월이 변경될경우 변경되기 이전의 만료년월일을 말함
      - name: 실제카드만료년월일
        expr: 실제카드만료년월일
        data_type: VARCHAR
        description: 카드가 실제만료(만료년월이 적용 되었거나 해지년월이 적용)되는 최종년월일
      - name: 해지년월일
        expr: 해지년월일
        data_type: VARCHAR
        description: 회원의 카드가 해지된 년월일
      - name: 신청서접수년월일
        expr: 신청서접수년월일
        data_type: VARCHAR
        description: 카드신청 또는 카드한도의 신청서 정보를 접수 처리(온라인,배치)한 일자
      - name: 카드교부년월일
        expr: 카드교부년월일
        data_type: VARCHAR
        description: 해당카드를 발급받고 영업점에서 교부한 일자이다.
      - name: 카드반송년월일
        expr: 카드반송년월일
        data_type: VARCHAR
        description: 고객이 카드 실물을 반송한 일자이다.

  - name: tddaa3e21
    physical_table: card_system.tddaa3e21
    korean_name: 모집최초회원카드일별
    description: "최초 모집 회원(신규 모집 카드)에 대한 일자별 정보를 적재하는 테이블. 한 행은 특정 일자에 최초회원으로 분류된 카드를 의미한다. 카드 발급/만료 년월일, 카드등급·브랜드·BIN 등을 담아 신규 모집·신규 발급 분석에 사용한다."
    grain: 기준년월일 × 최종카드발급년월일 × 회원 × 카드 1건
    primary_key: [기준년월일, 최종카드발급년월일, 회원일련번호, 카드구분키번호]
    synonyms: [신규모집, 최초모집, 모집회원, 신규발급카드]
    dimensions:
      - name: 회원일련번호
        expr: 회원일련번호
        data_type: VARCHAR
        description: 당사(KB국민카드)와 계약한 회원을 관리하는 식별번호
        synonyms: [회원번호, 회원ID]
      - name: 카드구분키번호
        expr: 카드구분키번호
        data_type: VARCHAR
        description: 회원별로 부여되는 일련번호에 카드상품 또는 계약별로 추가되는 일련번호이다. / 기본적으로 카드브랜드구분코드 + 일련번호로 구성된다.
      - name: 본인카드구분키번호
        expr: 본인카드구분키번호
        data_type: VARCHAR
        description: 가족 또는 사업자/사업장카드일 경우 본인 또는 대표에 해당하는 카드구분키번호이다.
      - name: 소유자고객식별자
        expr: 소유자고객식별자
        data_type: VARCHAR
        description: 소유자고객식별자를관리한다.
      - name: 소유자고객관리번호
        expr: 소유자고객관리번호
        data_type: VARCHAR
        description: 소유자고객관리번호를관리한다.
      - name: 본인고객식별자
        expr: 본인고객식별자
        data_type: VARCHAR
        description: 고객자신에 대한 식별자
      - name: 본인고객관리번호
        expr: 본인고객관리번호
        data_type: VARCHAR
        description: 카드에 해당하는 소유자에 따른 본인고객관리번호이다.
      - name: 개인기업구분코드
        expr: 개인기업구분코드
        data_type: VARCHAR
        description: 개인 또는 기업을 구분하는 코드
      - name: 카드소유자구분코드
        expr: 카드소유자구분코드
        data_type: VARCHAR
        description: 카드 소유자 유형 (본인/가족/대표/공용/개별)
      - name: 카드식별자
        expr: 카드식별자
        data_type: VARCHAR
        description: KB카드에서 발급하는 카드의 카드번호를 대체하여 식별하기 위한 중복되지 않는 값
      - name: 카드BIN번호
        expr: 카드BIN번호
        data_type: VARCHAR
        description: 카드의 발급사를 구분하는 BIN 번호이다.
      - name: 카드브랜드구분코드
        expr: 카드브랜드구분코드
        data_type: VARCHAR
        description: "카드브랜드구분코드 1:로칼(국민) 2:마스터 3:비자 4:JCB"
      - name: 카드등급구분코드
        expr: 카드등급구분코드
        data_type: VARCHAR
        description: 카드의 등급을 구분하는 코드로 일반/실버/골드/플래티늄등으로 카드를 구분하는 코드
      - name: 모집카드등급구분코드
        expr: 모집카드등급구분코드
        data_type: VARCHAR
        description: 모집이 이루어진 카드의 등급을 구분하는 코드
      - name: 상품코드
        expr: 상품코드
        data_type: VARCHAR
        description: 상품대분류+상품중분류+템플릿코드별 상품에 대해 고유하게 부여한 일련번호이다
      - name: 상품대분류구분코드
        expr: 상품대분류구분코드
        data_type: VARCHAR
        description: KB카드 전사차원에서 상품의 대분류를 구분하여 정의한 코드를 관리한다.
      - name: 상품중분류구분코드
        expr: 상품중분류구분코드
        data_type: VARCHAR
        description: KB카드 전사차원에서 상품의 대분류 하위 중분류를 구분하여 정의한 코드를 관리한다.
      - name: 카드등급그룹코드
        expr: 카드등급그룹코드
        data_type: VARCHAR
        description: KB카드사의 카드상품 등급에 대한 분류의 그룹핑 코드
      - name: 제휴코드
        expr: 제휴코드
        data_type: VARCHAR
        description: 상품코드의 마지막 5자리로 정의,상품코드를 그대로 사용함으로 별도 목록성 테이블은 관리하지 않고 코드로 표기하고자 함
      - name: 관리부점코드
        expr: 관리부점코드
        data_type: VARCHAR
        description: 고객이나 채권,가맹점 등을 관리하는 부점코드
      - name: 최초모집카드여부
        expr: 최초모집카드여부
        data_type: VARCHAR
        description: 개인과 기업의 카드 중 최초로 모집된 카드
      - name: 유효신용카드여부
        expr: 유효신용카드여부
        data_type: VARCHAR
        description: 카드가 만료년월일이 경과하지 않고 통합한도가 존재하는 유효한 신용카드인지여부
      - name: 발급유형구분코드
        expr: 발급유형구분코드
        data_type: VARCHAR
        description: 카드가 발급되는 경우 신규/재발급/자동갱신으로 발급유형을 구분하는 코드
      - name: 도난분실발급여부
        expr: 도난분실발급여부
        data_type: VARCHAR
        description: 모집카드의 도난분실발급여부
      - name: 교체카드여부
        expr: 교체카드여부
        data_type: VARCHAR
        description: 카드 만료일이 되어서 갱신된 경우와 분실/도난으로 카드를 교체한 여부이다.
      - name: 카드등급변경여부
        expr: 카드등급변경여부
        data_type: VARCHAR
        description: 카드 재발급 또는 갱신시 카드등급을 변경하여 받은 여부이다.
      - name: 갱신카드여부
        expr: 갱신카드여부
        data_type: VARCHAR
        description: 카드 만료일에 갱신발급 받은 여부이다.
      - name: 입력부점코드
        expr: 입력부점코드
        data_type: VARCHAR
        description: 입력을 발생 시킨 부점코드
      - name: 역할유형구분코드
        expr: 역할유형구분코드
        data_type: VARCHAR
        description: 권유자 역할 유형 코드 (배우자/직원/알바/..)
      - name: 권유자번호
        expr: 권유자번호
        data_type: VARCHAR
        description: "회원가입신청서 작성시 권유 모집인 식별을 위해 사용하는 번호 역할구분과 모집인번호가 조합 권유자식별자 -모집인구분(역할유형구분코드) +모집인번호(모집인식별내용(M) + 모집인코드)"
      - name: 청구지주소구분코드
        expr: 청구지주소구분코드
        data_type: VARCHAR
        description: 자택, 직장, 제3청구지 등 청구지 주소를 구분하는 코드
      - name: 카드청구지우편번호
        expr: 카드청구지우편번호
        data_type: VARCHAR
        description: 카드 청구지 주소의 우편번호 이다.
      - name: 모집부점코드
        expr: 모집부점코드
        data_type: VARCHAR
        description: 신용카드, 가맹점, 자동납부 신청을 모집한 부점코드
      - name: 회원자격코드
        expr: 회원자격코드
        data_type: VARCHAR
        description: 통합코드의 회원자격코드
      - name: 카드결제기관구분코드
        expr: 카드결제기관구분코드
        data_type: VARCHAR
        description: 카드결제계좌의 기관구분코드
      - name: 직업구분코드
        expr: 직업구분코드
        data_type: VARCHAR
        description: 고객의 직업을 구분하는 직업구분코드
      - name: 모집인소속부점코드
        expr: 모집인소속부점코드
        data_type: VARCHAR
        description: 카드모집인의 소속 부점코드이다.
      - name: 회원거래정지여부
        expr: 회원거래정지여부
        data_type: VARCHAR
        description: 거래정지 범위구분 중 회원제재여부
      - name: 카드거래정지여부
        expr: 카드거래정지여부
        data_type: VARCHAR
        description: 거래정지 범위구분 중 카드 제재여부를 관리
      - name: 최초모집회원여부
        expr: 최초모집회원여부
        data_type: VARCHAR
        description: 개인과 기업 중 기존에 발급받은 카드가 없이 최초로 카드가 발급된 회원이지를 관리하는 여부컬럼
      - name: 업체가맹점구분코드
        expr: 업체가맹점구분코드
        data_type: VARCHAR
        description: "회원일련번호의 개인기업구분코드가 '2'(기업) 인 경우 해당 회원이 업체인지 가맹점인지 구분하는 코드"
      - name: 통합BSS한도등급
        expr: 통합BSS한도등급
        data_type: VARCHAR
        description: 고객의 연체정보,사용실적,외부평가정보등 통합적인 정보를 활용하여 산출한 BSS(Behavior Score System)한도등급
      - name: 해지후3개월내신규발급여부
        expr: 해지후3개월내신규발급여부
        data_type: VARCHAR
        description: 해지 후 3개월 이내에 신규발급인지를 구분한다.
      - name: 카드청구지도로명우편번호
        expr: 카드청구지도로명우편번호
        data_type: VARCHAR
        description: 카드 청구지 주소의 도로명우편번호 이다.
      - name: 카드청구지우편일련번호
        expr: 카드청구지우편일련번호
        data_type: DECIMAL
        description: 카드 청구지 주소의 우편일련번호 이다.
      - name: 카드청구지도로명우편읍면번호
        expr: 카드청구지도로명우편읍면번호
        data_type: VARCHAR
        description: 카드 청구지 도로명 주소의 우편읍면번호 이다.
      - name: 카드청구지도로명우편보조번호
        expr: 카드청구지도로명우편보조번호
        data_type: VARCHAR
        description: 카드 청구지 도로명 주소의 우편보조번호 이다.
      - name: 카드청구지도로명구역번호
        expr: 카드청구지도로명구역번호
        data_type: VARCHAR
        description: 카드 청구지 도로명 주소의 구역번호 이다.
      - name: 카드청구지주소표시구분코드
        expr: 카드청구지주소표시구분코드
        data_type: VARCHAR
        description: 카드 청구지의 주소표시구분을 정의한다.(도로명주소, 일반주소)
    measures:
      - name: 고객한도신청평점
        expr: 고객한도신청평점
        data_type: BIGINT
        description: "일정기간 고객의 상품별 이용금액을 기준으로 점수를 산정하고 점수에 상응하는 이용한도등급을 부여하는데 이때 점수유형이 \"신청평점\"인 경우의 고객한도평점"
      - name: 통합ASS평점
        expr: 통합ASS평점
        data_type: BIGINT
        description: 고객의 신용도를 통합적으로 평가한 ASS(Application scoring system)평점
      - name: 통합BSS평점
        expr: 통합BSS평점
        data_type: BIGINT
        description: 고객의 연체정보,사용실적,외부평가정보등 통합적인 정보를 활용하여 산출한 BSS(Behavior Score System)평점
    time_dimensions:
      - name: 기준년월일
        expr: 기준년월일
        data_type: VARCHAR
        description: "모집최초회원에 대한 정보를 해당 일자별로 적재하기 위한 기준이 되는 일자 정보로 해당 일자에 최초회원으로 분류된 데이터를 적재하는 일자 정보를 관리한다."
        synonyms: [기준일, 일자, 날짜]
      - name: 최종카드발급년월일
        expr: 최종카드발급년월일
        data_type: VARCHAR
        description: 상품에 해당하는 카드가 최종 카드발급 접수된 일자이다.
      - name: 카드만료년월일
        expr: 카드만료년월일
        data_type: VARCHAR
        description: 카드 유효기간의 종료일
      - name: 이전카드만료년월일
        expr: 이전카드만료년월일
        data_type: VARCHAR
        description: 카드가 해지및 갱신으로인해 만료년월이 변경될경우 변경되기 이전의 만료년월일을 말함
      - name: 실제카드만료년월일
        expr: 실제카드만료년월일
        data_type: VARCHAR
        description: 카드가 실제만료(만료년월이 적용 되었거나 해지년월이 적용)되는 최종년월일
      - name: 신규년월일
        expr: 신규년월일
        data_type: VARCHAR
        description: 신규된 일자의 년월일을 관리한다.
      - name: 해지년월일
        expr: 해지년월일
        data_type: VARCHAR
        description: 회원이 카드를 해지한 일자
      - name: 신청서접수년월일
        expr: 신청서접수년월일
        data_type: VARCHAR
        description: 카드신청 또는 카드한도의 신청서 정보를 접수 처리(온라인,배치)한 일자
      - name: 유류구매카드발급년월일
        expr: 유류구매카드발급년월일
        data_type: VARCHAR
        description: 유류구매카드를 발급한 년월일을 관리한다.

  - name: tddaa3e23
    physical_table: card_system.tddaa3e23
    korean_name: 기존회원카드일별
    description: "최초모집카드가 아닌(기존 회원) 카드에 대한 일자별 정보를 적재하는 테이블. 한 행은 특정 일자의 기존 발급 카드를 의미한다. tddaa3e21과 대응되는 기존회원 카드 정보로, 신규 대비 기존 카드 분석에 사용한다."
    grain: 기준년월일 × 최종카드발급년월일 × 회원 × 카드 1건
    primary_key: [기준년월일, 최종카드발급년월일, 회원일련번호, 카드구분키번호]
    synonyms: [기존회원, 기존카드, 비모집카드]
    dimensions:
      - name: 회원일련번호
        expr: 회원일련번호
        data_type: VARCHAR
        description: 당사(KB국민카드)와 계약한 회원을 관리하는 식별번호
        synonyms: [회원번호, 회원ID]
      - name: 카드구분키번호
        expr: 카드구분키번호
        data_type: VARCHAR
        description: 회원별로 부여되는 일련번호에 카드상품 또는 계약별로 추가되는 일련번호이다. / 기본적으로 카드브랜드구분코드 + 일련번호로 구성된다.
      - name: 본인카드구분키번호
        expr: 본인카드구분키번호
        data_type: VARCHAR
        description: 가족 또는 사업자/사업장카드일 경우 본인 또는 대표에 해당하는 카드구분키번호이다.
      - name: 소유자고객식별자
        expr: 소유자고객식별자
        data_type: VARCHAR
        description: 소유자고객식별자를관리한다.
      - name: 소유자고객관리번호
        expr: 소유자고객관리번호
        data_type: VARCHAR
        description: 소유자고객관리번호를관리한다.
      - name: 본인고객식별자
        expr: 본인고객식별자
        data_type: VARCHAR
        description: 고객자신에 대한 식별자
      - name: 본인고객관리번호
        expr: 본인고객관리번호
        data_type: VARCHAR
        description: 카드에 해당하는 소유자에 따른 본인고객관리번호이다.
      - name: 개인기업구분코드
        expr: 개인기업구분코드
        data_type: VARCHAR
        description: 개인 또는 기업을 구분하는 코드
      - name: 카드소유자구분코드
        expr: 카드소유자구분코드
        data_type: VARCHAR
        description: 카드 소유자 유형 (본인/가족/대표/공용/개별)
      - name: 카드식별자
        expr: 카드식별자
        data_type: VARCHAR
        description: 카드상품에 해당하는 카드 중 재발급, 갱신시 최종카드를 나타내는 식별자이다.
      - name: 카드BIN번호
        expr: 카드BIN번호
        data_type: VARCHAR
        description: 카드의 발급사를 구분하는 BIN 번호이다.
      - name: 카드브랜드구분코드
        expr: 카드브랜드구분코드
        data_type: VARCHAR
        description: "카드브랜드구분코드 1:로칼(국민) 2:마스터 3:비자 4:JCB"
      - name: 카드등급구분코드
        expr: 카드등급구분코드
        data_type: VARCHAR
        description: 카드의 등급을 구분하는 코드로 일반/실버/골드/플래티늄등으로 카드를 구분하는 코드
      - name: 모집카드등급구분코드
        expr: 모집카드등급구분코드
        data_type: VARCHAR
        description: 모집이 이루어진 카드의 등급을 구분하는 코드
      - name: 상품코드
        expr: 상품코드
        data_type: VARCHAR
        description: 상품대분류+상품중분류+템플릿코드별 상품에 대해 고유하게 부여한 일련번호이다
      - name: 상품대분류구분코드
        expr: 상품대분류구분코드
        data_type: VARCHAR
        description: KB카드 전사차원에서 상품의 대분류를 구분하여 정의한 코드를 관리한다.
      - name: 상품중분류구분코드
        expr: 상품중분류구분코드
        data_type: VARCHAR
        description: KB카드 전사차원에서 상품의 대분류 하위 중분류를 구분하여 정의한 코드를 관리한다.
      - name: 카드등급그룹코드
        expr: 카드등급그룹코드
        data_type: VARCHAR
        description: KB카드사의 카드상품 등급에 대한 분류의 그룹핑 코드
      - name: 제휴코드
        expr: 제휴코드
        data_type: VARCHAR
        description: 상품코드의 마지막 5자리로 정의,상품코드를 그대로 사용함으로 별도 목록성 테이블은 관리하지 않고 코드로 표기하고자 함
      - name: 관리부점코드
        expr: 관리부점코드
        data_type: VARCHAR
        description: 고객이나 채권,가맹점 등을 관리하는 부점코드
      - name: 최초모집카드여부
        expr: 최초모집카드여부
        data_type: VARCHAR
        description: 개인과 기업의 카드 중 최초로 모집된 카드
      - name: 유효신용카드여부
        expr: 유효신용카드여부
        data_type: VARCHAR
        description: 카드가 만료년월일이 경과하지 않고 통합한도가 존재하는 유효한 신용카드인지여부
      - name: 발급유형구분코드
        expr: 발급유형구분코드
        data_type: VARCHAR
        description: 카드가 발급되는 경우 신규/재발급/자동갱신으로 발급유형을 구분하는 코드
      - name: 도난분실발급여부
        expr: 도난분실발급여부
        data_type: VARCHAR
        description: 모집카드의 도난분실발급여부
      - name: 교체카드여부
        expr: 교체카드여부
        data_type: VARCHAR
        description: 카드 만료일이 되어서 갱신된 경우와 분실/도난으로 카드를 교체한 여부이다.
      - name: 카드등급변경여부
        expr: 카드등급변경여부
        data_type: VARCHAR
        description: 카드 재발급 또는 갱신시 카드등급을 변경하여 받은 여부이다.
      - name: 갱신카드여부
        expr: 갱신카드여부
        data_type: VARCHAR
        description: 카드 만료일에 갱신발급 받은 여부이다.
      - name: 입력부점코드
        expr: 입력부점코드
        data_type: VARCHAR
        description: 입력을 발생 시킨 부점코드
      - name: 역할유형구분코드
        expr: 역할유형구분코드
        data_type: VARCHAR
        description: 권유자 역할 유형 코드 (배우자/직원/알바/..)
      - name: 권유자번호
        expr: 권유자번호
        data_type: VARCHAR
        description: "회원가입신청서 작성시 권유 모집인 식별을 위해 사용하는 번호 역할구분과 모집인번호가 조합 권유자식별자 -모집인구분(역할유형구분코드) +모집인번호(모집인식별내용(M) + 모집인코드)"
      - name: 청구지주소구분코드
        expr: 청구지주소구분코드
        data_type: VARCHAR
        description: 자택, 직장, 제3청구지 등 청구지 주소를 구분하는 코드
      - name: 카드청구지우편번호
        expr: 카드청구지우편번호
        data_type: VARCHAR
        description: 카드 청구지 주소의 우편번호 이다.
      - name: 모집부점코드
        expr: 모집부점코드
        data_type: VARCHAR
        description: 신용카드, 가맹점, 자동납부 신청을 모집한 부점코드
      - name: 회원자격코드
        expr: 회원자격코드
        data_type: VARCHAR
        description: 통합코드의 회원자격코드
      - name: 직업구분코드
        expr: 직업구분코드
        data_type: VARCHAR
        description: 고객의 직업을 구분하는 직업구분코드
      - name: 모집인소속부점코드
        expr: 모집인소속부점코드
        data_type: VARCHAR
        description: 카드모집인의 소속 부점코드이다.
      - name: TM재수행여부
        expr: TM재수행여부
        data_type: VARCHAR
        description: 고객에게 TM을 재수행 했는지 여부
      - name: 통합BSS한도등급
        expr: 통합BSS한도등급
        data_type: VARCHAR
        description: 고객의 연체정보,사용실적,외부평가정보등 통합적인 정보를 활용하여 산출한 BSS(Behavior Score System)한도등급
      - name: 카드청구지도로명우편번호
        expr: 카드청구지도로명우편번호
        data_type: VARCHAR
        description: 카드 청구지 주소의 도로명우편번호 이다.
      - name: 카드청구지우편일련번호
        expr: 카드청구지우편일련번호
        data_type: DECIMAL
        description: 카드 청구지 주소의 우편일련번호 이다.
      - name: 카드청구지도로명우편읍면번호
        expr: 카드청구지도로명우편읍면번호
        data_type: VARCHAR
        description: 카드 청구지 도로명 주소의 우편읍면번호 이다.
      - name: 카드청구지도로명우편보조번호
        expr: 카드청구지도로명우편보조번호
        data_type: VARCHAR
        description: 카드 청구지 도로명 주소의 우편보조번호 이다.
      - name: 카드청구지도로명구역번호
        expr: 카드청구지도로명구역번호
        data_type: VARCHAR
        description: 카드 청구지 도로명 주소의 구역번호 이다.
      - name: 카드청구지주소표시구분코드
        expr: 카드청구지주소표시구분코드
        data_type: VARCHAR
        description: 카드 청구지의 주소표시구분을 정의한다.(도로명주소, 일반주소)
    measures:
      - name: 통합ASS평점
        expr: 통합ASS평점
        data_type: BIGINT
        description: 고객의 신용도를 통합적으로 평가한 ASS(Application scoring system)평점
    time_dimensions:
      - name: 기준년월일
        expr: 기준년월일
        data_type: VARCHAR
        description: 최초모집카드여부가 0 인 카드들에 대한 정보를 기준년월일 기준으로 적재되어 있는 테이블의 기준년월일 정보이다.
        synonyms: [기준일, 일자, 날짜]
      - name: 최종카드발급년월일
        expr: 최종카드발급년월일
        data_type: VARCHAR
        description: 상품에 해당하는 카드가 최종 카드발급 접수된 일자이다.
      - name: 카드만료년월일
        expr: 카드만료년월일
        data_type: VARCHAR
        description: 카드 유효기간의 종료일
      - name: 이전카드만료년월일
        expr: 이전카드만료년월일
        data_type: VARCHAR
        description: 카드가 해지및 갱신으로인해 만료년월이 변경될경우 변경되기 이전의 만료년월일을 말함
      - name: 실제카드만료년월일
        expr: 실제카드만료년월일
        data_type: VARCHAR
        description: 카드가 실제만료(만료년월이 적용 되었거나 해지년월이 적용)되는 최종년월일
      - name: 신규년월일
        expr: 신규년월일
        data_type: VARCHAR
        description: 신규된 일자의 년월일을 관리한다.
      - name: 해지년월일
        expr: 해지년월일
        data_type: VARCHAR
        description: 회원이 카드를 해지한 일자
      - name: 신청서접수년월일
        expr: 신청서접수년월일
        data_type: VARCHAR
        description: 카드신청 또는 카드한도의 신청서 정보를 접수 처리(온라인,배치)한 일자
      - name: 유류구매카드발급년월일
        expr: 유류구매카드발급년월일
        data_type: VARCHAR
        description: 유류구매카드를 발급한 년월일을 관리한다.

  - name: tddaa3l01
    physical_table: card_system.tddaa3l01
    korean_name: 카드연체일별
    description: "카드 단위 연체 정보를 일자별로 집계하는 테이블. 한 행은 특정 기준년월일 시점의 하나의 카드 연체 상태를 의미한다. 신용카드 연체발생년월일·연체회차·연체일수, 최초 연체발생년월일·회차·일수, 자산유동화회차 등을 담아 일별 연체 현황·연체 추이 분석에 사용한다."
    grain: 기준년월일 × 회원일련번호 × 카드구분키번호 1건 (카드 일별 연체)
    primary_key: [기준년월일, 회원일련번호, 카드구분키번호]
    synonyms: [카드연체, 연체일별, 일별연체, 연체현황]
    dimensions:
      - name: 회원일련번호
        expr: 회원일련번호
        data_type: VARCHAR
        description: 당사(KB국민카드)와 계약한 회원을 관리하는 식별번호
        synonyms: [회원번호, 회원ID]
      - name: 카드구분키번호
        expr: 카드구분키번호
        data_type: VARCHAR
        description: 회원별로 부여되는 일련번호에 카드상품 또는 계약별로 추가되는 일련번호이다. / 기본적으로 카드브랜드구분코드 + 일련번호로 구성된다.
      - name: 고객식별자
        expr: 고객식별자
        data_type: VARCHAR
        description: KB카드의 고객에게 부여하는 10자리 번호체계로 각 고객을 고유하게 식별할 수 있음
        synonyms: [고객ID, 고객번호]
      - name: 고객관리번호
        expr: 고객관리번호
        data_type: VARCHAR
        description: 고객식별자의 하위 5자리 번호체계
      - name: 카드식별자
        expr: 카드식별자
        data_type: VARCHAR
        description: KB카드에서 발급하는 카드의 카드번호를 대체하여 식별하기 위한 중복되지 않는 값
      - name: 카드BIN번호
        expr: 카드BIN번호
        data_type: VARCHAR
        description: 카드의 발급사를 구분하는 BIN 번호이다.
      - name: 개인기업구분코드
        expr: 개인기업구분코드
        data_type: VARCHAR
        description: 개인 또는 기업을 구분하는 코드
      - name: KB카드BC카드구분코드
        expr: KB카드BC카드구분코드
        data_type: VARCHAR
        description: KB카드와 BC카드를 구분하는코드
      - name: 회원자산관리부점코드
        expr: 회원자산관리부점코드
        data_type: VARCHAR
        description: 회원의 자산을 관리하는 부점코드
      - name: 연체관리부점코드
        expr: 연체관리부점코드
        data_type: VARCHAR
        description: 고객의 연체 정보를 관리하는 부점코드
      - name: 결제계좌번호
        expr: 결제계좌번호
        data_type: VARCHAR
        description: 청구금액을 인출할 고객의 결제 계좌번호를 의미한다.
      - name: 카드결제기관구분코드
        expr: 카드결제기관구분코드
        data_type: VARCHAR
        description: 카드결제계좌의 기관구분코드
      - name: CA한도등급코드
        expr: CA한도등급코드
        data_type: VARCHAR
        description: 단기카드대출(현금서비스)을 받을 수 있는 한도의 등급코드
      - name: 통합한도등급코드
        expr: 통합한도등급코드
        data_type: VARCHAR
        description: 현금서비스를 포함하여 부여한 총 한도등급코드
      - name: 회원자격코드
        expr: 회원자격코드
        data_type: VARCHAR
        description: 통합코드의 회원자격코드
      - name: 카드등급구분코드
        expr: 카드등급구분코드
        data_type: VARCHAR
        description: 카드의 등급을 관리하는 구분코드
      - name: 카드브랜드구분코드
        expr: 카드브랜드구분코드
        data_type: VARCHAR
        description: "카드브랜드구분코드 1:로칼(국민) 2:마스터 3:비자 4:JCB"
      - name: 모집부점코드
        expr: 모집부점코드
        data_type: VARCHAR
        description: 신용카드, 가맹점, 자동납부 신청을 모집한 부점코드
      - name: 제휴코드
        expr: 제휴코드
        data_type: VARCHAR
        description: 상품코드의 마지막 5자리로 정의, 상품코드를 그대로 사용함으로 별도 목록성 테이블은 관리하지 않고, 코드로 표기하고자 함
      - name: 구매회원제휴코드
        expr: 구매회원제휴코드
        data_type: VARCHAR
        description: 구매카드 소지일 경우 제휴코드 제일큰값
      - name: 발급권유자역할유형구분코드
        expr: 발급권유자역할유형구분코드
        data_type: VARCHAR
        description: 카드발급 권유자의 역할유형을 산업은행, 회원모집팀장 등을 구분코드로 정의
      - name: 권유자번호
        expr: 권유자번호
        data_type: VARCHAR
        description: "회원가입신청서 작성시 권유 모집인 식별을 위해 사용하는 번호 역할구분과 모집인번호가 조합 권유자식별자 -모집인구분(역할유형구분코드) +모집인번호(모집인식별내용(M) + 모집인코드)"
      - name: 통합BSS한도등급
        expr: 통합BSS한도등급
        data_type: VARCHAR
        description: 고객의 연체정보,사용실적,외부평가정보등 통합적인 정보를 활용하여 산출한 BSS(Behavior Score System)한도등급
    measures:
      - name: 자산유동화회차
        expr: 자산유동화회차
        data_type: BIGINT
        description: 유동화자산(ABS) 발행 시 발행 순서에 따라 부여된 회차이다.
      - name: 신용카드연체회차
        expr: 신용카드연체회차
        data_type: BIGINT
        description: 신용카드(KB카드,BC카드) 이용건의 연체 회차 관리
      - name: 신용카드연체일수
        expr: 신용카드연체일수
        data_type: BIGINT
        description: 신용카드 사용시 발생된 연체일수
      - name: 최초연체회차
        expr: 최초연체회차
        data_type: BIGINT
        description: 최초 연체발생 시점의 연체회차
      - name: 최초연체일수
        expr: 최초연체일수
        data_type: BIGINT
        description: 최초연체년월일 부터 현재까지 일수를 말한다.
      - name: 연체회차
        expr: 연체회차
        data_type: BIGINT
        description: 청구된 회차의 잔액이 남아 연체된 경우의 회차를 관리함
      - name: 연체일수
        expr: 연체일수
        data_type: BIGINT
        description: 연체기간에 대한 일수
      - name: 연체원금
        expr: 연체원금
        data_type: DECIMAL
        description: 만기경과, 기한이익상실등의 사유로 발생한 원금 연체금액을 관리한다.
      - name: 연체수수료
        expr: 연체수수료
        data_type: DECIMAL
        description: KB국민카드에서 고객, 가맹점, 제휴사를 상대로 받아야 하는 금액이 납기내에 회수되지 않은 경우에 발생되는 미납 수수료 정보를 관리함
      - name: 연체료
        expr: 연체료
        data_type: DECIMAL
        description: "KB국민카드에서 고객, 가맹점, 제휴사를 상대로 받아야 하는 금액이 납기내에 회수되지 않은 경우에 발생되는 미납 원금에 대해서 지연된 일수만큼 연체료율을 적용해서 산출된 지연배상금 정보를 관리함"
      - name: 연체연회비
        expr: 연체연회비
        data_type: DECIMAL
        description: 카드 연회비에 대한 연체된 금액
      - name: 연체합계금액
        expr: 연체합계금액
        data_type: DECIMAL
        description: 연체금액(연체원금, 연체이자 등)의 합계를 관리한다.
      - name: 채권잔액
        expr: 채권잔액
        data_type: DECIMAL
        description: 연체 총 잔액 및 미청구금액을 포함한 금액을 말한다.
      - name: 청구수수료
        expr: 청구수수료
        data_type: DECIMAL
        description: 카드대금 청구시 청구금액에 포함된 수수료 금액
      - name: 예수금
        expr: 예수금
        data_type: DECIMAL
        description: 고객(회원)으로부터 수납하고 남은 금액
      - name: 선급금
        expr: 선급금
        data_type: DECIMAL
        description: 법적절차착수와 같이 회수절차상 발생한 비용을 당사가 미리 지급한 금액
      - name: 청구연회비
        expr: 청구연회비
        data_type: DECIMAL
        description: "카드대금 청구시 청구금액에 포함된 연회비 금액 / 카드를 발급받은 회원에게 카드회원의 자격을 유지하는 대가로 일 년에 한 번씩 청구하는 일정액의 금액"
      - name: 일시불연체원금
        expr: 일시불연체원금
        data_type: DECIMAL
        description: 일시불 매출 중 연체된 원금
      - name: CA연체원금
        expr: CA연체원금
        data_type: DECIMAL
        description: 단기카드대출(현금서비스) 매출 중 연체된 원금
      - name: 할부연체원금
        expr: 할부연체원금
        data_type: DECIMAL
        description: 할부 매출 중 연체된 원금
      - name: 리볼빙일시불연체원금
        expr: 리볼빙일시불연체원금
        data_type: DECIMAL
        description: 리볼빙일시불 매출 중 연체된 원금
      - name: 리볼빙CA연체원금
        expr: 리볼빙CA연체원금
        data_type: DECIMAL
        description: 리볼빙현금서비스 매출 중 연체된 원금
      - name: CA한도금액
        expr: CA한도금액
        data_type: DECIMAL
        description: (전문) 신용평가기관에서 제공하는 프로파일 항목으로 현금서비스한도합계금액
      - name: 통합한도금액
        expr: 통합한도금액
        data_type: DECIMAL
        description: "회원에 제공되는 각종 한도 중 \"통합한도등급\"으로 관리되는 한도금액"
      - name: 최종연체회차
        expr: 최종연체회차
        data_type: BIGINT
        description: 관리되고 있는 연체회차의 최종시점의 연체회차
      - name: CA할부연체원금
        expr: CA할부연체원금
        data_type: DECIMAL
        description: 단기카드대출(현금서비스)할부 매출 중 연체된 원금
      - name: 체크카드소액신용연체금액
        expr: 체크카드소액신용연체금액
        data_type: DECIMAL
        description: 소액신용결제 서비스가 등록된 체크카드의 연체금액
      - name: 체크카드소액신용채권잔액
        expr: 체크카드소액신용채권잔액
        data_type: DECIMAL
        description: 소액신용결제 서비스가 등록된 체크카드의 채권잔액(연체원금+미청구원금)
    time_dimensions:
      - name: 기준년월일
        expr: 기준년월일
        data_type: VARCHAR
        description: 일별로 집계되는 카드의 연체 정보를 적재하는 기준이 되는 기준년월일 정보로 해당 기준년월일 시점의 연체 내역을 적재하기 위한 기준년월일 관리
        synonyms: [기준일, 일자, 날짜]
      - name: 신용카드연체발생년월일
        expr: 신용카드연체발생년월일
        data_type: VARCHAR
        description: 신용카드(KB카드,BC카드)에 대해 연체가 발생한 년월일 관리
      - name: 최초연체발생년월일
        expr: 최초연체발생년월일
        data_type: VARCHAR
        description: 최초로 연체가 발생한 년월일 관리
      - name: 연체발생년월일
        expr: 연체발생년월일
        data_type: VARCHAR
        description: 연체발생한 년월일 관리
      - name: 결제일
        expr: 결제일
        data_type: VARCHAR
        description: 카드대금 및 대출이자에 대한 지정된 결제일
      - name: 카드신규발급년월일
        expr: 카드신규발급년월일
        data_type: VARCHAR
        description: 카드가 신규로 발급된 일자이다.
      - name: 회원신규가입년월일
        expr: 회원신규가입년월일
        data_type: VARCHAR
        description: 회원의 신규 가입일자를 관리하는 속성
      - name: 최종청구년월일
        expr: 최종청구년월일
        data_type: VARCHAR
        description: 최종으로 회원에게 청구한 기준일
      - name: 연체기준년월일
        expr: 연체기준년월일
        data_type: VARCHAR
        description: 연체를 판단하는 기준이 되는 년월일

  - name: tmdaa1d01
    physical_table: card_system.tmdaa1d01
    korean_name: 고객월스냅샷
    description: "고객정보기본(tbdaaat01)의 월말 시점 스냅샷 테이블. 한 행은 특정 기준년월 말일 시점의 하나의 고객을 의미한다. 고객 식별·분류 속성을 월 단위로 보관해, 월별 고객 추이·시계열 분석에 사용한다."
    grain: 기준년월 × 고객식별자 × 고객관리번호 1건 (고객 월말 스냅샷)
    primary_key: [기준년월, 고객식별자, 고객관리번호]
    synonyms: [고객월별, 고객스냅샷, 월별고객]
    dimensions:
      - name: 고객식별자
        expr: 고객식별자
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의KB카드의 고객에게 부여하는 10자리 번호체계로 각 고객을 고유하게 식별할 수 있음
        synonyms: [고객ID, 고객번호]
      - name: 고객관리번호
        expr: 고객관리번호
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의고객식별자의 하위 5자리 번호체계
      - name: 회원일련번호
        expr: 회원일련번호
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의당사(KB국민카드)와 계약한 회원을 관리하는 식별번호
        synonyms: [회원번호, 회원ID]
      - name: 개인기업구분코드
        expr: 개인기업구분코드
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의개인 또는 기업을 구분하는 코드
      - name: 고객상태구분코드
        expr: 고객상태구분코드
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의CIF에서 상태를 보고 거래불가 처리 함.
      - name: 고객고유번호구분코드
        expr: 고객고유번호구분코드
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의00(해당무)가 있으면 안됨. 99(기타)를 사용해야 함
      - name: 고객고유번호
        expr: 고객고유번호
        data_type: VARCHAR
        description: 고객을 식별할 수 있는 고유번호 (주민등록번호,운전면허번호,외국인등록번호,사업자등록번호 등)
      - name: 법인고객식별자
        expr: 법인고객식별자
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의법인을 구분하기 위한 번호로 법원의 등기소에 법인신청 허가시에 부여되는 번호이다.법인고객식별자 = 채번
      - name: 본사사업자등록번호
        expr: 본사사업자등록번호
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의기업 본사의 사업자등록번호
      - name: 본인확인번호
        expr: 본인확인번호
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의본인임을 판단하기 위해 사용되는 번호
      - name: 법인등록번호
        expr: 법인등록번호
        data_type: VARCHAR
        description: 개인의 주민등록번호처럼 법인 설립 시 주어지는 고유번호. 법인등기부등본,사업자등록증으로 확인
        synonyms: [법인번호]
      - name: 가맹점명
        expr: 가맹점명
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의당사와 가맹점 계약을 체결한 사업장의 명칭
        synonyms: [가맹점이름, 상호, 상호명]
      - name: 고객등록거래구분코드
        expr: 고객등록거래구분코드
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의고객등록거래구분코드 - 카드에서 사용
      - name: 고객유형분류구분코드
        expr: 고객유형분류구분코드
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의고객의 유형을 분류하는 구분코드
      - name: 세부고객유형분류구분코드
        expr: 세부고객유형분류구분코드
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의고객의 형태를 세부적으로 분류한 구분코드(개인,개인사업자,법인등)
      - name: 세부고객대표여부
        expr: 세부고객대표여부
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의세부고객의 대표여부
      - name: 대표자고객식별자
        expr: 대표자고객식별자
        data_type: VARCHAR
        description: "MFX월고객정보기본시점정보의고객 개별로 회사에서 관리상 부여한 일련번호를 말하며 주민등록번호별로 하나씩 부여하며 사업자등록번호별로는 의미있는분리로 일련번호를 부여하여 하나씩부여한다"
      - name: 거래자구분코드
        expr: 거래자구분코드
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의당사와 거래하는 고객을 분류하는 구분코드
      - name: 유효카드존재회원여부
        expr: 유효카드존재회원여부
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의유효카드가 존재하는 회원인지 여부
      - name: KB유효신용카드보유여부
        expr: KB유효신용카드보유여부
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의회원이 만료되지않은 유효한 KB신용카드를 보유하고 있는지 여부
      - name: BC유효신용카드보유여부
        expr: BC유효신용카드보유여부
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의회원이 만료되지않은 유효한 KB비씨 신용카드를 보유하고 있는지 여부
      - name: 카드론유효회원여부
        expr: 카드론유효회원여부
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의카드론을 받은 회원중 계약상태가 정상이고 잔액이 존재하는 회원인지 여부
      - name: 미청구금액보유회원여부
        expr: 미청구금액보유회원여부
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의채권 미청구잔액을 보유하고있는 회원인지 여부
      - name: 등록부점코드
        expr: 등록부점코드
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의등록처리한 부점코드이다.
      - name: 카드고객서비스구분코드
        expr: 카드고객서비스구분코드
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의고객서비스구분코드
      - name: 최고고객구분코드
        expr: 최고고객구분코드
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의가족포함된 최고 우대서비스가 가능한 고객의 등급(MVP,로얄,우대,프리미엄,잠재,일반등)을 구분하는 구분코드
      - name: 본인실질고객구분코드
        expr: 본인실질고객구분코드
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의최고 우대서비스가 가능한 고객의 등급(MVP,로얄,우대,프리미엄,잠재,일반등)을 구분하는 구분코드
      - name: 사망여부
        expr: 사망여부
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의(전문) 신용기관에서 수신하는 프로파일 항목으로 고객의 사망 여부이다
      - name: 카드거래정지여부
        expr: 카드거래정지여부
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의거래정지 범위구분 중 카드 제재여부를 관리
      - name: 회원거래정지여부
        expr: 회원거래정지여부
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의거래정지 범위구분 중 회원제재여부
      - name: 성별구분코드
        expr: 성별구분코드
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의개인고객의 남녀 성별 구분이다.
      - name: 양력음력구분코드
        expr: 양력음력구분코드
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의해당 기념일의 기준이 음력인지 양력인지를 나타낸다.
      - name: 카드국가코드
        expr: 카드국가코드
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의카드 국가를 구분하는 코드
      - name: ISO국가코드
        expr: ISO국가코드
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의전세계에서 표준으로 적용되는 국가코드
      - name: 표준산업분류코드
        expr: 표준산업분류코드
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의사업체가 주로 수행하는 산업활동을 그 유사성에 따라 체계적으로 유형화(분류) 한 코드
      - name: 주거형태구분코드
        expr: 주거형태구분코드
        data_type: VARCHAR
        description: 고객이 거주하고있는 주거형태를 구분하는 코드
      - name: 주식상장비상장구분코드
        expr: 주식상장비상장구분코드
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의해당 법인이 상장법인 인지 비상장법인 인지를 구분하는코드
      - name: 주택형태구분코드
