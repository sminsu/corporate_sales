# =============================================================================
# 2. RELATIONSHIPS - 테이블 간 관계 (JOIN 경로)
# =============================================================================
relationships:
  # ── 고객 ↔ 회원 / 카드 ──
  - from: tbdaaat01
    to: tbdaaat03
    type: one_to_many
    join_expr: "tbdaaat01.회원일련번호 = tbdaaat03.회원일련번호"
    description: "고객기본 -> 회원기본. 한 고객이 여러 회원(카드 계약)을 보유할 수 있다."
  - from: tbdaaat01
    to: tbdaaat18
    type: one_to_one
    join_expr: "tbdaaat01.고객식별자 = tbdaaat18.고객식별자 AND tbdaaat01.고객관리번호 = tbdaaat18.고객관리번호"
    description: "고객기본 -> 고객연락처. 고객 식별자 기준 1:1 연락처/주소 보강."
  - from: tbdaaat03
    to: tbdaaat05
    type: one_to_many
    join_expr: "tbdaaat03.회원일련번호 = tbdaaat05.회원일련번호"
    description: "회원기본 -> 회원카드기본. 한 회원이 여러 장의 카드를 보유한다."
  - from: tbdaaat05
    to: tbdaada72
    type: many_to_one
    join_expr: "tbdaaat05.상품코드 = tbdaada72.상품코드"
    description: "회원카드기본 -> 상품 마스터 (상품명/등급 참조)."

  # ── 카드 일별/월별 스냅샷 & 실적 ──
  - from: tbdaaat05
    to: tddaa3d01
    type: one_to_many
    join_expr: "tbdaaat05.회원일련번호 = tddaa3d01.회원일련번호 AND tbdaaat05.카드구분키번호 = tddaa3d01.카드구분키번호"
    description: "회원카드기본 -> 카드일별기본 (일자 시점 카드 스냅샷)."
  - from: tbdaaat05
    to: tmdaa3e16
    type: one_to_many
    join_expr: "tbdaaat05.회원일련번호 = tmdaa3e16.회원일련번호 AND tbdaaat05.카드구분키번호 = tmdaa3e16.카드구분키번호"
    description: "회원카드기본 -> 카드월실적 (월별 이용/연체/한도 실적)."
  - from: tbdaaat05
    to: tddaa3l01
    type: one_to_many
    join_expr: "tbdaaat05.회원일련번호 = tddaa3l01.회원일련번호 AND tbdaaat05.카드구분키번호 = tddaa3l01.카드구분키번호"
    description: "회원카드기본 -> 카드연체일별 (일별 연체 현황)."

  # ── 회원/고객 ↔ 매출전표 ──
  - from: tbdaaat03
    to: tbdaabt30
