      - name: 수수료적용구분코드
        expr: 수수료적용구분코드
        data_type: VARCHAR
        description: 수수료의 업종별,SLIDING별등 적용 대상을 관리하는 코드
      - name: 카드대금지급주기구분코드
        expr: 카드대금지급주기구분코드
        data_type: VARCHAR
        description: 가맹점 대금지급주기를 관리하는 코그
      - name: 현금카드결제기관구분코드
        expr: 현금카드결제기관구분코드
        data_type: VARCHAR
        description: 현금카드 CD기 출금시 카드와 연계되어 있는 결제금융기관(예) 산업은행, 기업은행, 국민은행, 외환은행 등)을 구분하는 코드
      - name: 미화카드결제기관구분코드
        expr: 미화카드결제기관구분코드
        data_type: VARCHAR
        description: 미화 카드대금의 결제계좌가 개설된 금융기관구분 코드
      - name: 카드환율적용구분코드
        expr: 카드환율적용구분코드
        data_type: VARCHAR
        description: 환율적용관리 코드
      - name: 대표가맹점번호
        expr: 대표가맹점번호
        data_type: VARCHAR
        description: 복수 가맹점의 경우 복수 가맹점에 대한 대표가맹점번호(종속가맹점번호)
      - name: 본사가맹점여부
        expr: 본사가맹점여부
        data_type: VARCHAR
        description: 가맹점이 동일업체 다매장인 경우 해당가맹점이 본사가맹점인지 여부(대표가맹점과는 다름)
      - name: 본사가맹점번호
        expr: 본사가맹점번호
        data_type: VARCHAR
        description: 가맹점이 동일업체 다매장인 경우 본사가맹점번호를 의미(대표가맹점과는 다름)
      - name: 집금가맹점대상여부
        expr: 집금가맹점대상여부
        data_type: VARCHAR
        description: 집금대상이란 다수 가맹점의 신용판매대금을 합산하여 한곳의 지정가맹점 계좌에 한건으로 처리하는것을 의미하는데 해당가맹점이 이에 해당되는지 여부
      - name: 집금대표가맹점번호
        expr: 집금대표가맹점번호
        data_type: VARCHAR
        description: 집금대상이란 다수 가맹점의 신용판매대금을 합산하여 한곳의 지정가맹점 계좌에 한건으로 처리하는것을 의미하는데 이에 해당되는 대표가맹점번호
      - name: 가맹점전화번호
        expr: 가맹점전화번호
        data_type: VARCHAR
        description: 당사 가맹점의 전화번호
      - name: 주소표시구분코드
        expr: 주소표시구분코드
        data_type: VARCHAR
        description: 고객의 주소를 보여줄때 일반주소 또는 도로명주소로 표시할지의 구분코드
      - name: 우편번호
        expr: 우편번호
        data_type: VARCHAR
        description: 우정사업본부에서 주소지를 식별하기 위해 부여하는 번호체계 / 도로명주소체계 이전에는 6자리, 도로명주소체계에서는 5자리를 사용함
      - name: 우편일련번호
        expr: 우편일련번호
        data_type: DECIMAL
        description: 대량배송처별 일련번호로 KB내부에서 관리하기 적합하게 변형해서 사용하는 일련번호 (우체국에서 사용하는 우편일련번호는 우편중복일련번호 로 사용)
      - name: 가맹점상세주소
        expr: 가맹점상세주소
        data_type: VARCHAR
        description: 가맹점가입시 입력되는 가맹점사업장의 상세주소
      - name: 도로명우편번호
        expr: 도로명우편번호
        data_type: VARCHAR
        description: 도로명 주소의 우편번호
      - name: 도로명우편읍면번호
        expr: 도로명우편읍면번호
        data_type: VARCHAR
        description: 도로명 주소의 우편읍면번호
      - name: 도로명우편보조번호
        expr: 도로명우편보조번호
        data_type: VARCHAR
        description: 도로명주소의 우편보조번호
      - name: 도로명구역번호
        expr: 도로명구역번호
        data_type: VARCHAR
        description: 도로명 주소의 해당 구역번호 / 도로명주소의구역번호
      - name: 도로명지하구분코드
        expr: 도로명지하구분코드
        data_type: VARCHAR
        description: 도로명주소의 지상/지하/공중인지 구분
      - name: 도로명건물본번호
        expr: 도로명건물본번호
        data_type: VARCHAR
        description: 도로명 주소의 건물본번호
      - name: 도로명건물부번호
        expr: 도로명건물부번호
        data_type: VARCHAR
        description: 도로명 주소의 건물부번호
    measures:
      - name: 금년가맹점신용판매매출금액
        expr: 금년가맹점신용판매매출금액
        data_type: DECIMAL
        description: 당해 년도 가맹점의 신용판매 매출금액
      - name: 전년가맹점신용판매매출금액
        expr: 전년가맹점신용판매매출금액
        data_type: DECIMAL
        description: 전해 년도 가맹점의 신용판매 매출금액
      - name: 금년사고보상범위금액
        expr: 금년사고보상범위금액
        data_type: DECIMAL
        description: 당해 년동의 사고 보상범위 금액
      - name: 금년사고보상처리금액
        expr: 금년사고보상처리금액
        data_type: DECIMAL
        description: 실제가맹점 대상 사고보상 처리된 금액
      - name: 금년기준외가맹점사고보상금액
        expr: 금년기준외가맹점사고보상금액
        data_type: DECIMAL
        description: 거래정지, 미승인전표, 서명상이,수기매출전표 등의 기준외에 금년도에 가맹점에 사고보상한 금액
      - name: 금년전년도분사고보상처리금액
        expr: 금년전년도분사고보상처리금액
        data_type: DECIMAL
        description: 실제가맹점 대상 사고보상 처리된 금액(전전년도)
      - name: 전년사고보상범위금액
        expr: 전년사고보상범위금액
        data_type: DECIMAL
        description: 기업의 전년도 사고보상범위금액
      - name: 전년사고보상처리금액
        expr: 전년사고보상처리금액
        data_type: DECIMAL
        description: 기업의 전년도 사고보상처리금액
      - name: 전년기준외가맹점사고보상금액
        expr: 전년기준외가맹점사고보상금액
        data_type: DECIMAL
        description: 거래정지, 미승인전표, 서명상이,수기매출전표 등의 기준외에 전년도에 가맹점에 사고보상한 금액
      - name: 전년전년도분사고보상처리금액
        expr: 전년전년도분사고보상처리금액
        data_type: DECIMAL
        description: 사업장의 전년,전년도분 사고보상처리 금액
      - name: 전년익년도분보상처리금액
        expr: 전년익년도분보상처리금액
        data_type: DECIMAL
        description: 사업장의 전년,익년도분 보상처리 금액
      - name: 신용카드가맹점수수료율
        expr: 신용카드가맹점수수료율
        data_type: DECIMAL
        description: 신용카드로 가맹점에서 매출이 발생시 카드사의 수입이 되는 수수료의 비율.
      - name: 체크카드가맹점수수료율
        expr: 체크카드가맹점수수료율
        data_type: DECIMAL
        description: 체크카드로 가맹점에서 매출이 발생시 카드사의 수입이 되는 수수료의 비율.
      - name: MASTER카드수수료율
        expr: MASTER카드수수료율
        data_type: DECIMAL
        description: MASTER카드 사용시 일정비율로 부과하는 수수료에 대한 산정비
      - name: VISA카드수수료율
        expr: VISA카드수수료율
        data_type: DECIMAL
        description: VISA카드 사용시 일정비율로 부과하는 수수료에 대한 산정비
      - name: JCB카드수수료율
        expr: JCB카드수수료율
        data_type: DECIMAL
        description: JCB카드 사용시 일정비율로 부과하는 수수료에 대한 산정비
      - name: 가맹점선지급처리건수
        expr: 가맹점선지급처리건수
        data_type: BIGINT
        description: 가맹점 선지급처리에 대한 건수
      - name: 가맹점선지급처리금액
        expr: 가맹점선지급처리금액
        data_type: DECIMAL
        description: 가맹점의 원대금지급일자이전에 선지급한 금액
      - name: 대금지급주기일수
        expr: 대금지급주기일수
        data_type: BIGINT
        description: 가맹점에게 신판 판매대금을 지급하는 주기. 전표매입일로 부터 1일 후, 2일후, 3일후 등.
      - name: 가맹점1회승인한도금액
        expr: 가맹점1회승인한도금액
        data_type: DECIMAL
        description: 가맹점에서 1회에 승인할 수 있는 승인한도금액
      - name: 가맹점일승인한도금액
        expr: 가맹점일승인한도금액
        data_type: DECIMAL
        description: 가맹점에 부여된 일별 최대승인한도금액
      - name: 가맹점월승인한도금액
        expr: 가맹점월승인한도금액
        data_type: DECIMAL
        description: 가맹점에 부여된 월별 최대승인한도금액
    time_dimensions:
      - name: 실적기준년월일
        expr: 실적기준년월일
        data_type: VARCHAR
        description: 해당 테이블의 데이터를 적재하는 기준이 되는 일자 정보로 사용되는 일자정보(기준년월일)를 나타낸다.
      - name: 최초심사방문년월일
        expr: 최초심사방문년월일
        data_type: VARCHAR
        description: 가맹점에 대한 최초 심사 방문 일자
      - name: 등록년월일
        expr: 등록년월일
        data_type: VARCHAR
        description: 해당테이블에 데이터가 등록된 년월일
      - name: 가맹점신규년월일
        expr: 가맹점신규년월일
        data_type: VARCHAR
        description: 가맹점이 신규로 등록된 일자
      - name: 가맹점재가입년월일
        expr: 가맹점재가입년월일
        data_type: VARCHAR
        description: 가맹점이 재가입된일자
      - name: 가맹점해지년월일
        expr: 가맹점해지년월일
