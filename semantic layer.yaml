    measures:
      - name: 기업카드신용한도금액
        expr: 기업카드신용한도금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 기업(법인, 사업자, 사업장)카드의 카드별로 부여된 신용한도 금액을 의미한다.
      - name: 카드반송회차
        expr: 카드반송회차
        data_type: BIGINT
        description: MFX월카드통합실적집계의 카드를 발송하고 다양한 사유에 의해 반송된 회차이다.
      - name: 부서사업장이용한도금액
        expr: 부서사업장이용한도금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 기업체의 부서사업장 이용한도금액
      - name: BSS평점
        expr: BSS평점
        data_type: BIGINT
        description: MFX월카드통합실적집계의 기존고객의 향후 부실 가능성을 예측하기 위하여 행동평점을 평가점수
      - name: ASS평점
        expr: ASS평점
        data_type: BIGINT
        description: MFX월카드통합실적집계의 신청평점 시스템의 신용평가 결과 점수
      - name: 발송물반송횟수
        expr: 발송물반송횟수
        data_type: BIGINT
        description: MFX월카드통합실적집계의 자택또는 직장으로 발송된 우편물이 반송된경우 반송횟수를 관리한다.
      - name: 기업회원이용한도금액
        expr: 기업회원이용한도금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 기업회원(사업자 단위)에 부여된 이용가능한 한도금액
      - name: RF이용금액
        expr: RF이용금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 RF후불교통카드로 서비스를 이용하면서 발생한 금액
      - name: 이월리볼빙일시불잔액
        expr: 이월리볼빙일시불잔액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 리볼빙 일시불 이월 이용매출 잔액
      - name: 이월리볼빙CA잔액
        expr: 이월리볼빙CA잔액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 리볼빙 현금서비스 이월 이용매출 잔액
      - name: 일시불미청구금액
        expr: 일시불미청구금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 일시불 매출 중 미청구된 금액
      - name: CA미청구금액
        expr: CA미청구금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 단기카드대출(현금서비스) 상품 금액 중 미청구 된 금액
      - name: CA할부미청구금액
        expr: CA할부미청구금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 단기카드대출(현금서비스)할부 매출 중 미청구된 금액
      - name: 리볼빙일시불미청구금액
        expr: 리볼빙일시불미청구금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 리볼빙일시불 매출 중 미청구된 금액
      - name: 리볼빙CA미청구금액
        expr: 리볼빙CA미청구금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 리볼빙현금서비스 매출 중 미청구된 금액
      - name: 할부미청구금액
        expr: 할부미청구금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 할부 매출금액 중 미청구된 금액
      - name: 금월청구건수
        expr: 금월청구건수
