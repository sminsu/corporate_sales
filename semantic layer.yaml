        description: MFX월카드통합실적집계의 통합회원(신용소지/미소지), 이원화(신용/체크), 이원화(신용/BC)등의 카드신용체크이원화를 관리하는 구분코드
      - name: 자택도로명우편번호
        expr: 자택도로명우편번호
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 고객의 자택 주소의 도로명 우편번호를 정의한다.
      - name: 자택도로명우편읍면번호
        expr: 자택도로명우편읍면번호
