        description: 가맹점의 미수금(카드회사에 지불해야 할 금액)이 발생 했는지의 여부
      - name: 가맹점한도설정여부
        expr: 가맹점한도설정여부
        data_type: VARCHAR
        description: 가맹점에 매입한도, 승인한도등을 설정하였는지의 여부
      - name: 인증서비스대상여부
        expr: 인증서비스대상여부
        data_type: VARCHAR
