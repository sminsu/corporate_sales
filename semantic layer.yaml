        description: 카드전표의 매입이 발생한 년월일
      - name: 전표매출년월일
        expr: 전표매출년월일
        data_type: VARCHAR
        description: 카드전표의 매출년월일

  - name: tbdaabt30
    physical_table: card_system.tbdaabt30
    korean_name: 매출전표
    description: "카드 매출전표 단위의 핵심 거래/매출 팩트 테이블. 한 행은 하나의 매출전표(기준년월+매출전표번호)를 의미한다. 전표매입/매출 일시, 회원·카드 식별자, 가맹점번호·업종, 카드매출유형·매출전표종류, 매출금액·할부·수수료 등 매출 분석에 필요한 거의 모든 측정값을 담는다. 카드 매출/이용금액 분석의 중심 팩트 테이블이다."
    grain: 기준년월 × 매출전표번호 1건 (국내 매출전표)
    primary_key: [기준년월, 매출전표번호]
    synonyms: [매출, 이용내역, 거래내역, 전표, 카드매출, 이용금액]
    dimensions:
      - name: 매출전표번호
        expr: 매출전표번호
        data_type: VARCHAR
        description: "매출전표입력시결정되는당사에서관리하는전표의고유번호 채번규칙 - 구성 : YYDDD(5) + 일련번호(10) + 매출유형구분(1) - 상세 규칙 YYDDD(5) : 년도(YY) + 줄리안Date(DDD) 일련번호(10) : 은행공통 #GETNCS 모듈에서 채번처리 매출유형구분(1) 1:일시불전표/2:할부전표/ 3:현금서비스 /4:리볼빙/5:예수금/6:선급금/9:연회비"
      - name: 전표매입시각
        expr: 전표매입시각
        data_type: VARCHAR
        description: 매출전표 매입완료후 원장생성된 시각
      - name: 카드매출유형구분코드
        expr: 카드매출유형구분코드
        data_type: VARCHAR
        description: 카드매출 유형별로 관리 하는 코드이다.
      - name: 매출전표종류구분코드
        expr: 매출전표종류구분코드
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 매출전표의 종류관리코드
      - name: 회원일련번호
        expr: 회원일련번호
        data_type: VARCHAR
        description: 당사(KB국민카드)와 계약한 회원을 관리하는 식별번호
        synonyms: [회원번호, 회원ID]
      - name: 카드구분키번호
        expr: 카드구분키번호
        data_type: VARCHAR
        description: 회원별로 부여되는 일련번호에 카드상품 또는 계약별로 추가되는 일련번호이다. / 기본적으로 카드브랜드구분코드 + 일련번호로 구성된다.
      - name: 카드식별자
        expr: 카드식별자
        data_type: VARCHAR
        description: KB카드에서 발급하는 카드의 카드번호를 대체하여 식별하기 위한 중복되지 않는 값
      - name: 카드BIN번호
        expr: 카드BIN번호
        data_type: VARCHAR
        description: 카드의 발급사를 구분하는 BIN 번호이다.
      - name: 상품대분류구분코드
