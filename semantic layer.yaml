  - from: tbdaaat05
    to: tddaa3e21
    type: one_to_many
    join_expr: "tbdaaat05.회원일련번호 = tddaa3e21.회원일련번호 AND tbdaaat05.카드구분키번호 = tddaa3e21.카드구분키번호"
    description: "회원카드기본 -> 모집최초회원카드일별 (신규 모집/발급)."
  - from: tbdaaat05
