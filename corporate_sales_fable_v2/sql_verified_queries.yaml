  - Athena
- name: overseas_peak_month_usage
  question: 2026년 해외업종에서 가장 많이 사용한 달과 이용금액을 알려줘
  description: 지정 연도의 해외 매출전표를 월별로 합산해 이용금액이 가장 큰 달과 금액을 반환합니다.
  sql: |
    SELECT
      "기준년월" AS "최다이용월",
      SUM(COALESCE("매출금액", 0)) AS "이용금액"
    FROM card_system.tbdaabt08
    WHERE "기준년월" BETWEEN '{기간_시작}' AND '{기간_종료}'
    GROUP BY "기준년월"
    ORDER BY "이용금액" DESC, "최다이용월"
    LIMIT 1
  parameters:
    기간_시작:
      type: string
      description: 조회 시작 기준년월(YYYYMM)
      required: true
    기간_종료:
      type: string
      description: 조회 종료 기준년월(YYYYMM)
      required: true
  tags:
  - 해외업종
  - 해외이용
  - 최다이용월
  - 이용금액
  - 월별
