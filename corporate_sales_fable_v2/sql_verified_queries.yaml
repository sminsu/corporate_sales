- name: enterprise_size_corporate_card_usage_by_current_size
  question: 현재 기업규모 기준으로 지정 기간의 기업카드 이용금액을 보여줘
  description: 현재 고객 마스터의 기업규모와 요청 기간의 고객별 법인카드 월 이용금액을 각각 중복 제거한 뒤 합산합니다.
  sql: |
    WITH current_customer_size AS (
      SELECT
        s."고객식별자",
        MAX(s."기업규모구분코드") AS "기업규모구분코드"
      FROM card_system.tbdaaat01 s
      WHERE s."개인기업구분코드" = '2'
      GROUP BY s."고객식별자"
      HAVING COUNT(DISTINCT s."기업규모구분코드") = 1
    ),
    card_customer_month AS (
      SELECT
        f."기준년월",
        f."고객식별자",
        SUM(COALESCE(f."금월이용합계금액", 0)) AS "월이용금액"
      FROM card_system.tmdaa3e16 f
      WHERE f."개인기업구분코드" = '2'
        AND f."기준년월" BETWEEN '{기간_시작}' AND '{기간_종료}'
      GROUP BY f."기준년월", f."고객식별자"
    )
    SELECT
      cm."기준년월",
      '{기업규모구분코드}' AS "기업규모구분코드",
      SUM(cm."월이용금액") AS "법인카드월이용금액"
    FROM card_customer_month cm
    JOIN current_customer_size cs
      ON cm."고객식별자" = cs."고객식별자"
    WHERE cs."기업규모구분코드" = '{기업규모구분코드}'
    GROUP BY cm."기준년월"
    ORDER BY cm."기준년월"
  parameters:
    기간_시작:
      type: string
      description: 조회 시작 기준년월(YYYYMM)
      required: true
    기간_종료:
      type: string
      description: 조회 종료 기준년월(YYYYMM)
      required: true
    기업규모구분코드:
      type: string
      description: enterprise_size 코드북으로 해석한 기업규모구분코드
      semantic_attribute: enterprise_size
      required: true
  tags:
  - 현재기준
  - 현재기업규모
  - 기업규모
  - 대기업
  - 중소기업
  - 공공기업
  - 영세기업
