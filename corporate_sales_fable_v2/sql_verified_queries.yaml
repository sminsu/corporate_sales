- name: merchant_corporate_sales_target_no_corporate_card
  question: 당사 가맹점 중 월 매출액 1억원 이상이고 법인사업자이며 KB국민 기업카드를 보유하지 않은 기업회원 명단을 알려줘
  description: 가맹점 월말 풍성화(tmdaaus01)를 월·가맹점별 최신행으로 축소하고 월가맹점실적(tmdaa5e11)의 일시불·할부 매출금액과 결합해, 월 매출 기준을 충족하는 법인사업자 중 유효 기업카드가 없는 영업대상을 조회합니다.
  sql: |
    WITH merchant_ranked AS (
      SELECT
        a."기준년월",
        a."기준년월일",
        a."가맹점번호",
        a."기업고객식별자",
        a."사업자등록번호",
        a."가맹점명",
        a."한글시도명",
        a."한글시군구명",
        a."가맹점업종코드",
        a."MCC업종코드",
        a."가맹점사업주체구분코드",
        a."유효기업신용카드수",
        a."유효기업체크카드수",
        a."휴폐업여부",
        ROW_NUMBER() OVER (
          PARTITION BY a."기준년월", a."가맹점번호"
          ORDER BY a."기준년월일" DESC
        ) AS rn
      FROM card_system.tmdaaus01 a
      WHERE a."기준년월" = '{기준년월}'
    ),
    merchant_month AS (
      SELECT
        r."가맹점번호",
        r."기업고객식별자",
        r."사업자등록번호",
        r."가맹점명",
        r."한글시도명",
        r."한글시군구명",
        r."가맹점업종코드",
        r."MCC업종코드",
        r."가맹점사업주체구분코드",
        r."유효기업신용카드수",
        r."유효기업체크카드수",
        r."휴폐업여부"
      FROM merchant_ranked r
      WHERE r.rn = 1
    ),
    merchant_sales AS (
      SELECT
        s."가맹점번호",
        SUM(
          COALESCE(s."가맹점일시불매출금액", 0)
          + COALESCE(s."가맹점할부매출금액", 0)
        ) AS "월매출액"
      FROM card_system.tmdaa5e11 s
      WHERE s."기준년월" = '{기준년월}'
      GROUP BY s."가맹점번호"
    )
    SELECT
      m."기업고객식별자" AS "고객식별자",
      m."사업자등록번호",
      m."가맹점번호",
      m."가맹점명",
      m."한글시도명",
      m."한글시군구명",
      m."가맹점업종코드",
      m."MCC업종코드",
      s."월매출액",
      COALESCE(m."유효기업신용카드수", 0) AS "유효기업신용카드수",
      COALESCE(m."유효기업체크카드수", 0) AS "유효기업체크카드수"
    FROM merchant_month m
    JOIN merchant_sales s
      ON m."가맹점번호" = s."가맹점번호"
    WHERE s."월매출액" >= {월매출금액}
      AND m."가맹점사업주체구분코드" = '2'
      AND COALESCE(m."유효기업신용카드수", 0) = 0
      AND COALESCE(m."유효기업체크카드수", 0) = 0
      AND COALESCE(m."휴폐업여부", '0') = '0'
      AND m."기업고객식별자" IS NOT NULL
    ORDER BY s."월매출액" DESC
    LIMIT {limit}
  parameters:
    기준년월:
      type: string
      description: 가맹점 월 매출 판단 기준년월(YYYYMM)
      required: true
      default: '202604'
      sample_values:
      - '202604'
    월매출금액:
      type: integer
      description: 월 매출액 하한 기준
      default: '100000000'
    limit:
      type: integer
      description: 상세 목록 제한 건수
      default: '1000000'
