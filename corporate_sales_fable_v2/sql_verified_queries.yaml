- name: merchant_named_store_sales_at_month
  question: 특정 가맹점주의 지정 기준월 최근 3개월 가맹점 매출액을 알려줘
  description: 월 가맹점 실적의 최근3개월가맹점매출금액을 동일 기준월의 가맹점 월 스냅샷 검색명과 정상 상태 조건으로 조회합니다.
  sql: |
    SELECT
      a."기준년월",
      a."가맹점번호",
      b."가맹점명",
      a."최근3개월가맹점매출금액"
    FROM card_system.tmdaa5e11 a
    LEFT JOIN card_system.tmdaa5d01 b
      ON a."가맹점번호" = b."가맹점번호"
      AND a."기준년월" = b."기준년월"
    WHERE a."기준년월" = '{기준년월}'
      AND LOWER(COALESCE(b."가맹점명", ''))
        LIKE LOWER(CONCAT('%', '{가맹점명}', '%')) ESCAPE '\'
      AND a."가맹점상태구분코드" = '1'
    ORDER BY a."최근3개월가맹점매출금액" DESC, a."가맹점번호"
    LIMIT {limit}
  parameters:
    기준년월:
      type: string
      description: 최근 3개월 가맹점 매출을 조회할 기준년월(YYYYMM). YYMM 입력은 2000년대 YYYYMM으로 확장
      required: true
    가맹점명:
      type: like_string
      description: 가맹점명에서 찾을 가맹점 또는 브랜드 검색어
      required: true
    limit:
      type: integer
      description: 개별 가맹점 목록 제한 건수
      default: '1000000'
  tags:
  - 최근3개월가맹점매출
  - 가맹점주매출
  - 기준년월
  - tmdaa5e11
  - tmdaa5d01
  - Athena
- name: merchant_payment_institution_list
  question: 특정 가맹점 또는 브랜드의 가맹점 결제금융기관 목록을 알려줘
  description: 가맹점 마스터에서 검색명에 해당하는 가맹점과 운영 고객 식별자, 대금지급 결제금융기관 코드를 반환합니다.
  sql: |
    SELECT
      m."등록년월일",
      m."가맹점번호",
      m."기업고객식별자",
      m."대표고객식별자" AS "개인고객식별자",
      m."가맹점명",
      m."현금카드결제기관구분코드" AS "가맹점결제계좌"
    FROM card_system.tbdaadt01 m
    WHERE (
      LOWER(COALESCE(m."가맹점명", ''))
        LIKE LOWER(CONCAT('%', '{가맹점명}', '%')) ESCAPE '\'
      OR LOWER(COALESCE(m."한글가맹점명", ''))
        LIKE LOWER(CONCAT('%', '{가맹점명}', '%')) ESCAPE '\'
    )
    ORDER BY m."가맹점명", m."가맹점번호"
    LIMIT {limit}
  parameters:
    가맹점명:
      type: like_string
      description: 가맹점명 또는 브랜드를 찾을 검색어
      required: true
    limit:
      type: integer
      description: 가맹점 목록 제한 건수
      default: '1000000'
  tags:
  - 가맹점계좌
  - 결제계좌
  - 결제금융기관
  - tbdaadt01
  - Athena
- name: merchant_count_by_payment_institution
  question: 특정 가맹점 또는 브랜드 중 지정 결제금융기관을 사용하는 가맹점 수를 알려줘
  description: 가맹점 마스터에서 검색명과 결제금융기관 코드를 적용해 고유 가맹점번호 수를 계산합니다.
  sql: |
    SELECT
      '{결제금융기관코드}' AS "결제금융기관코드",
      COUNT(DISTINCT m."가맹점번호") AS "가맹점수"
    FROM card_system.tbdaadt01 m
    WHERE (
      LOWER(COALESCE(m."가맹점명", ''))
        LIKE LOWER(CONCAT('%', '{가맹점명}', '%')) ESCAPE '\'
      OR LOWER(COALESCE(m."한글가맹점명", ''))
        LIKE LOWER(CONCAT('%', '{가맹점명}', '%')) ESCAPE '\'
    )
      AND m."현금카드결제기관구분코드" = '{결제금융기관코드}'
  parameters:
    가맹점명:
      type: like_string
      description: 가맹점명 또는 브랜드를 찾을 검색어
      required: true
    결제금융기관코드:
      type: string
      semantic_attribute: merchant_payment_institution
      description: semantic attribute에서 은행명으로 해석한 가맹점 대금지급 결제금융기관 코드
      required: true
  tags:
