verified_queries:
- name: corporate_member_with_usage_count
  question: 지정 월 기준 법인회원의 유실적 업체수를 알려줘
  description: 기업고객 일별 스냅샷(tbdaa1d12)을 고객별 월 최신행으로 축소한 뒤, 지정 월의 신용·체크 이용금액 합계가 0보다 큰 고유 법인회원 업체 수를 계산합니다.
  sql: |
    WITH ranked AS (
      SELECT
        a."고객식별자",
        a."금월신용카드이용금액",
        a."금월체크카드이용금액",
        ROW_NUMBER() OVER (
          PARTITION BY a."고객식별자"
          ORDER BY a."기준년월일" DESC
        ) AS rn
      FROM card_system.tbdaa1d12 a
      WHERE a."기준년월일"
        BETWEEN CONCAT('{기준년월}', '01') AND CONCAT('{기준년월}', '31')
    )
    SELECT
      COUNT(DISTINCT r."고객식별자") AS "유실적업체수"
    FROM ranked r
    WHERE r.rn = 1
      AND (
        COALESCE(r."금월신용카드이용금액", 0)
        + COALESCE(r."금월체크카드이용금액", 0)
      ) > 0
  parameters:
    기준년월:
      type: string
      description: 유실적 법인회원 업체 수를 조회할 기준년월(YYYYMM)
      required: true
  tags:
  - 법인회원
  - 기업회원
  - 유실적
  - 실적있음
  - 업체수
  - 이용금액
  - tbdaa1d12
  - Athena
- name: corporate_card_active_no_usage_members
  question: KB카드 기업카드 보유회원 중 기준년월 기준으로 6개월 무실적인 기업회원 명단을 알려줘
  description: 입력한 기준년월에 유효 기업카드를 보유하면서 기준월을 포함한 최근 N개월 동안 신용·체크 이용금액이 한 번도 발생하지 않은 기업을 월기업고객기본(tmdaa1d12)에서 조회합니다.
  sql: |
    SELECT
      a."사업자등록번호",
      a."기업명"
    FROM card_system.tmdaa1d12 a
    WHERE a."기준년월" = '{기준년월}'
      AND (
        COALESCE(a."유효기업신용카드수", 0)
        + COALESCE(a."유효기업체크카드수", 0)
      ) > 0
      AND NOT EXISTS (
        SELECT 1
        FROM card_system.tmdaa1d12 b
        WHERE b."고객식별자" = a."고객식별자"
          AND b."기준년월" BETWEEN
            DATE_FORMAT(
              DATE_ADD(
                'month',
                -({조회개월수} - 1),
                DATE_PARSE(CONCAT('{기준년월}', '01'), '%Y%m%d')
              ),
              '%Y%m'
            )
            AND '{기준년월}'
          AND (
            COALESCE(b."금월신용카드이용금액", 0)
            + COALESCE(b."금월체크카드이용금액", 0)
          ) > 0
      )
    ORDER BY a."기업명", a."사업자등록번호"
    LIMIT {limit}
  parameters:
    기준년월:
      type: string
      description: 현재 카드 보유 여부와 최근 N개월 무실적을 판단할 기준년월(YYYYMM)
      required: true
      sample_values:
      - '202604'
    조회개월수:
      type: integer
      description: 기준월을 포함한 무실적 판정 개월 수
      default: '6'
    limit:
      type: integer
      description: 상세 목록 제한 건수
      default: '1000000'
  tags:
  - 기업회원
  - 기업카드
  - 보유
  - 미이용
  - 이용없음
  - 명단
  - 추출
  - tmdaa1d12
  - Athena
  - SAS참조
- name: corporate_card_churned_after_usage_members
  runtime_mode: reference_only
  question: KB국민 기업카드를 과거 이용했지만 현재 탈퇴 또는 해지한 기업회원 명단을 알려줘
  description: tbdaa1d12의 고객별 월 최신행을 기준으로 최근 N개월 이용 이력이 있으나 기준월 유효 기업 신용·체크카드 수가 0인 기업을 조회합니다. 유효카드 수 0은 탈퇴·해지의 분석용 대리조건입니다.
  sql: |
    WITH params AS (
      SELECT
        '{기준년월}' AS "기준년월",
        DATE_FORMAT(
          DATE_ADD(
            'month',
            -({조회개월수} - 1),
            DATE_PARSE(CONCAT('{기준년월}', '01'), '%Y%m%d')
          ),
          '%Y%m'
        ) AS "시작년월"
    ),
    daily AS (
      SELECT
        a."기준년월일",
        SUBSTR(a."기준년월일", 1, 6) AS "기준년월",
        a."고객식별자",
        a."사업자등록번호",
        a."기업명",
        a."유효기업신용카드수",
        a."유효기업체크카드수",
        a."금월신용카드이용금액",
        a."금월체크카드이용금액"
      FROM card_system.tbdaa1d12 a
      CROSS JOIN params p
      WHERE a."기준년월일" BETWEEN CONCAT(p."시작년월", '01') AND CONCAT(p."기준년월", '31')
    ),
    ranked AS (
      SELECT
        d."기준년월일",
        d."기준년월",
        d."고객식별자",
        d."사업자등록번호",
        d."기업명",
        d."유효기업신용카드수",
        d."유효기업체크카드수",
        d."금월신용카드이용금액",
        d."금월체크카드이용금액",
        ROW_NUMBER() OVER (
          PARTITION BY d."고객식별자", d."기준년월"
          ORDER BY d."기준년월일" DESC
        ) AS rn
      FROM daily d
    ),
    monthly AS (
      SELECT
        r."기준년월",
        r."고객식별자",
        r."사업자등록번호",
        r."기업명",
        r."유효기업신용카드수",
        r."유효기업체크카드수",
        r."금월신용카드이용금액",
        r."금월체크카드이용금액"
      FROM ranked r
      WHERE r.rn = 1
    ),
    history AS (
      SELECT
        m."고객식별자",
        MAX(
          CASE
            WHEN COALESCE(m."금월신용카드이용금액", 0) + COALESCE(m."금월체크카드이용금액", 0) > 0
            THEN m."기준년월"
          END
        ) AS "마지막이용월",
        SUM(COALESCE(m."금월신용카드이용금액", 0) + COALESCE(m."금월체크카드이용금액", 0)) AS "최근기간총이용금액",
        MAX(
          CASE
            WHEN COALESCE(m."금월신용카드이용금액", 0) + COALESCE(m."금월체크카드이용금액", 0) > 0
            THEN 1 ELSE 0
          END
        ) AS "이용이력존재"
      FROM monthly m
      GROUP BY m."고객식별자"
    ),
    current_snapshot AS (
      SELECT
        m."고객식별자",
        m."사업자등록번호",
        m."기업명",
        m."유효기업신용카드수",
        m."유효기업체크카드수"
      FROM monthly m
      CROSS JOIN params p
      WHERE m."기준년월" = p."기준년월"
    )
    SELECT
      c."고객식별자",
      c."사업자등록번호",
      c."기업명",
      h."마지막이용월",
      h."최근기간총이용금액"
    FROM current_snapshot c
    JOIN history h
      ON c."고객식별자" = h."고객식별자"
    WHERE (COALESCE(c."유효기업신용카드수", 0) + COALESCE(c."유효기업체크카드수", 0)) = 0
      AND h."이용이력존재" = 1
    ORDER BY h."마지막이용월" DESC, h."최근기간총이용금액" DESC
    LIMIT {limit}
  parameters:
    기준년월:
      type: string
      description: 현재 탈퇴/해지 여부를 판단할 기준년월(YYYYMM)
      required: true
      default: '202604'
      sample_values:
      - '202604'
    조회개월수:
      type: integer
      description: 기준월을 포함한 과거 이용 이력 조회 개월 수
      default: '6'
    limit:
      type: integer
      description: 상세 목록 제한 건수
      default: '1000000'
  tags:
  - 기업회원
  - 기업카드
  - 과거이용
  - 탈퇴
  - 해지
  - 카드수0
  - 명단
  - tbdaa1d12
  - Athena
  - SAS참조
- name: corporate_check_card_only_high_monthly_avg
  question: KB국민 기업 체크카드만 보유하고 이용하는 기업회원 중 월 평균 5천만원 이상 이용 기업 명단을 알려줘
  description: tbdaa1d12의 고객별 월 최신행을 기준으로, 기준월 현재 신용카드는 없고 체크카드는 보유하며 연초부터 기준월까지 신용카드 보유·이용 없이 체크카드를 이용한 기업의 달력 월수 기준 월평균 체크 이용금액을 계산합니다.
  sql: |
    WITH params AS (
      SELECT
        '{기준년월}' AS "기준년월",
        CONCAT(SUBSTR('{기준년월}', 1, 4), '01') AS "연초년월",
        CAST(SUBSTR('{기준년월}', 5, 2) AS INTEGER) AS "평균산정월수"
    ),
    daily AS (
      SELECT
        a."기준년월일",
        SUBSTR(a."기준년월일", 1, 6) AS "기준년월",
        a."고객식별자",
        a."사업자등록번호",
        a."기업명",
        a."유효기업신용카드수",
        a."유효기업체크카드수",
        a."금월신용카드이용금액",
        a."금월체크카드이용금액"
      FROM card_system.tbdaa1d12 a
      CROSS JOIN params p
      WHERE a."기준년월일" BETWEEN CONCAT(p."연초년월", '01') AND CONCAT(p."기준년월", '31')
    ),
    ranked AS (
      SELECT
        d."기준년월일",
        d."기준년월",
        d."고객식별자",
        d."사업자등록번호",
        d."기업명",
        d."유효기업신용카드수",
        d."유효기업체크카드수",
        d."금월신용카드이용금액",
        d."금월체크카드이용금액",
        ROW_NUMBER() OVER (
          PARTITION BY d."고객식별자", d."기준년월"
          ORDER BY d."기준년월일" DESC
        ) AS rn
      FROM daily d
    ),
    monthly AS (
      SELECT
        r."기준년월",
        r."고객식별자",
        r."사업자등록번호",
        r."기업명",
        r."유효기업신용카드수",
        r."유효기업체크카드수",
        r."금월신용카드이용금액",
        r."금월체크카드이용금액"
      FROM ranked r
      WHERE r.rn = 1
    ),
    current_snapshot AS (
      SELECT
        m."고객식별자",
        m."사업자등록번호",
        m."기업명",
        m."유효기업신용카드수",
        m."유효기업체크카드수"
      FROM monthly m
      CROSS JOIN params p
      WHERE m."기준년월" = p."기준년월"
    ),
    agg AS (
      SELECT
        c."고객식별자",
        c."사업자등록번호",
        c."기업명",
        c."유효기업체크카드수" AS "현재유효기업체크카드수",
        SUM(COALESCE(m."금월체크카드이용금액", 0)) AS "기간총체크이용금액",
        COUNT(DISTINCT m."기준년월") AS "데이터보유월수",
        MAX(p."평균산정월수") AS "평균산정월수",
        SUM(COALESCE(m."금월체크카드이용금액", 0))
          / NULLIF(CAST(MAX(p."평균산정월수") AS DOUBLE), 0.0) AS "월평균체크이용금액"
      FROM current_snapshot c
      JOIN monthly m
        ON c."고객식별자" = m."고객식별자"
      CROSS JOIN params p
      WHERE COALESCE(c."유효기업신용카드수", 0) = 0
        AND COALESCE(c."유효기업체크카드수", 0) > 0
      GROUP BY
        c."고객식별자",
        c."사업자등록번호",
        c."기업명",
        c."유효기업체크카드수"
      HAVING MAX(COALESCE(m."유효기업신용카드수", 0)) = 0
        AND SUM(COALESCE(m."금월신용카드이용금액", 0)) = 0
        AND SUM(COALESCE(m."금월체크카드이용금액", 0)) > 0
    )
    SELECT
      a."고객식별자",
      a."사업자등록번호",
      a."기업명",
      a."현재유효기업체크카드수",
      a."기간총체크이용금액",
      a."데이터보유월수",
      a."평균산정월수",
      a."월평균체크이용금액"
    FROM agg a
    WHERE a."월평균체크이용금액" >= {월평균금액}
    ORDER BY a."월평균체크이용금액" DESC
    LIMIT {limit}
  parameters:
    기준년월:
      type: string
      description: 보유·이용과 월평균을 판단할 기준년월(YYYYMM)
      required: true
      default: '202604'
      sample_values:
      - '202604'
    월평균금액:
      type: integer
      description: 월평균 체크카드 이용금액 기준
      default: '50000000'
    limit:
      type: integer
      description: 상세 목록 제한 건수
      default: '1000000'
  tags:
  - 기업회원
  - 체크카드
  - 체크카드만
  - 신용카드미보유
  - 월평균
  - 5천만원
  - 이용금액
  - 명단
  - tbdaa1d12
  - Athena
  - SAS참조
- name: corporate_monthly_average_usage
  question: 지정 기간 기업별 월평균 기업카드 이용금액을 알려줘
  description: |
    기업고객 일별 스냅샷을 고객·월별 최신행으로 축소한 뒤 신용·체크 이용금액을 합산하고,
    데이터가 없는 월도 0원으로 포함하는 요청 기간의 달력 월수로 나눠 기업별 월평균을 계산합니다.
  sql: |
    WITH params AS (
      SELECT
        DATE_DIFF(
          'month',
          DATE_PARSE(CONCAT('{기간_시작}', '01'), '%Y%m%d'),
          DATE_PARSE(CONCAT('{기간_종료}', '01'), '%Y%m%d')
        ) + 1 AS "평균산정월수"
    ),
    ranked AS (
      SELECT
        a."기준년월일",
        SUBSTR(a."기준년월일", 1, 6) AS "기준년월",
        a."고객식별자",
        a."사업자등록번호",
        a."기업명",
        a."금월신용카드이용금액",
        a."금월체크카드이용금액",
        ROW_NUMBER() OVER (
          PARTITION BY a."고객식별자", SUBSTR(a."기준년월일", 1, 6)
          ORDER BY a."기준년월일" DESC
        ) AS rn
      FROM card_system.tbdaa1d12 a
      WHERE a."기준년월일"
        BETWEEN CONCAT('{기간_시작}', '01') AND CONCAT('{기간_종료}', '31')
        AND (
          '{기업명}' = '__ALL__'
          OR REGEXP_REPLACE(LOWER(COALESCE(a."기업명", '')), '\s+', '')
            LIKE REGEXP_REPLACE(LOWER(CONCAT('%', '{기업명}', '%')), '\s+', '')
        )
    ),
    monthly AS (
      SELECT
        r."기준년월",
        r."고객식별자",
        r."사업자등록번호",
        r."기업명",
        COALESCE(r."금월신용카드이용금액", 0) AS "신용카드이용금액",
        COALESCE(r."금월체크카드이용금액", 0) AS "체크카드이용금액"
      FROM ranked r
      WHERE r.rn = 1
    ),
    aggregated AS (
      SELECT
        m."고객식별자",
        m."사업자등록번호",
        m."기업명",
        COUNT(DISTINCT m."기준년월") AS "데이터보유월수",
        MAX(p."평균산정월수") AS "평균산정월수",
        SUM(m."신용카드이용금액") AS "기간신용카드이용금액",
        SUM(m."체크카드이용금액") AS "기간체크카드이용금액",
        SUM(m."신용카드이용금액" + m."체크카드이용금액") AS "기간총이용금액",
        SUM(m."신용카드이용금액" + m."체크카드이용금액")
          / NULLIF(CAST(MAX(p."평균산정월수") AS DOUBLE), 0.0) AS "월평균이용금액"
      FROM monthly m
      CROSS JOIN params p
      GROUP BY
        m."고객식별자",
        m."사업자등록번호",
        m."기업명"
    )
    SELECT
      a."고객식별자",
      a."사업자등록번호",
      a."기업명",
      a."데이터보유월수",
      a."평균산정월수",
      a."기간신용카드이용금액",
      a."기간체크카드이용금액",
      a."기간총이용금액",
      a."월평균이용금액"
    FROM aggregated a
    WHERE a."월평균이용금액" >= {월평균금액}
    ORDER BY a."월평균이용금액" DESC
    LIMIT {limit}
  parameters:
    기간_시작:
      type: string
      description: 월평균 이용금액 산정 시작 기준년월(YYYYMM)
      required: true
    기간_종료:
      type: string
      description: 월평균 이용금액 산정 종료 기준년월(YYYYMM)
      required: true
    기업명:
      type: like_string
      description: 특정 기업명 검색어. 미지정 시 전체 기업
      default: __ALL__
    월평균금액:
      type: integer
      description: 기업별 월평균 이용금액 하한. 미지정 시 0원
      default: 0
    limit:
      type: integer
      description: 기업 목록 제한 건수
      default: '1000000'
