- name: daily_sales_amount
  question: 일별 매출금액을 알려줘
  sql: |
    SELECT
      전표매출년월일,
      COUNT(DISTINCT 매출전표번호) AS 매출건수,
      SUM(매출금액) AS 총매출금액
    FROM card_system.tbdaabt30
    WHERE 개인기업구분코드 = '2'
      AND (전표취소구분코드 IS NULL OR 전표취소구분코드 = '0')
    GROUP BY 전표매출년월일
    ORDER BY 전표매출년월일
  tags:
  - 매출
  - 일별
  - 시계열
- name: merchant_monthly_trend
  question: 가맹점 월별 매출 추이를 보여줘
  sql: |
    SELECT
      기준년월,
      SUM(가맹점일시불매출금액 + 가맹점할부매출금액) AS 총매출금액,
      SUM(가맹점일시불매출건수 + 가맹점할부매출건수) AS 총매출건수,
      SUM(가맹점수입수수료) AS 수수료수입
    FROM card_system.tmdaa5e11
    GROUP BY 기준년월
    ORDER BY 기준년월
  tags:
  - 가맹점
  - 월별
  - 시계열
- name: merchant_yoy_growth
  question: 가맹점 전년대비 매출 성장률은?
  sql: |
    SELECT
      가맹점번호,
      가맹점명,
      SUM(금년가맹점신용판매매출금액) AS 금년매출,
      SUM(전년가맹점신용판매매출금액) AS 전년매출,
      CASE
        WHEN SUM(전년가맹점신용판매매출금액) > 0
        THEN CAST((SUM(금년가맹점신용판매매출금액) - SUM(전년가맹점신용판매매출금액)) AS DOUBLE)
             / SUM(전년가맹점신용판매매출금액)
        ELSE NULL
      END AS 전년대비성장률
    FROM card_system.tmdaa5e11
    GROUP BY 가맹점번호, 가맹점명
    HAVING SUM(전년가맹점신용판매매출금액) > 0
    ORDER BY 전년대비성장률 DESC
  tags:
  - 가맹점
  - 성장률
  - YoY
- name: review_by_credit_grade
  question: 신용등급별 심사 현황을 보여줘
  sql: |
    SELECT
      신용평가등급코드 AS 신용등급,
      COUNT(DISTINCT 신청서접수번호) AS 심사건수,
      COUNT(DISTINCT CASE WHEN 카드처리결과구분코드 = '01' THEN 신청서접수번호 END) AS 승인건수,
      AVG(최종부여한도금액) AS 평균부여한도,
      AVG(자산총계금액) AS 평균자산총계,
      AVG(매출금액) AS 평균매출
    FROM card_system.tbdaaaf23
    WHERE 신용평가등급코드 IS NOT NULL
    GROUP BY 신용평가등급코드
    ORDER BY 신용평가등급코드
  tags:
  - 심사
  - 신용등급
  - 집계
- name: fee_rate_by_industry
  question: 업종별 평균 수수료율은?
  sql: |
    SELECT
      b.업종대분류코드명,
      b.가맹점업종명,
      AVG(a.신용카드가맹점수수료율) AS 평균신용수수료율,
      AVG(a.체크카드수수료율) AS 평균체크수수료율,
      SUM(a.가맹점수입수수료) AS 수수료수입합계
    FROM card_system.tmdaa5e11 a
    JOIN card_system.tbdaadb17 b
      ON a.가맹점업종코드 = b.가맹점업종코드
    GROUP BY b.업종대분류코드명, b.가맹점업종명
    ORDER BY 수수료수입합계 DESC
  tags:
  - 수수료
  - 업종
  - 분석
- name: corporate_customer_card_holdings
  question: 기업고객별 카드 보유 현황을 보여줘
  sql: |
    SELECT
      고객식별자,
      기업검색명 AS 기업명,
      SUM(유효신용카드수) AS 유효신용카드,
      SUM(유효체크카드수) AS 유효체크카드,
      SUM(기업보유실물카드수) AS 실물카드수,
      SUM(금월일시불이용금액 + 금월할부이용금액 + 금월ca이용금액) AS 당월총이용금액
    FROM card_system.tmdaa2e17
    GROUP BY 고객식별자, 기업검색명
    ORDER BY 당월총이용금액 DESC
  tags:
  - 고객
  - 카드보유
  - 이용금액
- name: sales_target_individual_merchant_no_personal_card
  question: 개인사업자 가맹점주 영업추진 대상(개인카드 미보유) 추출해줘
  description: |
    특정 업종의 개인사업자 가맹점 중 대표자가 유효 개인카드(신용/체크)를 보유하지 않은 영업추진 대상을 추출합니다. 월 가맹점 매출금액도 함께 조회합니다.
  sql: |
    SELECT
        a.기준년월,
        a.가맹점번호,
        a.가맹점명,
        a.사업자등록번호,
        a.대표고객식별자,
        a.가맹점업종코드,
        a.가맹점관리부점코드,
        a.가맹점거래정지상태구분코드,
        COALESCE(c.가맹점일시불매출금액, 0) + COALESCE(c.가맹점할부매출금액, 0) AS 월가맹점매출금액
    FROM card_system.tmdaa5d01 a
    LEFT JOIN card_system.tmdaa3e16 b
        ON  a.대표고객식별자 = b.고객식별자
        AND a.기준년월      = b.기준년월
        AND b.개인기업구분코드       = '1'
        AND b.상품중분류구분코드     IN ('CP01', 'CP04')
        AND (b.유효신용카드여부 = '1' OR b.유효체크카드여부 = '1')
    LEFT JOIN card_system.tmdaa5e11 c
        ON  a.가맹점번호 = c.가맹점번호
        AND a.기준년월   = c.기준년월
    WHERE
        a.가맹점업종코드 IN ({업종코드목록})
        AND a.가맹점거래정지상태구분코드 IN ('1', '2')
        AND a.가맹점사업주체구분코드 = '1'
        AND b.고객식별자 IS NULL
    ORDER BY
        a.기준년월 DESC,
        월가맹점매출금액 DESC
  parameters:
    업종코드목록:
      type: list
      description: 대상 가맹점 업종코드 목록 (쉼표 구분)
      default: '''7005'',''5605'',''7002'',''7003'',''7007'''
      sample_values:
      - '''7005'',''5605'',''7002'',''7003'',''7007'''
      - '''7005'',''7002'''
    기준년월:
      type: string
      description: 조회 기준년월 (YYYYMM). 미지정 시 전체 기간.
      required: false
  tags:
  - 영업추진
  - 개인사업자
  - 가맹점
  - 개인카드미보유
  - 영업대상
  - 추출
- name: sales_by_industry_period
  question: 특정 기간 업종별 법인카드 매출을 분석해줘
  description: |
    기간과 업종 필터를 지정하여 업종별 매출금액/건수를 분석합니다. 법인카드(개인기업구분코드='2') 정상거래만 대상입니다.
  sql: |
    SELECT
      b.업종대분류코드명,
      b.가맹점업종명,
      SUM(a.매출금액) AS 총매출금액,
      COUNT(DISTINCT a.매출전표번호) AS 매출건수,
      AVG(a.매출금액) AS 건당평균금액
    FROM card_system.tbdaabt30 a
    JOIN card_system.tbdaadb17 b
      ON a.가맹점업종코드 = b.가맹점업종코드
    WHERE a.개인기업구분코드 = '2'
      AND (a.전표취소구분코드 IS NULL OR a.전표취소구분코드 = '0')
      AND a.전표매출년월일 BETWEEN '{기간_시작}' AND '{기간_종료}'
    GROUP BY b.업종대분류코드명, b.가맹점업종명
    ORDER BY 총매출금액 DESC
    LIMIT {limit}
  parameters:
    기간_시작:
      type: string
      description: 시작 기준년월일 (YYYYMMDD). YYYYMM 입력 시 뒤에 '01' 자동 추가.
      required: true
      sample_values:
      - '20250301'
      - '20260101'
    기간_종료:
      type: string
      description: 종료 기준년월일 (YYYYMMDD). YYYYMM 입력 시 해당 월 말일로 확장.
      required: true
      sample_values:
      - '20250331'
      - '20260430'
    limit:
      type: integer
      description: 결과 행수 제한
      default: '20'
  tags:
  - 업종
  - 매출
  - 기간필터
  - 법인카드
  - 파라미터
- name: top_merchants_by_revenue_period
  question: 특정 기간 매출 상위 가맹점을 조회해줘
  description: |
    기간/업종/가맹점명 필터를 지정하여 매출 상위 가맹점 순위를 조회합니다.
  sql: |
    SELECT
      a.가맹점번호,
      a.가맹점명,
      b.가맹점업종명,
      b.업종대분류코드명,
      SUM(a.가맹점일시불매출금액 + a.가맹점할부매출금액) AS 총매출금액,
      SUM(a.가맹점일시불매출건수 + a.가맹점할부매출건수) AS 총매출건수,
      AVG(a.신용카드가맹점수수료율) AS 평균수수료율
    FROM card_system.tmdaa5e11 a
    JOIN card_system.tbdaadb17 b
      ON a.가맹점업종코드 = b.가맹점업종코드
    WHERE a.기준년월 BETWEEN '{기간_시작}' AND '{기간_종료}'
    GROUP BY a.가맹점번호, a.가맹점명, b.가맹점업종명, b.업종대분류코드명
    ORDER BY 총매출금액 DESC
    LIMIT {limit}
  parameters:
    기간_시작:
      type: string
      description: 시작 기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202501'
      - '202601'
    기간_종료:
      type: string
      description: 종료 기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202503'
      - '202604'
    limit:
      type: integer
      description: 상위 N개 결과
      default: '10'
  tags:
  - 가맹점
  - 랭킹
  - 매출
  - 기간필터
  - TOP-N
  - 파라미터
- name: corporate_delinquency_detail
  question: 특정 기업의 연체 상세 현황을 보여줘
  description: |
    기업명/기간으로 필터링하여 월별 연체 상세 현황(한도, 이용금액, 연체금액, 연체율)을 조회합니다.
  sql: |
    SELECT
      작업기준년월,
      상호명,
      사업자등록번호,
      기업계열명,
      SUM(총한도금액) AS 총한도,
      SUM(카드이용합계금액) AS 총이용금액,
      SUM(신용판매이용금액) AS 신용판매이용,
      SUM(할부이용금액) AS 할부이용,
      SUM(ca이용금액) AS CA이용,
      SUM(연체금액) AS 연체금액,
      CASE
        WHEN SUM(카드이용합계금액) > 0
        THEN ROUND((CAST(SUM(연체금액) AS DOUBLE) / SUM(카드이용합계금액)) * 100, 2)
        ELSE 0
      END AS 연체율_퍼센트
    FROM card_system.tbdaaha97
    WHERE 상호명 LIKE '%{기업명}%'
    GROUP BY 작업기준년월, 상호명, 사업자등록번호, 기업계열명
    ORDER BY 작업기준년월 DESC
  parameters:
    기업명:
      type: string
      description: 기업 상호명 (부분일치 검색)
      required: true
      sample_values:
      - 삼성
      - 현대
      - LG
    기간_시작:
      type: string
      description: 시작 작업기준년월 (YYYYMM)
      required: false
    기간_종료:
      type: string
      description: 종료 작업기준년월 (YYYYMM)
      required: false
  tags:
  - 연체
  - 기업
  - 상세
  - 월별
  - 여신
  - 파라미터
- name: review_approval_by_period
  question: 특정 기간의 기업카드 심사 승인율을 분석해줘
  description: |
    기간/신용등급/기업규모 필터를 지정하여 심사 승인 현황을 분석합니다.
  sql: |
    SELECT
      신용평가등급코드 AS 신용등급,
      고객군형태구분코드 AS 고객유형,
      COUNT(DISTINCT 신청서접수번호) AS 총심사건수,
      COUNT(DISTINCT CASE WHEN 카드처리결과구분코드 = '01' THEN 신청서접수번호 END) AS 승인건수,
      COUNT(DISTINCT CASE WHEN 카드처리결과구분코드 = '02' THEN 신청서접수번호 END) AS 거절건수,
      ROUND(CAST(COUNT(DISTINCT CASE WHEN 카드처리결과구분코드 = '01' THEN 신청서접수번호 END) AS DOUBLE)
            / NULLIF(COUNT(DISTINCT 신청서접수번호), 0) * 100, 2) AS 승인율_퍼센트,
      AVG(최종부여한도금액) AS 평균부여한도,
      AVG(자산총계금액) AS 평균자산총계
    FROM card_system.tbdaaaf23
    WHERE 최종심사년월일 BETWEEN '{기간_시작}' AND '{기간_종료}'
    GROUP BY 신용평가등급코드, 고객군형태구분코드
    ORDER BY 신용평가등급코드, 고객군형태구분코드
  parameters:
    기간_시작:
      type: string
      description: 시작 심사년월일 (YYYYMMDD). YYYYMM 입력 시 '01' 자동 추가.
      required: true
      sample_values:
      - '20250101'
      - '20260101'
    기간_종료:
      type: string
      description: 종료 심사년월일 (YYYYMMDD). YYYYMM 입력 시 해당 월 말일로 확장.
      required: true
      sample_values:
      - '20251231'
      - '20260430'
    신용등급:
      type: string
      description: 특정 신용평가등급코드 필터
      required: false
  tags:
  - 심사
  - 승인율
  - 기간필터
  - 신용등급
  - 고객유형
  - 파라미터
- name: card_brand_usage_analysis
  question: 카드 브랜드별 법인카드 이용 현황을 분석해줘
  description: |
    카드 브랜드(VISA, Master, 국내 등)별로 법인카드 이용금액/건수를 분석합니다.
  sql: |
    SELECT
      카드브랜드구분코드 AS 카드브랜드,
      COUNT(DISTINCT 카드구분키번호) AS 카드수,
      SUM(금월이용합계건수) AS 총이용건수,
      SUM(금월이용합계금액) AS 총이용금액,
      SUM(금월일시불이용금액) AS 일시불이용,
      SUM(금월할부이용금액) AS 할부이용,
      SUM(금월ca이용금액) AS CA이용,
      ROUND(CAST(SUM(금월이용합계금액) AS DOUBLE) / NULLIF(SUM(금월이용합계건수), 0), 0) AS 건당평균금액
    FROM card_system.tmdaa3e16
    WHERE 개인기업구분코드 = '2'
      AND 기준년월 BETWEEN '{기간_시작}' AND '{기간_종료}'
    GROUP BY 카드브랜드구분코드
    ORDER BY 총이용금액 DESC
  parameters:
    기간_시작:
      type: string
      description: 시작 기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202501'
      - '202601'
    기간_종료:
      type: string
      description: 종료 기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202512'
      - '202604'
  tags:
  - 카드브랜드
  - VISA
  - Master
  - 이용금액
  - 법인카드
  - 파라미터
- name: merchant_monthly_sales_by_number
  question: 가맹점번호로 해당 가맹점의 월별 매출금액을 알려줘
  description: 명시한 가맹점번호와 정확히 일치하는 가맹점의 월별 일시불·할부 매출금액을 반환합니다.
  sql: |
    SELECT
      a."기준년월",
      a."가맹점번호",
      a."가맹점명",
      COALESCE(a."가맹점일시불매출금액", 0)
        + COALESCE(a."가맹점할부매출금액", 0) AS "월별매출금액"
    FROM card_system.tmdaa5e11 a
    WHERE a."가맹점번호" = '{가맹점번호}'
    ORDER BY a."기준년월"
  parameters:
    가맹점번호:
      type: string
      description: 정확히 일치시킬 가맹점번호
      required: true
      sample_values:
      - '595931113'
  tags:
  - 가맹점번호
  - 가맹점ID
  - 월별
  - 매출금액
  - tmdaa5e11
  - Athena
- name: merchant_sales_comparison
  question: 특정 가맹점의 매출 추이를 보여줘
  description: |
    가맹점명·브랜드 검색어에 부분일치하는 모든 가맹점의 일시불/할부 매출을 합산하여 월별 전체 매출 추이를 조회합니다.
    가맹점별 상세가 필요한 질문은 이 템플릿이 아니라 자동 SQL 생성 경로를 사용합니다.
  sql: |
    SELECT
      a."기준년월",
      SUM(COALESCE(a."가맹점일시불매출금액", 0)) AS "일시불매출",
      SUM(COALESCE(a."가맹점할부매출금액", 0)) AS "할부매출",
      SUM(COALESCE(a."가맹점일시불매출금액", 0) + COALESCE(a."가맹점할부매출금액", 0)) AS "총매출금액",
      SUM(COALESCE(a."가맹점일시불매출건수", 0) + COALESCE(a."가맹점할부매출건수", 0)) AS "총매출건수",
      SUM(COALESCE(a."가맹점수입수수료", 0)) AS "수수료수입",
      AVG(a."신용카드가맹점수수료율") AS "평균수수료율"
    FROM card_system.tmdaa5e11 a
    WHERE a."가맹점명" LIKE '%{가맹점명}%'
      AND a."기준년월" BETWEEN '{기간_시작}' AND '{기간_종료}'
    GROUP BY a."기준년월"
    ORDER BY a."기준년월"
  parameters:
    가맹점명:
      type: string
      description: 가맹점명 (부분일치 검색)
      required: true
      sample_values:
      - 스타벅스
      - CU
      - GS25
    기간_시작:
      type: string
      description: 시작 기준년월 (YYYYMM)
      required: true
    기간_종료:
      type: string
      description: 종료 기준년월 (YYYYMM)
      required: true
  tags:
  - 가맹점
  - 매출추이
  - 월별
  - 시계열
  - 검색
  - 파라미터
- name: corporate_credit_risk_summary
  question: 기업 계열별 여신 리스크 현황을 보여줘
  description: |
    기업계열별로 총한도, 이용금액, 연체금액, 한도사용률, 연체율을 종합 분석합니다.
  sql: |
    SELECT
      기업계열명,
      COUNT(DISTINCT 사업자등록번호) AS 기업수,
      SUM(총한도금액) AS 총한도,
      SUM(카드이용합계금액) AS 총이용금액,
      SUM(연체금액) AS 총연체금액,
      CASE
        WHEN SUM(총한도금액) > 0
        THEN ROUND((CAST(SUM(카드이용합계금액) AS DOUBLE) / SUM(총한도금액)) * 100, 2)
        ELSE 0
      END AS 한도사용률_퍼센트,
      CASE
        WHEN SUM(카드이용합계금액) > 0
        THEN ROUND((CAST(SUM(연체금액) AS DOUBLE) / SUM(카드이용합계금액)) * 100, 2)
        ELSE 0
      END AS 연체율_퍼센트
    FROM card_system.tbdaaha97
    WHERE 기업계열명 IS NOT NULL
      AND 작업기준년월 BETWEEN '{기간_시작}' AND '{기간_종료}'
    GROUP BY 기업계열명
    ORDER BY 총이용금액 DESC
    LIMIT {limit}
  parameters:
    기간_시작:
      type: string
      description: 시작 작업기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202501'
      - '202601'
    기간_종료:
      type: string
      description: 종료 작업기준년월 (YYYYMM)
      required: true
      sample_values:
      - '202512'
      - '202604'
    limit:
      type: integer
      description: 결과 행수 제한
      default: '20'
  tags:
  - 계열사
  - 여신
  - 리스크
  - 한도사용률
  - 연체율
  - 파라미터
- name: online_offline_sales_ratio
  question: 온라인/오프라인 매출 비율을 분석해줘
  description: |
    특정 기간의 법인카드 온라인/오프라인 거래 비율을 업종별로 분석합니다.
  sql: |
    SELECT
      b.업종대분류코드명,
      a.온라인거래여부,
      COUNT(DISTINCT a.매출전표번호) AS 거래건수,
      SUM(a.매출금액) AS 총매출금액,
      ROUND(AVG(a.매출금액), 0) AS 건당평균금액
    FROM card_system.tbdaabt30 a
    JOIN card_system.tbdaadb17 b
      ON a.가맹점업종코드 = b.가맹점업종코드
    WHERE a.개인기업구분코드 = '2'
      AND (a.전표취소구분코드 IS NULL OR a.전표취소구분코드 = '0')
      AND a.전표매출년월일 BETWEEN '{기간_시작}' AND '{기간_종료}'
    GROUP BY b.업종대분류코드명, a.온라인거래여부
    ORDER BY b.업종대분류코드명, a.온라인거래여부
  parameters:
    기간_시작:
      type: string
      description: 시작 기준년월일 (YYYYMMDD). YYYYMM 입력 시 '01' 자동 추가.
      required: true
      sample_values:
      - '20250301'
      - '20260101'
    기간_종료:
      type: string
      description: 종료 기준년월일 (YYYYMMDD). YYYYMM 입력 시 해당 월 말일로 확장.
      required: true
      sample_values:
      - '20250331'
      - '20260430'
  tags:
  - 온라인
  - 오프라인
  - 매출비율
  - 업종별
  - 법인카드
  - 파라미터
- name: installment_analysis
  question: 할부 거래 현황을 분석해줘
  description: |
    특정 기간의 법인카드 할부 거래를 할부개월 구간별로 분석합니다.
  sql: |
    SELECT
      CASE
        WHEN 할부기간개월수 = 0 THEN '일시불'
        WHEN 할부기간개월수 BETWEEN 1 AND 3 THEN '1~3개월'
        WHEN 할부기간개월수 BETWEEN 4 AND 6 THEN '4~6개월'
        WHEN 할부기간개월수 BETWEEN 7 AND 12 THEN '7~12개월'
        ELSE '12개월 초과'
      END AS 할부구간,
      COUNT(DISTINCT 매출전표번호) AS 거래건수,
      SUM(매출금액) AS 총매출금액,
      ROUND(AVG(매출금액), 0) AS 건당평균금액,
      ROUND(AVG(할부기간개월수), 1) AS 평균할부개월
    FROM card_system.tbdaabt30
    WHERE 개인기업구분코드 = '2'
      AND (전표취소구분코드 IS NULL OR 전표취소구분코드 = '0')
      AND 전표매출년월일 BETWEEN '{기간_시작}' AND '{기간_종료}'
    GROUP BY
      CASE
        WHEN 할부기간개월수 = 0 THEN '일시불'
        WHEN 할부기간개월수 BETWEEN 1 AND 3 THEN '1~3개월'
        WHEN 할부기간개월수 BETWEEN 4 AND 6 THEN '4~6개월'
        WHEN 할부기간개월수 BETWEEN 7 AND 12 THEN '7~12개월'
        ELSE '12개월 초과'
      END
    ORDER BY 총매출금액 DESC
  parameters:
    기간_시작:
      type: string
      description: 시작 기준년월일 (YYYYMMDD). YYYYMM 입력 시 '01' 자동 추가.
      required: true
      sample_values:
      - '20250101'
      - '20260101'
    기간_종료:
      type: string
      description: 종료 기준년월일 (YYYYMMDD). YYYYMM 입력 시 해당 월 말일로 확장.
      required: true
      sample_values:
      - '20251231'
      - '20260430'
  tags:
  - 할부
  - 할부개월
  - 거래분석
  - 법인카드
  - 파라미터
- name: corporate_customer_monthly_usage
  question: 특정 기업의 월별 카드 이용 내역을 보여줘
  description: |
    기업검색명으로 검색하여 해당 기업의 월별 카드 이용 상세(일시불/할부/CA/주유/국세 등)를 조회합니다.
  sql: |
    SELECT
      기준년월,
      고객식별자,
      기업검색명,
      SUM(유효신용카드수) AS 유효신용카드,
      SUM(유효체크카드수) AS 유효체크카드,
      SUM(금월일시불이용금액) AS 일시불이용,
      SUM(금월할부이용금액) AS 할부이용,
      SUM(금월ca이용금액) AS CA이용,
      SUM(금월일시불이용금액 + 금월할부이용금액 + 금월ca이용금액) AS 총이용금액,
      SUM(금월주유이용금액) AS 주유이용,
      SUM(금월국세이용금액 + 금월지방세이용금액) AS 세금납부,
      SUM(금월4대보험이용금액) AS 보험납부
    FROM card_system.tmdaa2e17
    WHERE 기업검색명 LIKE '%{기업명}%'
    GROUP BY 기준년월, 고객식별자, 기업검색명
    ORDER BY 기준년월 DESC
  parameters:
    기업명:
      type: string
      description: 기업검색명 (부분일치 검색)
      required: true
      sample_values:
      - 삼성
      - 현대
      - KB
    기간_시작:
      type: string
      description: 시작 기준년월 (YYYYMM)
      required: false
    기간_종료:
      type: string
      description: 종료 기준년월 (YYYYMM)
      required: false
  tags:
  - 기업고객
  - 월별
  - 이용내역
  - 상세
  - 검색
  - 파라미터
- name: current_corporate_half_year_usage_decline
  question: 현재 유효 기업카드 보유회원의 두 반기 이용금액 하락 현황을 알려줘
  description: |
    데이터의 최신 기준월에 유효 기업카드를 보유한 기업회원만 대상으로 고객·월 최신행의
    신용·체크 이용금액을 두 반기별로 합산하고, 대상 반기 이용금액이 기준 반기보다 하락한
    모든 기업회원을 하락금액 내림차순으로 반환합니다. 결과 행수 제한은 적용하지 않습니다.
  sql: |
    WITH latest_month AS (
      SELECT MAX(SUBSTR(a."기준년월일", 1, 6)) AS "현재기준년월"
      FROM card_system.tbdaa1d12 a
    ),
    current_ranked AS (
      SELECT
        a."기준년월일" AS "현재기준일",
        a."고객식별자",
        a."사업자등록번호",
        a."기업명",
        a."유효기업신용카드수",
        a."유효기업체크카드수",
        ROW_NUMBER() OVER (
          PARTITION BY a."고객식별자"
          ORDER BY a."기준년월일" DESC
        ) AS rn
      FROM card_system.tbdaa1d12 a
      CROSS JOIN latest_month l
      WHERE SUBSTR(a."기준년월일", 1, 6) = l."현재기준년월"
    ),
    current_members AS (
      SELECT
        c."현재기준일",
        c."고객식별자",
        c."사업자등록번호",
        c."기업명"
      FROM current_ranked c
      WHERE c.rn = 1
        AND (
          COALESCE(c."유효기업신용카드수", 0)
          + COALESCE(c."유효기업체크카드수", 0)
        ) > 0
    ),
    usage_ranked AS (
      SELECT
        SUBSTR(a."기준년월일", 1, 6) AS "기준년월",
        a."고객식별자",
        a."금월신용카드이용금액",
        a."금월체크카드이용금액",
        ROW_NUMBER() OVER (
          PARTITION BY a."고객식별자", SUBSTR(a."기준년월일", 1, 6)
          ORDER BY a."기준년월일" DESC
        ) AS rn
      FROM card_system.tbdaa1d12 a
      WHERE SUBSTR(a."기준년월일", 1, 6)
          BETWEEN '{기준기간_시작}' AND '{기준기간_종료}'
        OR SUBSTR(a."기준년월일", 1, 6)
          BETWEEN '{대상기간_시작}' AND '{대상기간_종료}'
    ),
    monthly_usage AS (
      SELECT
        u."기준년월",
        u."고객식별자",
        COALESCE(u."금월신용카드이용금액", 0)
          + COALESCE(u."금월체크카드이용금액", 0) AS "전체이용금액"
      FROM usage_ranked u
      WHERE u.rn = 1
    ),
    usage_totals AS (
      SELECT
        u."고객식별자",
        SUM(
          CASE
            WHEN u."기준년월" BETWEEN '{기준기간_시작}' AND '{기준기간_종료}'
              THEN u."전체이용금액"
            ELSE 0
          END
        ) AS "기준기간이용금액",
        SUM(
          CASE
            WHEN u."기준년월" BETWEEN '{대상기간_시작}' AND '{대상기간_종료}'
              THEN u."전체이용금액"
            ELSE 0
          END
        ) AS "대상기간이용금액"
      FROM monthly_usage u
      GROUP BY u."고객식별자"
    ),
    compared AS (
      SELECT
        c."현재기준일",
        c."고객식별자",
        c."사업자등록번호",
        c."기업명",
        u."기준기간이용금액",
        u."대상기간이용금액",
        u."기준기간이용금액" - u."대상기간이용금액" AS "하락금액"
      FROM current_members c
      JOIN usage_totals u
        ON c."고객식별자" = u."고객식별자"
    )
    SELECT
      c."현재기준일",
      c."고객식별자",
      c."사업자등록번호",
      c."기업명",
      c."기준기간이용금액",
      c."대상기간이용금액",
      c."하락금액"
    FROM compared c
    WHERE c."대상기간이용금액" < c."기준기간이용금액"
    ORDER BY c."하락금액" DESC, c."기업명", c."고객식별자"
  parameters:
    기준기간_시작:
      type: string
      description: 대비 기준이 되는 첫 번째 반기의 시작 기준년월(YYYYMM)
      required: true
    기준기간_종료:
      type: string
      description: 대비 기준이 되는 첫 번째 반기의 종료 기준년월(YYYYMM)
      required: true
    대상기간_시작:
      type: string
      description: 비교 대상이 되는 두 번째 반기의 시작 기준년월(YYYYMM)
      required: true
    대상기간_종료:
      type: string
      description: 비교 대상이 되는 두 번째 반기의 종료 기준년월(YYYYMM)
      required: true
  tags:
  - 현재유효기업카드
  - 기업회원
  - 반기비교
  - 이용금액하락
  - 이용금액감소
  - tbdaa1d12
  - Athena
- name: named_corporate_half_year_usage
  question: 특정 기업의 작년과 올해 반기별 이용금액 실적을 알려줘
  description: |
    기업명을 부분일치로 검색하고 기업고객 일별 스냅샷을 고객별 월 최신행으로 축소한 뒤,
    전년 1월부터 금년 현재월까지 신용·체크카드 이용금액을 반기별로 합산합니다.
  sql: |
    WITH monthly_latest AS (
      SELECT
        SUBSTR(a."기준년월일", 1, 6) AS "기준년월",
        a."고객식별자",
        a."기업명",
        a."금월신용카드이용금액",
        a."금월체크카드이용금액",
        ROW_NUMBER() OVER (
          PARTITION BY SUBSTR(a."기준년월일", 1, 6), a."고객식별자"
          ORDER BY a."기준년월일" DESC
        ) AS rn
      FROM card_system.tbdaa1d12 a
      WHERE LOWER(COALESCE(a."기업명", ''))
        LIKE LOWER(CONCAT('%', '{기업명}', '%')) ESCAPE '\'
        AND SUBSTR(a."기준년월일", 1, 6)
          BETWEEN '{기간_시작}' AND '{기간_종료}'
    )
    SELECT
      SUBSTR(m."기준년월", 1, 4) AS "기준연도",
      CASE
        WHEN SUBSTR(m."기준년월", 5, 2) BETWEEN '01' AND '06' THEN '상반기'
        ELSE '하반기'
      END AS "반기",
      MAX(m."기준년월") AS "최종반영년월",
      SUM(COALESCE(m."금월신용카드이용금액", 0)) AS "신용카드이용금액",
      SUM(COALESCE(m."금월체크카드이용금액", 0)) AS "체크카드이용금액",
      SUM(
        COALESCE(m."금월신용카드이용금액", 0)
        + COALESCE(m."금월체크카드이용금액", 0)
      ) AS "총이용금액"
    FROM monthly_latest m
    WHERE m.rn = 1
    GROUP BY 1, 2
    ORDER BY 1, 2
  parameters:
    기업명:
      type: string
      description: 기업명에서 찾을 기업회원 검색어
      required: true
    기간_시작:
      type: string
      description: 이용실적 집계 시작 기준년월(YYYYMM)
      required: true
    기간_종료:
      type: string
      description: 이용실적 집계 종료 기준년월(YYYYMM)
      required: true
