- name: merchant_portfolio_allowance_rate
  question: 지정 월 특정 가맹점 또는 브랜드 운영 기업의 대손충당금률을 알려줘
  description: 월 가맹점 스냅샷에서 기업고객을 중복 제거한 뒤 같은 월 대손충당금과 연결해 원화대출잔액 대비 기대대손충당금 비율을 계산합니다.
  sql: |
    WITH merchant_customers AS (
      SELECT DISTINCT
        m."기업고객식별자"
      FROM card_system.tmdaa5d01 m
      WHERE m."기준년월" = '{기준년월}'
        AND (
          LOWER(COALESCE(m."가맹점명", ''))
            LIKE LOWER(CONCAT('%', '{가맹점명}', '%')) ESCAPE '\'
          OR LOWER(COALESCE(m."한글가맹점명", ''))
            LIKE LOWER(CONCAT('%', '{가맹점명}', '%')) ESCAPE '\'
        )
        AND m."기업고객식별자" IS NOT NULL
    )
    SELECT
      p."기준년월",
      SUM(p."원화대출잔액") AS "원화대출잔액",
      SUM(p."기대대손충당금") AS "기대대손충당금",
      ROUND(
        CAST(SUM(p."기대대손충당금") AS DOUBLE)
          / NULLIF(CAST(SUM(p."원화대출잔액") AS DOUBLE), 0.0)
          * 100,
        4
      ) AS "대손충당금률_퍼센트"
    FROM card_system.tbmewcm94 p
    INNER JOIN merchant_customers c
      ON p."고객식별자" = c."기업고객식별자"
    WHERE p."기준년월" = '{기준년월}'
      AND p."개인기업구분코드" = '2'
    GROUP BY p."기준년월"
  parameters:
    기준년월:
      type: string
      description: 대손충당금률을 계산할 기준년월(YYYYMM)
      required: true
    가맹점명:
      type: like_string
      description: 가맹점명 또는 브랜드를 찾을 검색어
      required: true
  tags:
  - 가맹점대손율
  - 가맹점주대손율
  - 대손충당금률
  - tmdaa5d01
  - tbmewcm94
  - Athena
