  - 총한도
  - 잔여한도
  - 가용한도
  - 한도소진율
  - 한도사용률
  - tbdaa1d12
  - Athena
- name: corporate_limit_low_utilization_members
  runtime_mode: reference_only
  question: KB국민 기업카드 보유회원 중 한도 2천만원 이상이고 한도 소진율 50% 미만인 기업회원 명단을 알려줘
  description: tbdaa1d12에서 기준월 고객별 최신 일별 스냅샷을 선택한 뒤 유효 기업신용카드 보유, 총한도 하한, 한도소진율 상한 조건을 적용합니다. 한도소진율은 1 - 잔여한도/총한도입니다.
  sql: |
    WITH ranked AS (
      SELECT
        a."기준년월일",
        SUBSTR(a."기준년월일", 1, 6) AS "기준년월",
        a."고객식별자",
        a."사업자등록번호",
        a."기업명",
        a."유효기업신용카드수",
        a."기업총한도금액",
        a."기업총잔여한도금액",
        ROW_NUMBER() OVER (
          PARTITION BY a."고객식별자", SUBSTR(a."기준년월일", 1, 6)
          ORDER BY a."기준년월일" DESC
        ) AS rn
      FROM card_system.tbdaa1d12 a
      WHERE a."기준년월일" BETWEEN CONCAT('{기준년월}', '01') AND CONCAT('{기준년월}', '31')
    ),
    current_snapshot AS (
      SELECT
        r."기준년월",
        r."고객식별자",
        r."사업자등록번호",
        r."기업명",
        r."유효기업신용카드수",
        r."기업총한도금액",
        r."기업총잔여한도금액"
      FROM ranked r
      WHERE r.rn = 1
    ),
    limit_calc AS (
      SELECT
        c."기준년월",
        c."고객식별자",
        c."사업자등록번호",
        c."기업명",
        COALESCE(c."기업총한도금액", 0) AS "기업총한도금액",
        COALESCE(c."기업총잔여한도금액", 0) AS "기업총잔여한도금액",
        CASE
          WHEN COALESCE(c."기업총한도금액", 0) = 0 THEN 0.0
          ELSE 1.0
            - CAST(COALESCE(c."기업총잔여한도금액", 0) AS DOUBLE)
              / NULLIF(CAST(c."기업총한도금액" AS DOUBLE), 0.0)
        END AS "한도소진율"
      FROM current_snapshot c
      WHERE COALESCE(c."유효기업신용카드수", 0) > 0
        AND COALESCE(c."기업총한도금액", 0) >= {한도금액}
    )
    SELECT
      l."고객식별자",
      l."사업자등록번호",
      l."기업명",
      l."기준년월",
      l."기업총한도금액",
      l."기업총잔여한도금액",
      l."한도소진율"
    FROM limit_calc l
    WHERE l."한도소진율" < {한도소진율}
    ORDER BY l."한도소진율" ASC, l."기업총한도금액" DESC
    LIMIT {limit}
  parameters:
    기준년월:
      type: string
      description: 한도와 카드 보유 여부를 판단할 기준년월(YYYYMM)
      required: true
      default: '202604'
      sample_values:
      - '202604'
    한도금액:
      type: integer
      description: 기업 총한도 하한 기준
      default: '20000000'
    한도소진율:
      type: number
      description: 한도소진율 상한 기준. 50%는 0.5
      default: '0.5'
    limit:
      type: integer
      description: 상세 목록 제한 건수
      default: '1000000'
  tags:
  - 기업회원
  - 기업카드
  - 한도
  - 한도소진율
  - 잔여한도
  - 2천만원
  - 50%미만
  - 명단
