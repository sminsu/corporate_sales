- name: corporate_limit_status_at_month
  question: 지정 월 기준 기업별 총한도, 잔여한도와 한도소진율을 알려줘
  description: |
    기업고객 일별 스냅샷을 기준월 고객별 최신행으로 축소하고, 유효 기업카드를 보유한
    기업의 총한도·잔여한도·사용한도와 한도소진율을 반환합니다.
  sql: |
    WITH ranked AS (
      SELECT
        a."기준년월일",
        SUBSTR(a."기준년월일", 1, 6) AS "기준년월",
        a."고객식별자",
        a."사업자등록번호",
        a."기업명",
        a."유효기업신용카드수",
        a."유효기업체크카드수",
        a."기업총한도금액",
        a."기업총잔여한도금액",
        ROW_NUMBER() OVER (
          PARTITION BY a."고객식별자", SUBSTR(a."기준년월일", 1, 6)
          ORDER BY a."기준년월일" DESC
        ) AS rn
      FROM card_system.tbdaa1d12 a
      WHERE a."기준년월일"
        BETWEEN CONCAT('{기준년월}', '01') AND CONCAT('{기준년월}', '31')
        AND (
          '{기업명}' = '__ALL__'
          OR REGEXP_REPLACE(LOWER(COALESCE(a."기업명", '')), '\s+', '')
            LIKE REGEXP_REPLACE(LOWER(CONCAT('%', '{기업명}', '%')), '\s+', '')
        )
    ),
    current_snapshot AS (
      SELECT
        r."기준년월일",
        r."기준년월",
        r."고객식별자",
        r."사업자등록번호",
        r."기업명",
        COALESCE(r."유효기업신용카드수", 0)
          + COALESCE(r."유효기업체크카드수", 0) AS "유효기업카드수",
        COALESCE(r."기업총한도금액", 0) AS "기업총한도금액",
        COALESCE(r."기업총잔여한도금액", 0) AS "기업총잔여한도금액"
      FROM ranked r
      WHERE r.rn = 1
    )
    SELECT
      c."기준년월일" AS "조회기준일",
      c."고객식별자",
      c."사업자등록번호",
      c."기업명",
      c."유효기업카드수",
      c."기업총한도금액",
      c."기업총잔여한도금액",
      c."기업총한도금액" - c."기업총잔여한도금액" AS "기업한도사용금액",
      CASE
        WHEN c."기업총한도금액" > 0 THEN ROUND(
          (
            1.0
            - CAST(c."기업총잔여한도금액" AS DOUBLE)
              / NULLIF(CAST(c."기업총한도금액" AS DOUBLE), 0.0)
          ) * 100,
          2
        )
        ELSE NULL
      END AS "한도소진율_퍼센트"
    FROM current_snapshot c
    WHERE c."유효기업카드수" > 0
    ORDER BY c."기업총한도금액" DESC
    LIMIT {limit}
  parameters:
    기준년월:
      type: string
      description: 기업 한도 현황을 조회할 기준년월(YYYYMM)
      required: true
    기업명:
      type: like_string
      description: 특정 기업명 검색어. 미지정 시 전체 기업
      default: __ALL__
    limit:
      type: integer
      description: 기업 목록 제한 건수
      default: '1000000'
  tags:
  - 기업별
