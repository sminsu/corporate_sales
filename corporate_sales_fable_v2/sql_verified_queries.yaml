- name: managed_company_limit_reduction
  question: 내가 관리하고 있는 기업회원 중 한도 감액이 발생한 기업회원을 알려줘
  description: 관리기업에 대해 tbdaa1d12의 전월·기준월 고객별 최신 스냅샷을 비교하여 기업총한도금액이 순감소한 기업과 감액금액·감액률을 조회합니다. 월 누락을 0원으로 간주하지 않습니다.
  sql: |
    WITH params AS (
      SELECT
        '{기준년월}' AS "기준년월",
        DATE_FORMAT(
          DATE_ADD('month', -1, DATE_PARSE(CONCAT('{기준년월}', '01'), '%Y%m%d')),
          '%Y%m'
        ) AS "전월"
    ),
    managed_scope ("사업자등록번호") AS (
      VALUES {관리기업목록}
    ),
    ranked AS (
      SELECT
        a."고객식별자",
        a."사업자등록번호",
        a."기업명",
        a."기준년월일",
        SUBSTR(a."기준년월일", 1, 6) AS "기준년월",
        COALESCE(a."기업총한도금액", 0) AS "기업총한도금액",
        ROW_NUMBER() OVER (
          PARTITION BY a."고객식별자", SUBSTR(a."기준년월일", 1, 6)
          ORDER BY a."기준년월일" DESC
        ) AS rn
      FROM card_system.tbdaa1d12 a
      CROSS JOIN params p
      WHERE a."기준년월일" BETWEEN CONCAT(p."전월", '01') AND CONCAT(p."기준년월", '31')
    ),
    monthly AS (
      SELECT
        r."고객식별자",
        r."사업자등록번호",
        r."기업명",
        r."기준년월",
        r."기업총한도금액"
      FROM ranked r
      WHERE r.rn = 1
    ),
    current_snapshot AS (
      SELECT
        m."고객식별자",
        m."사업자등록번호",
        m."기업명",
        m."기업총한도금액"
      FROM monthly m
      CROSS JOIN params p
      WHERE m."기준년월" = p."기준년월"
    ),
    previous_snapshot AS (
      SELECT
        m."고객식별자",
        m."기업총한도금액"
      FROM monthly m
      CROSS JOIN params p
      WHERE m."기준년월" = p."전월"
    )
    SELECT
      c."고객식별자",
      c."사업자등록번호",
      c."기업명",
      p."기업총한도금액" AS "전월기업총한도금액",
      c."기업총한도금액" AS "기준월기업총한도금액",
      p."기업총한도금액" - c."기업총한도금액" AS "감액금액",
      CAST(p."기업총한도금액" - c."기업총한도금액" AS DOUBLE)
        / NULLIF(CAST(p."기업총한도금액" AS DOUBLE), 0.0) AS "감액률"
    FROM current_snapshot c
    JOIN previous_snapshot p
      ON c."고객식별자" = p."고객식별자"
    JOIN managed_scope l
      ON c."사업자등록번호" = l."사업자등록번호"
    WHERE c."기업총한도금액" < p."기업총한도금액"
    ORDER BY "감액금액" DESC
    LIMIT {limit}
  parameters:
    관리기업목록:
      type: business_number_list
      description: 파라미터로 직접 입력하고 정규화한 요청별 10자리 사업자등록번호 목록. 쉼표 또는 줄바꿈으로 구분하며 SQL에는 Athena VALUES 행 튜플로만 확장됩니다.
      required: true
      sample_values:
      - ['1234567890', '2345678901']
    기준년월:
      type: string
      description: 전월 대비 한도 감액을 판정할 기준년월(YYYYMM)
      required: true
      default: '202604'
      sample_values:
      - '202604'
    limit:
      type: integer
      description: 한도 감액 기업 목록 제한 건수
      default: '1000000'
  tags:
  - 관리기업
  - 담당기업
  - 한도감액
  - 한도감소
  - 요청별관리기업목록
  - VALUES_CTE
  - tbdaa1d12
  - Athena
- name: brand_active_merchant_count
  question: 도미노 브랜드 가맹점 수 몇 개야
  description: 가맹점 기본(tbdaadt01)의 가맹점명에서 브랜드 검색어를 찾아 지정된 정상 가맹점상태코드의 고유 가맹점 수를 계산합니다. 브랜드명 전용 컬럼이 필요한 월 시점 분석은 tmdaaus01을 사용합니다.
  sql: |
    SELECT
      COUNT(DISTINCT m."가맹점번호") AS "가맹점수"
    FROM card_system.tbdaadt01 m
    WHERE LOWER(COALESCE(m."가맹점명", '')) LIKE LOWER(CONCAT('%', '{가맹점명}', '%')) ESCAPE '\'
      AND m."가맹점상태구분코드" = '{정상가맹점상태코드}'
  parameters:
    가맹점명:
      type: like_string
      description: 가맹점명에서 찾을 브랜드명
      required: true
      default: 도미노
      sample_values:
      - 도미노
    정상가맹점상태코드:
      type: string
      description: 참고질의가 가정한 정상 가맹점 상태 코드. 운영 코드북 확인 후 재설정 가능
      required: false
      default: '1'
      sample_values:
      - '1'
  tags:
  - 브랜드
  - 도미노
  - 가맹점수
  - 정상가맹점
  - tbdaadt01
  - Athena
- name: recent_closed_brand_merchant_count
  question: 최근 일년 이내 폐업한 교촌 치킨 가맹점 수 알려줘
  description: 가맹점 일별 풍성화(tbdaaus01)의 국세청 휴폐업여부가 정상(0)이 아닌 상태로 처음 관측된 기준년월일을 폐업 관측일로 사용해, 최근 N개월 내 지정 브랜드의 고유 가맹점 수를 계산합니다. 실제 국세청 폐업 신고일 컬럼이 없으므로 결과는 최초 폐업 상태 관측일 기준입니다.
  sql: |
    WITH first_closed_observation AS (
      SELECT
        a."가맹점번호",
        MIN(a."기준년월일") AS "최초폐업관측일"
      FROM card_system.tbdaaus01 a
      WHERE COALESCE(a."휴폐업여부", '0') <> '0'
        AND a."기준년월일" <= DATE_FORMAT(CURRENT_DATE, '%Y%m%d')
        AND a."가맹점번호" IS NOT NULL
        AND (
          LOWER(COALESCE(a."가맹점명", '')) LIKE LOWER(CONCAT('%', '{가맹점명}', '%')) ESCAPE '\'
          OR LOWER(COALESCE(a."외부가맹점명", '')) LIKE LOWER(CONCAT('%', '{가맹점명}', '%')) ESCAPE '\'
          OR LOWER(COALESCE(a."브랜드명", '')) LIKE LOWER(CONCAT('%', '{가맹점명}', '%')) ESCAPE '\'
          OR REGEXP_REPLACE(LOWER(COALESCE(a."가맹점명", '')), '\s+', '')
            LIKE REGEXP_REPLACE(LOWER(CONCAT('%', '{가맹점명}', '%')), '\s+', '') ESCAPE '\'
          OR REGEXP_REPLACE(LOWER(COALESCE(a."외부가맹점명", '')), '\s+', '')
            LIKE REGEXP_REPLACE(LOWER(CONCAT('%', '{가맹점명}', '%')), '\s+', '') ESCAPE '\'
          OR REGEXP_REPLACE(LOWER(COALESCE(a."브랜드명", '')), '\s+', '')
            LIKE REGEXP_REPLACE(LOWER(CONCAT('%', '{가맹점명}', '%')), '\s+', '') ESCAPE '\'
        )
      GROUP BY a."가맹점번호"
    )
    SELECT
      DATE_FORMAT(DATE_ADD('month', -{조회기간개월수}, CURRENT_DATE), '%Y%m%d') AS "조회시작일",
      DATE_FORMAT(CURRENT_DATE, '%Y%m%d') AS "조회종료일",
      COUNT(DISTINCT f."가맹점번호") AS "폐업가맹점수"
    FROM first_closed_observation f
    WHERE f."최초폐업관측일" BETWEEN
      DATE_FORMAT(DATE_ADD('month', -{조회기간개월수}, CURRENT_DATE), '%Y%m%d')
      AND DATE_FORMAT(CURRENT_DATE, '%Y%m%d')
  parameters:
    가맹점명:
      type: like_string
      description: 가맹점명·외부가맹점명·브랜드명에서 부분일치로 찾을 이름. 공백을 제외한 표기도 함께 비교합니다.
      required: true
      sample_values:
      - 교촌 치킨
    조회기간개월수:
      type: integer
      description: CURRENT_DATE에서 과거로 조회할 개월 수. 최근 6달은 6, 최근 1년은 12입니다.
      required: true
      sample_values:
      - 6
      - 12
  tags:
  - 최근기간
  - 최근6개월
  - 최근1년
  - 폐업
  - 휴폐업
  - 브랜드
  - 가맹점수
  - 교촌치킨
  - tbdaaus01
  - Athena
- name: brand_merchants_with_corporate_card
  question: 꾸석지 가맹점 중에 기업카드 소지하고 있는 사람 기업고객식별자 리스트 알려줘
  description: 가맹점 일별 풍성화(tbdaaus01)에서 기준월의 가맹점별 최신일 스냅샷을 선택하고 가맹점명 또는 브랜드명으로 검색합니다. 기업 신용카드·체크카드가 명시되면 해당 카드 수만, 포괄적인 기업카드·법인카드는 두 카드 수의 합을 사용해 기업고객식별자를 중복 제거하여 반환합니다.
  sql: |
    WITH ranked AS (
      SELECT
        a."기준년월일",
        a."가맹점번호",
        a."기업고객식별자",
        a."가맹점명",
        a."브랜드명",
        a."유효기업신용카드수",
        a."유효기업체크카드수",
        ROW_NUMBER() OVER (
          PARTITION BY a."가맹점번호", SUBSTR(a."기준년월일", 1, 6)
          ORDER BY a."기준년월일" DESC
        ) AS rn
      FROM card_system.tbdaaus01 a
      WHERE a."기준년월일" BETWEEN CONCAT('{기준년월}', '01') AND CONCAT('{기준년월}', '31')
    )
    SELECT DISTINCT
      r."기업고객식별자"
    FROM ranked r
    WHERE r.rn = 1
      AND (
        LOWER(COALESCE(r."가맹점명", '')) LIKE LOWER(CONCAT('%', '{가맹점명}', '%')) ESCAPE '\'
        OR LOWER(COALESCE(r."브랜드명", '')) LIKE LOWER(CONCAT('%', '{가맹점명}', '%')) ESCAPE '\'
      )
      AND {기업카드보유조건}
      AND r."기업고객식별자" IS NOT NULL
    ORDER BY r."기업고객식별자"
    LIMIT {limit}
  parameters:
    기준년월:
      type: string
      description: 기업카드 보유와 가맹점 정보를 판단할 기준년월(YYYYMM)
      required: true
      default: '202605'
      sample_values:
      - '202605'
    가맹점명:
      type: like_string
      description: 가맹점명 또는 브랜드명에서 찾을 검색어
      required: true
      default: 꾸석지
      sample_values:
      - 꾸석지
    기업카드종류:
      type: string
      semantic_attribute: corporate_card_holding
      description: 기업 신용카드는 credit, 기업 체크카드는 check, 포괄적인 기업카드·법인카드는 all
      default: all
      sample_values:
      - credit
      - check
      - all
    limit:
      type: integer
      description: 기업고객식별자 목록 제한 건수
      default: '1000000'
  tags:
  - 브랜드
  - 꾸석지
  - 기업카드보유
  - 기업신용카드
  - 기업체크카드
  - 기업고객식별자
  - tbdaaus01
  - Athena
- name: brand_merchant_owner_corporate_card_count
  question: 특정 브랜드 가맹점주 중 KB국민카드 기업카드 소지자는 몇 명이야
  description: 최신 가맹점 일별 스냅샷에서 가맹점명 또는 브랜드명으로 검색하고, 유효 기업 신용·체크카드가 있는 고유 가맹점주 수를 집계합니다. 같은 대표자가 여러 가맹점을 운영해도 한 명으로 계산합니다.
  sql: |
    WITH latest_snapshot AS (
      SELECT MAX(a."기준년월일") AS "기준년월일"
      FROM card_system.tbdaaus01 a
    )
    SELECT
      (SELECT l."기준년월일" FROM latest_snapshot l) AS "조회기준일",
      COUNT(DISTINCT a."대표고객식별자") AS "기업카드소지가맹점주수"
    FROM card_system.tbdaaus01 a
    WHERE a."기준년월일" = (SELECT l."기준년월일" FROM latest_snapshot l)
      AND (
        LOWER(COALESCE(a."가맹점명", '')) LIKE LOWER(CONCAT('%', '{가맹점명}', '%')) ESCAPE '\'
        OR LOWER(COALESCE(a."브랜드명", '')) LIKE LOWER(CONCAT('%', '{가맹점명}', '%')) ESCAPE '\'
      )
      AND (
        COALESCE(a."유효기업신용카드수", 0)
        + COALESCE(a."유효기업체크카드수", 0)
      ) > 0
      AND a."대표고객식별자" IS NOT NULL
  parameters:
    가맹점명:
      type: like_string
      description: 가맹점명 또는 브랜드명에서 찾을 검색어
      required: true
      sample_values:
      - 파파존스
      - 도미노피자
  tags:
  - 브랜드
  - 가맹점주
  - 대표자
  - 기업카드보유
  - 인원수
  - 파파존스
  - tbdaaus01
  - Athena
- name: merchant_detail_by_name
  question: 마초스테이크하우스 가맹점 기본 정보를 알려줘
  description: 가맹점 기본(tbdaadt01)에서 가맹점명을 검색해 식별자·사업자 정보·업종·사업주체·결제기관·수수료율·등록일을 반환합니다. 원문의 잘못된 가맹점번호식별자는 문서 컬럼 가맹점번호로 교정했습니다.
  sql: |
    SELECT
      m."가맹점번호",
      m."기업고객식별자",
      m."대표고객식별자",
      m."사업자등록번호",
      m."법인등록번호",
      m."가맹점명",
      m."가맹점업종코드",
      m."MCC업종코드",
      m."가맹점사업주체구분코드",
      m."현금카드결제기관구분코드",
      m."신용카드가맹점수수료율",
      m."체크카드가맹점수수료율",
      m."등록년월일"
    FROM card_system.tbdaadt01 m
    WHERE LOWER(COALESCE(m."가맹점명", ''))
      LIKE LOWER(CONCAT('%', '{가맹점명}', '%')) ESCAPE '\'
      AND m."가맹점상태구분코드" = '{정상가맹점상태코드}'
    ORDER BY m."가맹점명", m."가맹점번호"
    LIMIT {limit}
  parameters:
    가맹점명:
      type: like_string
      description: 가맹점명에서 찾을 검색어
      required: true
      default: 마초스테이크하우스
      sample_values:
