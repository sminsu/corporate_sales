  - SAS참조
- name: corporate_target_industry_usage
  question: 1~5 질문 대상 기업회원의 업종별 이용금액을 알려줘
  description: 1~5 영업대상 조건을 문서 테이블로 재현한 뒤, 기업고객식별자로 카드전표입력내역(tbdaabt30)에 연결해 결제처 가맹점업종별 실제 매출금액을 집계합니다. 대상군 간 중복은 구분별 분석을 위해 유지합니다.
  sql: |
    WITH params AS (
      SELECT
        '{기준년월}' AS "기준년월",
        DATE_FORMAT(
          DATE_ADD(
            'month',
            -({조회개월수} - 1),
            DATE_PARSE(CONCAT('{기준년월}', '01'), '%Y%m%d')
          ),
          '%Y%m'
        ) AS "시작6개월",
        CONCAT(SUBSTR('{기준년월}', 1, 4), '01') AS "연초년월",
        CAST(SUBSTR('{기준년월}', 5, 2) AS INTEGER) AS "평균산정월수"
    ),
    customer_daily AS (
      SELECT
        a."기준년월일",
        SUBSTR(a."기준년월일", 1, 6) AS "기준년월",
        a."고객식별자",
        a."유효기업신용카드수",
        a."유효기업체크카드수",
        a."금월신용카드이용금액",
        a."금월체크카드이용금액",
        a."기업총한도금액",
        a."기업총잔여한도금액"
      FROM card_system.tbdaa1d12 a
      CROSS JOIN params p
      WHERE a."기준년월일" BETWEEN CONCAT(LEAST(p."시작6개월", p."연초년월"), '01')
        AND CONCAT(p."기준년월", '31')
    ),
    customer_ranked AS (
      SELECT
        d."기준년월일",
        d."기준년월",
        d."고객식별자",
        d."유효기업신용카드수",
        d."유효기업체크카드수",
        d."금월신용카드이용금액",
        d."금월체크카드이용금액",
        d."기업총한도금액",
        d."기업총잔여한도금액",
        ROW_NUMBER() OVER (
          PARTITION BY d."고객식별자", d."기준년월"
          ORDER BY d."기준년월일" DESC
        ) AS rn
      FROM customer_daily d
    ),
    customer_monthly AS (
      SELECT
        r."기준년월",
        r."고객식별자",
        r."유효기업신용카드수",
        r."유효기업체크카드수",
        r."금월신용카드이용금액",
        r."금월체크카드이용금액",
        r."기업총한도금액",
        r."기업총잔여한도금액"
      FROM customer_ranked r
      WHERE r.rn = 1
    ),
    current_customers AS (
      SELECT
        m."고객식별자",
        m."유효기업신용카드수",
        m."유효기업체크카드수",
        m."기업총한도금액",
        m."기업총잔여한도금액"
      FROM customer_monthly m
      CROSS JOIN params p
      WHERE m."기준년월" = p."기준년월"
    ),
    merchant_ranked AS (
      SELECT
        a."기준년월",
        a."기준년월일",
        a."가맹점번호",
        a."기업고객식별자",
        a."가맹점사업주체구분코드",
        a."유효기업신용카드수",
        a."유효기업체크카드수",
        a."휴폐업여부",
        ROW_NUMBER() OVER (
          PARTITION BY a."기준년월", a."가맹점번호"
          ORDER BY a."기준년월일" DESC
        ) AS rn
      FROM card_system.tmdaaus01 a
      CROSS JOIN params p
      WHERE a."기준년월" = p."기준년월"
    ),
    merchant_current AS (
      SELECT
        r."가맹점번호",
        r."기업고객식별자",
        r."가맹점사업주체구분코드",
        r."유효기업신용카드수",
        r."유효기업체크카드수",
        r."휴폐업여부"
      FROM merchant_ranked r
      WHERE r.rn = 1
    ),
    merchant_sales AS (
      SELECT
        s."가맹점번호",
        SUM(
          COALESCE(s."가맹점일시불매출금액", 0)
          + COALESCE(s."가맹점할부매출금액", 0)
        ) AS "월매출액"
      FROM card_system.tmdaa5e11 s
      CROSS JOIN params p
      WHERE s."기준년월" = p."기준년월"
      GROUP BY s."가맹점번호"
    ),
    target AS (
      SELECT DISTINCT
        c."고객식별자",
        '1_6개월무실적' AS "대상구분"
      FROM current_customers c
      CROSS JOIN params p
      WHERE COALESCE(c."유효기업신용카드수", 0) + COALESCE(c."유효기업체크카드수", 0) > 0
        AND NOT EXISTS (
          SELECT 1
          FROM customer_monthly h
          WHERE h."고객식별자" = c."고객식별자"
            AND h."기준년월" BETWEEN p."시작6개월" AND p."기준년월"
            AND COALESCE(h."금월신용카드이용금액", 0) + COALESCE(h."금월체크카드이용금액", 0) > 0
        )

      UNION ALL

      SELECT DISTINCT
        c."고객식별자",
        '2_이탈회원' AS "대상구분"
      FROM current_customers c
      CROSS JOIN params p
      WHERE COALESCE(c."유효기업신용카드수", 0) + COALESCE(c."유효기업체크카드수", 0) = 0
        AND EXISTS (
          SELECT 1
          FROM customer_monthly h
          WHERE h."고객식별자" = c."고객식별자"
            AND h."기준년월" BETWEEN p."시작6개월" AND p."기준년월"
            AND COALESCE(h."금월신용카드이용금액", 0) + COALESCE(h."금월체크카드이용금액", 0) > 0
        )

      UNION ALL

      SELECT
        m."고객식별자",
        '3_체크카드교차영업' AS "대상구분"
      FROM customer_monthly m
      CROSS JOIN params p
      WHERE m."기준년월" BETWEEN p."연초년월" AND p."기준년월"
      GROUP BY m."고객식별자"
      HAVING MAX(COALESCE(m."유효기업신용카드수", 0)) = 0
        AND MAX(COALESCE(m."유효기업체크카드수", 0)) > 0
        AND SUM(COALESCE(m."금월신용카드이용금액", 0)) = 0
        AND SUM(COALESCE(m."금월체크카드이용금액", 0))
          / NULLIF(CAST(MAX(p."평균산정월수") AS DOUBLE), 0.0) >= {월평균금액}

      UNION ALL

      SELECT DISTINCT
        m."기업고객식별자" AS "고객식별자",
        '4_가맹점신규영업' AS "대상구분"
      FROM merchant_current m
      JOIN merchant_sales s
        ON m."가맹점번호" = s."가맹점번호"
      WHERE s."월매출액" >= {월매출금액}
        AND m."가맹점사업주체구분코드" = '2'
        AND COALESCE(m."유효기업신용카드수", 0) = 0
        AND COALESCE(m."유효기업체크카드수", 0) = 0
        AND COALESCE(m."휴폐업여부", '0') = '0'
        AND m."기업고객식별자" IS NOT NULL

      UNION ALL

      SELECT DISTINCT
        c."고객식별자",
        '5_한도활용영업' AS "대상구분"
      FROM current_customers c
      WHERE COALESCE(c."유효기업신용카드수", 0) > 0
        AND COALESCE(c."기업총한도금액", 0) >= {한도금액}
        AND 1.0
          - CAST(COALESCE(c."기업총잔여한도금액", 0) AS DOUBLE)
            / NULLIF(CAST(c."기업총한도금액" AS DOUBLE), 0.0) < {한도소진율}
    ),
    industry AS (
      SELECT
        i."가맹점업종코드",
        MAX(i."가맹점업종명") AS "가맹점업종명"
      FROM card_system.tbdaadb17 i
      GROUP BY i."가맹점업종코드"
    )
    SELECT
      t."대상구분",
      s."가맹점업종코드",
      COALESCE(i."가맹점업종명", '미분류') AS "가맹점업종명",
      COUNT(DISTINCT t."고객식별자") AS "대상기업수",
      SUM(COALESCE(s."매출금액", 0)) AS "이용금액"
    FROM target t
    JOIN card_system.tbdaabt30 s
      ON t."고객식별자" = s."기업고객식별자"
    LEFT JOIN industry i
      ON s."가맹점업종코드" = i."가맹점업종코드"
    WHERE SUBSTR(s."전표매출년월일", 1, 6) BETWEEN '{이용기간_시작}' AND '{이용기간_종료}'
    GROUP BY t."대상구분", s."가맹점업종코드", i."가맹점업종명"
    ORDER BY t."대상구분", "이용금액" DESC
    LIMIT {limit}
  parameters:
    기준년월:
      type: string
      description: 1~5 영업대상을 판정할 기준년월(YYYYMM)
      required: true
      default: '202604'
      sample_values:
      - '202604'
    조회개월수:
      type: integer
      description: 무실적·이탈 이력 판정 개월 수
      default: '6'
    월평균금액:
      type: integer
      description: 체크카드 월평균 이용금액 하한
      default: '50000000'
    월매출금액:
      type: integer
      description: 가맹점 월 매출액 하한
      default: '100000000'
    한도금액:
      type: integer
      description: 기업 총한도 하한
      default: '20000000'
    한도소진율:
      type: number
      description: 한도소진율 상한
      default: '0.5'
    이용기간_시작:
      type: string
      description: 업종별 이용금액 집계 시작년월(YYYYMM)
      required: true
      default: '202601'
      sample_values:
      - '202601'
    이용기간_종료:
      type: string
      description: 업종별 이용금액 집계 종료년월(YYYYMM)
      required: true
      default: '202604'
      sample_values:
      - '202604'
    limit:
      type: integer
      description: 대상구분×업종 결과 제한 건수
      default: '500'
  tags:
  - 기업회원
  - 영업대상
  - 1~5질문
  - 업종별
  - 이용금액
  - tbdaa1d12
  - tmdaaus01
  - tmdaa5e11
  - tbdaabt30
  - tbdaadb17
  - Athena
- name: managed_company_usage_anomalies
  question: 내가 관리하는 기업회원의 최근 6개월 이용금액 추이와 특이사항을 알려줘
  description: 파라미터로 입력받은 요청별 관리기업 사업자등록번호 목록을 Athena VALUES CTE로 적용하고, tbdaa1d12의 고객별 월 최신행에서 최근 6개월 이용 추이를 만든 뒤 무실적·급감·급증·3개월 연속 감소를 판정합니다.
  sql: |
    WITH params0 AS (
      SELECT
        '{기준년월}' AS "기준년월",
        DATE_PARSE(CONCAT('{기준년월}', '01'), '%Y%m%d') AS "기준월일자"
    ),
    params AS (
      SELECT
        p."기준년월" AS m_0,
        DATE_FORMAT(DATE_ADD('month', -1, p."기준월일자"), '%Y%m') AS m_1,
        DATE_FORMAT(DATE_ADD('month', -2, p."기준월일자"), '%Y%m') AS m_2,
        DATE_FORMAT(DATE_ADD('month', -3, p."기준월일자"), '%Y%m') AS m_3,
        DATE_FORMAT(DATE_ADD('month', -4, p."기준월일자"), '%Y%m') AS m_4,
        DATE_FORMAT(DATE_ADD('month', -5, p."기준월일자"), '%Y%m') AS m_5
      FROM params0 p
    ),
    managed_scope ("사업자등록번호") AS (
      VALUES {관리기업목록}
    ),
    daily AS (
      SELECT
        a."기준년월일",
        SUBSTR(a."기준년월일", 1, 6) AS "기준년월",
        a."고객식별자",
        a."사업자등록번호",
        a."기업명",
        a."금월신용카드이용금액",
        a."금월체크카드이용금액"
      FROM card_system.tbdaa1d12 a
      JOIN managed_scope l
        ON a."사업자등록번호" = l."사업자등록번호"
      CROSS JOIN params p
      WHERE a."기준년월일" BETWEEN CONCAT(p.m_5, '01') AND CONCAT(p.m_0, '31')
    ),
    ranked AS (
      SELECT
        d."기준년월일",
        d."기준년월",
        d."고객식별자",
        d."사업자등록번호",
        d."기업명",
        d."금월신용카드이용금액",
        d."금월체크카드이용금액",
        ROW_NUMBER() OVER (
          PARTITION BY d."고객식별자", d."기준년월"
          ORDER BY d."기준년월일" DESC
        ) AS rn
      FROM daily d
    ),
    monthly AS (
      SELECT
        r."기준년월",
        r."고객식별자",
        r."사업자등록번호",
        r."기업명",
        COALESCE(r."금월신용카드이용금액", 0)
          + COALESCE(r."금월체크카드이용금액", 0) AS "금월총이용금액"
      FROM ranked r
      WHERE r.rn = 1
    ),
    pivoted AS (
      SELECT
        m."고객식별자",
        MAX(m."사업자등록번호") AS "사업자등록번호",
        MAX(m."기업명") AS "기업명",
        SUM(CASE WHEN m."기준년월" = p.m_5 THEN m."금월총이용금액" ELSE 0 END) AS amt_m_5,
        SUM(CASE WHEN m."기준년월" = p.m_4 THEN m."금월총이용금액" ELSE 0 END) AS amt_m_4,
        SUM(CASE WHEN m."기준년월" = p.m_3 THEN m."금월총이용금액" ELSE 0 END) AS amt_m_3,
        SUM(CASE WHEN m."기준년월" = p.m_2 THEN m."금월총이용금액" ELSE 0 END) AS amt_m_2,
        SUM(CASE WHEN m."기준년월" = p.m_1 THEN m."금월총이용금액" ELSE 0 END) AS amt_m_1,
        SUM(CASE WHEN m."기준년월" = p.m_0 THEN m."금월총이용금액" ELSE 0 END) AS amt_m_0
      FROM monthly m
      CROSS JOIN params p
      GROUP BY m."고객식별자"
    ),
    metrics AS (
      SELECT
        v."고객식별자",
        v."사업자등록번호",
        v."기업명",
        v.amt_m_5,
        v.amt_m_4,
        v.amt_m_3,
        v.amt_m_2,
        v.amt_m_1,
        v.amt_m_0,
        v.amt_m_5 + v.amt_m_4 + v.amt_m_3 + v.amt_m_2 + v.amt_m_1 + v.amt_m_0 AS "최근6개월총이용금액",
        (v.amt_m_3 + v.amt_m_2 + v.amt_m_1) / 3.0 AS "직전3개월평균"
      FROM pivoted v
    ),
    scored AS (
      SELECT
        m."고객식별자",
        m."사업자등록번호",
        m."기업명",
        m.amt_m_5,
        m.amt_m_4,
        m.amt_m_3,
        m.amt_m_2,
        m.amt_m_1,
        m.amt_m_0,
        m."최근6개월총이용금액",
        m."직전3개월평균",
        CASE
          WHEN m.amt_m_0 = 0 THEN '최근월 무실적'
          WHEN m."직전3개월평균" > 0 AND m.amt_m_0 < m."직전3개월평균" * {급감배수} THEN '급감'
          WHEN m."직전3개월평균" > 0 AND m.amt_m_0 >= m."직전3개월평균" * {급증배수} THEN '급증'
          WHEN m.amt_m_2 > m.amt_m_1 AND m.amt_m_1 > m.amt_m_0 THEN '3개월 연속 감소'
          ELSE '정상'
        END AS "특이사항"
      FROM metrics m
    )
    SELECT
      s."고객식별자",
      s."사업자등록번호",
      s."기업명",
      p.m_5 AS "m_5_년월",
      s.amt_m_5 AS "m_5_이용금액",
      p.m_4 AS "m_4_년월",
      s.amt_m_4 AS "m_4_이용금액",
      p.m_3 AS "m_3_년월",
      s.amt_m_3 AS "m_3_이용금액",
      p.m_2 AS "m_2_년월",
      s.amt_m_2 AS "m_2_이용금액",
      p.m_1 AS "m_1_년월",
      s.amt_m_1 AS "m_1_이용금액",
      p.m_0 AS "기준년월",
      s.amt_m_0 AS "기준월이용금액",
      s."최근6개월총이용금액",
      s."직전3개월평균",
      s."특이사항"
    FROM scored s
    CROSS JOIN params p
    WHERE s."특이사항" <> '정상'
    ORDER BY s."특이사항", s."최근6개월총이용금액" DESC
    LIMIT {limit}
  parameters:
    관리기업목록:
      type: business_number_list
      description: 파라미터로 직접 입력하고 정규화한 요청별 10자리 사업자등록번호 목록. 쉼표 또는 줄바꿈으로 구분하며 SQL에는 Athena VALUES 행 튜플로만 확장됩니다.
      required: true
      sample_values:
      - ['1234567890', '2345678901']
    기준년월:
      type: string
      description: 최근 6개월 추이의 기준년월(YYYYMM)
      required: true
      default: '202604'
      sample_values:
      - '202604'
    급감배수:
      type: number
      description: 기준월 이용액이 직전 3개월 평균의 이 배수 미만이면 급감
      default: '0.5'
    급증배수:
      type: number
      description: 기준월 이용액이 직전 3개월 평균의 이 배수 이상이면 급증
      default: '2.0'
    limit:
      type: integer
      description: 특이사항 기업 목록 제한 건수
      default: '1000000'
  tags:
  - 관리기업
  - 담당기업
  - 최근6개월
  - 이용추이
  - 특이사항
  - 요청별관리기업목록
  - VALUES_CTE
  - tbdaa1d12
  - Athena
- name: managed_company_delinquency
  question: 내가 관리하고 있는 기업회원 중 연체가 발생한 기업회원을 알려줘
  description: 관리기업 범위를 사업자등록번호로 제한하고, 기준월 중 카드연체여부·여신연체여부 또는 해당 연체원금이 양수였던 tbdaa1d12 행 가운데 고객별 가장 최근 연체 스냅샷을 반환합니다. tbdaa1d12에 없는 연체일수는 생성하지 않습니다.
  sql: |
    WITH managed_scope ("사업자등록번호") AS (
      VALUES {관리기업목록}
    ),
    overdue_ranked AS (
      SELECT
        a."고객식별자",
        a."사업자등록번호",
        a."기업명",
        a."기준년월일",
        SUBSTR(a."기준년월일", 1, 6) AS "기준년월",
        a."카드연체여부",
        a."카드연체원금",
        a."여신연체여부",
        a."여신연체원금",
        ROW_NUMBER() OVER (
          PARTITION BY a."고객식별자"
          ORDER BY a."기준년월일" DESC
        ) AS rn
      FROM card_system.tbdaa1d12 a
      JOIN managed_scope l
        ON a."사업자등록번호" = l."사업자등록번호"
      WHERE a."기준년월일" BETWEEN CONCAT('{기준년월}', '01') AND CONCAT('{기준년월}', '31')
        AND (
          COALESCE(a."카드연체여부", '0') = '1'
          OR COALESCE(a."여신연체여부", '0') = '1'
          OR COALESCE(a."카드연체원금", 0) > 0
          OR COALESCE(a."여신연체원금", 0) > 0
        )
    )
    SELECT
      r."고객식별자",
      r."사업자등록번호",
      r."기업명",
      r."기준년월",
      r."기준년월일",
      r."카드연체여부",
      COALESCE(r."카드연체원금", 0) AS "카드연체원금",
      r."여신연체여부",
      COALESCE(r."여신연체원금", 0) AS "여신연체원금",
      COALESCE(r."카드연체원금", 0) + COALESCE(r."여신연체원금", 0) AS "총연체원금"
    FROM overdue_ranked r
    WHERE r.rn = 1
    ORDER BY "총연체원금" DESC, r."기업명"
    LIMIT {limit}
  parameters:
    관리기업목록:
      type: business_number_list
      description: 파라미터로 직접 입력하고 정규화한 요청별 10자리 사업자등록번호 목록. 쉼표 또는 줄바꿈으로 구분하며 SQL에는 Athena VALUES 행 튜플로만 확장됩니다.
      required: true
      sample_values:
      - ['1234567890', '2345678901']
    기준년월:
      type: string
      description: 연체 발생 여부를 조회할 기준년월(YYYYMM)
      required: true
      default: '202604'
      sample_values:
      - '202604'
    limit:
      type: integer
      description: 연체 기업 목록 제한 건수
      default: '1000000'
  tags:
