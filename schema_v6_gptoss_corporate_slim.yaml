query_references:
- intent: 기업고객 월별 한도/이용/연체 분석
  when_user_says:
  - 기업고객 한도사용률
  - 법인고객 월별 이용금액
  - 카드 연체 고객
  - 신용등급별 한도
  rules:
  - 기업고객 월별 스냅샷은 tmdaa1d12를 사용합니다.
  - 한도사용률은 (기업총한도금액 - 기업총잔여한도금액) / 기업총한도금액입니다.
  - 한도/연체 원금은 스냅샷성 지표이므로 여러 월 합산 대신 기준년월별로 봅니다.
  sql_pattern: |
    SELECT
      기준년월,
      COUNT(DISTINCT 고객식별자) AS 기업고객수,
      SUM(기업총한도금액) AS 기업총한도금액,
      SUM(기업총잔여한도금액) AS 기업총잔여한도금액,
      (SUM(기업총한도금액) - SUM(기업총잔여한도금액))::FLOAT / NULLIF(SUM(기업총한도금액), 0) AS 기업한도사용률,
      SUM(COALESCE(금월신용카드이용금액, 0) + COALESCE(금월체크카드이용금액, 0)) AS 기업월총이용금액,
      SUM(카드연체원금) AS 카드연체원금,
      SUM(여신연체원금) AS 여신연체원금
    FROM card_system.tmdaa1d12
    WHERE 기준년월 BETWEEN '{시작년월}' AND '{종료년월}'
    GROUP BY 기준년월
    ORDER BY 기준년월
  primary_table: tmdaa1d12
- intent: 대표 가맹점 업종별 기업고객 영업대상
  when_user_says:
  - 업종별 기업고객
  - 가맹점 계약 법인고객
  - 신용등급별 대표 가맹점
  rules:
  - tmdaa1d12의 대표가맹점번호/가맹점업종코드를 사용합니다.
  - 업종명은 tbdaadb17을 조인해 보강합니다.
  - 영업중/거래가능 고객이 필요하면 기업거래정지여부와 폐업여부 필터를 적용합니다.
  sql_pattern: |
    SELECT
      t.기준년월,
      u.업종대분류코드명,
      u.가맹점업종명,
      COUNT(DISTINCT t.고객식별자) AS 기업고객수,
      SUM(COALESCE(t.금월신용카드이용금액, 0) + COALESCE(t.금월체크카드이용금액, 0)) AS 기업월총이용금액,
      SUM(t.기업총한도금액) AS 기업총한도금액
    FROM card_system.tmdaa1d12 t
    LEFT JOIN card_system.tbdaadb17 u
      ON t.가맹점업종코드 = u.가맹점업종코드
    WHERE t.기준년월 = '{기준년월}'
      AND COALESCE(t.기업거래정지여부, 'N') <> 'Y'
      AND COALESCE(t.폐업여부, 'N') <> 'Y'
    GROUP BY t.기준년월, u.업종대분류코드명, u.가맹점업종명
    ORDER BY 기업월총이용금액 DESC
    LIMIT {limit}
  primary_table: tmdaa1d12
  join_tables:
  - tbdaadb17
- intent: 활성_가맹점업종_코드명_조회
  when_user_says:
  - 업종 코드명 알려줘
  - 가맹점 업종코드와 업종명
  - 사용 중인 가맹점 업종 목록
  - 업종명 코드 매핑
  primary_table: tbdaadb17
  recommended_columns:
    filters:
    - 사용여부 = '1'
    display:
    - 가맹점업종코드
    - 가맹점업종명
    - 업종대분류코드명
  rules:
  - SAS 원문의 가맹점업종코트는 오타이므로 가맹점업종코드를 사용합니다.
  - 활성 업종 목록은 tbdaadb17.사용여부 = '1' 조건을 기본으로 둡니다.
  sql_pattern: |
    SELECT
      가맹점업종코드,
      가맹점업종명,
      업종대분류코드명
    FROM card_system.tbdaadb17
    WHERE 사용여부 = '1'
    ORDER BY 가맹점업종코드
- intent: 지역별 기업영업 가맹점 성과
  when_user_says:
  - 지역별 가맹점 전월 매입
  - 시도별 기업카드 가맹점 실적
  - 영업지역별 가맹점 지급금액
  rules:
  - 가맹점 실적은 기본적으로 tbdaaus01을 사용합니다.
  - 월별 추이가 필요하면 기준년월일에서 SUBSTRING(기준년월일, 1, 6)을 사용하거나 tbmaisd06을 사용합니다.
  - 휴폐업/거래정지 제외 요청이 있으면 휴폐업여부, 가맹점거래정지여부 필터를 적용합니다.
  sql_pattern: |
    SELECT
      한글시도명,
      한글시군구명,
      COUNT(DISTINCT 가맹점번호) AS 가맹점수,
      SUM(COALESCE(전월일시불매입금액, 0) + COALESCE(전월할부매입금액, 0)) AS 전월매입금액,
      SUM(COALESCE(전월일시불매입건수, 0) + COALESCE(전월할부매입건수, 0)) AS 전월매입건수,
      AVG(신용카드가맹점수수료율) AS 평균수수료율
    FROM card_system.tbdaaus01
    WHERE 기준년월일 BETWEEN '{시작일}' AND '{종료일}'
    GROUP BY 한글시도명, 한글시군구명
    ORDER BY 전월매입금액 DESC
    LIMIT {limit}
  primary_table: tbdaaus01
- intent: 기업 특수채권 리스크 분석
  when_user_says:
  - 기업 특수채권 편입 현황
  - 자산건전성별 특채 잔액
  - 연체회차별 편입원금
  rules:
  - 기업 기준 질문은 개인기업구분코드 = '2' 필터를 적용합니다.
  - 특수채권편입잔액은 원금+수수료+이자+연체료+가지급금 합계입니다.
  sql_pattern: |
    SELECT
      기준년,
      자산건전성분류구분코드,
      COUNT(DISTINCT 특수채권관리번호) AS 특수채권건수,
      SUM(특수채권편입원금) AS 편입원금,
      SUM(COALESCE(특수채권편입원금, 0) + COALESCE(특수채권편입수수료, 0) + COALESCE(특수채권편입이자, 0) + COALESCE(특수채권편입연체료, 0) + COALESCE(특수채권편입가지급금, 0)) AS 편입잔액,
      AVG(연체회차) AS 평균연체회차
    FROM card_system.tmdaaus01
    WHERE 개인기업구분코드 = '2'
    GROUP BY 기준년, 자산건전성분류구분코드
    ORDER BY 기준년, 편입잔액 DESC
  primary_table: tmdaaus01
- intent: 기업영업 대손충당금 및 리스크비용률
  when_user_says:
  - 기업 대손충당금률
  - 월별 리스크비용
  - PD LGD 충당금 분석
  rules:
  - 기업 기준 질문은 개인기업구분코드 = '2' 필터를 적용합니다.
  - 대손충당금률은 기대대손충당금 / 원화대출잔액입니다.
  - PD/LGD는 단순 합산하지 말고 평균 또는 잔액가중 평균 여부를 질문 의도에 맞춰 선택합니다.
  sql_pattern: |
    SELECT
      기준년월,
      상품코드,
      SUM(원화대출잔액) AS 원화대출잔액,
      SUM(기대대손충당금) AS 기대대손충당금,
      AVG(기대1년PD율) AS 평균PD율,
      AVG(충당금기대LGD율) AS 평균LGD율,
      SUM(기대대손충당금)::FLOAT / NULLIF(SUM(원화대출잔액), 0) AS 대손충당금률
    FROM card_system.tbmewcm94
    WHERE 개인기업구분코드 = '2'
    GROUP BY 기준년월, 상품코드
    ORDER BY 기준년월, 기대대손충당금 DESC
  primary_table: tbmewcm94
