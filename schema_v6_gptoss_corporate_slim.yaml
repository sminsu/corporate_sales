semantic_join_graph:
  safe_paths:
  - name: merchant_daily_to_merchant_monthly
    from_entity: merchant_enrichment_daily
    to_entity: merchant_enrichment_monthly
    join_type: many_to_one
    sql: a.가맹점번호 = b.가맹점번호 AND SUBSTRING(a.기준년월일, 1, 6) = b.기준년월
    use_when:
    - 일별 가맹점 속성과 월별 가맹점 기준을 함께 비교
  - name: merchant_to_special_debt_by_customer
    from_entity: merchant_enrichment_daily
    to_entity: special_debt_monthly
    join_type: one_to_many
    sql: a.기업고객식별자 = b.고객식별자
    caution: 가맹점과 특수채권은 고객식별자 기준 조인입니다. 한 기업고객이 여러 가맹점/채권을 가질 수 있으므로 집계 전 중복을 확인합니다.
    use_when:
    - 가맹점 기업고객의 특수채권 보유 여부
    - 기업영업 포트폴리오와 연체 리스크 결합
  - name: special_debt_to_allowance
    from_entity: special_debt_monthly
    to_entity: allowance_monthly_detail
    join_type: many_to_many_cautious
    sql: a.고객식별자 = b.고객식별자 AND a.회계계정과목코드 = b.회계계정과목코드 AND a.기준년 = SUBSTRING(b.기준년월,
      1, 4)
    caution: 두 테이블 모두 원장성/월별성 데이터라 고객 단위 직접 조인은 중복 집계 위험이 있습니다. 고객-계정-기간으로 사전 집계 후
      조인합니다.
    use_when:
    - 특수채권과 대손충당금의 고객/계정 단위 비교
    - 리스크 비용률 분석
  - name: merchant_monthly_to_allowance_by_customer
    from_entity: merchant_enrichment_monthly
    to_entity: allowance_monthly_detail
    join_type: one_to_many
    sql: a.기업고객식별자 = b.고객식별자 AND a.기준년월 = b.기준년월
    caution: 가맹점 월별 스냅샷과 충당금 명세를 고객-월 기준으로 결합합니다. 가맹점 수가 많은 고객은 중복 가능성이 있어 고객-월 집계
      후 사용합니다.
  - name: corporate_customer_monthly_to_industry
    from_entity: corporate_customer_enrichment_monthly
    to_entity: industry
    join_type: many_to_one
    sql: a.가맹점업종코드 = b.가맹점업종코드
    use_when:
    - 기업고객의 대표 가맹점 업종명/대분류 표시
    - 업종별 기업고객 한도/이용금액 분석
  - name: corporate_customer_monthly_to_merchant_master
    from_entity: corporate_customer_enrichment_monthly
    to_entity: merchant_master
    join_type: many_to_one
    sql: a.대표가맹점번호 = b.가맹점번호
    caution: merchant_master는 일자 스냅샷이므로 정확한 시점 정합성이 필요하면 b.실적기준년월일 조건을 추가합니다.
  - name: corporate_customer_monthly_to_merchant_monthly
    from_entity: corporate_customer_enrichment_monthly
    to_entity: merchant_enrichment_monthly
    join_type: one_to_many
    sql: a.고객식별자 = b.기업고객식별자 AND a.기준년월 = b.기준년월
    caution: 한 기업고객이 여러 가맹점을 가질 수 있으므로 가맹점 기준 지표와 고객 기준 지표를 함께 합산할 때는 고객-월 사전 집계가
      필요합니다.
  - name: corporate_customer_monthly_to_special_debt
    from_entity: corporate_customer_enrichment_monthly
    to_entity: special_debt_monthly
    join_type: one_to_many
    sql: a.고객식별자 = b.고객식별자 AND SUBSTRING(a.기준년월, 1, 4) = b.기준년
    caution: 특수채권 원장은 고객-연도 다중행일 수 있어 고객-연도 단위로 사전 집계 후 조인합니다.
  - name: corporate_customer_monthly_to_allowance
    from_entity: corporate_customer_enrichment_monthly
    to_entity: allowance_monthly_detail
    join_type: one_to_many
    sql: a.고객식별자 = b.고객식별자 AND a.기준년월 = b.기준년월
    caution: 충당금 명세는 고객-월 내 여러 계정/상품 행이 있을 수 있으므로 충당금은 고객-월로 먼저 집계합니다.
