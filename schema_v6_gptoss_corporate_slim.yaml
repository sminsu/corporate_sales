---
model_info:
  name: kb_card_corporate_sales_slim_gptoss
  description: gpt-oss 기반 Text2SQL을 위한 KB카드 법인/기업영업 축약 시맨틱 모델입니다. schema_v6_gptoss에서
    요청된 기업영업 가맹점/채권/충당금 관련 테이블만 남기고, 첨부 XLSX의 tmdaa1d12 기업고객 월별 풍성화 테이블을 추가했습니다.
  database: card_system
  schema: card_system
  dialect: postgres
  target_llm: gpt-oss
  semantic_engine: none
  source_schema_file: schema_v6_gptoss.yaml + ALL_COLUMN_LIST.xlsx(tmdaa1d12)
  version: 2.2-corporate-slim
  updated_at: '2026-06-01'
  change_summary: 요청 테이블만 남긴 축약본입니다. 요청 목록의 tbdaa1d12 표기는 첨부 설명에 따라 tmdaa1d12로 정규화했습니다.
    시스템 갱신일시/식별자 등 SQL 생성 활용도가 낮은 메타 컬럼은 기존 v6 정책과 동일하게 제외했습니다.
llm_semantic_contract:
  purpose: 사용자의 자연어 질문을 요청 테이블 범위 안에서 안전한 읽기 전용 SQL로 변환하기 위한 축약 실행 규약입니다.
  sql_output_rules:
  - 항상 SELECT 또는 WITH로 시작하는 읽기 전용 SQL만 생성합니다.
  - 모든 실제 테이블명에는 card_system. prefix를 붙입니다.
  - SELECT *를 사용하지 말고 필요한 컬럼과 집계값만 명시합니다.
  - 사용자 질문에 없는 테이블, 컬럼, 업무 개념을 임의로 만들지 않습니다.
  - 테이블 alias를 쓰는 경우 모든 조인/필터/집계 컬럼에 alias를 붙입니다.
  - 분모가 있는 비율 지표는 NULLIF(분모, 0)를 사용합니다.
  - 금액 비율을 퍼센트로 보여달라고 한 경우에만 * 100 또는 ROUND(..., 2)를 적용합니다.
  - 여부 컬럼은 실제 코드값이 확정되지 않은 경우 Y/N을 단정하지 말고 사용자의 조건 또는 sample query를 우선합니다.
  evidence_priority:
  - '1순위: verified_queries 중 의미가 가장 가까운 예시'
  - '2순위: query_references의 intent/rules/sql_pattern'
  - '3순위: canonical_metrics의 공식 정의'
  - '4순위: semantic_entities와 semantic_join_graph'
  - '5순위: tables의 컬럼 설명과 glossary'
  ambiguity_policy:
  - 기업고객/법인고객의 월별 한도, 잔여한도, 금월 이용금액, 카드/여신 연체, 신용등급 질문은 tmdaa1d12를 우선 사용합니다.
  - 가맹점별 전월 매입, 지급금액, 지역/브랜드/마케팅 업종 질문은 tbdaaus01 또는 월별 기준이 있는 tbmaisd06을 사용합니다.
  - 가맹점 기본정보나 업종명 보강은 tbdaadt01, tbdaadb17을 사용합니다.
  - 특수채권/특채/편입원금/연체회차 질문은 tmdaaus01을 사용합니다.
  - 대손충당금/PD/LGD/원화대출잔액/리스크비용률 질문은 tbmewcm94를 사용합니다.
  - 여부 컬럼은 기본적으로 Y/N 플래그로 모델링했지만 실제 코드 사전이 제공되면 코드 사전을 우선합니다.
  - tmdaa1d12와 tmdaaus01/tbmewcm94/tbmaisd06을 조인할 때는 고객-월 또는 고객-계정-기간 단위로 사전 집계해 중복
    집계를 피합니다.
  - 사용자 질문에 없는 테이블이나 컬럼은 만들지 않습니다. 이 파일에 없는 기존 v6 테이블은 사용할 수 없는 것으로 간주합니다.
