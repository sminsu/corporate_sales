- name: region_top_enterprise_merchants
  question: 최근 기준일 기준 지역별 기업영업 가맹점 전월 매입 상위 지역은?
  sql: |
    SELECT
      한글시도명,
      한글시군구명,
      COUNT(DISTINCT 가맹점번호) AS 가맹점수,
      SUM(COALESCE(전월일시불매입금액, 0) + COALESCE(전월할부매입금액, 0)) AS 전월매입금액,
      SUM(COALESCE(전월일시불매입건수, 0) + COALESCE(전월할부매입건수, 0)) AS 전월매입건수,
      AVG(신용카드가맹점수수료율) AS 평균수수료율
    FROM card_system.tbdaaus01
    WHERE 기준년월일 = (SELECT MAX(기준년월일) FROM card_system.tbdaaus01)
      AND COALESCE(가맹점거래정지여부, 'N') <> 'Y'
      AND COALESCE(휴폐업여부, 'N') <> 'Y'
    GROUP BY 한글시도명, 한글시군구명
    ORDER BY 전월매입금액 DESC
    LIMIT 20
  tags:
  - 기업영업
  - 가맹점
  - 지역
  - 전월매입
  - 랭킹
- name: marketing_industry_card_portfolio
  question: 마케팅 업종 대분류별 유효 기업카드 수와 전월 매입금액을 보여줘
  sql: |
    SELECT
      마케팅업종대분류구분명,
      COUNT(DISTINCT 가맹점번호) AS 가맹점수,
      SUM(COALESCE(유효기업신용카드수, 0)) AS 유효기업신용카드수,
      SUM(COALESCE(유효기업체크카드수, 0)) AS 유효기업체크카드수,
      SUM(COALESCE(전월일시불매입금액, 0) + COALESCE(전월할부매입금액, 0)) AS 전월매입금액
    FROM card_system.tbdaaus01
    WHERE 기준년월일 = (SELECT MAX(기준년월일) FROM card_system.tbdaaus01)
    GROUP BY 마케팅업종대분류구분명
    ORDER BY 전월매입금액 DESC
  tags:
  - 기업영업
  - 업종
  - 카드수
  - 전월매입
- name: special_debt_by_asset_quality
  question: 기업 특수채권을 자산건전성별로 요약해줘
  sql: |
    SELECT
      기준년,
      자산건전성분류구분코드,
      COUNT(DISTINCT 특수채권관리번호) AS 특수채권건수,
      SUM(특수채권편입원금) AS 편입원금,
      SUM(COALESCE(특수채권편입원금, 0) + COALESCE(특수채권편입수수료, 0) + COALESCE(특수채권편입이자, 0) + COALESCE(특수채권편입연체료, 0) + COALESCE(특수채권편입가지급금, 0)) AS 편입잔액,
      AVG(연체회차) AS 평균연체회차
    FROM card_system.tmdaaus01
    WHERE 개인기업구분코드 = '2'
    GROUP BY 기준년, 자산건전성분류구분코드
    ORDER BY 기준년, 편입잔액 DESC
  tags:
  - 기업영업
  - 특수채권
  - 자산건전성
  - 연체
- name: allowance_monthly_cost_rate
  question: 월별 기업 대손충당금률과 평균 PD/LGD를 계산해줘
  sql: |
    SELECT
      기준년월,
      SUM(원화대출잔액) AS 원화대출잔액,
      SUM(기대대손충당금) AS 기대대손충당금,
      AVG(기대1년PD율) AS 평균PD율,
      AVG(충당금기대LGD율) AS 평균LGD율,
      SUM(기대대손충당금)::FLOAT / NULLIF(SUM(원화대출잔액), 0) AS 대손충당금률
    FROM card_system.tbmewcm94
    WHERE 개인기업구분코드 = '2'
    GROUP BY 기준년월
    ORDER BY 기준년월
  tags:
  - 기업영업
  - 대손충당금
  - PD
  - LGD
  - 리스크비용률
- name: merchant_risk_combined_customer_month
  question: 월별 가맹점 포트폴리오와 대손충당금을 고객 기준으로 같이 봐줘
  sql: |
    WITH merchant_customer_month AS (
      SELECT
        기준년월,
        기업고객식별자 AS 고객식별자,
        COUNT(DISTINCT 가맹점번호) AS 가맹점수,
        SUM(COALESCE(전월일시불매입금액, 0) + COALESCE(전월할부매입금액, 0)) AS 전월매입금액
      FROM card_system.tbmaisd06
      GROUP BY 기준년월, 기업고객식별자
    ), allowance_customer_month AS (
      SELECT
        기준년월,
        고객식별자,
        SUM(원화대출잔액) AS 원화대출잔액,
        SUM(기대대손충당금) AS 기대대손충당금
      FROM card_system.tbmewcm94
      WHERE 개인기업구분코드 = '2'
      GROUP BY 기준년월, 고객식별자
    )
    SELECT
      m.기준년월,
      COUNT(DISTINCT m.고객식별자) AS 기업고객수,
      SUM(m.가맹점수) AS 가맹점수,
      SUM(m.전월매입금액) AS 전월매입금액,
      SUM(a.원화대출잔액) AS 원화대출잔액,
      SUM(a.기대대손충당금) AS 기대대손충당금,
      SUM(a.기대대손충당금)::FLOAT / NULLIF(SUM(a.원화대출잔액), 0) AS 대손충당금률
    FROM merchant_customer_month m
    LEFT JOIN allowance_customer_month a
      ON m.기준년월 = a.기준년월
     AND m.고객식별자 = a.고객식별자
    GROUP BY m.기준년월
    ORDER BY m.기준년월
  tags:
  - 기업영업
  - 가맹점
  - 충당금
  - 고객월
  - 조인
- name: corporate_customer_limit_usage_latest
  question: 최근 기준월 기업고객 한도사용률과 이용금액을 보여줘
  sql: |
    SELECT
      기준년월,
      COUNT(DISTINCT 고객식별자) AS 기업고객수,
      SUM(기업총한도금액) AS 기업총한도금액,
      SUM(기업총잔여한도금액) AS 기업총잔여한도금액,
      (SUM(기업총한도금액) - SUM(기업총잔여한도금액))::FLOAT / NULLIF(SUM(기업총한도금액), 0) AS 기업한도사용률,
      SUM(COALESCE(금월신용카드이용금액, 0) + COALESCE(금월체크카드이용금액, 0)) AS 기업월총이용금액
    FROM card_system.tmdaa1d12
    WHERE 기준년월 = (SELECT MAX(기준년월) FROM card_system.tmdaa1d12)
      AND COALESCE(기업거래정지여부, 'N') <> 'Y'
      AND COALESCE(폐업여부, 'N') <> 'Y'
    GROUP BY 기준년월
  tags:
  - 기업고객
  - 한도
  - 한도사용률
  - 이용금액
  - tmdaa1d12
- name: corporate_customer_by_credit_grade
  question: 신용등급별 기업고객 수와 카드/여신 연체원금을 요약해줘
  sql: |
    SELECT
      기준년월,
      그룹최종평가신용등급코드,
      COUNT(DISTINCT 고객식별자) AS 기업고객수,
      SUM(카드연체원금) AS 카드연체원금,
      SUM(여신연체원금) AS 여신연체원금,
      SUM(COALESCE(금월신용카드이용금액, 0) + COALESCE(금월체크카드이용금액, 0)) AS 기업월총이용금액
    FROM card_system.tmdaa1d12
    WHERE 기준년월 = '{기준년월}'
    GROUP BY 기준년월, 그룹최종평가신용등급코드
    ORDER BY 카드연체원금 DESC NULLS LAST, 여신연체원금 DESC NULLS LAST
  parameters:
    기준년월:
      type: string
      description: 분석 기준년월(YYYYMM)
      required: true
      sample_values:
      - '202512'
  tags:
  - 기업고객
  - 신용등급
  - 연체
  - 이용금액
  - tmdaa1d12
  - 파라미터
- name: corporate_customer_usage_by_industry
  question: 대표 가맹점 업종별 기업고객 이용금액 상위 업종을 보여줘
  sql: |
    SELECT
      t.기준년월,
      u.업종대분류코드명,
      u.가맹점업종명,
      COUNT(DISTINCT t.고객식별자) AS 기업고객수,
      SUM(COALESCE(t.금월신용카드이용금액, 0) + COALESCE(t.금월체크카드이용금액, 0)) AS 기업월총이용금액,
      SUM(t.기업총한도금액) AS 기업총한도금액
    FROM card_system.tmdaa1d12 t
    LEFT JOIN card_system.tbdaadb17 u
      ON t.가맹점업종코드 = u.가맹점업종코드
    WHERE t.기준년월 = '{기준년월}'
    GROUP BY t.기준년월, u.업종대분류코드명, u.가맹점업종명
    ORDER BY 기업월총이용금액 DESC
    LIMIT {limit}
  parameters:
    기준년월:
      type: string
      description: 분석 기준년월(YYYYMM)
      required: true
      sample_values:
      - '202512'
    limit:
      type: integer
      description: 상위 N개 결과
      default: '20'
  tags:
  - 기업고객
  - 업종
  - 이용금액
  - 대표가맹점
  - tmdaa1d12
  - tbdaadb17
  - 파라미터
