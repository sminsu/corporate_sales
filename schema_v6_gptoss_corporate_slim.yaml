  domain: 기업영업리스크손익
  source_entity: allowance_monthly_detail
  source_table: tbmewcm94
  expression: AVG(기대1년PD율)
  required_filters:
  - 개인기업구분코드 = '2'
  default_time_dimension: 기준년월
  additive: false
  unit: ratio
  synonyms:
  - PD
  - 부도확률
  - 기대PD
- name: 평균기대LGD율
  domain: 기업영업리스크손익
  source_entity: allowance_monthly_detail
  source_table: tbmewcm94
  expression: AVG(충당금기대LGD율)
  required_filters:
  - 개인기업구분코드 = '2'
  default_time_dimension: 기준년월
  additive: false
  unit: ratio
  synonyms:
  - LGD
  - 손실률
  - 기대LGD
- name: 대손충당금률
  domain: 기업영업리스크손익
  source_entity: allowance_monthly_detail
  source_table: tbmewcm94
  numerator_metric: 기대대손충당금합계
  denominator_metric: 원화대출잔액합계
  expression: SUM(기대대손충당금)::FLOAT / NULLIF(SUM(원화대출잔액), 0)
  required_filters:
  - 개인기업구분코드 = '2'
  default_time_dimension: 기준년월
  additive: false
  unit: ratio
  synonyms:
  - 충당금률
  - 리스크비용률
  - 대손비용률
time_resolution_rules:
- user_expression: YYYY년 MM월, MM월, 특정 월
  monthly_columns: 기준년월 = 'YYYYMM'
  daily_columns: 기준년월일 또는 일자 컬럼은 BETWEEN 'YYYYMM01' AND 'YYYYMM31' 형태로 변환
- user_expression: 일별
  preferred_columns:
  - 기준년월일
  - 실적기준년월일
  - 특수채권편입기준년월일
  - 연체발생년월일
- user_expression: 월별
  preferred_columns:
  - 기준년월
  - SUBSTRING(기준년월일, 1, 6)
- user_expression: 연도별
  preferred_columns:
  - 기준년
  - SUBSTRING(기준년월, 1, 4)
  - SUBSTRING(기준년월일, 1, 4)
- user_expression: 최근 기준
  rule: 해당 테이블의 default_time_dimension에서 MAX 값을 서브쿼리로 사용합니다.
metric_generation_rules:
- name: ratio_metrics
  rule: 비율 지표는 분자와 분모를 같은 GROUP BY 레벨에서 계산한 뒤 NULLIF로 나눕니다.
- name: snapshot_metrics
  rule: 스냅샷성 수치(한도, 카드수, 고객수, 잔액성 수치)는 기간 합산 시 중복 가능성을 고려하고 기준년월/기준년월일을 유지합니다.
- name: count_distinct
  rule: 건수/고객수/카드수는 grain에 맞는 DISTINCT key를 사용합니다.
- name: amount_metrics
  rule: 금액 지표는 COALESCE(컬럼, 0)를 사용해 NULL 누락을 줄입니다.
- name: customer_join_metrics
  rule: 가맹점과 채권/충당금 조인은 고객-월 또는 고객-계정-기간으로 사전 집계한 뒤 결합합니다.
- name: tmdaa1d12_snapshot
  rule: tmdaa1d12의 한도, 카드수, 연체원금, 신용등급은 고객-월 스냅샷입니다. 여러 월을 합산하지 말고 기준년월을 유지하거나 최근
    기준월만 선택합니다.
intent_routing:
- intent: corporate_customer_query
  choose_when: 기업고객, 법인고객, 한도, 잔여한도, 이용금액, 연체, 신용등급, 대표가맹점을 묻는 경우
  action: tmdaa1d12를 선택하고 기준년월을 기본 시간축으로 사용합니다.
- intent: metric_query
  choose_when: 사용자가 매출/건수/승인율/연체율/한도사용률 등 공식 지표를 묻는 경우
  action: canonical_metrics에서 지표를 선택하고 default_time_dimension, required_filters, preferred_dimensions를
    반영합니다.
- intent: detailed_list
  choose_when: 사용자가 목록, 상세, 추출, 뽑아줘를 요청하는 경우
  action: metric보다 entity의 identifying dimensions를 우선 선택하고 LIMIT 기본값 100을 적용합니다.
- intent: comparison_or_ranking
  choose_when: 상위, TOP, 순위, 비교, 높은/낮은을 요청하는 경우
  action: 정렬 metric을 명확히 선택하고 ORDER BY metric DESC/ASC 및 LIMIT를 적용합니다.
- intent: merchant_sales_query
  choose_when: 가맹점, 전월매입, 지급금액, 수수료율, 브랜드, 지역, 마케팅업종을 묻는 경우
  action: tbdaaus01 또는 tbmaisd06을 선택하고 기업가맹점전월매입금액 지표를 우선 사용합니다.
- intent: special_debt_query
  choose_when: 특수채권, 특채, 편입원금, 연체회차, 자산건전성을 묻는 경우
  action: tmdaaus01을 선택하고 개인기업구분코드 = '2' 필터를 적용합니다.
- intent: allowance_query
  choose_when: 대손충당금, PD, LGD, 원화대출잔액, 리스크비용률을 묻는 경우
  action: tbmewcm94를 선택하고 대손충당금률 공식 정의를 사용합니다.
- intent: combined_risk_sales_query
  choose_when: 가맹점 포트폴리오와 특수채권/충당금을 결합해 묻는 경우
  action: semantic_join_graph.safe_paths만 사용하고, 고객-월 사전 집계 CTE를 만듭니다.
result_shape_defaults:
