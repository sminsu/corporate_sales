agent:
  name: text2sql-v4
  environment: local
  service_name: text2sql-v4-local

llm:
  model_registry_path: models.example.yaml
  # 기본은 Bedrock OpenAI 호환 gpt-oss-120b. 더 가벼운 20b 또는 로컬 vLLM(local-chat)으로 교체 가능.
  default_model: "openai.gpt-oss-120b-1:0"
  temperature: 0
  max_tokens: 4096
  timeout: 120

embedding:
  provider: tei
  # OpenAI 호환 /v1/embeddings 를 노출하는 임베딩 서버 (예: .local/embedding_server.py).
  base_url: http://127.0.0.1:8124
  model: intfloat/multilingual-e5-small
  api_key: null
  timeout: 60

# Text2SQL 실행 백엔드는 DB_BACKEND 환경변수로 고른다 (postgres | athena).
# Athena 사용 시 아래 값들을 환경변수(.env)로 주입한다 (AWS 자격증명은 표준 체인 사용):
#   DB_BACKEND=athena
#   ATHENA_REGION, ATHENA_S3_STAGING_DIR, ATHENA_WORKGROUP, ATHENA_DATABASE, ATHENA_CATALOG
