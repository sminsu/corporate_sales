agent:
  name: text2sql-v4
  environment: local
  service_name: text2sql-v4-local

llm:
  model_registry_path: models.example.yaml
  # 기본은 Bedrock OpenAI 호환 gpt-oss. 로컬 vLLM을 쓰려면 local-chat 으로 변경.
  default_model: "openai.gpt-oss-20b-1:0"
  temperature: 0
  max_tokens: 4096
  timeout: 120

embedding:
  provider: tei
  # OpenAI 호환 /v1/embeddings 를 노출하는 임베딩 서버 (예: .local/embedding_server.py).
  base_url: http://127.0.0.1:8124
  model: intfloat/multilingual-e5-small
  api_key: null
  timeout: 60
