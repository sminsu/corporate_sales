agent:
  name: corporate_sales
  environment: local
  service_name: cs_dev

  #gemma4-31b  #qwen3.6-35b-a3b
llm:
  model_registry_path: models.local.yaml
  default_model: gpt-oss:120b
  temperature: 0
  max_tokens: 4096
  timeout: 90

embedding:
  provider: tei
  base_url: http://10.81.21.105:18220
  model: bge-m3

retrieval:
  store:
    provider: postgres
    dsn_env: KBCARD_POSTGRES_DSN
    pool_max_size: 10

logger:
  level: INFO
  formatter: pretty
  output: stdout
  file_path: logs/text2sql-agent.jsonl
  max_bytes: 10485760
  backup_count: 5
