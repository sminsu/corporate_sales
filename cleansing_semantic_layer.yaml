# =============================================================================
# Text2SQL Semantic Layer (cleansed) - KB카드 법인영업 시스템
# =============================================================================
# schema_v5.yaml에서 common_athena text2sql 코드가 실제로 소비하는 섹션만 남긴 버전.
#
# 유지(코드에서 사용):
#   1. tables           - 테이블/컬럼 정의 (select_tables가 yaml.dump로 LLM에 주입,
#                         build_table_summary / 스키마 검증에서 사용)
#   2. relationships    - JOIN 경로 (from/to/join_expr)
#   3. metrics          - build_metrics_summary
#   4. glossary         - build_glossary_summary
#   5. query_references - find_relevant_references
#
# 삭제(미사용):
#   - model_info        : 코드에서 읽지 않는 순수 메타데이터
#   - verified_queries  : 런타임에 tools/sql_verified_queries.yaml 외부 파일이
#                         _merge_external_verified_queries()로 항상 덮어쓰므로 미사용
#   - domains           : 코드는 v6 키 canonical_domains만 읽고 v5의 domains는 읽지 않음
# =============================================================================

# =============================================================================
# 1. TABLES - 테이블 및 컬럼 정의
# =============================================================================
tables:
  # ── 카드사 마스터 ──
  - name: tbdaaaf17
    physical_table: card_system.tbdaaaf17
    description: >
      카드사 기본 정보 마스터 테이블. 한 행은 하나의 카드사를 나타냅니다.
    grain: "카드사 1개"
    primary_key: [카드사코드]

    dimensions:
      - name: 카드사코드
        description: "카드사 고유 식별 코드"
        expr: 카드사코드
        data_type: VARCHAR
        unique: true

      - name: 카드사명
        description: "카드사 명칭"
        expr: 카드사명
        data_type: VARCHAR
        synonyms: ["카드사이름", "카드회사명"]
        sample_values: ["KB국민카드", "신한카드", "삼성카드"]

      - name: 대표전화
        description: "카드사 대표 전화번호"
        expr: 대표전화
        data_type: VARCHAR

      - name: 홈페이지
        description: "카드사 홈페이지 URL"
        expr: 홈페이지
        data_type: VARCHAR

    time_dimensions:
      - name: 설립일
        description: "카드사 설립일"
        expr: 설립일
        data_type: DATE

  # ── 기업 신용심사 ──
  - name: tbdaaaf23
    physical_table: card_system.tbdaaaf23
    description: >
      기업 신용심사 정보 테이블. 한 행은 하나의 기업카드 신청 심사건을 나타냅니다.
      신용평가등급, 재무정보, 심사결과(승인/거절)를 포함합니다.
    grain: "심사 신청건 1건"
    primary_key: [신청서접수번호]

    dimensions:
      - name: 신청서접수번호
        description: "심사 신청서 접수 고유번호"
        expr: 신청서접수번호
        data_type: VARCHAR
        unique: true

      - name: 관리부점코드
        description: "심사 관리 부점(지점) 코드"
        expr: 관리부점코드
        data_type: VARCHAR
        synonyms: ["지점코드", "부점"]

      - name: 신용평가모형구분코드
        description: "적용된 신용평가 모형 유형"
        expr: 신용평가모형구분코드
        data_type: VARCHAR

      - name: 신용평가등급코드
        description: "기업 신용평가 등급"
        expr: 신용평가등급코드
        data_type: VARCHAR
        synonyms: ["신용등급", "평가등급", "기업등급"]

      - name: 고객군형태구분코드
        description: "고객군 형태 구분 (대기업/중소기업 등)"
        expr: 고객군형태구분코드
        data_type: VARCHAR
        synonyms: ["고객유형", "기업규모"]

      - name: 카드기업형태구분코드
        description: "카드 발급 기업 형태 구분"
        expr: 카드기업형태구분코드
        data_type: VARCHAR

      - name: 본사사업자등록번호
        description: "심사 대상 기업의 본사 사업자등록번호"
        expr: 본사사업자등록번호
        data_type: VARCHAR
        synonyms: ["사업자번호", "사업자등록번호"]

      - name: 개인법인구분코드
        description: "개인사업자/법인 구분"
        expr: 개인법인구분코드
        data_type: VARCHAR
        synonyms: ["개인법인구분"]

      - name: 카드처리결과구분코드
        description: "심사 처리 결과 (승인/거절 등)"
        expr: 카드처리결과구분코드
        data_type: VARCHAR
        synonyms: ["심사결과", "처리결과", "승인여부"]

      - name: 처리결과사유구분코드
        description: "심사 결과 사유 코드"
        expr: 처리결과사유구분코드
        data_type: VARCHAR

      - name: 표준산업분류코드
        description: "기업의 표준산업분류 코드"
        expr: 표준산업분류코드
        data_type: VARCHAR
        synonyms: ["산업분류", "업종코드"]

      - name: kis신용등급코드
        description: "KIS(한국신용평가) 신용등급"
        expr: kis신용등급코드
        data_type: VARCHAR
        synonyms: ["KIS등급"]

      - name: cass신용등급코드
        description: "CASS 신용등급"
        expr: cass신용등급코드
        data_type: VARCHAR

      - name: 재무모형등급코드
        description: "재무모형 기반 평가등급"
        expr: 재무모형등급코드
        data_type: VARCHAR

      - name: kb카드연체여부
        description: "KB카드 연체 이력 여부"
        expr: kb카드연체여부
        data_type: VARCHAR
        synonyms: ["연체여부"]

      - name: 타사연체여부
        description: "타 카드사 연체 이력 여부"
        expr: 타사연체여부
        data_type: VARCHAR

      - name: 유효기업카드소지여부
        description: "현재 유효한 기업카드 보유 여부"
        expr: 유효기업카드소지여부
        data_type: VARCHAR

      - name: 거래정지업체여부
        description: "거래정지 업체 여부"
        expr: 거래정지업체여부
        data_type: VARCHAR

      - name: 대기업분류여부
        description: "대기업 분류 여부"
        expr: 대기업분류여부
        data_type: VARCHAR
        synonyms: ["대기업여부"]

    measures:
      - name: 자기자본금
        description: "기업 자기자본금 (원)"
        expr: 자기자본금
        data_type: NUMERIC
        default_aggregation: sum
        synonyms: ["자본금"]

      - name: 매출금액
        description: "기업 매출금액 (원)"
        expr: 매출금액
        data_type: NUMERIC
        default_aggregation: sum
        synonyms: ["기업매출"]

      - name: 자산총계금액
        description: "기업 자산 총계 (원)"
        expr: 자산총계금액
        data_type: NUMERIC
        default_aggregation: sum
        synonyms: ["총자산", "자산총계"]

      - name: 당기순이익
        description: "당기 순이익 (원)"
        expr: 당기순이익
        data_type: NUMERIC
        default_aggregation: sum

      - name: 부채총계금액
        description: "부채 총계 (원)"
        expr: 부채총계금액
        data_type: NUMERIC
        default_aggregation: sum
        synonyms: ["총부채", "부채총계"]

      - name: 영업점부여한도금액
        description: "영업점에서 부여한 한도 금액 (원)"
        expr: 영업점부여한도금액
        data_type: NUMERIC
        default_aggregation: sum

      - name: 최종부여한도금액
        description: "최종 부여된 한도 금액 (원)"
        expr: 최종부여한도금액
        data_type: NUMERIC
        default_aggregation: sum
        synonyms: ["부여한도", "승인한도"]

      - name: 종업원수
        description: "기업 종업원 수"
        expr: 종업원수
        data_type: NUMERIC
        default_aggregation: avg
        synonyms: ["직원수", "임직원수"]

      - name: kis신용평점
        description: "KIS 신용평점"
        expr: kis신용평점
        data_type: NUMERIC
        default_aggregation: avg

      - name: cass신용평점
        description: "CASS 신용평점"
        expr: cass신용평점
        data_type: NUMERIC
        default_aggregation: avg

    time_dimensions:
      - name: 최종심사년월일
        description: "최종 심사 완료일"
        expr: 최종심사년월일
        data_type: VARCHAR
        synonyms: ["심사일", "심사일자"]

      - name: 설립년월일
        description: "기업 설립일"
        expr: 설립년월일
        data_type: VARCHAR

    filters:
      - name: 승인건
        description: "심사 승인된 건만 필터"
        expr: "카드처리결과구분코드 = '01'"
        synonyms: ["승인", "승인완료"]

      - name: 거절건
        description: "심사 거절된 건만 필터"
        expr: "카드처리결과구분코드 = '02'"
        synonyms: ["거절", "반려"]

      - name: 법인기업
        description: "법인 기업만 필터"
        expr: "개인법인구분코드 = '2'"
        synonyms: ["법인", "법인사업자"]

  # ── 기업고객 마스터 ──
  - name: tbdaaat14
    physical_table: card_system.tbdaaat14
    description: >
      기업고객 종합 마스터 테이블. 한 행은 하나의 기업고객 레코드를 나타냅니다.
      기업정보, 가맹점정보, 카드보유현황을 포함합니다.
    grain: "기업고객 1건 (기준년월일 기준)"
    primary_key: [고객식별자, 기준년월일]

    time_dimensions:
      - name: 기준년월일
        description: "데이터 기준일"
        expr: 기준년월일
        data_type: VARCHAR
        synonyms: ["기준일", "기준날짜"]

    dimensions:
      - name: 고객식별자
        description: "기업고객 고유 식별자"
        expr: 고객식별자
        data_type: VARCHAR
        synonyms: ["고객ID", "고객번호"]

      - name: 고객관리번호
        description: "고객 관리번호"
        expr: 고객관리번호
        data_type: VARCHAR

      - name: 법인등록번호
        description: "법인 등록번호"
        expr: 법인등록번호
        data_type: VARCHAR
        synonyms: ["법인번호"]

      - name: 본사사업자등록번호
        description: "본사 사업자등록번호"
        expr: 본사사업자등록번호
        data_type: VARCHAR
        synonyms: ["사업자번호", "사업자등록번호"]

      - name: 가맹점명
        description: "기업 가맹점 명칭"
        expr: 가맹점명
        data_type: VARCHAR

      - name: 표준산업분류코드
        description: "표준산업분류 코드"
        expr: 표준산업분류코드
        data_type: VARCHAR
        synonyms: ["산업분류", "업종"]

      - name: 업종구분코드
        description: "업종 구분 코드"
        expr: 업종구분코드
        data_type: VARCHAR

      - name: 가맹점번호
        description: "가맹점 고유번호"
        expr: 가맹점번호
        data_type: VARCHAR

      - name: 가맹점업종코드
        description: "가맹점 업종 코드"
        expr: 가맹점업종코드
        data_type: VARCHAR

      - name: 가맹점상태구분코드
        description: "가맹점 상태 (정상/해지 등)"
        expr: 가맹점상태구분코드
        data_type: VARCHAR
        synonyms: ["가맹점상태"]

      - name: 기업대표자고객식별자
        description: "기업 대표자의 고객 식별자"
        expr: 기업대표자고객식별자
        data_type: VARCHAR

    measures:
      - name: 회원보유신용카드수
        description: "보유 신용카드 수"
        expr: 회원보유신용카드수
        data_type: INTEGER
        default_aggregation: sum
        synonyms: ["신용카드수", "신용카드보유수"]

      - name: 회원보유체크카드수
        description: "보유 체크카드 수"
        expr: 회원보유체크카드수
        data_type: INTEGER
        default_aggregation: sum
        synonyms: ["체크카드수", "체크카드보유수"]

      - name: 회원유효신용카드수
        description: "유효한 신용카드 수"
        expr: 회원유효신용카드수
        data_type: INTEGER
        default_aggregation: sum
        synonyms: ["유효신용카드"]

      - name: 회원유효체크카드수
        description: "유효한 체크카드 수"
        expr: 회원유효체크카드수
        data_type: INTEGER
        default_aggregation: sum
        synonyms: ["유효체크카드"]

  # ── 고객 마스터 ──
  - name: tbdaaat01
    physical_table: card_system.tbdaaat01
    description: >
      고객 기본 마스터 테이블. 한 행은 하나의 고객을 나타냅니다.
      개인/기업 고객 공통 정보(상태, 연락처, 주소, 마케팅 동의 등)를 포함합니다.
    grain: "고객 1명"
    primary_key: [고객식별자]

    dimensions:
      - name: 고객식별자
        description: "고객 고유 식별자"
        expr: 고객식별자
        data_type: VARCHAR
        unique: true
        synonyms: ["고객ID"]

      - name: 고객관리번호
        description: "고객 관리번호"
        expr: 고객관리번호
        data_type: VARCHAR

      - name: 개인기업구분코드
        description: "개인/기업 구분 코드"
        expr: 개인기업구분코드
        data_type: VARCHAR
        synonyms: ["개인법인구분"]
        sample_values: ["1 (개인)", "2 (기업)"]

      - name: 고객상태구분코드
        description: "고객 상태 (정상/해지 등)"
        expr: 고객상태구분코드
        data_type: VARCHAR
        synonyms: ["고객상태"]

      - name: 고객유형분류구분코드
        description: "고객 유형 분류"
        expr: 고객유형분류구분코드
        data_type: VARCHAR

      - name: 법인등록번호
        description: "법인등록번호"
        expr: 법인등록번호
        data_type: VARCHAR

      - name: 본사사업자등록번호
        description: "본사 사업자등록번호"
        expr: 본사사업자등록번호
        data_type: VARCHAR

      - name: 가맹점명
        description: "기업/가맹점 명칭"
        expr: 가맹점명
        data_type: VARCHAR
        synonyms: ["업체명", "기업명", "회사명"]

      - name: 표준산업분류코드
        description: "표준산업분류 코드"
        expr: 표준산업분류코드
        data_type: VARCHAR

      - name: 성별구분코드
        description: "대표자 성별"
        expr: 성별구분코드
        data_type: VARCHAR

      - name: 카드거래정지여부
        description: "카드 거래정지 상태 여부"
        expr: 카드거래정지여부
        data_type: VARCHAR

      - name: 유효카드존재회원여부
        description: "유효한 카드가 있는 회원인지 여부"
        expr: 유효카드존재회원여부
        data_type: VARCHAR

      - name: 카드고객서비스구분코드
        description: "고객 서비스 등급 구분"
        expr: 카드고객서비스구분코드
        data_type: VARCHAR
        synonyms: ["고객등급", "서비스등급"]

    time_dimensions:
      - name: 최초등록년월일
        description: "고객 최초 등록일"
        expr: 최초등록년월일
        data_type: VARCHAR
        synonyms: ["가입일", "등록일"]

    filters:
      - name: 기업고객
        description: "기업 고객만 필터"
        expr: "개인기업구분코드 = '2'"
        synonyms: ["법인고객", "기업"]

      - name: 유효카드보유
        description: "유효 카드를 보유한 고객만 필터"
        expr: "유효카드존재회원여부 = 'Y'"

  # ── 매출전표 (팩트) ──
  - name: tbdaabt30
    physical_table: card_system.tbdaabt30
    description: >
      카드 매출전표 상세 팩트 테이블. 한 행은 하나의 매출전표(거래)를 나타냅니다.
      카드 승인/매입 금액, 가맹점, 할부정보, 수수료 등을 포함합니다.
      법인카드 이용 분석의 핵심 테이블입니다.
    grain: "매출전표 1건"
    primary_key: [매출전표번호, 기준년월]

    time_dimensions:
      - name: 전표매출년월일
        description: "매출 발생일 (실제 결제일)"
        expr: 전표매출년월일
        data_type: VARCHAR
        synonyms: ["매출일", "결제일자", "거래일"]

      - name: 전표매입년월일
        description: "매입 처리일"
        expr: 전표매입년월일
        data_type: VARCHAR
        synonyms: ["매입일"]

      - name: 기준년월
        description: "데이터 기준 년월"
        expr: 기준년월
        data_type: VARCHAR

    dimensions:
      - name: 매출전표번호
        description: "매출전표 고유번호"
        expr: 매출전표번호
        data_type: VARCHAR
        unique: true

      - name: 카드매출유형구분코드
        description: "매출 유형 (일시불/할부/CA 등)"
        expr: 카드매출유형구분코드
        data_type: VARCHAR
        synonyms: ["매출유형", "거래유형"]

      - name: 가맹점번호
        description: "거래 발생 가맹점 번호"
        expr: 가맹점번호
        data_type: VARCHAR

      - name: 가맹점업종코드
        description: "거래 가맹점의 업종 코드"
        expr: 가맹점업종코드
        data_type: VARCHAR
        synonyms: ["업종코드"]

      - name: 가맹점명
        description: "거래 가맹점 명칭"
        expr: 가맹점명
        data_type: VARCHAR

      - name: 카드식별자
        description: "사용 카드 식별자"
        expr: 카드식별자
        data_type: VARCHAR

      - name: 소유자고객식별자
        description: "카드 소유자(기업) 고객 식별자"
        expr: 소유자고객식별자
        data_type: VARCHAR

      - name: 본인고객식별자
        description: "실제 카드 사용자 고객 식별자"
        expr: 본인고객식별자
        data_type: VARCHAR

      - name: 기업고객식별자
        description: "기업 고객 식별자"
        expr: 기업고객식별자
        data_type: VARCHAR

      - name: 개인기업구분코드
        description: "개인/기업 거래 구분"
        expr: 개인기업구분코드
        data_type: VARCHAR
        synonyms: ["개인법인구분"]

      - name: 카드브랜드구분코드
        description: "카드 브랜드 (VISA/Master/국내 등)"
        expr: 카드브랜드구분코드
        data_type: VARCHAR
        synonyms: ["카드브랜드"]

      - name: 카드등급구분코드
        description: "카드 등급"
        expr: 카드등급구분코드
        data_type: VARCHAR
        synonyms: ["카드등급"]

      - name: 전표취소구분코드
        description: "전표 취소 여부/유형"
        expr: 전표취소구분코드
        data_type: VARCHAR
        synonyms: ["취소여부"]

      - name: mcc업종코드
        description: "MCC(Merchant Category Code) 업종코드"
        expr: mcc업종코드
        data_type: VARCHAR
        synonyms: ["MCC코드"]

      - name: 온라인거래여부
        description: "온라인 거래 여부"
        expr: 온라인거래여부
        data_type: VARCHAR

      - name: 가맹점사업자등록번호
        description: "거래 가맹점 사업자등록번호"
        expr: 가맹점사업자등록번호
        data_type: VARCHAR

      - name: year
        description: "파티션 연도"
        expr: year
        data_type: VARCHAR

      - name: month
        description: "파티션 월"
        expr: month
        data_type: VARCHAR

      - name: day
        description: "파티션 일"
        expr: day
        data_type: VARCHAR

    measures:
      - name: 매출금액
        description: "매출 금액 (원)"
        expr: 매출금액
        data_type: BIGINT
        default_aggregation: sum
        synonyms: ["거래금액", "이용금액", "결제금액"]

      - name: 카드승인금액
        description: "카드 승인 금액 (원)"
        expr: 카드승인금액
        data_type: BIGINT
        default_aggregation: sum
        synonyms: ["승인금액"]

      - name: 할부기간개월수
        description: "할부 개월 수"
        expr: 할부기간개월수
        data_type: BIGINT
        default_aggregation: avg
        synonyms: ["할부개월"]

      - name: 가맹점수수료
        description: "가맹점 수수료 (원)"
        expr: 가맹점수수료
        data_type: BIGINT
        default_aggregation: sum
        synonyms: ["수수료"]

      - name: 가맹점수수료율
        description: "가맹점 수수료율 (%)"
        expr: 가맹점수수료율
        data_type: NUMERIC
        default_aggregation: avg

      - name: ca수수료
        description: "CA(현금서비스) 수수료 (원)"
        expr: ca수수료
        data_type: BIGINT
        default_aggregation: sum

      - name: 봉사료
        description: "봉사료 (원)"
        expr: 봉사료
        data_type: BIGINT
        default_aggregation: sum

    filters:
      - name: 기업거래
        description: "기업(법인) 카드 거래만 필터"
        expr: "개인기업구분코드 = '2'"
        synonyms: ["법인거래", "기업카드거래"]

      - name: 정상거래
        description: "취소되지 않은 정상 거래만 필터"
        expr: "전표취소구분코드 IS NULL OR 전표취소구분코드 = '0'"
        synonyms: ["취소제외"]

      - name: 온라인거래
        description: "온라인 거래만 필터"
        expr: "온라인거래여부 = 'Y'"

  # ── 무이자할부 서비스 ──
  - name: tbdaada23
    physical_table: card_system.tbdaada23
    description: >
      무이자할부 서비스 정보 테이블. 한 행은 하나의 무이자할부 적용 조건을 나타냅니다.
      가맹점/제휴업체별 무이자할부 기간과 금액 조건을 포함합니다.
    grain: "무이자할부 조건 1건"
    primary_key: [서비스코드, 가맹점번호, 정보적용일련번호]

    dimensions:
      - name: 서비스코드
        description: "무이자할부 서비스 코드"
        expr: 서비스코드
        data_type: VARCHAR

      - name: 제휴업체코드
        description: "제휴업체 코드"
        expr: 제휴업체코드
        data_type: VARCHAR

      - name: 가맹점번호
        description: "적용 가맹점 번호"
        expr: 가맹점번호
        data_type: VARCHAR

      - name: 무이자할부수수료적용구분코드
        description: "무이자할부 수수료 적용 구분"
        expr: 무이자할부수수료적용구분코드
        data_type: VARCHAR

    measures:
      - name: 최소무이자할부개월수
        description: "최소 무이자 할부 개월 수"
        expr: 최소무이자할부개월수
        data_type: NUMERIC
        default_aggregation: min

      - name: 최대무이자할부개월수
        description: "최대 무이자 할부 개월 수"
        expr: 최대무이자할부개월수
        data_type: NUMERIC
        default_aggregation: max
        synonyms: ["무이자할부기간"]

      - name: 무이자할부거래건당최소금액
        description: "무이자할부 적용 최소 거래 금액 (원)"
        expr: 무이자할부거래건당최소금액
        data_type: NUMERIC
        default_aggregation: min

      - name: 무이자할부거래건당최대금액
        description: "무이자할부 적용 최대 거래 금액 (원)"
        expr: 무이자할부거래건당최대금액
        data_type: NUMERIC
        default_aggregation: max

    time_dimensions:
      - name: 정보적용시작년월일
        description: "무이자할부 적용 시작일"
        expr: 정보적용시작년월일
        data_type: VARCHAR

      - name: 정보적용종료년월일
        description: "무이자할부 적용 종료일"
        expr: 정보적용종료년월일
        data_type: VARCHAR

  # ── 가맹점 업종코드 마스터 ──
  - name: tbdaadb17
    physical_table: card_system.tbdaadb17
    description: >
      가맹점 업종코드 마스터 테이블. 한 행은 하나의 업종코드를 나타냅니다.
      업종 분류체계(대분류/중분류), 수수료율, 할부 가능 여부 등을 포함합니다.
    grain: "업종코드 1개"
    primary_key: [가맹점업종코드]

    dimensions:
      - name: 가맹점업종코드
        description: "가맹점 업종 코드 (PK)"
        expr: 가맹점업종코드
        data_type: VARCHAR
        unique: true
        synonyms: ["업종코드"]

      - name: 가맹점업종명
        description: "가맹점 업종 명칭"
        expr: 가맹점업종명
        data_type: VARCHAR
        synonyms: ["업종명", "업종이름"]

      - name: 업종대분류코드명
        description: "업종 대분류 명칭"
        expr: 업종대분류코드명
        data_type: VARCHAR
        synonyms: ["대분류", "업종대분류"]

      - name: 가맹점업종대분류구분코드
        description: "업종 대분류 구분 코드"
        expr: 가맹점업종대분류구분코드
        data_type: VARCHAR

      - name: 가맹점업종중분류구분코드
        description: "업종 중분류 구분 코드"
        expr: 가맹점업종중분류구분코드
        data_type: VARCHAR
        synonyms: ["중분류코드"]

      - name: mcc업종코드
        description: "MCC 업종코드"
        expr: mcc업종코드
        data_type: VARCHAR

      - name: 할부가능여부
        description: "해당 업종의 할부 거래 가능 여부"
        expr: 할부가능여부
        data_type: VARCHAR

      - name: 사용여부
        description: "업종코드 사용 여부"
        expr: 사용여부
        data_type: VARCHAR

    measures:
      - name: 신용카드가맹점수수료율
        description: "신용카드 가맹점 수수료율 (%)"
        expr: 신용카드가맹점수수료율
        data_type: NUMERIC
        default_aggregation: avg
        synonyms: ["신용수수료율"]

      - name: 체크카드가맹점수수료율
        description: "체크카드 가맹점 수수료율 (%)"
        expr: 체크카드가맹점수수료율
        data_type: NUMERIC
        default_aggregation: avg
        synonyms: ["체크수수료율"]

      - name: 할부가능개월수
        description: "할부 가능 최대 개월 수"
        expr: 할부가능개월수
        data_type: NUMERIC
        default_aggregation: max

  # ── 가맹점 마스터 (일단위) ──
  - name: tbdaadt01
    physical_table: card_system.tbdaadt01
    description: >
      가맹점 일단위 마스터 테이블. 한 행은 하나의 가맹점 정보를 나타냅니다.
      가맹점 기본정보, 수수료, 한도, 매출 등을 포함합니다.
    grain: "가맹점 1개 (실적기준년월일 기준)"
    primary_key: [가맹점번호, 실적기준년월일]

    time_dimensions:
      - name: 실적기준년월일
        description: "실적 기준일"
        expr: 실적기준년월일
        data_type: VARCHAR
        synonyms: ["기준일"]

      - name: 가맹점신규년월일
        description: "가맹점 신규 등록일"
        expr: 가맹점신규년월일
        data_type: VARCHAR
        synonyms: ["가맹점등록일", "가입일"]

      - name: 가맹점해지년월일
        description: "가맹점 해지일"
        expr: 가맹점해지년월일
        data_type: VARCHAR
        synonyms: ["해지일"]

    dimensions:
      - name: 가맹점번호
        description: "가맹점 고유번호"
        expr: 가맹점번호
        data_type: VARCHAR
        synonyms: ["가맹점ID"]

      - name: 가맹점명
        description: "가맹점 명칭"
        expr: 가맹점명
        data_type: VARCHAR
        synonyms: ["상호명", "가맹점이름"]

      - name: 가맹점상태구분코드
        description: "가맹점 상태 (정상/해지/거래정지 등)"
        expr: 가맹점상태구분코드
        data_type: VARCHAR
        synonyms: ["가맹점상태"]

      - name: 가맹점업종코드
        description: "가맹점 업종 코드"
        expr: 가맹점업종코드
        data_type: VARCHAR

      - name: mcc업종코드
        description: "MCC 업종코드"
        expr: mcc업종코드
        data_type: VARCHAR

      - name: 사업자등록번호
        description: "가맹점 사업자등록번호"
        expr: 사업자등록번호
        data_type: VARCHAR

      - name: 가맹점유형구분코드
        description: "가맹점 유형 구분"
        expr: 가맹점유형구분코드
        data_type: VARCHAR

      - name: 가맹점관리부점코드
        description: "가맹점 관리 부점(지점) 코드"
        expr: 가맹점관리부점코드
        data_type: VARCHAR
        synonyms: ["관리지점"]

      - name: 가맹점거래정지여부
        description: "거래정지 여부"
        expr: 가맹점거래정지여부
        data_type: VARCHAR

      - name: 기업고객식별자
        description: "가맹점 소속 기업 고객 식별자"
        expr: 기업고객식별자
        data_type: VARCHAR

      - name: 가맹점수수료구분코드
        description: "수수료 구분 코드"
        expr: 가맹점수수료구분코드
        data_type: VARCHAR

    measures:
      - name: 신용카드가맹점수수료율
        description: "신용카드 수수료율 (%)"
        expr: 신용카드가맹점수수료율
        data_type: NUMERIC
        default_aggregation: avg

      - name: 체크카드가맹점수수료율
        description: "체크카드 수수료율 (%)"
        expr: 체크카드가맹점수수료율
        data_type: NUMERIC
        default_aggregation: avg

      - name: 금년가맹점신용판매매출금액
        description: "금년 신용카드 판매 매출금액 (원)"
        expr: 금년가맹점신용판매매출금액
        data_type: NUMERIC
        default_aggregation: sum
        synonyms: ["금년매출", "올해매출"]

      - name: 전년가맹점신용판매매출금액
        description: "전년 신용카드 판매 매출금액 (원)"
        expr: 전년가맹점신용판매매출금액
        data_type: NUMERIC
        default_aggregation: sum
        synonyms: ["전년매출", "작년매출"]

      - name: 가맹점1회승인한도금액
        description: "1회 승인 한도 금액 (원)"
        expr: 가맹점1회승인한도금액
