        synonyms: ["카드등급"]

      - name: 상품코드
        description: "카드 상품 코드"
        expr: 상품코드
        data_type: VARCHAR

      - name: 유효신용카드여부
        description: "유효 신용카드 여부"
        expr: 유효신용카드여부
        data_type: VARCHAR

      - name: 유효체크카드여부
        description: "유효 체크카드 여부"
        expr: 유효체크카드여부
        data_type: VARCHAR

      - name: 회원거래정지여부
        description: "회원 거래 정지 여부"
        expr: 회원거래정지여부
        data_type: VARCHAR

      - name: 카드거래정지여부
        description: "카드 거래 정지 여부"
        expr: 카드거래정지여부
        data_type: VARCHAR

      - name: year
        description: "파티션 연도"
        expr: year
        data_type: VARCHAR

      - name: month
        description: "파티션 월"
        expr: month
        data_type: VARCHAR

    measures:
      - name: 기업카드신용한도금액
