        expr: 기업카드신용한도금액
        data_type: BIGINT
        default_aggregation: sum
        synonyms: ["카드한도", "신용한도"]

      - name: 금월이용합계건수
        description: "당월 이용 합계 건수"
        expr: 금월이용합계건수
        data_type: BIGINT
        default_aggregation: sum
        synonyms: ["이용건수"]

      - name: 금월이용합계금액
        description: "당월 이용 합계 금액 (원)"
        expr: 금월이용합계금액
        data_type: BIGINT
        default_aggregation: sum
        synonyms: ["이용금액", "당월이용액"]

      - name: 금월일시불이용건수
        description: "당월 일시불 이용 건수"
        expr: 금월일시불이용건수
        data_type: BIGINT
        default_aggregation: sum

      - name: 금월일시불이용금액
        description: "당월 일시불 이용 금액 (원)"
        expr: 금월일시불이용금액
        data_type: BIGINT
        default_aggregation: sum

      - name: 금월할부이용건수
        description: "당월 할부 이용 건수"
        expr: 금월할부이용건수
        data_type: BIGINT
        default_aggregation: sum

      - name: 금월할부이용금액
        description: "당월 할부 이용 금액 (원)"
        expr: 금월할부이용금액
        data_type: BIGINT
        default_aggregation: sum

      - name: 금월ca이용건수
        description: "당월 CA 이용 건수"
        expr: 금월ca이용건수
        data_type: BIGINT
        default_aggregation: sum

      - name: 금월ca이용금액
        description: "당월 CA 이용 금액 (원)"
        expr: 금월ca이용금액
        data_type: BIGINT
        default_aggregation: sum

      - name: 금월청구금액
        description: "당월 청구 금액 (원)"
        expr: 금월청구금액
        data_type: BIGINT
        default_aggregation: sum
        synonyms: ["청구금액"]

      - name: 금월청구건수
        description: "당월 청구 건수"
        expr: 금월청구건수
        data_type: BIGINT
        default_aggregation: sum

      - name: 최근1년카드이용건수
        description: "최근 1년 카드 이용 건수"
        expr: 최근1년카드이용건수
        data_type: BIGINT
        default_aggregation: sum

      - name: 최근1년카드이용금액
        description: "최근 1년 카드 이용 금액 (원)"
        expr: 최근1년카드이용금액
        data_type: BIGINT
        default_aggregation: sum

      - name: 연체원금
        description: "연체 원금 (원)"
        expr: 연체원금
        data_type: BIGINT
        default_aggregation: sum

      - name: 연체회차
        description: "연체 회차"
        expr: 연체회차
        data_type: BIGINT
        default_aggregation: max

    filters:
      - name: 기업카드
        description: "기업카드만 필터"
        expr: "개인기업구분코드 = '2'"
        synonyms: ["법인카드"]

      - name: 유효카드
        description: "유효한 카드만 필터"
        expr: "유효신용카드여부 = 'Y' OR 유효체크카드여부 = 'Y'"

      - name: 연체발생
        description: "연체가 발생한 카드만 필터"
        expr: "연체원금 > 0"

  # ── 가맹점 월별 마스터 ──
  - name: tmdaa5d01
    physical_table: card_system.tmdaa5d01
    description: >
      가맹점 월별 마스터 스냅샷 테이블. 한 행은 한 가맹점의 월별 상태를 나타냅니다.
      가맹점 기본정보, 수수료, 한도 등의 월별 스냅샷입니다.
    grain: "가맹점-월 1건"
    primary_key: [가맹점번호, 기준년월]

    time_dimensions:
      - name: 기준년월
        description: "기준 년월"
        expr: 기준년월
        data_type: VARCHAR

    dimensions:
      - name: 가맹점번호
        description: "가맹점 번호"
        expr: 가맹점번호
        data_type: VARCHAR

      - name: 가맹점명
        description: "가맹점 명칭"
        expr: 가맹점명
        data_type: VARCHAR

      - name: 가맹점상태구분코드
        description: "가맹점 상태"
        expr: 가맹점상태구분코드
        data_type: VARCHAR

      - name: 가맹점업종코드
        description: "가맹점 업종 코드"
        expr: 가맹점업종코드
        data_type: VARCHAR

      - name: 사업자등록번호
        description: "사업자등록번호"
        expr: 사업자등록번호
        data_type: VARCHAR

      - name: 가맹점관리부점코드
        description: "관리 부점 코드"
        expr: 가맹점관리부점코드
        data_type: VARCHAR

      - name: 가맹점유형구분코드
        description: "가맹점 유형"
        expr: 가맹점유형구분코드
        data_type: VARCHAR

      - name: year
        description: "파티션 연도"
        expr: year
        data_type: VARCHAR

      - name: month
        description: "파티션 월"
        expr: month
        data_type: VARCHAR

    measures:
      - name: 금년가맹점신용판매매출금액
        description: "금년 신용판매 매출 (원)"
        expr: 금년가맹점신용판매매출금액
        data_type: BIGINT
        default_aggregation: sum

      - name: 전년가맹점신용판매매출금액
        description: "전년 신용판매 매출 (원)"
        expr: 전년가맹점신용판매매출금액
        data_type: BIGINT
        default_aggregation: sum

      - name: 신용카드가맹점수수료율
        description: "신용카드 수수료율"
        expr: 신용카드가맹점수수료율
        data_type: NUMERIC
        default_aggregation: avg

      - name: 체크카드가맹점수수료율
        description: "체크카드 수수료율"
        expr: 체크카드가맹점수수료율
        data_type: NUMERIC
        default_aggregation: avg

  # ── 가맹점 월별 실적 ──
  - name: tmdaa5e11
    physical_table: card_system.tmdaa5e11
    description: >
      가맹점 월별 실적 테이블. 한 행은 한 가맹점의 월별 실적을 나타냅니다.
      매출건수, 매출금액, 수수료, 기간별 실적 등을 포함합니다.
      가맹점 실적 분석의 핵심 테이블입니다.
    grain: "가맹점-월 1건"
    primary_key: [가맹점번호, 기준년월]

    time_dimensions:
      - name: 기준년월
        description: "실적 기준 년월"
        expr: 기준년월
        data_type: VARCHAR
        synonyms: ["기준월"]

    dimensions:
      - name: 가맹점번호
        description: "가맹점 번호"
        expr: 가맹점번호
        data_type: VARCHAR

      - name: 사업자등록번호
        description: "사업자등록번호"
        expr: 사업자등록번호
        data_type: VARCHAR

      - name: 가맹점업종코드
        description: "가맹점 업종 코드"
        expr: 가맹점업종코드
        data_type: VARCHAR

      - name: mcc업종코드
        description: "MCC 업종코드"
        expr: mcc업종코드
        data_type: VARCHAR

      - name: 가맹점명
        description: "가맹점 명칭"
        expr: 가맹점명
        data_type: VARCHAR

      - name: 가맹점관리부점코드
        description: "관리 부점 코드"
        expr: 가맹점관리부점코드
        data_type: VARCHAR

      - name: 가맹점유형구분코드
        description: "가맹점 유형"
        expr: 가맹점유형구분코드
        data_type: VARCHAR

      - name: 가맹점거래정지여부
        description: "거래 정지 여부"
        expr: 가맹점거래정지여부
        data_type: VARCHAR

      - name: year
        description: "파티션 연도"
        expr: year
        data_type: VARCHAR

      - name: month
        description: "파티션 월"
        expr: month
        data_type: VARCHAR

    measures:
      - name: 가맹점일시불매입건수
        description: "일시불 매입 건수"
        expr: 가맹점일시불매입건수
        data_type: NUMERIC
        default_aggregation: sum

      - name: 가맹점일시불매입금액
        description: "일시불 매입 금액 (원)"
        expr: 가맹점일시불매입금액
        data_type: NUMERIC
        default_aggregation: sum
        synonyms: ["일시불매출"]

      - name: 가맹점할부매입건수
        description: "할부 매입 건수"
        expr: 가맹점할부매입건수
        data_type: NUMERIC
        default_aggregation: sum

      - name: 가맹점할부매입금액
        description: "할부 매입 금액 (원)"
        expr: 가맹점할부매입금액
        data_type: NUMERIC
        default_aggregation: sum
        synonyms: ["할부매출"]

      - name: 가맹점일시불매출건수
        description: "일시불 매출 건수"
        expr: 가맹점일시불매출건수
        data_type: NUMERIC
        default_aggregation: sum

      - name: 가맹점일시불매출금액
        description: "일시불 매출 금액 (원)"
        expr: 가맹점일시불매출금액
        data_type: NUMERIC
        default_aggregation: sum

      - name: 가맹점할부매출건수
        description: "할부 매출 건수"
        expr: 가맹점할부매출건수
        data_type: NUMERIC
        default_aggregation: sum

      - name: 가맹점할부매출금액
        description: "할부 매출 금액 (원)"
        expr: 가맹점할부매출금액
        data_type: NUMERIC
        default_aggregation: sum

      - name: 가맹점수입수수료
        description: "가맹점 수입수수료 (원)"
        expr: 가맹점수입수수료
        data_type: NUMERIC
        default_aggregation: sum
        synonyms: ["수수료수입"]

      - name: 금년가맹점신용판매매출금액
        description: "금년 신용판매 매출 (원)"
        expr: 금년가맹점신용판매매출금액
        data_type: NUMERIC
        default_aggregation: sum

      - name: 전년가맹점신용판매매출금액
        description: "전년 신용판매 매출 (원)"
        expr: 전년가맹점신용판매매출금액
        data_type: NUMERIC
        default_aggregation: sum

      - name: 최근3개월가맹점매출건수
        description: "최근 3개월 매출 건수"
        expr: 최근3개월가맹점매출건수
        data_type: NUMERIC
        default_aggregation: sum

      - name: 최근3개월가맹점매출금액
        description: "최근 3개월 매출 금액 (원)"
        expr: 최근3개월가맹점매출금액
        data_type: NUMERIC
        default_aggregation: sum

      - name: 최근6개월가맹점매출건수
        description: "최근 6개월 매출 건수"
        expr: 최근6개월가맹점매출건수
        data_type: NUMERIC
        default_aggregation: sum

      - name: 최근6개월가맹점매출금액
        description: "최근 6개월 매출 금액 (원)"
        expr: 최근6개월가맹점매출금액
        data_type: NUMERIC
        default_aggregation: sum

      - name: 최근1년가맹점매출건수
        description: "최근 1년 매출 건수"
        expr: 최근1년가맹점매출건수
        data_type: NUMERIC
        default_aggregation: sum

      - name: 최근1년가맹점매출금액
        description: "최근 1년 매출 금액 (원)"
        expr: 최근1년가맹점매출금액
        data_type: NUMERIC
        default_aggregation: sum

      - name: 신용카드가맹점수수료율
        description: "신용카드 수수료율 (%)"
        expr: 신용카드가맹점수수료율
        data_type: NUMERIC
        default_aggregation: avg

      - name: 체크카드수수료율
        description: "체크카드 수수료율 (%)"
        expr: 체크카드수수료율
        data_type: NUMERIC
        default_aggregation: avg

      - name: 체크카드수수료
        description: "체크카드 수수료 (원)"
        expr: 체크카드수수료
        data_type: NUMERIC
        default_aggregation: sum

      - name: 해외가맹점매출건수
        description: "해외 매출 건수"
        expr: 해외가맹점매출건수
        data_type: NUMERIC
        default_aggregation: sum

      - name: 해외가맹점매출금액
        description: "해외 매출 금액 (원)"
        expr: 해외가맹점매출금액
        data_type: NUMERIC
        default_aggregation: sum

    filters:
      - name: 활성가맹점
        description: "거래정지가 아닌 가맹점만 필터"
        expr: "가맹점거래정지여부 = 'N' OR 가맹점거래정지여부 IS NULL"

# =============================================================================
# 2. RELATIONSHIPS - 테이블 간 관계 (JOIN 경로)
# =============================================================================
relationships:
  # 고객 체계
  - from: tbdaaat14
    to: tbdaaat01
    type: many_to_one
    join_expr: "tbdaaat14.고객식별자 = tbdaaat01.고객식별자"
    description: "기업고객 마스터 -> 고객 기본 마스터 (고객 기본정보 참조)"

  # 기업심사 -> 기업고객
  - from: tbdaaaf23
    to: tbdaaat14
    type: many_to_one
    join_expr: "tbdaaaf23.본사사업자등록번호 = tbdaaat14.본사사업자등록번호"
    description: "기업 심사건 -> 기업고객 (사업자등록번호 기준)"

  # 매출전표 -> 가맹점
  - from: tbdaabt30
    to: tbdaadt01
    type: many_to_one
    join_expr: "tbdaabt30.가맹점번호 = tbdaadt01.가맹점번호"
    description: "매출전표 -> 가맹점 마스터 (가맹점 상세정보 참조)"

  # 매출전표 -> 업종코드
  - from: tbdaabt30
    to: tbdaadb17
    type: many_to_one
    join_expr: "tbdaabt30.가맹점업종코드 = tbdaadb17.가맹점업종코드"
    description: "매출전표 -> 업종코드 마스터 (업종명 참조)"

  # 매출전표 -> 기업고객
  - from: tbdaabt30
    to: tbdaaat14
    type: many_to_one
    join_expr: "tbdaabt30.기업고객식별자 = tbdaaat14.고객식별자"
    description: "매출전표 -> 기업고객 마스터 (기업 정보 참조)"

  # 기업고객 월별 집계 -> 기업고객
  - from: tmdaa2e17
    to: tbdaaat14
    type: many_to_one
    join_expr: "tmdaa2e17.고객식별자 = tbdaaat14.고객식별자"
    description: "기업고객 월별 집계 -> 기업고객 마스터"

  # 기업고객 월별 집계 -> 업종코드
  - from: tmdaa2e17
    to: tbdaadb17
    type: many_to_one
    join_expr: "tmdaa2e17.가맹점업종코드 = tbdaadb17.가맹점업종코드"
    description: "기업고객 월별 집계 -> 업종코드 마스터"

  # 카드 월별 -> 기업고객
  - from: tmdaa3e16
    to: tbdaaat14
    type: many_to_one
    join_expr: "tmdaa3e16.고객식별자 = tbdaaat14.고객식별자"
    description: "카드 월별 실적 -> 기업고객 마스터"

  # 가맹점 월별 실적 -> 가맹점 월별 마스터
  - from: tmdaa5e11
    to: tmdaa5d01
    type: one_to_one
    join_expr: "tmdaa5e11.가맹점번호 = tmdaa5d01.가맹점번호 AND tmdaa5e11.기준년월 = tmdaa5d01.기준년월"
    description: "가맹점 월별 실적 -> 가맹점 월별 마스터 (같은 기준년월)"

  # 가맹점 월별 실적 -> 업종코드
  - from: tmdaa5e11
    to: tbdaadb17
    type: many_to_one
    join_expr: "tmdaa5e11.가맹점업종코드 = tbdaadb17.가맹점업종코드"
    description: "가맹점 월별 실적 -> 업종코드 마스터"

  # KCIS 여신 -> 기업고객
  - from: tbdaaha97
    to: tbdaaat14
    type: many_to_one
    join_expr: "tbdaaha97.사업자등록번호 = tbdaaat14.본사사업자등록번호"
    description: "KCIS 여신현황 -> 기업고객 (사업자등록번호 기준)"

  # 무이자할부 -> 가맹점
  - from: tbdaada23
    to: tbdaadt01
    type: many_to_one
    join_expr: "tbdaada23.가맹점번호 = tbdaadt01.가맹점번호"
    description: "무이자할부 서비스 -> 가맹점 마스터"

  # 가맹점 마스터 -> 업종코드
  - from: tbdaadt01
    to: tbdaadb17
    type: many_to_one
    join_expr: "tbdaadt01.가맹점업종코드 = tbdaadb17.가맹점업종코드"
    description: "가맹점 마스터 -> 업종코드 마스터 (업종명 참조)"

# =============================================================================
# 3. METRICS - 비즈니스 메트릭 정의
# =============================================================================
metrics:
  # ── 매출/이용 메트릭 ──
  - name: 법인카드총이용금액
    description: >
      법인카드 총 이용금액: 기업(법인) 카드의 매출전표 매출금액 합계.
      반드시 개인기업구분코드 = '2' 조건을 포함해야 합니다.
    sql: "SUM(CASE WHEN 개인기업구분코드 = '2' THEN 매출금액 ELSE 0 END)"
    source_table: tbdaabt30
    type: currency_krw
    time_dimension: 전표매출년월일
    synonyms: ["법인이용금액", "기업카드이용액", "법인카드매출"]

  - name: 전표매출건수
    description: "매출전표 총 건수"
    sql: "COUNT(DISTINCT 매출전표번호)"
    source_table: tbdaabt30
    type: count
    time_dimension: 전표매출년월일
    synonyms: ["거래건수", "매출건수", "이용건수"]

  - name: 일시불이용금액합계
    description: "일시불 이용 금액 합계"
    sql: "SUM(금월일시불이용금액)"
    source_table: tmdaa3e16
    type: currency_krw
    time_dimension: 기준년월
    synonyms: ["일시불이용액", "일시불합계"]

  - name: 할부이용금액합계
    description: "할부 이용 금액 합계"
    sql: "SUM(금월할부이용금액)"
    source_table: tmdaa3e16
    type: currency_krw
    time_dimension: 기준년월
    synonyms: ["할부이용액", "할부합계"]

  - name: CA이용금액합계
    description: "CA(현금서비스) 이용 금액 합계"
    sql: "SUM(금월ca이용금액)"
    source_table: tmdaa3e16
    type: currency_krw
    time_dimension: 기준년월
    synonyms: ["현금서비스이용액", "CA합계"]

  # ── 가맹점 실적 메트릭 ──
  - name: 가맹점총매출금액
    description: "가맹점 총 매출 금액 (일시불 + 할부)"
    sql: "SUM(가맹점일시불매출금액 + 가맹점할부매출금액)"
    source_table: tmdaa5e11
    type: currency_krw
    time_dimension: 기준년월
    synonyms: ["가맹점매출", "가맹점총매출"]

  - name: 가맹점총매출건수
    description: "가맹점 총 매출 건수 (일시불 + 할부)"
    sql: "SUM(가맹점일시불매출건수 + 가맹점할부매출건수)"
    source_table: tmdaa5e11
    type: count
    time_dimension: 기준년월
    synonyms: ["가맹점매출건수"]

  - name: 가맹점평균수수료율
    description: "가맹점 평균 신용카드 수수료율"
    sql: "AVG(신용카드가맹점수수료율)"
    source_table: tmdaa5e11
    type: ratio
    time_dimension: 기준년월
    synonyms: ["평균수수료율"]

  - name: 가맹점수수료수입합계
    description: "가맹점 수수료 수입 합계 금액"
    sql: "SUM(가맹점수입수수료)"
    source_table: tmdaa5e11
    type: currency_krw
    time_dimension: 기준년월
    synonyms: ["수수료수입", "수수료합계"]

  # ── 심사 메트릭 ──
  - name: 심사신청건수
    description: "기업카드 심사 신청 총 건수"
    sql: "COUNT(DISTINCT 신청서접수번호)"
    source_table: tbdaaaf23
    type: count
    time_dimension: 최종심사년월일
    synonyms: ["신청건수", "심사건수"]

  - name: 심사승인건수
    description: "심사 승인 건수"
    sql: "COUNT(DISTINCT CASE WHEN 카드처리결과구분코드 = '01' THEN 신청서접수번호 END)"
    source_table: tbdaaaf23
    type: count
    time_dimension: 최종심사년월일
    synonyms: ["승인건수"]

  - name: 심사승인율
    description: "심사 승인율: 승인건수 / 전체 심사건수"
    sql: >
      COUNT(DISTINCT CASE WHEN 카드처리결과구분코드 = '01' THEN 신청서접수번호 END)::FLOAT
      / NULLIF(COUNT(DISTINCT 신청서접수번호), 0)
    source_table: tbdaaaf23
    type: ratio
    time_dimension: 최종심사년월일
    synonyms: ["승인율", "심사통과율"]

  - name: 평균부여한도
    description: "심사 시 평균 최종 부여 한도 금액"
    sql: "AVG(최종부여한도금액)"
    source_table: tbdaaaf23
    type: currency_krw
    time_dimension: 최종심사년월일
    synonyms: ["평균한도"]

  # ── 고객/카드 메트릭 ──
  - name: 기업고객수
    description: "기업 고객 수 (고유 고객식별자 기준)"
    sql: "COUNT(DISTINCT 고객식별자)"
    source_table: tmdaa2e17
    type: count
    time_dimension: 기준년월
    synonyms: ["법인고객수", "기업수"]

  - name: 유효카드수
    description: "유효한 기업 카드 수 (신용 + 체크)"
    sql: "SUM(유효신용카드수 + 유효체크카드수)"
    source_table: tmdaa2e17
    type: count
    time_dimension: 기준년월
    synonyms: ["유효카드", "보유카드수"]

  # ── 여신/연체 메트릭 ──
  - name: 총여신한도
    description: "KCIS 기준 총 카드 한도 합계"
    sql: "SUM(총한도금액)"
    source_table: tbdaaha97
    type: currency_krw
    time_dimension: 작업기준년월
    synonyms: ["총한도", "여신한도"]

  - name: 총연체금액
    description: "연체 금액 합계"
    sql: "SUM(연체금액)"
    source_table: tbdaaha97
    type: currency_krw
    time_dimension: 작업기준년월
    synonyms: ["연체합계", "연체총액"]

  - name: 연체율
    description: "연체율: 연체금액 / 카드이용합계금액"
    sql: "SUM(연체금액)::FLOAT / NULLIF(SUM(카드이용합계금액), 0)"
    source_table: tbdaaha97
    type: ratio
    time_dimension: 작업기준년월
    synonyms: ["연체비율"]

  # ── 건당/비율 메트릭 ──
  - name: 건당평균이용금액
    description: "거래 1건당 평균 이용 금액"
    sql: "SUM(금월이용합계금액)::FLOAT / NULLIF(SUM(금월이용합계건수), 0)"
    source_table: tmdaa3e16
    type: currency_krw
    time_dimension: 기준년월
    synonyms: ["건당이용액", "평균거래금액", "객단가"]

  - name: 가맹점전년대비성장률
    description: "가맹점 매출 전년대비 성장률"
    sql: >
      (SUM(금년가맹점신용판매매출금액) - SUM(전년가맹점신용판매매출금액))::FLOAT
      / NULLIF(SUM(전년가맹점신용판매매출금액), 0)
    source_table: tmdaa5e11
    type: ratio
    time_dimension: 기준년월
    synonyms: ["매출성장률", "전년대비", "YoY"]

# =============================================================================
# 4. GLOSSARY - 비즈니스 용어 사전
# =============================================================================
glossary:
  - term: "법인카드"
    canonical: "개인기업구분코드 = '2'인 카드"
    description: "기업(법인) 명의로 발급된 카드. 개인기업구분코드가 '2'인 레코드"
    aliases: ["기업카드", "법인신용카드", "corporate card"]

  - term: "CA"
    canonical: "현금서비스(Cash Advance)"
    description: "카드를 이용한 현금 인출 서비스. ca이용금액, ca수수료 등의 컬럼에서 사용"
    aliases: ["현금서비스", "Cash Advance", "캐시어드밴스"]

  - term: "가맹점"
    canonical: "카드 결제를 받는 상점"
    description: "KB카드와 가맹 계약을 맺고 카드 결제를 수용하는 업소"
    aliases: ["merchant", "상점", "매장", "업소"]

  - term: "매입"
    canonical: "카드사가 매출전표를 접수하여 정산 처리하는 행위"
    description: "가맹점의 카드 거래를 카드사가 승인 후 정산 처리. 매입건수/매입금액으로 집계"
    aliases: ["acquisition", "전표매입"]

  - term: "일시불"
    canonical: "할부 없이 1회 전액 결제"
    description: "할부기간개월수 = 0 또는 카드매출유형 중 일시불에 해당하는 거래"
    aliases: ["일괄결제", "lump sum"]

  - term: "연체"
    canonical: "결제 기한 경과 후 미납 상태"
    description: "카드 이용 대금을 결제일까지 납부하지 않은 상태. 연체원금, 연체금액, 연체회차로 관리"
    aliases: ["미납", "delinquency", "overdue"]

  - term: "MCC"
    canonical: "Merchant Category Code"
    description: "국제 표준 가맹점 업종 분류 코드. mcc업종코드 컬럼에 저장"
    aliases: ["MCC코드", "업종분류코드"]

  - term: "수수료"
    canonical: "가맹점이 카드사에 지불하는 결제 대행 수수료"
    description: "거래금액 대비 일정 비율(수수료율)로 산정. 신용카드/체크카드별 별도 수수료율 적용"
    aliases: ["가맹점수수료", "merchant fee", "결제수수료"]

  - term: "부점"
    canonical: "영업점/지점"
    description: "카드사의 영업 관리 단위. 관리부점코드, 모집부점코드 등으로 참조"
    aliases: ["영업점", "지점", "부점코드", "branch"]

  - term: "KCIS"
    canonical: "한국신용정보원"
    description: "금융권 신용정보 집중/관리 기관. tbdaaha97 테이블의 여신 정보 출처"
    aliases: ["한국신용정보원", "신용정보원"]

  - term: "KIS"
    canonical: "한국신용평가"
    description: "기업 신용등급 평가기관. kis신용등급코드/kis신용평점 컬럼에서 사용"
    aliases: ["한국신용평가", "KIS등급"]

  - term: "CRS"
    canonical: "Credit Rating System (신용등급평가시스템)"
    description: "카드사 자체 신용등급 평가 시스템. crs 관련 컬럼들에서 사용"
    aliases: ["신용등급시스템", "Credit Rating"]

  - term: "심사"
    canonical: "기업카드 발급 심사 (tbdaaaf23)"
    description: "기업카드 발급 신청에 대한 신용 심사 과정. 승인/거절 결과와 부여한도 결정"
    aliases: ["신용심사", "카드심사", "발급심사", "credit review"]

  - term: "한도"
    canonical: "카드 이용 가능 최대 금액"
    description: "기업카드의 이용 가능 한도. 최종부여한도금액, 가맹점월승인한도금액 등"
    aliases: ["이용한도", "신용한도", "승인한도", "credit limit"]

  - term: "전표"
    canonical: "매출전표 (tbdaabt30)"
    description: "카드 거래 발생 시 생성되는 거래 기록. 매출전표번호로 식별"
    aliases: ["매출전표", "거래전표", "slip"]

  - term: "기준년월"
    canonical: "데이터 스냅샷 기준 시점 (YYYYMM 형식)"
    description: "월별 집계/스냅샷 테이블의 기준 시점. YYYYMM 형식의 VARCHAR"
    aliases: ["기준월", "기준시점"]
    sql_hint: "기준년월 형식은 'YYYYMM'입니다. 예: '202604'"

  - term: "기준년월일"
    canonical: "데이터 스냅샷 기준 시점 (YYYYMMDD 형식)"
    description: "일별 스냅샷 테이블의 기준 시점. YYYYMMDD 형식의 VARCHAR"
    aliases: ["기준일"]
    sql_hint: "기준년월일 형식은 'YYYYMMDD'입니다. 예: '20260416'"

  - term: "신규 고객"
    canonical: "고객 최초 등록일 기준 신규 고객"
    description: "실제 모집 테이블이 확정되지 않은 경우 고객 마스터(tbdaaat01)의 최초등록년월일 기준 신규 등록 고객으로만 해석합니다."
    aliases: ["신규고객", "가입고객", "등록고객"]
    sql_hint: "신규/가입/등록 고객 질의는 tbdaaat01.최초등록년월일을 사용합니다. '모집고객'은 별도 실테이블이 없으면 임의 매핑하지 말고 추가 확인이 필요합니다."

  - term: "여성 고객"
    canonical: "성별구분코드 = '2'"
    description: "성별 코드 기준 여성 고객. 실제 코드 사전이 있으면 그 값을 우선합니다."
    aliases: ["여성", "여자", "여자고객", "female"]
    sql_hint: "여성 조건은 성별구분코드 = '2'를 기본값으로 사용합니다."

# =============================================================================
# 5. QUERY REFERENCES - 질의별 컬럼/필터/조인 선택 지침
# =============================================================================
query_references:
  - intent: 신규등록고객_월별_기본조회
    when_user_says:
      - "12월 신규 고객 알려줘"
      - "12월 가입 고객 수"
      - "2025년 12월 등록고객"
      - "월별 신규 고객 추이"
    primary_table: tbdaaat01
    recommended_columns:
      time_filter: "SUBSTRING(최초등록년월일, 1, 6) = '{기준년월}'"
      metric: "COUNT(DISTINCT 고객식별자) AS 신규고객수"
      display: ["기준년월", "신규고객수"]
    rules:
      - "신규/가입/등록 고객은 tbdaaat01.최초등록년월일을 기준으로 해석합니다."
      - "모집고객이라는 표현은 실테이블이 확정되지 않았으므로 tbdaaat01로 임의 치환하지 않습니다."
      - "월 조건은 YYYYMM 형식으로 변환합니다."
    sql_pattern: |
      SELECT
        SUBSTRING(최초등록년월일, 1, 6) AS 기준년월,
        COUNT(DISTINCT 고객식별자) AS 신규고객수
      FROM card_system.tbdaaat01
      WHERE SUBSTRING(최초등록년월일, 1, 6) = '{기준년월}'
      GROUP BY SUBSTRING(최초등록년월일, 1, 6)

  - intent: 신규등록고객_성별필터
    when_user_says:
      - "12월 신규 고객 중 여성 고객을 뽑아줘"
      - "가입 고객 중 여자 고객만 보여줘"
      - "여성 신규 고객 수"
      - "등록고객을 성별로 나눠줘"
    primary_table: tbdaaat01
    recommended_columns:
      filters: ["성별구분코드 = '2' for 여성", "성별구분코드 = '1' for 남성"]
      metric: "COUNT(DISTINCT 고객식별자)"
      display: ["기준년월", "성별구분코드", "고객수"]
    rules:
      - "여성/남성 조건은 tbdaaat01.성별구분코드를 사용합니다."
      - "성별별 분포를 묻는 경우 WHERE 성별 조건을 걸지 말고 GROUP BY 성별구분코드를 사용합니다."

  - intent: 기업고객_신규등록_대표자성별
    when_user_says:
      - "12월 신규 기업고객 중 대표자가 여성인 고객"
      - "여성 대표자 기업고객"
      - "신규 법인고객 중 여성 대표자"
    primary_table: tbdaaat14
    join_tables: [tbdaaat01]
    join_rule: "tbdaaat14.기업대표자고객식별자 = tbdaaat01.고객식별자"
    recommended_columns:
      time_filter: "SUBSTRING(tbdaaat14.최초등록년월일, 1, 6) = '{기준년월}'"
      gender_filter: "tbdaaat01.성별구분코드 = '2'"
      metric: "COUNT(DISTINCT tbdaaat14.고객식별자) AS 기업고객수"
    rules:
      - "기업 자체의 성별이 아니라 대표자 성별을 묻는 경우 tbdaaat14.기업대표자고객식별자로 tbdaaat01을 조인합니다."
      - "기업고객 수는 tbdaaat14.고객식별자 distinct count를 사용합니다."

  - intent: 기업고객_월별이용_복합질의
    when_user_says:
      - "신규 기업고객의 이후 카드 이용금액"
      - "기업고객 중 여성 대표자의 월별 이용금액"
      - "기업고객 등록월과 이용월을 같이 보여줘"
    primary_table: tbdaaat14
    join_tables: [tmdaa2e17, tbdaaat01]
    join_rule: "tbdaaat14.고객식별자 = tmdaa2e17.고객식별자; tbdaaat14.기업대표자고객식별자 = tbdaaat01.고객식별자"
    recommended_columns:
      registration_month: "SUBSTRING(tbdaaat14.최초등록년월일, 1, 6)"
      usage_month: "tmdaa2e17.기준년월"
      usage_metric: "SUM(tmdaa2e17.금월일시불이용금액 + tmdaa2e17.금월할부이용금액 + tmdaa2e17.금월ca이용금액)"
    rules:
      - "등록월과 이용월은 서로 다른 시간축이므로 SELECT alias를 명확히 분리합니다."
      - "이용금액은 tmdaa2e17의 월별 기업고객 집계 컬럼을 우선 사용합니다."

  - intent: 기업심사_조건결합_복합질의
    when_user_says:
      - "여성 대표자 기업의 심사 승인율"
      - "신규 기업고객의 심사 승인 현황"
      - "특정 기간 기업고객 심사와 한도"
    primary_table: tbdaaaf23
    join_tables: [tbdaaat14, tbdaaat01]
    join_rule: "tbdaaaf23.본사사업자등록번호 = tbdaaat14.본사사업자등록번호; tbdaaat14.기업대표자고객식별자 = tbdaaat01.고객식별자"
    recommended_columns:
