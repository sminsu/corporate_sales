        synonyms: ["카드ID", "카드번호"]

      - name: 고객식별자
        description: "카드 소유 고객 식별자"
        expr: 고객식별자
        data_type: VARCHAR

      - name: 개인기업구분코드
        description: "개인/기업 구분"
        expr: 개인기업구분코드
        data_type: VARCHAR

      - name: 카드브랜드구분코드
        description: "카드 브랜드 (VISA/Master 등)"
        expr: 카드브랜드구분코드
        data_type: VARCHAR
        synonyms: ["카드브랜드"]

      - name: 카드등급구분코드
        description: "카드 등급"
        expr: 카드등급구분코드
