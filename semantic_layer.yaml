        format: YYYYMMDD
        role: effective_to
      - name: 실제카드만료년월일
        data_type: VARCHAR
        description: 카드가 실제만료(만료년월이 적용 되었거나 해지년월이 적용)되는 최종년월일
        format: YYYYMMDD
        role: effective_to
      - name: 신규년월일
        data_type: VARCHAR
        description: 신규된 일자의 년월일을 관리한다.
