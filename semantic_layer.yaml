        synonyms: [가맹점ID, 가맹점코드]
      - name: 소유자고객식별자
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 소유자고객식별자를관리한다.
      - name: 소유자고객관리번호
        data_type: VARCHAR
