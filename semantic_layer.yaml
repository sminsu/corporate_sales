      - name: 외환부점구분코드
        data_type: VARCHAR
        description: 해당 부점의 외환업무수행을 위한 등급을 구분하기 위한 속성이다 (갑류, 을류 구분)
      - name: 외환취급부점구분코드
        data_type: VARCHAR
