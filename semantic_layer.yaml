        description: 매입전표의 전산처리방법을 구분하는 코드이다.
      - name: 매입경로구분코드
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 매출전표의 매입경로 관리 코드
      - name: 센터처리기관구분코드
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 매입센터처리 중계기관코드관리
      - name: 발급사공동망기관구분코드
