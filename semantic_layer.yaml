      '7': 주부
      '8': 연금(임대소득자)
      '9': 기타소득,금융거래자
    value_semantics_provenance: user_provided_business_codebook
    source_mappings:
      - {entity: customer, table: tbdaaat01, column: 직업유형구분코드, role: current_occupation_type_code}
