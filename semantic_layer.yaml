        data_type: VARCHAR
        description: "MFX월카드통합실적집계의 비계좌 선불카드 여부 인지를 나타낸다.※ 선불전자지급수단을 충전계정(결제계좌)으로 하는 선불카드 (은행의 리브포켓, 당사의 머니 등)"
      - name: 유효비계좌선불카드여부
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 유효한 비계좌 선불카드인지를 나타난다.
    measures:
      - name: 기업카드신용한도금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 기업(법인, 사업자, 사업장)카드의 카드별로 부여된 신용한도 금액을 의미한다.
        required: true
        unit: KRW
        aggregation: sum_at_declared_month_grain
      - name: 카드반송회차
        data_type: BIGINT
        description: MFX월카드통합실적집계의 카드를 발송하고 다양한 사유에 의해 반송된 회차이다.
        required: true
        unit: count
        aggregation: sum_at_declared_month_grain
      - name: 부서사업장이용한도금액
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 기업체의 부서사업장 이용한도금액
        required: true
        unit: KRW
        aggregation: sum_at_declared_month_grain
      - name: BSS평점
        data_type: BIGINT
        description: MFX월카드통합실적집계의 기존고객의 향후 부실 가능성을 예측하기 위하여 행동평점을 평가점수
        required: true
        unit: count
        aggregation: sum_at_declared_month_grain
      - name: ASS평점
        data_type: BIGINT
        description: MFX월카드통합실적집계의 신청평점 시스템의 신용평가 결과 점수
        required: true
        unit: count
