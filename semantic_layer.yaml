      aggregate_across_time: false
      default_measure_behavior: no_aggregatable_measure
  - name: tbdaaat46
    physical_table: tbdaaat46
    korean_name: 카드상세변경이력
    description: "카드의 발급/재발급/해제 등 상세 변경 이력을 관리하는 테이블. 한 행은 하나의 카드 변경 이벤트를 의미한다. 처리년월일·처리부점·처리직원, 해제년월일·해제부점, 카드 수령 부점, 송증번호 등 카드 라이프사이클 이벤트를 추적할 때 사용한다."
    grain: 카드식별자 × 카드상세일련번호 × 변경유형 1건 (카드 변경 이벤트)
    primary_key: [카드식별자, 카드상세일련번호, 카드상세통합변경유형구분코드, 카드상세변경유형일련번호]
    synonyms: [카드변경, 카드이력, 카드상세]
    dimensions:
      - name: 카드식별자
        data_type: VARCHAR
        description: KB카드에서 발급하는 카드의 카드번호를 대체하여 식별하기 위한 중복되지 않는 값
        required: true
      - name: 카드상세일련번호
        data_type: DECIMAL
        description: 카드상세에 해당하는 일련번호이다. / 카드번호가 동일한 경우에 증가하는 일련번호이다.
        required: true
      - name: 카드상세통합변경유형구분코드
        data_type: VARCHAR
        description: "카드상세(카드단위)에 변경이 처리가 되는 경우 중요(카드정보유출, 티머니번호등록 등) 변경 유형과 단순( 교부, 반송, 사진도착 등) 변경 유형을 통합 관리하기 위한 구분코드이다."
        required: true
      - name: 카드상세변경유형일련번호
        data_type: DECIMAL
        description: "카드상세(카드단위)에 변경이 처리가 되는 경우 카드상세변경유형구분코드별로 증가하는 일련번호이다. / 카드상세중요변경유형구분코드와 카드상세단순변경유형구분코드에 따른 일련번호와 동일하게 구성된다."
        required: true
      - name: 회원일련번호
        data_type: VARCHAR
        description: 당사(KB국민카드)와 계약한 회원을 관리하는 식별번호
        synonyms: [회원번호, 회원ID]
      - name: 카드구분키번호
        data_type: VARCHAR
        description: 회원별로 부여되는 일련번호에 카드상품 또는 계약별로 추가되는 일련번호이다. / 기본적으로 카드브랜드구분코드 + 일련번호로 구성된다.
      - name: 처리부점코드
        data_type: VARCHAR
        description: 대상업무를 처리한 조작자 직원번호에 해당하는 부점코드이다.
      - name: 처리단말번호
        data_type: VARCHAR
        description: 대상업무를 처리한 조작자 직원번호에 해당하는 단말번호이다.
      - name: 처리직원번호
        data_type: VARCHAR
        description: 대상 업무를 처리한 조작자의 직원번호
      - name: 카드정보변경유형일련번호
        data_type: VARCHAR
        description: 카드에 해당하는 정보를 변경할 때 카드처리유형구분코드(발급비청구, 비밀번호변경, 사용등록 등)에 따른 일련번호이다.
      - name: 해제부점코드
        data_type: VARCHAR
        description: 정상거래에 대해서 해제거래를 처리한 부서의 부점코드 정보를 관리함
      - name: 해제직원번호
        data_type: VARCHAR
        description: 정상거래에 대해서 해제거래를 처리한 직원번호 정보를 관리함
      - name: 해제단말번호
        data_type: VARCHAR
        description: 정상거래에 대해서 해제거래를 발생한 단말기의 번호 정보를 관리함
      - name: 카드수령부점코드
        data_type: VARCHAR
        description: 카드를 수령하기 위한 부점코드이다.
      - name: 카드정보변경발송업체내용
        data_type: VARCHAR
        description: 카드에 해당하는 정보(재발송, 반송 등)를 변경할 때 발송 업체에 기술하는 내용이다.
      - name: 송증번호
        data_type: VARCHAR
        description: 부점발송카드의 송증번호 이다.
      - name: 회원카드추가구분코드
        data_type: VARCHAR
        description: 회원 및 카드 단위의 추가정보를 관리
      - name: 카드정보변경추가내용1
        data_type: VARCHAR
        description: 카드정보 변경시 추가로 입력하는 내용
      - name: 처리시각
        data_type: VARCHAR
        description: 대상업무를 처리한 시각(HHMMSS) 이다.
    time_dimensions:
      - name: 처리년월일
        data_type: VARCHAR
        description: 대상 업무를 처리한 일자이다.
        format: YYYYMMDD
        role: event_date
      - name: 해제년월일
        data_type: VARCHAR
        description: 정상거래에 대해서 해제거래를 발생한 일자 정보를 관리함

        format: YYYYMMDD
        role: effective_to
    table_kind: event_fact
    source_definition: 1. 카드상세에서 카드처리내역이 변경된 카드상세 내역을 관리한다. 2. 카드기능유형구분코드에서 '0', '2', '5', '9'로 시작코드로 변경된 정보를 등록한다. - 001(MS재기록), 002(거래정지교부카드캐리어인자), 004(비대면본인확인완료), 201(도난분실즉발거절), 501(앤디카드플레이어신청),
      902(BC미교부카드인수) 등
    source_metadata:
      workbook_entity: 고객회원카드(카드기본변경내역)
      source_column_count: 23
      queryable_column_count: 21
      excluded_technical_columns: [시스템최종거래일시, ADW시스템최종갱신일시]
    aggregation_policy:
      deduplicate_before_aggregation: false
      aggregate_across_time: true
      default_measure_behavior: sum_at_transaction_grain
  - name: tbdaaat53
    physical_table: tbdaaat53
    korean_name: 거래정지
    description: "고객의 거래정지(회원/여신/가맹점/카드 거래정지) 내역을 관리하는 테이블. 한 행은 하나의 거래정지 건을 의미한다. 거래정지코드, 회원/여신/가맹점/카드 거래정지 여부, 거래정지 대상 연체금액·연체회차, 거래정지 등재년월일 등을 담아 연체·부실로 인한 거래정지 현황 분석에 사용한다."
    grain: 고객식별자 × 고객관리번호 × 거래정지일련번호 1건 (거래정지 건)
    primary_key: [고객식별자, 고객관리번호, 거래정지일련번호]
    synonyms: [거래정지내역, 정지, 거래중지]
    dimensions:
      - name: 고객식별자
        data_type: VARCHAR
        description: KB카드의 고객에게 부여하는 10자리 번호체계로 각 고객을 고유하게 식별할 수 있음
        synonyms: [고객ID, 고객번호]
        required: true
      - name: 고객관리번호
        data_type: VARCHAR
        description: 고객식별자의 하위 5자리 번호체계
        required: true
      - name: 거래정지일련번호
        data_type: DECIMAL
        description: 거래정지 정보를 관리하기 위해 부여한 일련번호
        required: true
      - name: 소유자고객식별자
        data_type: VARCHAR
        description: 소유자고객식별자를관리한다.
      - name: 소유자고객관리번호
        data_type: VARCHAR
        description: 소유자고객관리번호를관리한다.
      - name: 회원일련번호
        data_type: VARCHAR
        description: 당사(KB국민카드)와 계약한 회원을 관리하는 식별번호
        synonyms: [회원번호, 회원ID]
      - name: 거래정지코드
        data_type: VARCHAR
        description: 거래정지를 구분한 코드
      - name: 상품번호
        data_type: VARCHAR
        description: 상품을 식별하기 위해 부여한 일련의 번호를 관리한다.
      - name: 거래정지대상번호
        data_type: VARCHAR
        description: 거래정지 등재, 해재되는 대상번호로 카드식별자, 장기카드대출번호, 가맹점번호를 관리하는 대상번호
      - name: 회원거래정지여부
        data_type: VARCHAR
        description: 거래정지 범위구분 중 회원제재여부
      - name: 여신거래정지여부
        data_type: VARCHAR
        description: 거래정지 범위구분 중 여신제재여부를 관리
      - name: 가맹점거래정지여부
        data_type: VARCHAR
        description: 거래정지 범위구분 중 가맹점 제재여부를 관리
      - name: 카드거래정지여부
        data_type: VARCHAR
        description: 거래정지 범위구분 중 카드 제재여부를 관리
      - name: 거래정지발생업무구분코드
        data_type: VARCHAR
        description: 거래정지를 등재 처리한 업무를 구분한 코드
      - name: 은행지로코드
        data_type: VARCHAR
        description: 해당 결제은행의 지로코드
      - name: 신용관리대상구분코드
        data_type: VARCHAR
        description: "한국신용정보원에서 관리되는 신용정보(연체,대출,개설등)를 구분하는 코드 신용정보 공동규약 시행(2001. 1. 2) 이전의 신용도판단정보, 공공정보등을 관리하는 코드"
      - name: 거래정지등재시각
        data_type: VARCHAR
        description: 거래정지를 등재한 시각
      - name: 거래정지등재부점코드
        data_type: VARCHAR
        description: 거래정지를 등재한 부점코드
      - name: 거래정지해제시각
        data_type: VARCHAR
        description: 거래정지를 해제한 시각
      - name: 거래정지해제부점코드
        data_type: VARCHAR
        description: 거래정지등재된 대상을 해제처리한 부점코드
      - name: 거래정지생성일련번호
        data_type: DECIMAL
        description: 거래정지 등재해제 정보가 생성될때 부여한 일련번호
      - name: 사고신고지역구분코드
        data_type: VARCHAR
        description: 도난분실 신고시 해당지역을 구분한 코드
      - name: 카드재발급신청여부
        data_type: VARCHAR
        description: 카드 분실등의 사유로 재발급을 신청했는지 여부
      - name: 등록해제구분코드
        data_type: VARCHAR
        description: 거래정지에 대한 등록해제구분코드
      - name: 거래정지등재경로구분코드
        data_type: VARCHAR
        description: 거래정지 등재 경로를 구분하는 코드
      - name: 도난분실접수번호
        data_type: VARCHAR
        description: 회원의 카드를 도난 또는 분실시 접수한 시점정보를 식별하기위한 번호
      - name: 재발급오류메시지코드
        data_type: VARCHAR
        description: 도난,분실등의 사유로 재발급요청후에 오류메시지로 등록된 오류메시지코드
      - name: 거래정지해제직원번호
        data_type: VARCHAR
        description: 온라인으로 거래정지 해제처리시 거래를 발생한 직원번호
    measures:
