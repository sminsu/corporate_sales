        description: MFX월카드통합실적집계의 카드대금납부 결제일
        format: DD
        role: day_of_month
      - name: 회원최초신규발급년월일
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 회원이 최초로 카드를 신규발급한 년월일
        format: YYYYMMDD
        role: event_date
      - name: 연체발생년월일
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 연체발생한 년월일 관리

        format: YYYYMMDD
        role: event_date
    table_kind: monthly_aggregate
    source_definition: 1. 월회원정보기본시점정보을 기준으로 월카드연간청구실적집계, 월카드연간청구실적집계 데이터를 카드구분키번호, 회원일련번호별로 기준년월의 회원정보, 카드이용실적, 카드청구실적 데이터 정보를 생성하고 관리한다. - 금월청구건수, 금월청구금액, 금월이용합계건수,금월이용합계금액 등
    source_metadata:
      workbook_entity: 카드(월카드통합실적집계)
      source_column_count: 191
      queryable_column_count: 190
      excluded_technical_columns: [ADW시스템최종갱신일시]
    primary_time_dimension: 기준년월
    aggregation_policy:
      deduplicate_before_aggregation: false
      aggregate_across_time: true
      default_measure_behavior: sum_at_declared_month_grain
