    korean_name: 대손충당금
    description: "대손충당금 산출 내역을 관리하는 테이블. 한 행은 특정 기준년월의 하나의 충당금 산출 단위를 의미한다. 회원일련번호·상품코드·회계계정과목, 원화대출잔액, 기대 1년 PD율·LGD율, 기대 대손충당금 등을 담아 충당금/대손 리스크 분석(IFRS9 기대신용손실 등)에 사용한다."
    grain: 기준년월 × 충당금식별번호 × 차주구분 1건 (충당금 산출 단위)
    primary_key: [기준년월, 충당금식별번호, 충당금차주구분코드]
