        synonyms: [기준일, 일자, 날짜]
        required: true
        format: YYYYMMDD
        role: snapshot_date
      - name: 최종카드발급년월일
        data_type: VARCHAR
        description: 상품에 해당하는 카드가 최종 카드발급 접수된 일자이다.
