# =============================================================================
# 2. SEMANTIC CONTRACT - 소형 모델용 도메인/엔터티/공식 지표/안전 JOIN
# =============================================================================
# 아래 블록은 workflow.py의 deterministic domain router와 SQL prompt가 직접 사용한다.
# 물리 스키마를 바꾸면 tables와 함께 이 블록도 갱신한다.
sql_generation_contract:
  purpose: 원본 정의서의 grain·키·시간·집계 의미와 canonical metric/join만 사용해 Athena engine v3 읽기 전용 SQL을 생성한다.
  evidence_order:
    - 사용자 질문의 기간·대상·집계 단위와 멀티턴 문맥
    - semantic_query_contracts의 지표·대상·기간·grain 조합 규칙
    - query_references의 정확한 원문 질의와 external verified query
    - canonical_metrics와 metric required_filters
    - table grain·primary_time_dimension·aggregation_policy
    - semantic_join_graph.safe_paths
    - 컬럼 원천 정의와 구조화된 value semantics
  athena_rules:
    - SELECT 또는 WITH로 시작하는 단일 읽기 전용 SQL만 반환한다.
    - SAS/Oracle의 CREATE TABLE, CONNECTION TO ORACLE, 바깥 SELECT * 래퍼는 만들지 않고 Athena에서 실행할 내부 SELECT/WITH만 반환한다.
    - Oracle NVL은 COALESCE로, 분석 순번은 ROW_NUMBER() OVER (...)로 표현한다.
    - SQL에는 ASCII 곧은따옴표만 사용하고 문자열은 작은따옴표, 식별자는 큰따옴표로 감싼다. CTE 이름은 공백 없는 snake_case로 쓰며 DISTINCT 뒤에 점을 붙이지 않는다.
    - 한글·비ASCII 식별자와 alias는 큰따옴표로 감싼다.
    - CAST(expr AS type), LOWER(col) LIKE LOWER(pattern), DATE_PARSE/DATE_ADD/DATE_FORMAT 등 Athena engine v3 문법을 사용한다.
    - Glue partition metadata가 선언되지 않은 year/month 컬럼은 만들지 않는다.
    - 질문에 없는 취소·활성·상태 코드를 임의로 추가하지 않는다.
    - 가맹점명·기업명·상호명·브랜드명 등 이름 필터는 기본 LIKE '%이름%' 부분일치를 사용하고, 사용자가 이름 고정·이름만·정확 일치를 명시한 경우에만 앞뒤 %를 제거한다.
    - 가맹점·브랜드 검색은 semantic_attributes.merchant_search_name의 테이블별 source_mappings를 사용하며, 브랜드 컬럼이 있는 테이블에서는 가맹점명·외부가맹점명·브랜드명 OR 조건 전체를 괄호로 묶는다.
    - 상세 목록은 요청 개수가 없으면 LIMIT 100을 적용한다.
  grain_and_aggregation_rules:
    - 일·월 snapshot은 table aggregation_policy의 최신행 축소를 먼저 적용한다.
    - 1:N JOIN 뒤 상위 grain 개체 수는 COUNT(DISTINCT key)로 계산하고 fact 금액 중복을 점검한다.
    - measure aggregation이 recompute_or_weighted_avg 또는 semi_additive_latest_snapshot이면 무조건 SUM하지 않는다.
    - 기업카드 신용+체크 축과 개별+공용 축, 총이용액과 세부 이용액처럼 overlap_group이 다른 값을 함께 더하지 않는다.
    - 기업 총한도와 잔여한도는 월 snapshot 지표이므로 tbdaa1d12를 고객×월 최신 기준년월일 1건으로 축소한 뒤 집계하고 일별 행을 합산하지 않는다.
    - 기업별 한도소진율은 1 - 잔여한도/총한도, 포트폴리오 한도소진율은 1 - SUM(잔여한도)/NULLIF(SUM(총한도), 0)으로 재계산하며 기업별 비율을 AVG하지 않는다.
    - 기업 월평균 이용금액은 고객×월 최신행의 신용+체크 이용금액 합계를 요청 기간의 달력 월수로 나누며 데이터가 없는 월도 0원으로 포함한다. 사용월 평균을 명시한 경우에만 데이터 또는 이용실적이 있는 월수를 분모로 쓴다.
    - 가맹점 월매출은 tmdaa5e11의 일시불+할부이며 tmdaaus01 가맹점총지급금액으로 대체하지 않는다.
    - 가맹점주 인원은 대표고객식별자를 COUNT DISTINCT하고 가맹점번호나 기업고객식별자로 대체하지 않는다.
    - 가맹점주가 운영하는 기업의 속성·리스크를 물으면 기업고객식별자를 사용하고, 가맹점주 개인의 식별·인원은 대표고객식별자를 사용한다.
    - 가맹점 결제 금융기관별 가맹점 수는 가맹점번호를 COUNT DISTINCT하고 대표고객식별자 인원과 혼용하지 않는다.
    - 폐업 가맹점 수는 국세청 휴폐업여부가 정상(0)이 아닌 최초 관측일과 가맹점번호 DISTINCT를 사용하며 KB 가맹점 계약 해지와 구분한다.
    - 전월 대비 증감률은 요청 시작월보다 한 달 앞선 월까지 읽어 LAG를 계산한 뒤 요청 기간만 출력한다.
  time_resolution:
    YYYY년: YYYY01~YYYY12
    YYYY년 M월: YYYYMM
    YYMM 기준·YYMM월: "2000년대 YYYYMM (예: 2605 기준 → 202605)"
    현재·이번달: 실행일이 속한 기준년월
    지난달·저번달·전월: 실행일 또는 비교 대상 월의 직전월
    최근 N개월·최근 N달: 월 스냅샷/월 집계는 현재월 포함 N개 기준년월, 일 이벤트는 실행일에서 N개월 전부터 실행일까지 양 끝을 포함
    최근 N년·지난 N년: 월 스냅샷/월 집계는 현재월 포함 N×12개 기준년월, 일 이벤트는 실행일에서 N년 전부터 실행일까지 양 끝을 포함
    tbdaa1d12 월: SUBSTR(기준년월일,1,6) 후 고객×월 최신행
  ambiguity_rules:
    - 필수 기간·대상·코드값을 확정할 수 없으면 임의 값을 만들지 않고 추가 입력을 요청한다.
    - 기업카드 보유회원의 6개월 무실적 명단은 기준년월일이 필수이며 질문에 없으면 YYYYMMDD 입력을 요청한다.
    - 코드 의미는 value_semantics의 provenance를 함께 따르며 reference 가정은 운영 코드 검증 대상으로 남긴다.
    - 현재 한도는 실행일이 속한 월의 고객별 최신 snapshot을 사용한다. 과거 한도나 평균 한도는 사용자가 지정한 기간을 사용한다.
    - 기업·법인 문맥의 단독 한도는 tbdaa1d12의 기업총한도금액과 기업총잔여한도금액을 뜻한다. 카드별·회원별·부서별 한도를 명시하면 해당 grain의 원천을 별도로 사용한다.
    - 단독 평균 이용금액은 월평균·일평균·건당평균이 모호할 수 있다. 월평균 또는 기업별·법인별 문맥이 확인될 때만 기업 월평균 지표를 사용한다.
    - 업종별 이용금액은 결제처 업종(tbdaabt30.가맹점업종코드), 기업 자체 업종은 명시된 경우에만 표준산업분류코드를 사용한다.
    - 관리기업목록이 없으면 사업자등록번호 목록을 파라미터로 직접 입력하도록 요청한다.
    - 현금카드결제기관구분코드는 금융기관 코드이며 보통·당좌 같은 계좌 종류가 아니다. 계좌 종류 원천 컬럼과 당좌 코드 매핑이 없으면 당좌계좌 인원·비율 SQL을 만들지 않는다.
    - '"가맹점 계좌"가 은행명과 함께 쓰이면 계좌번호가 아니라 가맹점 대금지급 결제금융기관으로 해석한다. 실제 계좌번호나 보통·당좌 같은 계좌 종류는 현재 스키마에서 조회하지 않는다.'
    - '가맹점 문맥의 단독 "대손율"은 월말 기대대손충당금/원화대출잔액의 대손충당금률로 해석한다. 사용자가 대손비용률·상각·보정계수·LS·IS를 명시하면 월초/월말 충당금과 상각 기반 대손비용률로 분리한다.'
