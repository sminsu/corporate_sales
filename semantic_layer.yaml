      - tbmewcm94."개인기업구분코드" = '2'
      - tbmewcm94."원화대출잔액" 합계가 0이면 비율은 NULL
    synonyms: [가맹점 대손율, 가맹점주 대손율, 브랜드 대손율, 대손충당금률, 충당금 적립률]
    unit: '%'
    aggregation_behavior: ratio_of_sums
    semantic_cautions:
      - 가맹점주 개인의 대손율이 아니라 해당 가맹점을 운영하는 기업고객 포트폴리오 기준
      - 대손비용률은 월초·월말 충당금 변화와 상각을 사용하는 별도 지표
  - name: 법인카드월이용금액
    domain: card_usage
    business_definition: 법인·기업 카드의 월별 이용 합계 금액
    expression: SUM(COALESCE(tmdaa3e16."금월이용합계금액", 0))
    source_table: tmdaa3e16
    source_entity: card_monthly_performance
    default_time_dimension: 기준년월
    result_grain: 기준년월
    required_filters:
      - tmdaa3e16."개인기업구분코드" = '2'
      - 질문의 조회 시작월과 종료월로 기준년월 제한
    synonyms: [월별 법인카드 이용금액, 법인카드 이용금액 합계, 기업카드 월 사용액, 법인카드 월 이용액]
    unit: 원
    aggregation_behavior: additive_at_declared_month_grain
    time_policy:
      explicit_year: YYYY01부터 YYYY12까지
      recent_n_months: 현재월을 포함한 N개 월
  - name: 법인카드월전월대비증감률
    domain: card_usage
    business_definition: 월별 법인카드 이용금액의 직전 달 대비 증감률
    expression: ROUND((CAST("월이용금액" AS DOUBLE) - CAST("전월이용금액" AS DOUBLE)) / NULLIF(CAST("전월이용금액" AS DOUBLE), 0.0) * 100, 2)
    window_expression: LAG("월이용금액") OVER (ORDER BY "기준년월")
    numerator_expression: "월이용금액 - 전월이용금액"
    denominator_expression: NULLIF(전월이용금액, 0)
    source_table: tmdaa3e16
    source_entity: card_monthly_performance
    default_time_dimension: 기준년월
    result_grain: 기준년월
    required_filters:
      - tmdaa3e16."개인기업구분코드" = '2'
      - 월이용금액은 SUM(COALESCE(tmdaa3e16."금월이용합계금액", 0)) GROUP BY "기준년월"로 먼저 집계한 alias
      - 전월이용금액은 월이용금액에 window_expression(LAG)을 적용한 alias
      - 요청 시작월의 증감률 계산을 위해 입력 스캔은 시작월보다 한 달 앞서 시작
      - LAG 계산 후 최종 출력은 사용자가 요청한 시작월과 종료월만 유지
      - 전월이용금액이 NULL 또는 0이면 증감률은 NULL
    synonyms: [전월 대비 증감률, 전월비, 전월대비 증가율, 월별 증감률]
    unit: '%'
    aggregation_behavior: derived_window_metric
    time_policy:
      input_range: 요청 시작월 직전월부터 요청 종료월
      output_range: 요청 시작월부터 요청 종료월
  - name: 브랜드가맹점주수
    domain: merchant_sales
    business_definition: 지정 브랜드를 운영하는 고유 주대표자 수
    expression: COUNT(DISTINCT tbdaaus01."대표고객식별자")
    source_table: tbdaaus01
    source_entity: merchant_daily_enrichment
    default_time_dimension: 기준년월일
    result_grain: 최신 스냅샷 1행
    required_filters:
      - 전체 데이터의 MAX(기준년월일) 최신 스냅샷
      - 대표고객식별자 IS NOT NULL
      - 가맹점명·외부가맹점명·브랜드명 중 하나에 가맹점명 파라미터 부분일치
    name_filter:
      parameter: 가맹점명
      columns: [가맹점명, 외부가맹점명, 브랜드명]
      default_match: contains
      normalize_whitespace: true
    synonyms: [가맹점주 수, 브랜드 점주 수, 대표자 인원]
    unit: 명
    aggregation_behavior: distinct_count_latest_snapshot
  - name: 기업카드소지가맹점주수
    domain: corporate_sales_targeting
    business_definition: 지정 브랜드 가맹점주 중 유효 기업 신용카드 또는 체크카드를 보유한 고유 주대표자 수
    expression: COUNT(DISTINCT tbdaaus01."대표고객식별자")
    source_table: tbdaaus01
    source_entity: merchant_daily_enrichment
    default_time_dimension: 기준년월일
    result_grain: 최신 스냅샷 1행
    required_filters:
      - 전체 데이터의 MAX(기준년월일) 최신 스냅샷
      - COALESCE(tbdaaus01."유효기업신용카드수", 0) + COALESCE(tbdaaus01."유효기업체크카드수", 0) > 0
      - tbdaaus01."대표고객식별자" IS NOT NULL
      - 가맹점명·외부가맹점명·브랜드명 중 하나에 가맹점명 파라미터 부분일치
    name_filter:
      parameter: 가맹점명
      columns: [가맹점명, 외부가맹점명, 브랜드명]
      default_match: contains
      normalize_whitespace: true
    semantic_cautions:
      - 가맹점번호 수나 기업고객식별자 수가 아니라 대표고객식별자를 DISTINCT 집계
      - 유효기업개별카드수와 유효기업공용카드수는 소유형태 축이므로 신용·체크 수에 중복 합산하지 않음
    synonyms: [기업카드 보유 가맹점주 수, 법인카드 소지 점주 인원, 기업카드 소지자 명수]
    unit: 명
    aggregation_behavior: distinct_count_latest_snapshot
  - name: 최근기간폐업가맹점수
    domain: merchant_sales
    business_definition: 국세청 휴폐업 상태가 정상(0)이 아닌 것으로 최근 N개월 안에 처음 관측된 고유 가맹점 수
    expression: COUNT(DISTINCT "가맹점번호") WHERE "최초폐업관측일" BETWEEN DATE_FORMAT(DATE_ADD('month', -:조회기간개월수, CURRENT_DATE), '%Y%m%d') AND DATE_FORMAT(CURRENT_DATE, '%Y%m%d')
    source_table: tbdaaus01
    source_entity: merchant_daily_enrichment
    default_time_dimension: 기준년월일
    result_grain: 조회기간 1행
    required_filters:
      - COALESCE(tbdaaus01."휴폐업여부", '0') <> '0'
      - 가맹점번호별 MIN(기준년월일)을 최초폐업관측일로 계산
      - 최초폐업관측일이 CURRENT_DATE - 조회기간개월수부터 CURRENT_DATE까지
      - 가맹점명·외부가맹점명·브랜드명 중 하나에 가맹점명 파라미터 부분일치
    name_filter:
      parameter: 가맹점명
      columns: [가맹점명, 외부가맹점명, 브랜드명]
      default_match: contains
      normalize_whitespace: true
    time_policy:
      parameter: 조회기간개월수
      range_start: DATE_ADD('month', -:조회기간개월수, CURRENT_DATE)
      range_end: CURRENT_DATE
      boundaries: inclusive
    semantic_cautions:
      - 실제 국세청 폐업 신고일이 아니라 일별 스냅샷의 최초 폐업 상태 관측일
      - tbdaadt01.가맹점해지년월일은 KB 가맹점 계약 해지일이므로 폐업과 혼용하지 않음
    synonyms: [최근 폐업 가맹점 수, 최근 6개월 폐업 가맹점 수, 최근 6달 폐업 점포 수, 최근 1년 폐업 가맹점 수, 지난 12개월 폐업 점포 수, 일년 이내 문 닫은 가맹점 개수]
    unit: 개
    aggregation_behavior: first_event_then_distinct_count

semantic_query_contracts:
  - name: current_enterprise_size_customer_list
    domain: customer_card_portfolio
    execution_mode: semantic_generation
    routing_strength: high
    support_status: generative
    table_selection_mode: authoritative
    description: 현재 고객 마스터에서 질문에 지정된 기업규모 코드에 해당하는 기업고객 목록을 반환한다.
    match:
      required:
        - [명단, 목록, 리스트, 고객, 회사, 업체, 찾아, 보여, 알려]
      excluded: [기업카드, 법인카드, 보유카드, 카드수, 발급, 카드이용, 카드사용, 이용금액, 사용금액, 사용액, 가맹점매출, 작년, 지난해, 전년도, 월별]
      exclude_explicit_period: true
      required_attribute_values: [enterprise_size]
    examples:
      - 대기업 고객 목록 보여줘
      - 중소기업 회사 명단 알려줘
      - 공공기업 고객을 찾아줘
    source_tables: [tbdaaat01]
    semantic_attributes: [enterprise_size]
    result_grain: 고객식별자 × 고객관리번호
    dimensions: [고객식별자, 고객관리번호, 본사사업자등록번호, 기업규모구분코드]
    filters:
      - tbdaaat01.개인기업구분코드 = '2'
      - tbdaaat01.기업규모구분코드 = 질문의 기업규모 표현을 enterprise_size.value_semantics로 해석한 코드값
      - 여러 기업규모를 요청하면 해당 코드들을 IN 조건으로 적용
  - name: historical_enterprise_size_customer_list
    domain: customer_card_portfolio
    execution_mode: semantic_generation
    routing_strength: high
    support_status: generative
    table_selection_mode: authoritative
    description: 지정 과거 시점의 고객 월스냅샷에서 질문의 기업규모 코드에 해당하는 기업고객 목록을 반환한다.
    match:
      required:
        - [명단, 목록, 리스트, 고객, 회사, 업체, 찾아, 보여, 알려]
      excluded: [기업카드, 법인카드, 보유카드, 카드수, 발급, 카드이용, 카드사용, 이용금액, 사용금액, 사용액, 가맹점매출]
      require_explicit_period: true
      required_attribute_values: [enterprise_size]
    examples:
      - 2025년 6월 당시 대기업 고객 목록 보여줘
      - 작년 중소기업 회사 명단 알려줘
    source_tables: [tmdaa1d01]
    semantic_attributes: [enterprise_size]
    result_grain: 기준년월 × 고객식별자 × 고객관리번호
    dimensions: [기준년월, 고객식별자, 고객관리번호, 본사사업자등록번호, 기업규모구분코드]
    time_policy:
      explicit_period: 질문에 지정된 기준년월 또는 기간을 사용
      when_missing: 이 계약과 매치하지 않고 현재 기업규모 계약을 사용
    filters:
      - tmdaa1d01.개인기업구분코드 = '2'
      - tmdaa1d01.기업규모구분코드를 질문의 enterprise_size 코드값으로 필터
      - 여러 기업규모를 요청하면 해당 코드들을 IN 조건으로 적용
  - name: corporate_card_active_without_recent_usage
    domain: corporate_sales_targeting
    verified_query: corporate_card_active_no_usage_members
    routing_strength: high
    support_status: supported
    table_selection_mode: authoritative
    description: 입력한 기준년월일 현재 유효 기업카드를 보유하지만 최근 지정 개월 동안 신용·체크 이용이 전혀 없는 기업회원 명단을 tmdaa1d12에서 반환한다.
    match:
      required:
        - [기업카드, 법인카드]
        - [보유, 유효, 살아 있지만, 살아있는]
        - [무실적, 미이용, 이용이 없는, 이용 없는, 사용이 없는, 사용 없는, 한 번도 쓰지 않은, 쓰지 않은]
      optional:
        - [최근, 6개월, 반년, 명단, 목록]
      excluded: [탈회, 탈퇴, 해지, 미보유, 소진율]
    examples:
      - KB카드 기업카드 보유회원 중에 2026년 7월 기준으로 6개월 무실적인 기업 회원 명단을 알려줘
      - KB카드 기업카드 보유회원 중에 6개월 무실적인 기업 회원 명단을 알려줘
    source_tables: [tmdaa1d12]
    metric_names: [기업월카드이용금액, 기업유효카드수]
    result_grain: 고객식별자 1행
    dimensions: [고객식별자, 사업자등록번호, 기업명]
    time_policy:
      required_parameter: 기준년월일(YYYYMMDD); 질문에 없으면 추가 입력 요청
      month_only_input: YYYY년 M월은 해당 월 말일로 변환
      current_snapshot: 입력 기준년월일이 속한 월의 고객별 최신 기준년월일 1건
      usage_window: 입력 기준년월일이 속한 월을 포함한 최근 N개월의 고객×월 최신행
    deduplication:
      snapshot: 고객식별자×SUBSTR(기준년월일,1,6)별 기준년월일 DESC ROW_NUMBER() = 1
    filters:
      - 현재 유효기업신용카드수 + 유효기업체크카드수 > 0
      - 조회기간 신용카드이용금액 + 체크카드이용금액 > 0인 월이 없음
  - name: corporate_member_with_monthly_usage_count
    domain: corporate_sales_targeting
    verified_query: corporate_member_with_usage_count
    routing_strength: high
    support_status: supported
    table_selection_mode: authoritative
    description: 지정 월에 신용·체크카드 이용 실적이 있는 법인회원의 고유 업체 수를 반환한다.
    match:
      required:
        - [법인회원, 기업회원, 법인고객, 기업고객]
        - [유실적, 실적이 있는, 실적 있는, 이용실적이 있는, 이용 실적이 있는]
        - [업체수, 업체 수, 기업수, 기업 수, 회사수, 회사 수, 회원수, 회원 수, 몇 개]
      optional:
        - [기준, 월, 알려]
      excluded: [무실적, 미이용, 이용이 없는, 사용이 없는]
    examples:
      - 2026년 6월 기준 법인회원의 유실적 업체수를 알려주세요
    source_tables: [tbdaa1d12]
    metric_names: [기업월카드이용금액]
    result_grain: 요청 전체 1행
    dimensions: []
    time_policy:
      usage_month: 질문에 지정된 기준년월
    deduplication:
      snapshot: 고객식별자별 기준년월일 DESC ROW_NUMBER() = 1
    filters:
      - 기준월 금월신용카드이용금액 + 금월체크카드이용금액 > 0
    calculation: COUNT(DISTINCT 고객식별자)
    result_fields: [유실적업체수]
  - name: corporate_card_churn_after_usage
    domain: corporate_sales_targeting
    reference_query: corporate_card_churned_after_usage_members
    execution_mode: semantic_generation
    routing_strength: high
    support_status: generative
    table_selection_mode: authoritative
    description: 최근 지정 기간에 기업카드 이용 이력이 있으나 기준월 현재 유효 기업카드 수가 0인 이탈 후보 기업회원 명단을 반환한다.
    match:
      required:
        - [기업카드, 법인카드]
        - [이용하였, 과거 이용, 이용했, 결제는 있었, 사용했, 사용 이력, 이용 이력]
        - [탈회, 탈퇴, 해지, 현재 유효 카드가 없는, 현재 카드가 없는, 지금 기업카드가 없는, 카드수 0]
      optional:
        - [최근, 6개월, 반년, 이탈, 명단, 목록]
      excluded: [무실적, 소진율]
    examples:
