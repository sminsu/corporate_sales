    time_dimensions:
      - name: 기준년월
        data_type: VARCHAR
        description: "MFX월카드통합실적집계의 카드의 통합 실적을 집계하는 기준이 되는 기준년월 정보로 집계된 카드의 통합 실적은 해당 년월(기준년월)에 발생한 데이터를 집계한다."
        synonyms: [년월, 월, 기준월]
        required: true
        format: YYYYMM
        role: snapshot_month
      - name: 카드만료년월일
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드 유효기간의 종료일
        format: YYYYMMDD
        role: effective_to
      - name: 실제카드만료년월일
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드가 실제만료(만료년월이 적용 되었거나 해지년월이 적용)되는 최종년월일
        format: YYYYMMDD
        role: effective_to
      - name: 이전카드만료년월일
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드가 해지및 갱신으로인해 만료년월이 변경될경우 변경되기 이전의 만료년월일을 말함
        format: YYYYMMDD
        role: effective_to
      - name: 카드신규발급년월일
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드가 신규로 발급된 일자이다.
        format: YYYYMMDD
        role: event_date
      - name: 최종카드발급년월일
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 상품에 해당하는 카드가 최종 카드발급 접수된 일자이다.
        format: YYYYMMDD
        role: event_date
      - name: 카드교부년월일
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 해당카드를 발급받고 영업점에서 교부한 일자이다.
        format: YYYYMMDD
        role: event_date
      - name: 카드반송년월일
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 고객이 카드 실물을 반송한 일자이다.
        format: YYYYMMDD
        role: event_date
      - name: 해지년월일
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드가 해지된 년월일
        format: YYYYMMDD
        role: event_date
      - name: 신청서접수년월일
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드신청 또는 카드한도의 신청서 정보를 접수 처리(온라인,배치)한 일자
        format: YYYYMMDD
        role: event_date
      - name: 결제일
