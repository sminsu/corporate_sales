      - name: CA채널구분코드
        data_type: VARCHAR
        description: 단기카드대출(현금서비스) 거래가 발생한 채널(자동화기기, 인터넷 등)에 대한 코드 정보이다.
      - name: CA취급기관구분코드
        data_type: VARCHAR
        description: 단기카드대출을 취급한 기관을 구분한 코드
      - name: CA취급유형구분코드
        data_type: VARCHAR
        description: 단기카드대출을 취급한 유형을 구분하는 코드 예)현금출금, 수표출금, 이체 등
      - name: CA기관구분코드
        data_type: VARCHAR
        description: 단기카드대출(현금서비스)를 제공하는 기관을 구분하는 코드
