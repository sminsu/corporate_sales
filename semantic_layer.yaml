      workbook_entity: 카드(일카드모집기타실적집계시점정보)
      source_column_count: 55
      queryable_column_count: 54
      excluded_technical_columns: [ADW시스템최종갱신일시]
    primary_time_dimension: 기준년월일
    aggregation_policy:
      deduplicate_before_aggregation: true
      aggregate_across_time: flow_measures_only
      default_measure_behavior: semi_additive_latest_snapshot
  - name: tddaa3l01
    physical_table: tddaa3l01
    korean_name: 카드연체일별
    description: "카드 단위 연체 정보를 일자별로 집계하는 테이블. 한 행은 특정 기준년월일 시점의 하나의 카드 연체 상태를 의미한다. 신용카드 연체발생년월일·연체회차·연체일수, 최초 연체발생년월일·회차·일수, 자산유동화회차 등을 담아 일별 연체 현황·연체 추이 분석에 사용한다."
    grain: 기준년월일 × 회원일련번호 × 카드구분키번호 1건 (카드 일별 연체)
    primary_key: [기준년월일, 회원일련번호, 카드구분키번호]
    synonyms: [카드연체, 연체일별, 일별연체, 연체현황]
    dimensions:
      - name: 회원일련번호
        data_type: VARCHAR
        description: 당사(KB국민카드)와 계약한 회원을 관리하는 식별번호
        synonyms: [회원번호, 회원ID]
        required: true
      - name: 카드구분키번호
        data_type: VARCHAR
        description: 회원별로 부여되는 일련번호에 카드상품 또는 계약별로 추가되는 일련번호이다. / 기본적으로 카드브랜드구분코드 + 일련번호로 구성된다.
        required: true
      - name: 고객식별자
        data_type: VARCHAR
        description: KB카드의 고객에게 부여하는 10자리 번호체계로 각 고객을 고유하게 식별할 수 있음
        synonyms: [고객ID, 고객번호]
      - name: 고객관리번호
        data_type: VARCHAR
        description: 고객식별자의 하위 5자리 번호체계
      - name: 카드식별자
        data_type: VARCHAR
        description: KB카드에서 발급하는 카드의 카드번호를 대체하여 식별하기 위한 중복되지 않는 값
      - name: 카드BIN번호
        data_type: VARCHAR
        description: 카드의 발급사를 구분하는 BIN 번호이다.
      - name: 개인기업구분코드
        data_type: VARCHAR
        description: 개인 또는 기업을 구분하는 코드
      - name: KB카드BC카드구분코드
        data_type: VARCHAR
        description: KB카드와 BC카드를 구분하는코드
      - name: 회원자산관리부점코드
        data_type: VARCHAR
        description: 회원의 자산을 관리하는 부점코드
      - name: 연체관리부점코드
        data_type: VARCHAR
        description: 고객의 연체 정보를 관리하는 부점코드
      - name: 결제계좌번호
        data_type: VARCHAR
        description: 청구금액을 인출할 고객의 결제 계좌번호를 의미한다.
      - name: 카드결제기관구분코드
        data_type: VARCHAR
        description: 카드결제계좌의 기관구분코드
      - name: CA한도등급코드
        data_type: VARCHAR
        description: 단기카드대출(현금서비스)을 받을 수 있는 한도의 등급코드
      - name: 통합한도등급코드
        data_type: VARCHAR
        description: 현금서비스를 포함하여 부여한 총 한도등급코드
      - name: 회원자격코드
        data_type: VARCHAR
        description: 통합코드의 회원자격코드
      - name: 카드등급구분코드
        data_type: VARCHAR
        description: 카드의 등급을 관리하는 구분코드
      - name: 카드브랜드구분코드
        data_type: VARCHAR
        description: "카드브랜드구분코드 1:로칼(국민) 2:마스터 3:비자 4:JCB"
      - name: 모집부점코드
        data_type: VARCHAR
        description: 신용카드, 가맹점, 자동납부 신청을 모집한 부점코드
      - name: 제휴코드
        data_type: VARCHAR
        description: 상품코드의 마지막 5자리로 정의, 상품코드를 그대로 사용함으로 별도 목록성 테이블은 관리하지 않고, 코드로 표기하고자 함
      - name: 구매회원제휴코드
        data_type: VARCHAR
        description: 구매카드 소지일 경우 제휴코드 제일큰값
      - name: 발급권유자역할유형구분코드
        data_type: VARCHAR
        description: 카드발급 권유자의 역할유형을 산업은행, 회원모집팀장 등을 구분코드로 정의
      - name: 권유자번호
        data_type: VARCHAR
        description: "회원가입신청서 작성시 권유 모집인 식별을 위해 사용하는 번호 역할구분과 모집인번호가 조합 권유자식별자 -모집인구분(역할유형구분코드) +모집인번호(모집인식별내용(M) + 모집인코드)"
      - name: 통합BSS한도등급
        data_type: VARCHAR
        description: 고객의 연체정보,사용실적,외부평가정보등 통합적인 정보를 활용하여 산출한 BSS(Behavior Score System)한도등급
    measures:
      - name: 자산유동화회차
        data_type: BIGINT
        description: 유동화자산(ABS) 발행 시 발행 순서에 따라 부여된 회차이다.
        required: true
        unit: count
        aggregation: semi_additive_latest_snapshot
      - name: 신용카드연체회차
        data_type: BIGINT
        description: 신용카드(KB카드,BC카드) 이용건의 연체 회차 관리
        required: true
        unit: count
        aggregation: semi_additive_latest_snapshot
      - name: 신용카드연체일수
        data_type: BIGINT
        description: 신용카드 사용시 발생된 연체일수
        required: true
        unit: day
        aggregation: semi_additive_latest_snapshot
      - name: 최초연체회차
        data_type: BIGINT
        description: 최초 연체발생 시점의 연체회차
        required: true
        unit: count
        aggregation: semi_additive_latest_snapshot
      - name: 최초연체일수
        data_type: BIGINT
        description: 최초연체년월일 부터 현재까지 일수를 말한다.
        required: true
        unit: day
        aggregation: semi_additive_latest_snapshot
      - name: 연체회차
        data_type: BIGINT
        description: 청구된 회차의 잔액이 남아 연체된 경우의 회차를 관리함
        required: true
        unit: count
        aggregation: semi_additive_latest_snapshot
      - name: 연체일수
        data_type: BIGINT
        description: 연체기간에 대한 일수
        required: true
        unit: day
        aggregation: semi_additive_latest_snapshot
      - name: 연체원금
        data_type: DECIMAL
        description: 만기경과, 기한이익상실등의 사유로 발생한 원금 연체금액을 관리한다.
        required: true
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 연체수수료
        data_type: DECIMAL
        description: KB국민카드에서 고객, 가맹점, 제휴사를 상대로 받아야 하는 금액이 납기내에 회수되지 않은 경우에 발생되는 미납 수수료 정보를 관리함
        required: true
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 연체료
        data_type: DECIMAL
        description: "KB국민카드에서 고객, 가맹점, 제휴사를 상대로 받아야 하는 금액이 납기내에 회수되지 않은 경우에 발생되는 미납 원금에 대해서 지연된 일수만큼 연체료율을 적용해서 산출된 지연배상금 정보를 관리함"
        required: true
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 연체연회비
        data_type: DECIMAL
        description: 카드 연회비에 대한 연체된 금액
        required: true
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 연체합계금액
        data_type: DECIMAL
        description: 연체금액(연체원금, 연체이자 등)의 합계를 관리한다.
        required: true
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 채권잔액
        data_type: DECIMAL
        description: 연체 총 잔액 및 미청구금액을 포함한 금액을 말한다.
        required: true
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 청구수수료
        data_type: DECIMAL
        description: 카드대금 청구시 청구금액에 포함된 수수료 금액
        required: true
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 예수금
        data_type: DECIMAL
        description: 고객(회원)으로부터 수납하고 남은 금액
        required: true
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 선급금
        data_type: DECIMAL
        description: 법적절차착수와 같이 회수절차상 발생한 비용을 당사가 미리 지급한 금액
        required: true
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 청구연회비
        data_type: DECIMAL
        description: "카드대금 청구시 청구금액에 포함된 연회비 금액 / 카드를 발급받은 회원에게 카드회원의 자격을 유지하는 대가로 일 년에 한 번씩 청구하는 일정액의 금액"
        required: true
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 일시불연체원금
        data_type: DECIMAL
        description: 일시불 매출 중 연체된 원금
        required: true
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: CA연체원금
        data_type: DECIMAL
        description: 단기카드대출(현금서비스) 매출 중 연체된 원금
        required: true
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 할부연체원금
        data_type: DECIMAL
        description: 할부 매출 중 연체된 원금
        required: true
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 리볼빙일시불연체원금
        data_type: DECIMAL
        description: 리볼빙일시불 매출 중 연체된 원금
        required: true
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 리볼빙CA연체원금
        data_type: DECIMAL
        description: 리볼빙현금서비스 매출 중 연체된 원금
        required: true
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: CA한도금액
        data_type: DECIMAL
        description: (전문) 신용평가기관에서 제공하는 프로파일 항목으로 현금서비스한도합계금액
        required: true
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 통합한도금액
        data_type: DECIMAL
        description: "회원에 제공되는 각종 한도 중 \"통합한도등급\"으로 관리되는 한도금액"
        required: true
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 최종연체회차
        data_type: BIGINT
        description: 관리되고 있는 연체회차의 최종시점의 연체회차
        required: true
        unit: count
        aggregation: semi_additive_latest_snapshot
      - name: CA할부연체원금
        data_type: DECIMAL
        description: 단기카드대출(현금서비스)할부 매출 중 연체된 원금
        required: true
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 체크카드소액신용연체금액
        data_type: DECIMAL
        description: 소액신용결제 서비스가 등록된 체크카드의 연체금액
        required: true
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 체크카드소액신용채권잔액
        data_type: DECIMAL
        description: 소액신용결제 서비스가 등록된 체크카드의 채권잔액(연체원금+미청구원금)
        required: true
        unit: KRW
        aggregation: semi_additive_latest_snapshot
    time_dimensions:
      - name: 기준년월일
        data_type: VARCHAR
        description: 일별로 집계되는 카드의 연체 정보를 적재하는 기준이 되는 기준년월일 정보로 해당 기준년월일 시점의 연체 내역을 적재하기 위한 기준년월일 관리
        synonyms: [기준일, 일자, 날짜]
        required: true
        format: YYYYMMDD
        role: snapshot_date
      - name: 신용카드연체발생년월일
        data_type: VARCHAR
        description: 신용카드(KB카드,BC카드)에 대해 연체가 발생한 년월일 관리
        format: YYYYMMDD
        role: event_date
      - name: 최초연체발생년월일
        data_type: VARCHAR
        description: 최초로 연체가 발생한 년월일 관리
        format: YYYYMMDD
        role: event_date
      - name: 연체발생년월일
        data_type: VARCHAR
        description: 연체발생한 년월일 관리
        format: YYYYMMDD
        role: event_date
      - name: 결제일
        data_type: VARCHAR
        description: 카드대금 및 대출이자에 대한 지정된 결제일
        format: DD
        role: day_of_month
      - name: 카드신규발급년월일
        data_type: VARCHAR
        description: 카드가 신규로 발급된 일자이다.
        format: YYYYMMDD
        role: event_date
      - name: 회원신규가입년월일
        data_type: VARCHAR
        description: 회원의 신규 가입일자를 관리하는 속성
        format: YYYYMMDD
        role: event_date
      - name: 최종청구년월일
        data_type: VARCHAR
        description: 최종으로 회원에게 청구한 기준일
        format: YYYYMMDD
        role: event_date
      - name: 연체기준년월일
        data_type: VARCHAR
        description: 연체를 판단하는 기준이 되는 년월일

        format: YYYYMMDD
        role: event_date
    table_kind: daily_snapshot
    source_definition: '1. DAA일채권카드실적집계 테이블 데이터를 기초로 각종 연체정보(연체일수,연체회차,연체원금,연체료 등)을 계산하여 구축 관리한다. - 해당월 수보된 청구회수의 총괄전표명세를 집계 하여 카드별 연체 정보를 최종 산출한다. 2. ASIS 원장성 테이블에서 TOBE 이력관리 테이블로 변경
      - ASIS : TSTAFLA01(최종 마트) , TSTAFLA04(최종 마트 구축전 전일 이미지 백업) - TOBE : TDDAA3L01 (일별 이력관리:기준년월일)'
    source_metadata:
      workbook_entity: 카드(일채권카드연체내역)
      source_column_count: 61
      queryable_column_count: 60
      excluded_technical_columns: [ADW시스템최종갱신일시]
    primary_time_dimension: 기준년월일
    aggregation_policy:
      deduplicate_before_aggregation: true
      aggregate_across_time: flow_measures_only
      default_measure_behavior: semi_additive_latest_snapshot
  - name: tmdaa1d01
    physical_table: tmdaa1d01
    korean_name: 고객월스냅샷
