        aggregation: sum_at_declared_month_grain
      - name: 최근1년해외가맹점매출금액
        data_type: DECIMAL
        description: MFX월가맹점실적집계의 최근 1년간 해외 가맹점에서 발생한 매출 금액
        required: true
