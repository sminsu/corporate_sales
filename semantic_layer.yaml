  - name: tbdaadt01
    physical_table: tbdaadt01
    korean_name: 가맹점기본
    description: "당사와 가맹점 계약을 체결한 사업장의 기본 정보를 관리하는 가맹점 마스터 테이블. 한 행은 하나의 가맹점(가맹점번호)을 의미한다. 가맹점명·사업자/법인등록번호·가맹점업종·MCC업종·기업/대표 고객식별자·가맹점상태·등록/신규 년월일 등 가맹점 식별 및 분류 속성을 담는다. 가맹점 기준 분석의 마스터
      테이블이다."
    grain: 가맹점번호 1건 (가맹점 마스터)
    primary_key: [가맹점번호]
    synonyms: [가맹점, 가맹점마스터, 가맹점정보, 사업장]
    dimensions:
      - name: 가맹점번호
        data_type: VARCHAR
        description: KB카드와 가맹점 계약을 체결한 사업장에 부여하는 식별번호
        synonyms: [가맹점ID, 가맹점코드]
        required: true
      - name: 기업고객식별자
        data_type: VARCHAR
        description: KB카드의 고객에게 부여하는 10자리 식별번호중 기업고객에 대한 식별번호
      - name: 기업고객관리번호
        data_type: VARCHAR
        description: 개인이 아닌 기업체에 대한 고객관리번호
      - name: 대표고객식별자
        data_type: VARCHAR
        description: GBH고객식별자이벤트응모내역 엔티티에서 관리되는 대표고객의 고객식별자이다.
      - name: 대표고객관리번호
        data_type: VARCHAR
        description: GBH고객식별자이벤트응모내역 엔티티에서 관리되는 대표고객식별자의 일련번호이다.
      - name: 가맹점상태구분코드
        data_type: VARCHAR
        description: 가맹점의 상태 표시 코드
        value_semantics:
          '1': 활성 가맹점
        value_semantics_provenance: athena_reference_assumption
      - name: 법인등록번호
        data_type: VARCHAR
        description: 개인의 주민등록번호처럼 법인 설립 시 주어지는 고유번호. 법인등기부등본,사업자등록증으로 확인
        synonyms: [법인번호]
      - name: 사업자등록번호
        data_type: VARCHAR
        description: 개인기업 또는 법인의 사업자등록증번호
        synonyms: [사업자번호, 사업자등록]
      - name: 가맹점명
        data_type: VARCHAR
        description: 당사와 가맹점 계약을 체결한 사업장의 명칭
        synonyms: [가맹점이름, 상호, 상호명]
      - name: 영문가맹점명
        data_type: VARCHAR
        description: 가맹점명에 대한 영문명칭
      - name: 한글가맹점명
        data_type: VARCHAR
        description: 일반적인 가맹점명외에 영문도 한글로 변환한 가맹점명
      - name: 가맹점업종코드
        data_type: VARCHAR
        description: 가맹점업종코드관리
      - name: MCC업종코드
        data_type: VARCHAR
        description: MCC(Merchant Category Code) 업종코를 가맹점의 업종코드
      - name: 가맹점신청서번호
        data_type: VARCHAR
        description: 가맹점 신청서에 부여되는 일련번호
      - name: 가맹점해지사유구분코드
        data_type: VARCHAR
        description: 가맹점해지사유의 원인코드
      - name: 신규등록부점코드
        data_type: VARCHAR
        description: 신규등록 처리한 부점코드
      - name: 가맹점모집부점코드
        data_type: VARCHAR
        description: 가맹점 신청을 모집한 부점코드
      - name: 가맹점전입모집부점코드
        data_type: VARCHAR
        description: 가맹점이 주소 이전시 해당 가맹점을 유치한 부점코드
      - name: 역할유형구분코드
        data_type: VARCHAR
        description: 권유자 역할 유형 코드 (배우자/직원/알바/..)
      - name: 가맹점신청서권유자번호
        data_type: VARCHAR
        description: 가맹점에 가맹점신청서를 권유한 모집사원의 번호
      - name: 가맹점관리부점코드
        data_type: VARCHAR
        description: 가맹점 대금지급 대상건의 가맹점을 관리하는 지점의 부점코드
      - name: 가맹점전입관리부점코드
        data_type: VARCHAR
        description: 가맹점이 주소 이전시 전입지의 카드영업소 관리부점코드
      - name: 가맹점거래정지여부
        data_type: VARCHAR
        description: 거래정지 범위구분 중 가맹점 제재여부를 관리
      - name: 가맹점거래정지코드
        data_type: VARCHAR
        description: 가맹점에대한 거래정지코드 (승인요청시 가맹점 거래정지로 인해 거절되는 경우 거절내역에 사유파악을 위해 저장)
      - name: 가맹점거래정지상태구분코드
        data_type: VARCHAR
        description: 가맹점의 상태를 거래정지기준으로 해제,미해제로 구분한 코드
      - name: 가맹점유형구분코드
        data_type: VARCHAR
        description: 가맹점의 유형(일반,통판등)구분
      - name: 가맹점세분화구분코드
        data_type: VARCHAR
        description: 가맹점을 상세하게 분류하기위한 구분코드
      - name: 사업자과세유형구분코드
        data_type: VARCHAR
        description: 해당 가맹점의 사업자 과세유형을 구분하는 코드(일반과세,간이과세 등)
      - name: 가맹점서비스구분코드
        data_type: VARCHAR
        description: 해당 가맹점의 가맹점서비스를 구분하는코드
      - name: 가맹점사업주체구분코드
        data_type: VARCHAR
        description: 가맹점의 사업주체가 개인사업자인지 법인사업자(법인포함)인지를 구분하는코드
      - name: 가맹점대표구분코드
        data_type: VARCHAR
        description: 가맹점대표의 유형을 구분하는코드(일반,공동,외국인 등)
      - name: 가맹점최종매입부점코드
        data_type: VARCHAR
        description: 가맹점에서 최종으로 전표를 매입한 부점코드
      - name: 카드VAN사구분코드
        data_type: VARCHAR
        description: 카드결제시 가맹점과 카드사를 중계해주는 VAN사를 구분하는코드
      - name: 공동망가맹점대상여부
        data_type: VARCHAR
        description: 공동망가맹점 대상인지의 여부
      - name: 할부가능여부
        data_type: VARCHAR
        description: 가맹점의 할부 가능여부
      - name: 공용전표사용여부
        data_type: VARCHAR
        description: "신용판매 매출에 대한 공용전표 사용여부(0:일반전표,1:공용전표)"
      - name: 고액승인가맹점여부
        data_type: VARCHAR
        description: 가맹점 고액승인 대상 여부
      - name: 사고발생가맹점여부
        data_type: VARCHAR
        description: 거래정지된 카드, 미승인전표, 수기매출전표 등으로 전표매입이 발생되어 회원의 클레임이 발생한 가맹점의 여부임
      - name: 통신판매수기판매가맹점여부
        data_type: VARCHAR
        description: 통신판매 또는 수기특약 가맹점 여부
      - name: 심야승인제한여부
        data_type: VARCHAR
        description: 심야시간대 승인을 제한할 지 여부
      - name: 국세청압류대상여부
        data_type: VARCHAR
        description: 국세청 압류대상 사업장 여부
      - name: ONUS가맹점여부
        data_type: VARCHAR
        description: ONUS 가맹점인지에 대한 여부.
      - name: 대금지급보류등록가맹점여부
        data_type: VARCHAR
        description: 대금지급보류가 등록된 가맹점인지 여부
      - name: 가맹점미수금발생여부
        data_type: VARCHAR
        description: 가맹점의 미수금(카드회사에 지불해야 할 금액)이 발생 했는지의 여부
      - name: 가맹점한도설정여부
        data_type: VARCHAR
        description: 가맹점에 매입한도, 승인한도등을 설정하였는지의 여부
      - name: 인증서비스대상여부
        data_type: VARCHAR
        description: 승인시점에 해당 가맹점의 승인시 반드시 인증을 요하는 경우의 가맹점
      - name: 가맹점대금지급통화구분코드
        data_type: VARCHAR
        description: 가맹점 대금지급시 미화 또는 원화등 통용되고 있는 화폐를 구분하는 코드
      - name: 우체국특약여부
        data_type: VARCHAR
        description: 가맹점의 우체국 특약등록 여부
      - name: 해외지급보류처리제외여부
        data_type: VARCHAR
        description: 해외 지급보류 처리제외 가맹점 여부
      - name: 승인검증생략구분코드
        data_type: VARCHAR
        description: 전표매입시 승인번호 검증에 대한 관리 코드
      - name: 복수가맹점등록여부
        data_type: VARCHAR
        description: 동일 사업자등록번호로 복수개의 가맹점 보유여부
      - name: 전표매입거절구분코드
        data_type: VARCHAR
        description: 해당 전표매입시 매입이 거절된 시기를 구분하는코드(온라인거절,센터처리거절 등)
      - name: 수기할부매입거절여부
        data_type: VARCHAR
        description: 수기 할부 매출에 대한 매입거절 여부
      - name: 가맹점수수료구분코드
        data_type: VARCHAR
        description: 가맹점수수료 적용 관리 코드
      - name: 선취후취구분코드
        data_type: VARCHAR
        description: 가맹점 수수료 청구방법을 구분하는코드(선취,후취 등)
      - name: 수수료적용구분코드
        data_type: VARCHAR
        description: 수수료의 업종별,SLIDING별등 적용 대상을 관리하는 코드
      - name: 카드대금지급주기구분코드
        data_type: VARCHAR
        description: 가맹점 대금지급주기를 관리하는 코그
      - name: 현금카드결제기관구분코드
        data_type: VARCHAR
        description: 현금카드 CD기 출금시 카드와 연계되어 있는 결제금융기관(예) 산업은행, 기업은행, 국민은행, 외환은행 등)을 구분하는 코드
      - name: 미화카드결제기관구분코드
        data_type: VARCHAR
        description: 미화 카드대금의 결제계좌가 개설된 금융기관구분 코드
      - name: 카드환율적용구분코드
        data_type: VARCHAR
        description: 환율적용관리 코드
      - name: 대표가맹점번호
        data_type: VARCHAR
        description: 복수 가맹점의 경우 복수 가맹점에 대한 대표가맹점번호(종속가맹점번호)
      - name: 본사가맹점여부
        data_type: VARCHAR
        description: 가맹점이 동일업체 다매장인 경우 해당가맹점이 본사가맹점인지 여부(대표가맹점과는 다름)
      - name: 본사가맹점번호
        data_type: VARCHAR
        description: 가맹점이 동일업체 다매장인 경우 본사가맹점번호를 의미(대표가맹점과는 다름)
      - name: 집금가맹점대상여부
        data_type: VARCHAR
        description: 집금대상이란 다수 가맹점의 신용판매대금을 합산하여 한곳의 지정가맹점 계좌에 한건으로 처리하는것을 의미하는데 해당가맹점이 이에 해당되는지 여부
      - name: 집금대표가맹점번호
        data_type: VARCHAR
        description: 집금대상이란 다수 가맹점의 신용판매대금을 합산하여 한곳의 지정가맹점 계좌에 한건으로 처리하는것을 의미하는데 이에 해당되는 대표가맹점번호
      - name: 가맹점전화번호
        data_type: VARCHAR
        description: 당사 가맹점의 전화번호
      - name: 주소표시구분코드
        data_type: VARCHAR
        description: 고객의 주소를 보여줄때 일반주소 또는 도로명주소로 표시할지의 구분코드
      - name: 우편번호
        data_type: VARCHAR
        description: 우정사업본부에서 주소지를 식별하기 위해 부여하는 번호체계 / 도로명주소체계 이전에는 6자리, 도로명주소체계에서는 5자리를 사용함
      - name: 우편일련번호
        data_type: DECIMAL
        description: 대량배송처별 일련번호로 KB내부에서 관리하기 적합하게 변형해서 사용하는 일련번호 (우체국에서 사용하는 우편일련번호는 우편중복일련번호 로 사용)
      - name: 가맹점상세주소
        data_type: VARCHAR
        description: 가맹점가입시 입력되는 가맹점사업장의 상세주소
      - name: 도로명우편번호
        data_type: VARCHAR
        description: 도로명 주소의 우편번호
      - name: 도로명우편읍면번호
        data_type: VARCHAR
        description: 도로명 주소의 우편읍면번호
      - name: 도로명우편보조번호
        data_type: VARCHAR
        description: 도로명주소의 우편보조번호
      - name: 도로명구역번호
        data_type: VARCHAR
        description: 도로명 주소의 해당 구역번호 / 도로명주소의구역번호
      - name: 도로명지하구분코드
        data_type: VARCHAR
        description: 도로명주소의 지상/지하/공중인지 구분
      - name: 도로명건물본번호
        data_type: VARCHAR
        description: 도로명 주소의 건물본번호
      - name: 도로명건물부번호
        data_type: VARCHAR
        description: 도로명 주소의 건물부번호
    measures:
      - name: 금년가맹점신용판매매출금액
        data_type: DECIMAL
        description: 당해 년도 가맹점의 신용판매 매출금액
        required: true
        unit: KRW
        aggregation: sum_at_declared_grain
      - name: 전년가맹점신용판매매출금액
        data_type: DECIMAL
        description: 전해 년도 가맹점의 신용판매 매출금액
        required: true
        unit: KRW
        aggregation: sum_at_declared_grain
      - name: 금년사고보상범위금액
        data_type: DECIMAL
        description: 당해 년동의 사고 보상범위 금액
        required: true
        unit: KRW
        aggregation: sum_at_declared_grain
      - name: 금년사고보상처리금액
        data_type: DECIMAL
        description: 실제가맹점 대상 사고보상 처리된 금액
        required: true
        unit: KRW
        aggregation: sum_at_declared_grain
      - name: 금년기준외가맹점사고보상금액
        data_type: DECIMAL
        description: 거래정지, 미승인전표, 서명상이,수기매출전표 등의 기준외에 금년도에 가맹점에 사고보상한 금액
        required: true
        unit: KRW
        aggregation: sum_at_declared_grain
      - name: 금년전년도분사고보상처리금액
        data_type: DECIMAL
        description: 실제가맹점 대상 사고보상 처리된 금액(전전년도)
        required: true
        unit: KRW
        aggregation: sum_at_declared_grain
      - name: 전년사고보상범위금액
        data_type: DECIMAL
        description: 기업의 전년도 사고보상범위금액
        required: true
        unit: KRW
        aggregation: sum_at_declared_grain
      - name: 전년사고보상처리금액
        data_type: DECIMAL
        description: 기업의 전년도 사고보상처리금액
        required: true
        unit: KRW
        aggregation: sum_at_declared_grain
      - name: 전년기준외가맹점사고보상금액
        data_type: DECIMAL
        description: 거래정지, 미승인전표, 서명상이,수기매출전표 등의 기준외에 전년도에 가맹점에 사고보상한 금액
        required: true
        unit: KRW
        aggregation: sum_at_declared_grain
      - name: 전년전년도분사고보상처리금액
        data_type: DECIMAL
        description: 사업장의 전년,전년도분 사고보상처리 금액
        required: true
        unit: KRW
        aggregation: sum_at_declared_grain
      - name: 전년익년도분보상처리금액
        data_type: DECIMAL
        description: 사업장의 전년,익년도분 보상처리 금액
        required: true
        unit: KRW
        aggregation: sum_at_declared_grain
      - name: 신용카드가맹점수수료율
        data_type: DECIMAL
        description: 신용카드로 가맹점에서 매출이 발생시 카드사의 수입이 되는 수수료의 비율.
        required: true
        unit: ratio
        aggregation: recompute_or_weighted_avg
      - name: 체크카드가맹점수수료율
        data_type: DECIMAL
        description: 체크카드로 가맹점에서 매출이 발생시 카드사의 수입이 되는 수수료의 비율.
        required: true
        unit: ratio
        aggregation: recompute_or_weighted_avg
      - name: MASTER카드수수료율
        data_type: DECIMAL
        description: MASTER카드 사용시 일정비율로 부과하는 수수료에 대한 산정비
        required: true
        unit: ratio
        aggregation: recompute_or_weighted_avg
      - name: VISA카드수수료율
        data_type: DECIMAL
        description: VISA카드 사용시 일정비율로 부과하는 수수료에 대한 산정비
        required: true
        unit: ratio
        aggregation: recompute_or_weighted_avg
      - name: JCB카드수수료율
        data_type: DECIMAL
        description: JCB카드 사용시 일정비율로 부과하는 수수료에 대한 산정비
        required: true
        unit: ratio
        aggregation: recompute_or_weighted_avg
      - name: 가맹점선지급처리건수
        data_type: BIGINT
        description: 가맹점 선지급처리에 대한 건수
        required: true
        unit: count
        aggregation: sum_at_declared_grain
      - name: 가맹점선지급처리금액
        data_type: DECIMAL
        description: 가맹점의 원대금지급일자이전에 선지급한 금액
        required: true
        unit: KRW
        aggregation: sum_at_declared_grain
      - name: 대금지급주기일수
        data_type: BIGINT
        description: 가맹점에게 신판 판매대금을 지급하는 주기. 전표매입일로 부터 1일 후, 2일후, 3일후 등.
        required: true
        unit: day
        aggregation: sum_at_declared_grain
      - name: 가맹점1회승인한도금액
        data_type: DECIMAL
        description: 가맹점에서 1회에 승인할 수 있는 승인한도금액
        required: true
        unit: KRW
        aggregation: sum_at_declared_grain
      - name: 가맹점일승인한도금액
        data_type: DECIMAL
        description: 가맹점에 부여된 일별 최대승인한도금액
        required: true
        unit: KRW
        aggregation: sum_at_declared_grain
      - name: 가맹점월승인한도금액
        data_type: DECIMAL
        description: 가맹점에 부여된 월별 최대승인한도금액
        required: true
        unit: KRW
        aggregation: sum_at_declared_grain
    time_dimensions:
