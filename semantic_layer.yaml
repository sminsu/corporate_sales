        unit: KRW
        aggregation: sum_at_transaction_grain
      - name: 리볼빙일시불편입원금
        data_type: DECIMAL
        description: 리볼빙 일시불 채권의 대손상각(자산의 손비처리) 후 특수채권으로 편입되는 원금
        unit: KRW
        aggregation: sum_at_transaction_grain
      - name: 리볼빙CA편입원금
        data_type: DECIMAL
        description: 리볼빙 단기카드대출 채권의 대손상각(자산의 손비처리) 후 특수채권으로 편입되는 원금
        unit: KRW
        aggregation: sum_at_transaction_grain
    time_dimensions:
