    source_definition: 1. DAA카드모집기타실적집계 테이블의 일별 스냅샷 테이블로 해당 기준년월일의 시점정보를 적재하는 엔티티이다.추후 재작업 및 과거 시점정보 확인에 필요한 엔티티로 TOBE에 신규로 생성하는 엔티티이다.
