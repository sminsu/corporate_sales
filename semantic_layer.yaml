# 3. SEMANTIC ATTRIBUTES - 질의와 독립적인 역할·코드·컬럼 매핑
# =============================================================================
semantic_attributes:
  - name: merchant_search_name
    korean_name: 가맹점·브랜드 검색명
    domains: [merchant_sales, corporate_sales_targeting, credit_risk]
    business_definition: 사용자가 말한 상호·가맹점·브랜드 명칭을 물리 테이블에서 찾기 위한 공통 검색 속성
    aliases: [가맹점명, 브랜드명, 상호명, 매장명, 점포명]
    parameter_name: 가맹점명
    default_match: contains
    case_insensitive: true
    normalize_whitespace: true
    source_mappings:
      - {entity: merchant, table: tbdaadt01, columns: [가맹점명, 한글가맹점명]}
      - {entity: merchant_daily_enrichment, table: tbdaaus01, columns: [가맹점명, 외부가맹점명, 브랜드명]}
      - {entity: merchant_monthly_snapshot, table: tmdaa5d01, columns: [가맹점명, 한글가맹점명]}
      - {entity: merchant_monthly_performance, table: tmdaa5e11, columns: [가맹점명]}
      - {entity: merchant_monthly_enrichment, table: tmdaaus01, columns: [가맹점명, 외부가맹점명, 브랜드명]}
    semantic_cautions:
      - 여러 검색 컬럼은 OR로 연결한 뒤 괄호로 묶어 기간·상태·카드 조건이 OR 전체에 적용되게 한다.
      - 브랜드명 컬럼이 없는 테이블에서는 가맹점명·한글가맹점명만 사용하고 존재하지 않는 브랜드명 컬럼을 만들지 않는다.
  - name: merchant_identifier
    korean_name: 가맹점 식별자
    domains: [merchant_sales, corporate_sales_targeting]
    business_definition: KB카드와 계약한 개별 사업장을 식별하는 가맹점번호
    aliases: [가맹점번호, 가맹점ID, 점포ID, 매장번호]
    source_mappings:
      - {entity: merchant, table: tbdaadt01, column: 가맹점번호, role: merchant_key}
      - {entity: merchant_daily_enrichment, table: tbdaaus01, column: 가맹점번호, role: merchant_key}
      - {entity: merchant_monthly_snapshot, table: tmdaa5d01, column: 가맹점번호, role: merchant_key}
      - {entity: merchant_monthly_performance, table: tmdaa5e11, column: 가맹점번호, role: merchant_key}
      - {entity: merchant_monthly_enrichment, table: tmdaaus01, column: 가맹점번호, role: merchant_key}
    semantic_cautions:
      - 가맹점 수는 COUNT(DISTINCT 가맹점번호)로 계산한다.
  - name: merchant_corporate_customer
    korean_name: 가맹점 운영 기업고객
    domains: [merchant_sales, corporate_sales_targeting, credit_risk]
    business_definition: 가맹점 사업체를 기업고객 단위로 식별하는 기업고객식별자
    aliases: [기업고객식별자, 가맹점 기업고객, 운영기업, 가맹점주 기업]
    source_mappings:
      - {entity: merchant, table: tbdaadt01, column: 기업고객식별자, role: corporate_customer_key}
      - {entity: merchant_daily_enrichment, table: tbdaaus01, column: 기업고객식별자, role: corporate_customer_key}
      - {entity: merchant_monthly_snapshot, table: tmdaa5d01, column: 기업고객식별자, role: corporate_customer_key}
      - {entity: merchant_monthly_enrichment, table: tmdaaus01, column: 기업고객식별자, role: corporate_customer_key}
      - {entity: loss_provision, table: tbmewcm94, column: 고객식별자, role: corporate_customer_key}
    semantic_cautions:
      - 기업고객 목록은 기업고객식별자 IS NOT NULL과 DISTINCT를 적용한다.
      - 기업 리스크·충당금은 기업고객식별자로 연결하며 대표고객식별자와 바꾸지 않는다.
  - name: merchant_owner
    korean_name: 가맹점 주대표자
    domains: [merchant_sales, corporate_sales_targeting]
    business_definition: 가맹점의 주대표자 개인을 식별하는 대표고객식별자
    aliases: [가맹점주, 점주, 가맹점 대표자, 주대표자, 개인고객식별자]
    source_mappings:
      - {entity: merchant, table: tbdaadt01, column: 대표고객식별자, role: person_key}
      - {entity: merchant_daily_enrichment, table: tbdaaus01, column: 대표고객식별자, role: person_key}
      - {entity: merchant_monthly_snapshot, table: tmdaa5d01, column: 대표고객식별자, role: person_key}
      - {entity: merchant_monthly_enrichment, table: tmdaaus01, column: 대표고객식별자, role: person_key}
    semantic_cautions:
      - 가맹점주 인원은 대표고객식별자 IS NOT NULL 후 COUNT(DISTINCT 대표고객식별자)를 사용한다.
      - 가맹점주가 운영하는 기업의 매출·카드·리스크를 묻는 경우 사람 수가 아니므로 대표고객식별자로 집계하지 않는다.
  - name: enterprise_size
    korean_name: 기업규모
    domains: [card_usage, customer_card_portfolio]
    business_definition: 고객의 기업규모를 대기업·중소기업·영세기업·공공기업 등으로 분류하는 코드 속성
    aliases: [기업규모, 기업규모구분, 대기업, 중소기업, 중소기업간주, 영세기업, 공공기업]
    parameter_name: 기업규모구분코드
    codebook_status: verified
    value_semantics:
      '0': 기업규모산정미대상
      '1': 대기업
      '2': 중소기업
      '3': 중소기업간주
      '4': 외부감사대상 중소기업
      '5': 외부감사비대상 중소기업
      '6': 영세기업
      '7': 공공기업
      '8': 가계
      '9': 기타
    value_semantics_provenance: user_provided_business_codebook
    source_mappings:
      - {entity: customer, table: tbdaaat01, column: 기업규모구분코드, role: current_enterprise_size_code}
      - {entity: customer_monthly_snapshot, table: tmdaa1d01, column: 기업규모구분코드, role: monthly_enterprise_size_code}
    source_selection:
      default_role_prefix: current_
      period_role_prefix: monthly_
      current_terms: [현재, 최신, 지금, 현시점]
    semantic_cautions:
      - 기업규모별 이용금액은 tbdaaat01의 현재 기업규모를 요청 기간 전체의 이용실적에 적용한다.
      - 질문이 당시 또는 월별 과거 기업규모를 명시한 경우에만 동일 기준년월의 tmdaa1d01 기업규모구분코드를 사용한다.
      - 여러 기업규모를 함께 요청하면 해당 코드들을 IN 조건으로 적용하고 기업규모별로 구분하여 집계한다.
      - 고객별 현재 기업규모구분코드가 둘 이상이면 임의 대표값을 고르지 않고 해당 고객을 제외하거나 데이터 품질 예외로 보고한다.
