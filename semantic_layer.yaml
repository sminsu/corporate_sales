        description: 비계좌 선불카드만을 보유하고있는지를 나타낸다. ※ 선불전자지급수단을 충전계정(결제계좌)으로 하는 선불카드(은행의 리브포켓, 당사의 머니 등)
      - name: 외국인여부
        data_type: VARCHAR
        description: 고객이 외국인인지에 대한 여부 값을 관리한다.
    measures:
      - name: 월소득금액
        data_type: DECIMAL
        description: 고객의 월소득금액
        required: true
        unit: KRW
        aggregation: sum_at_declared_grain
      - name: 자택발송물반송횟수
        data_type: BIGINT
        description: 자택에 발송물이 반송된 횟수를 관리
        required: true
        unit: count
        aggregation: sum_at_declared_grain
      - name: 직장발송물반송횟수
        data_type: BIGINT
        description: 직장에 발송물이 반송된 횟수를 관리
        required: true
        unit: count
        aggregation: sum_at_declared_grain
    time_dimensions:
      - name: 실적기준년월일
        data_type: VARCHAR
        description: 해당 테이블의 데이터를 적재하는 기준이 되는 일자 정보로 사용되는 일자정보(기준년월일)를 나타낸다.
        format: YYYYMMDD
        role: event_date
      - name: 등록년월일
        data_type: VARCHAR
        description: 해당테이블에 데이터가 등록된 년월일
        format: YYYYMMDD
        role: event_date
      - name: 최초등록년월일
        data_type: VARCHAR
        description: 국민카드에 고객으로 처음 등록한 일자(년월일)
        format: YYYYMMDD
        role: event_date
      - name: 사망년월일
        data_type: VARCHAR
        description: 사망한 기준이 되는 년/월/일이다
        format: YYYYMMDD
        role: event_date
      - name: 사망해제년월일
        data_type: VARCHAR
        description: 사망으로 등록된이후 사망 상태가 해제된 년월일
        format: YYYYMMDD
        role: effective_to
      - name: 기념년월일
        data_type: VARCHAR
        description: 생일,기일,결혼기념일 등의 고객별 기념일을 년월일로 관리
        format: YYYYMMDD
        role: event_date
      - name: 결혼기념년월일
        data_type: VARCHAR
        description: 고객의 결혼기념에 해당하는 일자이다.

        format: YYYYMMDD
        role: event_date
    table_kind: master
    source_definition: "1. KB국민카드와 신규계약 생성, 가맹점생성,기업고객의 부서단위 생성및 관련정보변경시 고객기본정보(주소,연락처,취미 등)를 관리하는 엔티티 <특이사항> : ASIS는 고객식별자 '6'번대를 개인사업자, '7','8'은 법인(법인사업자)로 판단했으나 TOBE는 개인사업자가 '6'번대
      이후로 발번될수있어서 고객유형분류구분코드로 판단 필요함 ※ 아래 ASIS 판단기준을 TOBE형태로 변경필요 (1) 개인:SUBSTR(고객식별자, 1, 1) < '6' -> 고객유형분류구분코드 = '1' (2) 개인사업자:SUBSTR(고객식별자, 1, 1) ='6' -> 고객유형분류구분코드 = '2 (3) 법인(사업자):SUBSTR(고객식별자,1,1)
      IN ('7','8') -> 고객유형분류구분코드 NOT IN ('1','2') (4) 개인(사업자):SUBSTR(고객식별자,1,1) < '7' -> 고객유형분류구분코드 IN ('1','2')"
    source_metadata:
      workbook_entity: 고객 회원 카드
      source_column_count: 105
      queryable_column_count: 104
      excluded_technical_columns: [ADW시스템최종갱신일시]
    primary_time_dimension: 최초등록년월일
    aggregation_policy:
      deduplicate_before_aggregation: false
      aggregate_across_time: false
      default_measure_behavior: use_declared_grain
  - name: tbdaaat03
    physical_table: tbdaaat03
    korean_name: 회원기본
    description: "당사와 계약한 회원(카드 회원)을 관리하는 회원 마스터 테이블. 한 행은 하나의 회원일련번호를 의미한다. 유효 신용/체크카드 소지 여부와 매수, 국제브랜드카드 보유 여부, 회원/카드 거래정지 여부, 최초 신규발급·해지·만료 년월일 등 회원의 카드 보유 및 상태 이력을 집약한다. 회원 단위 카드
      보유 현황 분석에 사용한다."
    grain: 회원일련번호 1건 (회원 마스터)
    primary_key: [회원일련번호]
    synonyms: [회원, 회원마스터, 회원정보]
    dimensions:
      - name: 회원일련번호
        data_type: VARCHAR
        description: 당사(KB국민카드)와 계약한 회원을 관리하는 식별번호
        synonyms: [회원번호, 회원ID]
        required: true
      - name: 고객식별자
        data_type: VARCHAR
        description: KB카드의 고객에게 부여하는 10자리 번호체계로 각 고객을 고유하게 식별할 수 있음
        synonyms: [고객ID, 고객번호]
      - name: 고객관리번호
        data_type: VARCHAR
        description: 고객식별자의 하위 5자리 번호체계
      - name: 개인기업구분코드
        data_type: VARCHAR
        description: 개인 또는 기업을 구분하는 코드
        value_semantics:
          '2': 기업
        value_semantics_provenance: source_definition
      - name: 유효카드존재회원여부
        data_type: VARCHAR
        description: 유효카드가 존재하는 회원인지 여부
      - name: 유효신용카드소지여부
        data_type: VARCHAR
        description: 한도신청 고객의 유효한 신용카드소지 여부
      - name: 유효체크카드소지여부
        data_type: VARCHAR
        description: 카드 회원중 유효기간이 남아있는 체크카드를 보유 했는지의 여부
      - name: 국제브랜드카드보유여부
        data_type: VARCHAR
        description: 국제브랜드카드의 보유여부
      - name: 카드거래정지여부
        data_type: VARCHAR
        description: 거래정지 범위구분 중 카드 제재여부를 관리
      - name: 회원거래정지여부
        data_type: VARCHAR
        description: 거래정지 범위구분 중 회원제재여부
      - name: 회원자산관리부점코드
        data_type: VARCHAR
        description: 회원의 자산을 관리하는 부점코드
      - name: 회원자격코드
        data_type: VARCHAR
        description: 통합코드의 회원자격코드
      - name: 카드등급구분코드
        data_type: VARCHAR
        description: 카드의 등급을 구분하는코드(일반,실버,골드,플래티늄 등)
      - name: 할부요율그룹구분코드
        data_type: VARCHAR
        description: 할부에 적용되는 요율그룹을 구분하는 코드
      - name: CA요율그룹구분코드
        data_type: VARCHAR
        description: 단기카드대출(현금서비스)에 적용되는 요율그룹을 구분하는 코드
      - name: 연회비면제구분코드
        data_type: VARCHAR
        description: 연회비 면제 구분(일반/제휴/일반+제휴)
      - name: 통합한도등급코드
        data_type: VARCHAR
        description: "현금서비스를 포함하여 부여한 총 한도등급코드 ※ 통합회원의 경우 : 통합한도등급 이원화회원의 경우: 통합한도등급(이원화 한도등급의 합산)"
      - name: CA한도등급코드
        data_type: VARCHAR
        description: "단기카드대출(현금서비스)을 받을 수 있는 한도의 등급코드 ※ 통합회원의 경우: CA한도등급 이원화회원의 경우: CA한도등급(이원화 CA한도등급 합산)"
      - name: 결제단위분리구분코드
        data_type: VARCHAR
        description: 회원 결제단위 분리구분(kb/bc)
      - name: 결제정보이원화구분코드
        data_type: VARCHAR
        description: 카드 결제단위 청구방식이 통합 및 이원화(KB카드/BC카드)하고 있는지를 구분하는 코드
      - name: 카드신용체크이원화구분코드
        data_type: VARCHAR
        description: 카드의 결제단위가 신용카드/체크카드이원화 인지 통합인지 구분하는코드
      - name: 카드결제기관구분코드
        data_type: VARCHAR
        description: 카드결제계좌의 기관구분코드
      - name: 지로코드
        data_type: VARCHAR
        description: "금융결제원에서 대한민국에 소재하는 금융기관의 각 본지점에 부여하는 번호 ※결제계좌의 최초 청구일련번호에 대한 지로코드를 세팅함 · 이원화회원일경우 결제단위구분에서 KB/신용/일반 중 MIN(청구번호일련번호)"
      - name: 청구지주소구분코드
        data_type: VARCHAR
        description: "자택, 직장,이메일 등 청구지 주소를 구분하는 코드 ※청구단위정보의 최초 청구번호에 대한 청구지주소구분코드를 세팅함 · 이원화회원일경우 결제단위구분에서 KB/신용/일반 중 MIN(청구번호)"
      - name: 회수방법구분코드
        data_type: VARCHAR
        description: "결제 대금 회수방법구분코드 ※청구단위정보의 최초 청구번호에 대한 회수방법구분코드를 세팅함 · 이원화회원일경우 결제단위구분에서 KB/신용/일반 중 MIN(청구번호)"
      - name: KB카드통합한도등급코드
        data_type: VARCHAR
        description: "회원의 결제단위가 신용카드를 포함한 KB카드일 경우의 통합한도등급코드 ※이원화 회원일때만 세팅함 · 이원화회원일경우 결제단위구분에서 KB/신용/일반 인 경우에 한도"
      - name: KB카드CA한도등급코드
        data_type: VARCHAR
        description: 회원의 결제단위가 KB카드인경우의 현금서비스한도등급코드
      - name: BC카드결제기관구분코드
        data_type: VARCHAR
        description: "회원의 결제단위가 BC카드인경우의 결제계좌 개설기관 은행구분 코드 ※이원화 회원일때만 세팅함 · 이원화회원일경우 결제단위구분에서 BC/체크/특정 중 MIN(청구번호일련번호)"
      - name: BC카드결제은행지로코드
        data_type: VARCHAR
        description: "BC카드 결제대금을 지로용지를 이용해서 납부할경우 해당결제은행의 지로코드 ※이원화 회원일때만 세팅함 · 이원화회원일경우 결제단위구분에서 BC/체크/특정 중 MIN(청구번호일련번호)"
      - name: BC카드청구지주소구분코드
        data_type: VARCHAR
        description: "BC카드의 청구지주소구분코드 로 자택, 직장, 제3청구지 등을 표현한다. ※이원화 회원일때만 세팅함 · 이원화회원일경우 결제단위구분에서 BC/체크/특정 중 MIN(청구번호)"
      - name: BC카드회수방법구분코드
        data_type: VARCHAR
        description: "회원의 결제단위가 BC카드인 경우의 결제대금 회수방법구분 ※이원화 회원일때만 세팅함 · 이원화회원일경우 결제단위구분에서 BC/체크/특정 중 MIN(청구번호)"
      - name: BC카드통합한도등급코드
        data_type: VARCHAR
        description: "BC카드계열+I1의 현금서비스를 포함한 통합한도등급코드 ※이원화 회원일때만 세팅함 이원화회원일경우 결제단위구분에서 BC/체크/특정 인 경우의 한도"
      - name: BC카드CA한도등급코드
        data_type: VARCHAR
        description: "회원의 결제단위가 BC카드인경우의 현금서비스한도등급코드 ※이원화 회원일때만 세팅함 이원화회원일경우 결제단위구분에서 BC/체크/특정 인 경우의 한도"
      - name: 통합BSS한도등급
        data_type: VARCHAR
        description: 고객의 연체정보,사용실적,외부평가정보등 통합적인 정보를 활용하여 산출한 BSS(Behavior Score System)한도등급
      - name: 카드일반특정이원화구분코드
        data_type: VARCHAR
        description: 카드의 결제단위가 일반카드/특정카드이원화 인지 통합인지 구분하는 코드 이다.
      - name: 결제다원화회원여부
        data_type: VARCHAR
        description: 결제계좌 다원화를 사용하는 회원인지 아닌지를 나타낸다.
      - name: 회원대표청구일련번호
        data_type: DECIMAL
        description: 결제계좌 다원화를 사용하는 회원의 대표청구일련번호를 나타낸다. · 결제계좌다원화일 때에만 셋팅한다.
      - name: 회원대표청구번호
        data_type: VARCHAR
        description: 결제계좌 다원화를 사용하는 회원의 대표청구번호를 나타낸다. · 결제계좌다원화일 때에만 셋팅한다.
      - name: 비계좌선불카드단독보유여부
        data_type: VARCHAR
        description: 비계좌 선불카드만을 보유하고있는지를 나타낸다. ※ 선불전자지급수단을 충전계정(결제계좌)으로 하는 선불카드(은행의 리브포켓, 당사의 머니 등)
    measures:
      - name: 유효신용카드수
        data_type: BIGINT
        description: 회원이 소지한 유효한(만료되거나 해지 하지 않은) 신용카드의 개수
        required: true
        unit: count
        aggregation: sum_at_declared_grain
      - name: 유효체크카드수
        data_type: BIGINT
        description: 회원이 소지한 유효한(만료되거나 해지 하지 않은) 채크카드의 개수
        required: true
        unit: count
        aggregation: sum_at_declared_grain
      - name: 부서사업장이용한도금액
        data_type: DECIMAL
        description: 기업체의 부서사업장 이용한도금액
        required: true
        unit: KRW
        aggregation: sum_at_declared_grain
      - name: 기업회원이용한도금액
        data_type: DECIMAL
        description: 기업회원(사업자 단위)에 부여된 이용가능한 한도금액
        required: true
        unit: KRW
        aggregation: sum_at_declared_grain
      - name: 통합한도금액
        data_type: DECIMAL
        description: "회원에 제공되는 각종 한도 중 \"통합한도등급\"으로 관리되는 한도금액"
        required: true
        unit: KRW
        aggregation: sum_at_declared_grain
      - name: CA한도금액
        data_type: DECIMAL
        description: (전문) 신용평가기관에서 제공하는 프로파일 항목으로 현금서비스한도합계금액
        required: true
        unit: KRW
        aggregation: sum_at_declared_grain
      - name: 결제단위수
        data_type: BIGINT
        description: 회원이 보유한 결제단위 개수
        required: true
        unit: count
        aggregation: sum_at_declared_grain
      - name: KB카드통합한도금액
        data_type: DECIMAL
        description: "회원의 결제단위가 신용카드를 포함한 KB카드일 경우의 통합한도금액 ※이원화 회원일때만 세팅함 · 이원화회원일경우 결제단위구분에서 KB/신용/일반 인 경우에 한도"
        required: true
        unit: KRW
        aggregation: sum_at_declared_grain
      - name: KB카드CA한도금액
        data_type: DECIMAL
        description: 회원의 결제단위가 KB카드인경우의 현금서비스한도금액
        required: true
        unit: KRW
        aggregation: sum_at_declared_grain
      - name: BC카드통합한도금액
        data_type: DECIMAL
        description: BC카드계열의 현금서비스를 포함한 통합한도금액
        required: true
        unit: KRW
        aggregation: sum_at_declared_grain
      - name: BC카드CA한도금액
        data_type: DECIMAL
        description: 회원의 결제단위가 BC카드인경우의 현금서비스한도금액 ※이원화 회원일때만 세팅함 이원화회원일경우 결제단위구분에서 BC/체크/특정 인 경우의 한도
        required: true
        unit: KRW
        aggregation: sum_at_declared_grain
      - name: ASS평점
        data_type: BIGINT
        description: 신청평점 시스템의 신용평가 결과 점수
        required: true
        unit: count
        aggregation: sum_at_declared_grain
      - name: BSS평점
        data_type: BIGINT
        description: 기존고객의 향후 부실 가능성을 예측하기 위하여 행동평점을 평가점수
        required: true
        unit: count
        aggregation: sum_at_declared_grain
      - name: 통합ASS평점
        data_type: BIGINT
        description: 고객의 신용도를 통합적으로 평가한 ASS(Application scoring system)평점
        required: true
        unit: count
        aggregation: sum_at_declared_grain
      - name: 통합BSS평점
        data_type: BIGINT
        description: 고객의 연체정보,사용실적,외부평가정보등 통합적인 정보를 활용하여 산출한 BSS(Behavior Score System)평점
        required: true
        unit: count
        aggregation: sum_at_declared_grain
    time_dimensions:
      - name: 실적기준년월일
        data_type: VARCHAR
        description: 해당 테이블의 데이터를 적재하는 기준이 되는 일자 정보로 사용되는 일자정보(기준년월일)를 나타낸다.
        format: YYYYMMDD
        role: event_date
      - name: 회원원장최초생성년월일
        data_type: VARCHAR
        description: 회원기본 원장을 최초로 생성한 년월일
        format: YYYYMMDD
        role: event_date
      - name: 회원최초신규발급년월일
        data_type: VARCHAR
        description: 회원이 최초로 카드를 신규발급한 년월일
        format: YYYYMMDD
        role: event_date
      - name: 회원신용카드만료년월일
        data_type: VARCHAR
        description: 회원별 소지한 신용카드가 모두 만료되는 최종년월일
        format: YYYYMMDD
        role: effective_to
      - name: 회원신용카드해지년월일
        data_type: VARCHAR
        description: 회원이 소지한 신용카드가 모두 해지되는 최종년월일
        format: YYYYMMDD
        role: event_date
      - name: 회원신용카드실제만료년월일
        data_type: VARCHAR
        description: 회원이 소지한 신용카드가 모두 실제만료(만료년월이 적용 되었거나 해지년월이 적용)되는 최종년월일
        format: YYYYMMDD
        role: effective_to
      - name: 회원체크카드만료년월일
        data_type: VARCHAR
        description: 회원이 소지한 체크카드가 모두 만료되는 최종년월일
        format: YYYYMMDD
        role: effective_to
      - name: 회원체크카드해지년월일
        data_type: VARCHAR
        description: 회원이 소지한 체크카드가 모두 해지되는 최종년월일
        format: YYYYMMDD
        role: event_date
      - name: 회원체크카드실제만료년월일
        data_type: VARCHAR
        description: 회원이 소지한 체크카드가 모두 실제만료(만료년월이 적용 되었거나 해지년월이 적용)되는 최종년월일
        format: YYYYMMDD
        role: effective_to
      - name: 회원전체카드만료년월일
        data_type: VARCHAR
        description: 회원이 소지한 신용카드/체크카드 등 전체 카드가 만료되는 최종년월일
        format: YYYYMMDD
        role: effective_to
      - name: 회원전체카드해지년월일
        data_type: VARCHAR
        description: 회원이 소지한 신용카드/체크카드 등 전체카드가 모두 해지되는 최종년월일
        format: YYYYMMDD
        role: event_date
      - name: 회원전체카드실제만료년월일
        data_type: VARCHAR
        description: 회원이 소지한 전체카드(신용카드/ 체크카드/신용카드+체크카드)가 모두 실제만료(만료년월이 적용 되었거나 해지년월이 적용)되는 최종년월일
        format: YYYYMMDD
        role: effective_to
      - name: 결제일변경후최초결제년월일
        data_type: VARCHAR
        description: 결제일을 변경한 이후에 최초로 청구되는 결제년월일
        format: YYYYMMDD
        role: event_date
      - name: 결제일
        data_type: VARCHAR
        description: "회원이 사용한 카드대금이 매월 결제되는 일 ※청구단위정보의 최초 청구번호에 대한 결제일을 세팅함 · 이원화회원일경우 결제단위구분에서 KB/신용/일반 중 MIN(청구번호)"
        format: DD
        role: day_of_month
      - name: BC카드결제일
        data_type: VARCHAR
        description: "BC카드 신용판매수수료 전문에서 전달받은 결제일 ※이원화 회원일때만 세팅함 · 이원화회원일경우 결제단위구분에서 BC/체크/특정 중 MIN(청구번호)"
        format: DD
        role: day_of_month
      - name: 이원화체크카드결제일
        data_type: VARCHAR
        description: 결제 이원화 (신용/체크)를 이용하는 회원에 대한 체크카드 결제일이다.
        format: DD
        role: day_of_month
      - name: 이원화특정카드결제일
        data_type: VARCHAR
        description: 결제 이원화 (일반/특정)를 용하는 회원에 대한 특정카드 결제일이다.

        format: DD
        role: day_of_month
    table_kind: master
    source_definition: "1. KB국민카드에 카드 계약이 체결되어 유지되고 있는 고객을 회원으로 관리 2. 카드 계약이 모두 해지된 이후 재가입(신규)시 고객의 회원번호는 유지된다. 위 대상에 회원의 결제단위,한도, 평점등을 추가 관리하는 엔티티 <특이사항> : ASIS의 THKBAHW00(회원기본) 의 한도가
      TBGACHD01(GAC개인신용한도기본) 의 본인한도로 전환됨,THKBAHW01(회원결제단위)의 한도가 TBGACHD01(GAC개인신용한도기본) 으로 전환됨( 결제단위구분-> 이용한도구분 : '1'->'5', '2'->'6', 'B'->'D', 'C' -> 'C') 따라서 TOBE의 TBDAAAT03(DAA회원정보기본)의
      한도세팅은 통합한도 는 개인본인한도를 세팅, KB,BC한도는 결제단위분리구분이 이원화('1':KB,BC, '2':신용,체크, '3':일반,특정) 일때만 세팅함"
    source_metadata:
      workbook_entity: 고객회원카드
      source_column_count: 72
      queryable_column_count: 71
      excluded_technical_columns: [ADW시스템최종갱신일시]
    aggregation_policy:
      deduplicate_before_aggregation: false
      aggregate_across_time: false
      default_measure_behavior: use_declared_grain
  - name: tbdaaat05
    physical_table: tbdaaat05
    korean_name: 회원카드기본
    description: "회원이 보유한 개별 카드의 기본 정보를 관리하는 테이블. 한 행은 회원의 카드 한 장(회원일련번호+카드구분키번호)을 의미한다. 상품코드·상품대/중분류·카드등급그룹·제휴코드·카드브랜드·카드소유자구분 등 카드 속성과 소유자/본인 고객 식별자를 담아, 카드 단위 발급·보유 현황과 상품/등급/브랜드별
      분석에 사용한다."
    grain: 회원일련번호 × 카드구분키번호 1건 (회원이 보유한 카드)
    primary_key: [회원일련번호, 카드구분키번호]
    synonyms: [회원카드, 카드기본, 보유카드, 카드정보]
    dimensions:
      - name: 회원일련번호
        data_type: VARCHAR
        description: 당사(KB국민카드)와 계약한 회원을 관리하는 식별번호
        synonyms: [회원번호, 회원ID]
        required: true
      - name: 카드구분키번호
        data_type: VARCHAR
        description: 회원별로 부여되는 일련번호에 카드상품 또는 계약별로 추가되는 일련번호이다. / 기본적으로 카드브랜드구분코드 + 일련번호로 구성된다.
        required: true
      - name: 개인기업구분코드
        data_type: VARCHAR
        description: 개인 또는 기업을 구분하는 코드
        value_semantics:
          '2': 기업
        value_semantics_provenance: source_definition
      - name: 카드소유자구분코드
        data_type: VARCHAR
        description: 카드 소유자 유형 (본인/가족/대표/공용/개별)
      - name: 본인카드구분키번호
        data_type: VARCHAR
        description: 가족 또는 사업자/사업장카드일 경우 본인 또는 대표에 해당하는 카드구분키번호이다.
      - name: 소유자고객식별자
        data_type: VARCHAR
        description: 소유자고객식별자를관리한다.
      - name: 소유자고객관리번호
        data_type: VARCHAR
        description: 소유자고객관리번호를관리한다.
      - name: 본인고객식별자
        data_type: VARCHAR
        description: 고객자신에 대한 식별자
      - name: 본인고객관리번호
        data_type: VARCHAR
        description: 카드에 해당하는 소유자에 따른 본인고객관리번호이다.
      - name: 최종카드식별자
        data_type: VARCHAR
        description: 카드상품에 해당하는 카드 중 재발급, 갱신시 최종카드를 나타내는 식별자이다.
      - name: 최종카드상세일련번호
        data_type: DECIMAL
        description: 연회비환급삭제의 기준이 되는 최종 발급 카드번호의 상세일련번호
      - name: 상품코드
        data_type: VARCHAR
        description: 상품대분류+상품중분류+템플릿코드별 상품에 대해 고유하게 부여한 일련번호이다
      - name: 상품대분류구분코드
        data_type: VARCHAR
        description: KB카드 전사차원에서 상품의 대분류를 구분하여 정의한 코드를 관리한다.
      - name: 상품중분류구분코드
        data_type: VARCHAR
        description: KB카드 전사차원에서 상품의 대분류 하위 중분류를 구분하여 정의한 코드를 관리한다.
      - name: 카드등급그룹코드
        data_type: VARCHAR
        description: KB카드사의 카드상품 등급에 대한 분류의 그룹핑 코드
      - name: 제휴코드
        data_type: VARCHAR
        description: 상품코드의 마지막 5자리로 정의, 상품코드를 그대로 사용함으로 별도 목록성 테이블은 관리하지 않고, 코드로 표기하고자 함
      - name: 카드브랜드구분코드
        data_type: VARCHAR
        description: "카드브랜드구분코드 1:로칼(국민) 2:마스터 3:비자 4:JCB"
      - name: KB카드BC카드구분코드
        data_type: VARCHAR
        description: KB카드와 BC카드를 구분하는코드
      - name: 카드등급구분코드
        data_type: VARCHAR
        description: 카드의 등급을 구분하는코드(일반,실버,골드,플래티늄 등)
      - name: 알파원카드여부
        data_type: VARCHAR
        description: 알파원카드로 등록된 카드인지에 대한 여부
      - name: 카드BIN번호
        data_type: VARCHAR
        description: 카드의 발급사를 구분하는 BIN 번호이다.
      - name: 구카드식별자
        data_type: VARCHAR
        description: 이전 카드에 해당하는 카드식별지이다.
      - name: 유효신용카드여부
        data_type: VARCHAR
        description: 카드가 만료년월일이 경과하지 않고 통합한도가 존재하는 유효한 신용카드인지여부
      - name: 유효체크카드여부
        data_type: VARCHAR
        description: 체크카드가 만료년월일이 경과하지 않은 유효한 체크카드인지여부
      - name: 결제정보이원화구분코드
        data_type: VARCHAR
        description: 카드 결제단위 청구방식이 통합 및 이원화하고 있는지를 구분하는 코드
      - name: 카드결제기관구분코드
        data_type: VARCHAR
        description: 카드결제계좌의 기관구분코드
      - name: 청구번호
        data_type: VARCHAR
        description: 회원일련번호+청구일련번호
      - name: 지로코드
        data_type: VARCHAR
        description: 금융결제원에서 대한민국에 소재하는 금융기관의 각 본지점에 부여하는 번호
      - name: 회수방법구분코드
        data_type: VARCHAR
        description: 결제 대금 회수방법구분코드
      - name: 청구지주소구분코드
        data_type: VARCHAR
        description: 자택, 직장,이메일 등 청구지 주소를 구분하는 코드
      - name: 카드이용한도구분코드
        data_type: VARCHAR
        description: 카드별 이용한도를 구분하는 코드
      - name: 카드당한도사용여부
        data_type: VARCHAR
        description: 카드에 해당하는 한도를 카드당 한도를 사용할지에 대한 여부
      - name: 부서사업장한도사용여부
        data_type: VARCHAR
        description: 카드에 해당하는 한도를 부서사업장한도를 사용할지에 대한 여부
      - name: 통합한도등급코드
        data_type: VARCHAR
        description: 현금서비스를 포함하여 부여한 총 한도등급코드
      - name: CA한도등급코드
        data_type: VARCHAR
        description: 단기카드대출(현금서비스)을 받을 수 있는 한도의 등급코드
      - name: 역할유형구분코드
        data_type: VARCHAR
        description: 권유자 역할 유형 코드 (배우자/직원/알바/..)
      - name: 권유자번호
        data_type: VARCHAR
        description: "회원가입신청서 작성시 권유 모집인 식별을 위해 사용하는 번호 역할구분과 모집인번호가 조합 권유자식별자 -모집인구분(역할유형구분코드) +모집인번호(모집인식별내용(M) + 모집인코드)"
      - name: 모집부점코드
        data_type: VARCHAR
        description: 신용카드, 가맹점, 자동납부 신청을 모집한 부점코드
      - name: 입력부점코드
        data_type: VARCHAR
        description: 입력을 발생 시킨 부점코드
      - name: 관리부점코드
        data_type: VARCHAR
        description: 고객이나 채권,가맹점 등을 관리하는 부점코드
      - name: 리볼빙대상여부
        data_type: VARCHAR
        description: 회원 카드상품별 리볼빙 대상인지를 판단하는 여부이다.
      - name: 교체카드여부
        data_type: VARCHAR
        description: 카드 만료일이 되어서 갱신된 경우와 분실/도난으로 카드를 교체한 여부이다.
      - name: 카드등급변경여부
        data_type: VARCHAR
        description: 카드 재발급 또는 갱신시 카드등급을 변경하여 받은 여부이다.
      - name: 갱신카드여부
        data_type: VARCHAR
        description: 카드 만료일에 갱신발급 받은 여부이다.
      - name: 카드우선발급여부
        data_type: VARCHAR
        description: 카드 제작시 우선(긴급) 발급을 하기 위한 여부이다.
      - name: 모바일카드여부
        data_type: VARCHAR
        description: 카드상품이 모바일카드인지를 판단하는 여부이다.
      - name: 자동갱신비대상사유구분코드
        data_type: VARCHAR
        description: 카드 자동갱신 대상에서 제외된 사유를 구분하는 코드
      - name: 카드정보변경유형일련번호
        data_type: VARCHAR
        description: "카드의 정보변경 내용을 구분하는 카드처리유형구분코드(발급비청구, 비밀번호변경, 사용등록, 카드해지 등)중 카드해지에 대한 상세사유이다. (03:연회비관련 불만,04:당행카드2개이상소지,11:거래정지관련 불만 등등)"
      - name: BC카드관리구분코드
        data_type: VARCHAR
        description: 동남카드/비씨카드 를 구분하는 코드
      - name: 제휴관리번호
        data_type: VARCHAR
        description: 제휴사에서 관리를 원할하게 하기 위해 고객에게 제공한 관리번호이다.(아시아나항공, GS번호, 대한항공, ABC번호 등...)
      - name: 신청서접수번호
        data_type: VARCHAR
        description: "카드(개인,기업),한도(개인,기업),가맹점,장기카드대출 신청서 접수단위로 부여되는 번호 / 각 업무별 용어사용 예시 -카드신청서접수번호 -한도신청서접수번호 -가맹점신청서접수번호 -카드론신청서접수번호"
      - name: 신청서접수대상여부
        data_type: VARCHAR
        description: 카드신청시 신청서로 들어온 대상인지를 판단하는 여부이다.
      - name: 카드신청서이미지저장여부
        data_type: VARCHAR
        description: 카드신청서를 이미지로 저장되어 있는지 여부
      - name: 카드거래매체구분코드
        data_type: VARCHAR
        description: 거래 매체별 종류
      - name: 교부유형구분코드
        data_type: VARCHAR
        description: 카드 교부방법 종류 (인편/우편/지점방문/등등)
      - name: 발급유형구분시기구분코드
        data_type: VARCHAR
        description: 카드가 발급된 유형및 시기를 분류한 구분코드(선발급,즉시발급,일괄발급 등)
      - name: 발급유형구분코드
        data_type: VARCHAR
        description: 카드의 발급유형을 구분하는 코드(신규발급,재발급 등)
      - name: 카드도난분실발급여부
        data_type: VARCHAR
        description: 카드를 도난 분실시 거래정지를 등록하고 재발급 받은 여부이다.
      - name: 유선발급구분코드
        data_type: VARCHAR
        description: 카드 유선 발급 구분 (임시/재발급/교체..)
      - name: 발송기관구분코드
        data_type: VARCHAR
        description: 회원에게 카드를 발송해주는 기관구분코드
      - name: 수령지주소구분코드
        data_type: VARCHAR
        description: 자택, 직장, 제3청구지 등 카드 수령시 수령지 주소를 구분하는 코드
      - name: 카드교부희망부점코드
        data_type: VARCHAR
        description: 카드 교부시 고객이 희망(요청)하는 부점코드
      - name: 카드실물보유부점코드
        data_type: VARCHAR
        description: 카드를 실물 부유하고 있는 영업점부점코드이다.
      - name: 실물보유구분코드
        data_type: VARCHAR
        description: 실물 카드 보유/미보유 구분
      - name: CD기기능구분코드
        data_type: VARCHAR
        description: CD기능 연결 계좌를 구분하는 코드 (결제계좌/별도계좌)
      - name: CD상태구분코드
        data_type: VARCHAR
        description: CD기능 등록/해지 상태 구분코드
      - name: 카드신용체크이원화구분코드
        data_type: VARCHAR
        description: 카드의 결제단위가 신용카드/체크카드이원화 인지 통합인지 구분하는코드
      - name: 카드일반특정이원화구분코드
        data_type: VARCHAR
        description: 카드의 결제단위가 일반카드/특정카드이원화 인지 통합인지 구분하는 코드 이다.
      - name: 결제다원화카드여부
        data_type: VARCHAR
        description: 결제계좌 다원화를 이용하는 회원에 대한 카드 여부를 나타낸다.
      - name: 고객선택자재구분코드
        data_type: VARCHAR
        description: 카드를 신청시 고객이 선택한 상품의 제휴코드이다. (자재구분코드)
      - name: 비계좌선불카드여부
        data_type: VARCHAR
        description: 비계좌 선불카드 여부 인지를 나타낸다. ※ 선불전자지급수단을 충전계정(결제계좌)으로 하는 선불카드 (은행의 리브포켓, 당사의 머니 등)
      - name: 유효비계좌선불카드여부
        data_type: VARCHAR
        description: 해당 카드가 유효한 선불방식 체크카드인지를 나타낸다.
    measures:
      - name: 기업카드신용한도금액
        data_type: DECIMAL
        description: 기업(법인, 사업자, 사업장)카드의 카드별로 부여된 신용한도 금액을 의미한다.
        required: true
        unit: KRW
        aggregation: sum_at_declared_grain
      - name: 카드반송회차
        data_type: BIGINT
        description: 카드를 발송하고 다양한 사유에 의해 반송된 회차이다.
        required: true
        unit: count
        aggregation: sum_at_declared_grain
    time_dimensions:
      - name: 실적기준년월일
        data_type: VARCHAR
        description: 해당 테이블의 데이터를 적재하는 기준이 되는 일자 정보로 사용되는 일자정보(기준년월일)를 나타낸다.
        format: YYYYMMDD
        role: event_date
      - name: 결제일
        data_type: VARCHAR
        description: 회원이 사용한 카드대금이 매월 결제되는 일
        format: DD
        role: day_of_month
      - name: 카드신규발급년월일
        data_type: VARCHAR
        description: 카드가 신규로 발급된 일자이다.
        format: YYYYMMDD
        role: event_date
      - name: 최종카드발급년월일
        data_type: VARCHAR
        description: 상품에 해당하는 카드가 최종 카드발급 접수된 일자이다.
        format: YYYYMMDD
        role: event_date
      - name: 등록년월일
        data_type: VARCHAR
        description: 해당테이블에 데이터가 등록된 년월일
        format: YYYYMMDD
        role: event_date
      - name: 카드만료년월일
        data_type: VARCHAR
        description: 카드 유효기간의 종료일
        format: YYYYMMDD
        role: effective_to
      - name: 이전카드만료년월일
        data_type: VARCHAR
        description: 카드가 해지및 갱신으로인해 만료년월이 변경될경우 변경되기 이전의 만료년월일을 말함
        format: YYYYMMDD
        role: effective_to
      - name: 실제카드만료년월일
        data_type: VARCHAR
        description: 카드가 실제만료(만료년월이 적용 되었거나 해지년월이 적용)되는 최종년월일
        format: YYYYMMDD
        role: effective_to
      - name: 해지년월일
        data_type: VARCHAR
        description: 회원의 카드가 해지된 년월일
        format: YYYYMMDD
        role: event_date
      - name: 신청서접수년월일
        data_type: VARCHAR
        description: 카드신청 또는 카드한도의 신청서 정보를 접수 처리(온라인,배치)한 일자
        format: YYYYMMDD
        role: event_date
      - name: 카드교부년월일
        data_type: VARCHAR
        description: 해당카드를 발급받고 영업점에서 교부한 일자이다.
        format: YYYYMMDD
        role: event_date
      - name: 카드반송년월일
        data_type: VARCHAR
        description: 고객이 카드 실물을 반송한 일자이다.

        format: YYYYMMDD
        role: event_date
    table_kind: master
    source_definition: "1. 상품처리계 GAG카드기본(TBGAGCD01) 전체대상 기준으로 카드결제단위,결제계좌정보,상품정보등의 추가정보를 추출하여 관리하는 엔티티 <특이사항> (1) 결제단위 관련항목의 관리기준변경 :ASIS 는 제휴체크카드의 경우에 회원이 여러업체(우체국,증권,농협은행등)의 카드를 가지고있어도
      하나의 청구로 관리되었는데 TOBE는 제휴업체별로 청구가 분리됨에 따라 그에 해당되는 결제단위의 값이 분리됨 ( ※ 관련항목 : 청구번호, 회수방법구분코드, 결제기관구분코드,지로코드,계좌번호 등등) (2) 한도관련 관리기준변경 : ASIS 의 THKBACD00(신용카드기본) 에 있는 한도중 '3'(기업카드별)한도만
      TOBE의 TBGACHD02(GAC기업신용한도기본) 로 이관되었고 THKBAHD00(가족회원한도기본) 가 TBGACHD01(GAC개인신용한도기본) 으로 이관되었음 따라서 TOBE의 TBDAAAT05(DAA카드정보기본) 에서 한도 세팅은 카드별,가족한도일경우만 세팅됨"
    source_metadata:
      workbook_entity: 고객회원카드
      source_column_count: 87
      queryable_column_count: 86
      excluded_technical_columns: [ADW시스템최종갱신일시]
    aggregation_policy:
      deduplicate_before_aggregation: false
      aggregate_across_time: false
      default_measure_behavior: use_declared_grain
  - name: tbdaaat18
    physical_table: tbdaaat18
    korean_name: 고객회원카드 (고객암호화정보)
    description: "DAA고객정보기본을 대상으로 고객명·연락처·주소·계좌번호 등 암호화된 고객정보를 적재·관리하는 테이블. 신규고객 생성 시 적재되고 주소·연락처·결제 관련 사항이 변경될 때 갱신되며 삭제는 발생하지 않는다."
    semantic_visibility: restricted
    restriction_reason: "주민등록번호·연락처·상세주소·계좌번호 등 직접 식별정보를 포함하므로 일반 Text2SQL 후보와 LLM prompt에서 제외한다. 별도 권한·마스킹 정책이 있는 전용 흐름에서만 사용한다."
    grain: 고객식별자 × 고객관리번호 1건 (암호화 고객정보 현재 상태)
    primary_key: [고객식별자, 고객관리번호]
    synonyms: [고객암호화정보, 고객회원카드, 고객주소, 연락처, 고객컨택, 고객상세]
    dimensions:
      - name: 고객식별자
        data_type: VARCHAR
        physical_data_type: VARCHAR2(10)
        description: KB카드의 고객에게 부여하는 10자리 번호체계로 각 고객을 고유하게 식별할 수 있음
        synonyms: [고객ID, 고객번호]
        required: true
      - name: 고객관리번호
        data_type: VARCHAR
        physical_data_type: VARCHAR2(5)
        description: 고객식별자의 하위 5자리 번호체계
        required: true
      - name: 회원일련번호
        data_type: VARCHAR
        physical_data_type: VARCHAR2(8)
        description: 당사(KB국민카드)와 계약한 회원을 관리하는 식별번호
        synonyms: [회원번호, 회원ID]
      - name: 고객고유번호평문길이
        data_type: BIGINT
        physical_data_type: NUMBER(3)
        description: 고객고유번호의 암호화 되기 전 평문 자리수를 의미
        required: true
        default: 0
      - name: 고객고유번호
        data_type: VARCHAR
        physical_data_type: VARCHAR2(48)
        description: 고객을 식별할 수 있는 고유번호 (주민등록번호,운전면허번호,외국인등록번호,사업자등록번호 등)
      - name: 주민등록번호
        data_type: VARCHAR
        physical_data_type: VARCHAR2(24)
        description: 개인 고객식별정보 (주민등록번호)
      - name: 주민사업자등록번호
        data_type: VARCHAR
        physical_data_type: VARCHAR2(24)
        description: 개인인 경우 주민등록번호, 사업자인 경우 사업자등록번호
      - name: 고객명
        data_type: VARCHAR
        physical_data_type: VARCHAR2(88)
        description: 고객의 성명을 관리한다.
      - name: 영문고객명
        data_type: VARCHAR
        physical_data_type: VARCHAR2(88)
        description: 고객의 영문명칭을 관리
      - name: 세대주명
        data_type: VARCHAR
        physical_data_type: VARCHAR2(88)
        description: 고객의 세대주 성명
      - name: 고객전자주소
        data_type: VARCHAR
        physical_data_type: VARCHAR2(176)
        description: 고객의 이메일주소, 홈페이지 주소 등
      - name: 휴대폰번호
        data_type: VARCHAR
        physical_data_type: VARCHAR2(48)
        description: 고객의 휴대폰번호
      - name: 고객대표전화지역번호
        data_type: VARCHAR
        physical_data_type: VARCHAR2(24)
        description: 고객의 대표 전화지역번호 (자택 또는 직장의 전화지역번호)
      - name: 고객대표전화번호
        data_type: VARCHAR
        physical_data_type: VARCHAR2(48)
        description: 고객의 대표 전화번호 (자택 또는 직장의 전화번호)
      - name: 고객자택전화번호
        data_type: VARCHAR
        physical_data_type: VARCHAR2(48)
        description: 고객의 자택 전화번호를 관리한다.
      - name: 고객직장전화번호
        data_type: VARCHAR
        physical_data_type: VARCHAR2(48)
        description: 고객이 근무하는 직장의 전화번호를 관리한다.
      - name: 자택상세주소
        data_type: VARCHAR
        physical_data_type: VARCHAR2(216)
        description: 고객의 자택주소의 우편번호에 해당하는 주소를 제외한 주소이다.
      - name: 직장상세주소
        data_type: VARCHAR
        physical_data_type: VARCHAR2(216)
        description: 고객의 직장 우편번호에 해당하는 상세주소
      - name: 고객대표상세주소
        data_type: VARCHAR
        physical_data_type: VARCHAR2(216)
        description: 고객의 대표 상세주소(자택 또는 직장의 상세주소)
      - name: 계좌번호
        data_type: VARCHAR
        physical_data_type: VARCHAR2(48)
        description: 은행 등에서 저축이나 대출 상황 등을 기록하고 관리하기 위해 고객에게 부여하는 식별번호
      - name: BC카드결제계좌번호
        data_type: VARCHAR
        physical_data_type: VARCHAR2(48)
        description: BC카드대급 납부를 위한 은행의 결제계좌번호를 관리한다
    time_dimensions:
      - name: 실적기준년월일
        data_type: VARCHAR
        physical_data_type: VARCHAR2(8)
        description: 해당 테이블의 데이터를 적재하는 기준이 되는 일자 정보로 사용되는 일자정보(기준년월일)를 나타낸다.
        format: YYYYMMDD
        role: snapshot_date
    table_kind: restricted_current_state
    data_classification: restricted_personal_information
    restricted_columns:
      - 고객고유번호
      - 주민등록번호
      - 주민사업자등록번호
      - 고객명
      - 영문고객명
      - 세대주명
      - 고객전자주소
      - 휴대폰번호
      - 고객대표전화지역번호
      - 고객대표전화번호
      - 고객자택전화번호
      - 고객직장전화번호
      - 자택상세주소
      - 직장상세주소
      - 고객대표상세주소
      - 계좌번호
      - BC카드결제계좌번호
    source_definition: "DAA고객정보기본을 대상으로 고객명·연락처·주소·계좌번호 등 암호화 관련 정보를 적재·관리한다. 신규고객 생성 시 신규 적재하고, 주소·연락처·결제 관련 사항 변동 시 변경 적재하며, 삭제는 발생하지 않는다."
    entity_occurrence_rules:
      insert: 신규고객 생성 시 적재
      update: 주소·연락처·결제 관련 사항 등 변동 시 적재
      delete: 해당 없음
    source_metadata:
      workbook_entity: 고객회원카드 (고객암호화정보)
      validation_entity: DAA고객암호화정보기본
      validation_source: 예시.xlsx
      source_column_count: 23
      queryable_column_count: 22
      excluded_technical_columns: [ADW시스템최종갱신일시]
    aggregation_policy:
