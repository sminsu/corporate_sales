  - name: tbdccam02
    physical_table: tbdccam02
    korean_name: 회원거래정지월집계
    description: "회원 거래정지 실적을 월 시점으로 집계한 테이블. 한 행은 특정 기준년월 시점의 하나의 거래정지 건을 의미한다. 카드거래정지사유·거래정지코드(명)·연체거래정지 여부·거래정지 등재년월일을 담아, 월별 거래정지 추이 분석에 사용한다."
    grain: 기준년월 × 기준년월일 × 고객 × 거래정지일련번호 1건
    primary_key: [기준년월, 기준년월일, 고객식별자, 고객관리번호, 거래정지일련번호]
    synonyms: [거래정지집계, 월거래정지, 거래정지현황]
    dimensions:
      - name: 고객식별자
        data_type: VARCHAR
        description: KB카드의 고객에게 부여하는 10자리 번호체계로 각 고객을 고유하게 식별할 수 있음
        synonyms: [고객ID, 고객번호]
        required: true
      - name: 고객관리번호
        data_type: VARCHAR
        description: 고객식별자의 하위 5자리 번호체계
        required: true
      - name: 거래정지일련번호
        data_type: DECIMAL
        description: 거래정지 정보를 관리하기 위해 부여한 일련번호
        required: true
      - name: 카드거래정지사유구분코드
        data_type: VARCHAR
        description: 카드거래 정지의 사유를 관리하기 위한 코드이다.
      - name: 회원일련번호
        data_type: VARCHAR
        description: 당사(KB국민카드)와 계약한 회원을 관리하는 식별번호
        synonyms: [회원번호, 회원ID]
      - name: 거래정지코드
        data_type: VARCHAR
        description: 거래정지를 구분한 코드로 본원장은 회원에 대한 거래정지코드를 의미한다.
      - name: 거래정지코드명
        data_type: VARCHAR
        description: 거래정지 코드에 대한 정의 정보를 관리한다.
      - name: 연체거래정지여부
        data_type: VARCHAR
        description: "거래정지 회원 중 연체로 인한 거래정지 회원인지에 대한 여부 (※025:이용대금연체, 026:여신연체, 058:개인/기업간연체, 072:소액연체, 074:KCB/KED타사연체)"
    time_dimensions:
      - name: 기준년월
        data_type: VARCHAR
        description: 회원거래정지 실적을 집계하기 위해 적용하는 일자정보(기준년월)로 해당 시점의 회원거래정지에 대한 상태를 집계하는 기준이 된다.
        synonyms: [년월, 월, 기준월]
        required: true
        format: YYYYMM
        role: snapshot_month
      - name: 기준년월일
        data_type: VARCHAR
        description: 회원거래정지 실적을 집계하기 위해 적용하는 일자정보(기준년월일)이며 기준년월에 적재되는 일자시점을 관리한다.
        synonyms: [기준일, 일자, 날짜]
        required: true
        format: YYYYMMDD
        role: snapshot_date
      - name: 거래정지등재년월일
        data_type: VARCHAR
        description: 거래정지를 등재한 년월일을 관리하는 원천단의 시스템일자정보를 관리한다.

        format: YYYYMMDD
        role: event_date
    table_kind: monthly_snapshot
    source_definition: 1.DCC회원거래정지기본(TBDCCAD02)의 월말일시점 데이터를 생성 관리한다.
    source_metadata:
      workbook_entity: 대시보드(월회원거래정지기본)
      source_column_count: 14
      queryable_column_count: 11
      excluded_technical_columns: [시스템최종갱신일시, 시스템최종갱신식별자, 시스템최종거래일시]
    primary_time_dimension: 기준년월
    aggregation_policy:
      deduplicate_before_aggregation: true
      aggregate_across_time: flow_measures_only
      default_measure_behavior: semi_additive_latest_snapshot
  - name: tbmaisd06
    physical_table: tbmaisd06
    korean_name: 특수채권
    description: "부실채권(특수채권) 편입 내역을 관리하는 테이블. 한 행은 하나의 특수채권 편입 건을 의미한다. 특수채권 편입 기준년월일, 최초/현재 연체발생년월일·연체회차, 특수채권 편입 원금·수수료·이자·연체료 등을 담아 부실채권·상각채권 분석에 사용한다."
    grain: 기준년 × 특수채권관리번호 × 고객 1건 (특수채권 편입 건)
    primary_key: [기준년, 특수채권관리번호, 고객식별자, 고객관리번호]
    synonyms: [특수채권, 부실채권, 상각채권, 악성채권]
