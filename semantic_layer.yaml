        description: MFX월고객정보기본시점정보의고객 직장주소 대량배송처별 우편일련번호
      - name: 직장도로명우편번호
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의고객 직장 주소 중 도로명 우편번호를 정의한다.
      - name: 직장도로명우편읍면번호
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의고객 주소 중 직장의 도로명 우편 읍면번호를 정의한다.
      - name: 직장도로명우편보조번호
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의고객 직장주소 도로명우편보조번호
      - name: 직장도로명구역번호
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의고객 직장주소 도로명구역번호
      - name: 직장도로명건물본번호
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의고객 직장주소 도로명건물본번호
      - name: 직장도로명건물부번호
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의고객 직장주소 도로명건물부번호
      - name: 직장도로명지하구분코드
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의직장 위치의 지하구분코드 (지상, 지하, 공중인지 구분)
      - name: 고객대표주소표시구분코드
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의고객의 대표 주소표시구분코드(자택 또는 직장의 주소표시구분코드)
      - name: 고객대표주소사용가능여부
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의고객의 대표주소(자택 또는 직장주소)가 정상적으로 사용 가능한지 여부를 관리
      - name: 고객대표우편번호
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의고객의 대표 우편번호(자택 또는 직장의 우편번호)
      - name: 고객대표우편일련번호
        data_type: DECIMAL
        description: MFX월고객정보기본시점정보의고객의 대표 우편일련번호(자택 또는 직장의 우편일련번호)
      - name: 고객대표도로명우편번호
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의고객의 대표 도로명우편번호(자택 또는 직장의 도로명우편번호)
      - name: 고객대표도로명우편읍면번호
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의고객의 대표 도로명우편읍면번호(자택 또는 직장의 도로명우편읍면번호)
      - name: 고객대표도로명우편보조번호
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의고객의 대표 도로명우편보조번호(자택 또는 직장의 도로명우편보조번호)
      - name: 고객대표도로명구역번호
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의고객의 대표 도로명구역번호(자택 또는 직장의 도로명구역번호)
      - name: 고객대표도로명건물본번호
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의고객의 대표 도로명건물본번호(자택 또는 직장의 도로명건물본번호)
      - name: 고객대표도로명건물부번호
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의고객의 대표 도로명건물부번호(자택 또는 직장의 도로명건물부번호)
      - name: 고객대표도로명지하구분코드
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의고객의 대표 도로명지하구분코드(자택 또는 직장의 도로명지하구분코드)
      - name: 이용권유전화동의구분코드
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의카드사에서 제공하는 서비스나 제휴혜택등을 전화로 받는데 동의하는지에 대한 여부를 구분코드로 정의한다.
      - name: 이용권유서면동의구분코드
        data_type: VARCHAR
        description: "MFX월고객정보기본시점정보의카드사에서 제공하는 서비스나 제휴혜택등의 이용권유를 서면(우편)으로 받는데 동의하는지에 대한 여부를 구분코드로 정의한다."
      - name: 이용권유이메일동의구분코드
        data_type: VARCHAR
        description: "MFX월고객정보기본시점정보의카드사에서 제공하는 서비스나 제휴혜택등의 이용권유를 전자우편(이메일)으로 받는데 동의하는지에 대한 여부를 구분코드로 정의한다."
      - name: 이용권유SMS동의구분코드
        data_type: VARCHAR
        description: "MFX월고객정보기본시점정보의카드사에서 제공하는 서비스나 제휴혜택등의 이용권유를 SMS(문자)로 받는데 동의하는지에 대한 여부를 구분코드로 정의한다."
      - name: 카드이용권유동의구분코드
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의카드 이용 권유에 대한 동의 구분코드를 나타낸다.
      - name: 마케팅활용동의구분코드
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의고객의 정보를 마케팅 활동에 동의했는지를 구분코드로 관리
      - name: 그룹사정보제공동의구분코드
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의고객의 정보를 KB그룹사에 제공하는것에 대한 동의여부를 구분코드로 정의한다.
      - name: 비계좌선불카드단독보유여부
        data_type: VARCHAR
        description: "MFX월고객정보기본시점정보의 비계좌 선불카드만을 보유하고 있는지를 나타낸다.※ 선불전자지급수단을 충전계정(결제계좌)으로 하는 선불카드(은행의 리브포켓, 당사의 머니 등)"
      - name: 외국인여부
        data_type: VARCHAR
        description: 고객이 외국인인지에 대한 내용을 관리한다.
    measures:
      - name: 월소득금액
        data_type: DECIMAL
        description: 고객의 월소득금액
        required: true
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 자택발송물반송횟수
        data_type: BIGINT
        description: MFX월고객정보기본시점정보의자택에 발송물이 반송된 횟수를 관리
        required: true
        unit: count
        aggregation: semi_additive_latest_snapshot
      - name: 직장발송물반송횟수
        data_type: BIGINT
        description: MFX월고객정보기본시점정보의직장에 발송물이 반송된 횟수를 관리
        required: true
        unit: count
        aggregation: semi_additive_latest_snapshot
    time_dimensions:
      - name: 기준년월
        data_type: VARCHAR
        description: "MFX월고객정보기본시점정보의고객정보기본 테이블의 월 스냅샷을 생성하기 위해 사용하는 일자 정보로 해당 기준년월의 말일자 시점의 데이터를 보관한다."
        synonyms: [년월, 월, 기준월]
        required: true
        format: YYYYMM
        role: snapshot_month
      - name: 등록년월일
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의해당테이블에 데이터가 등록된 년월일
        format: YYYYMMDD
        role: event_date
      - name: 최초등록년월일
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의국민카드에 고객으로 처음 등록한 일자(년월일)
        format: YYYYMMDD
        role: event_date
      - name: 사망년월일
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의 사망한 기준이 되는 년/월/일이다
        format: YYYYMMDD
        role: event_date
      - name: 사망해제년월일
        data_type: VARCHAR
        description: MFX월고객정보기본시점정보의사망으로 등록된이후 사망 상태가 해제된 년월일
        format: YYYYMMDD
        role: effective_to
      - name: 기념년월일
        data_type: VARCHAR
        description: 생일,기일,결혼기념일 등의 고객별 기념일을 년월일로 관리
        format: YYYYMMDD
        role: event_date
      - name: 결혼기념년월일
        data_type: VARCHAR
        description: 고객의 결혼기념에 해당하는 일자이다.

        format: YYYYMMDD
        role: event_date
    table_kind: monthly_snapshot
    source_definition: 1. DAA일고객정보기본시점정보 의 매월말 자료를 적재하는 스냅샷 정보 엔티티
    source_metadata:
      workbook_entity: 고객(월고객정보기본시점정보)
      source_column_count: 107
      queryable_column_count: 106
      excluded_technical_columns: [ADW시스템최종갱신일시]
    primary_time_dimension: 기준년월
    aggregation_policy:
      deduplicate_before_aggregation: true
      aggregate_across_time: flow_measures_only
      default_measure_behavior: semi_additive_latest_snapshot
      snapshot_deduplication:
        target_grain: 기준년월 × 고객식별자
        partition_by: [기준년월, 고객식별자]
        source_grain: 기준년월 × 고객식별자 × 고객관리번호
        consistency_guard: COUNT(DISTINCT "기업규모구분코드") = 1
        canonical_value: MAX("기업규모구분코드")
        keep: 기업규모구분코드가 고객×월 내에서 하나로 일치하는 행만 1건으로 축소
  - name: tmdaa3e16
    physical_table: tmdaa3e16
    korean_name: 카드월실적
    description: "카드의 월별 통합 실적을 집계하는 대형 팩트 테이블. 한 행은 특정 기준년월에 발생한 하나의 카드 실적을 의미한다. 이용금액·이용건수·연체원금·한도·평점(ASS/BSS) 등 카드 단위의 월별 성과·리스크 지표를 광범위하게 담아, 카드별 월 이용·연체·한도 분석에 사용한다."
    grain: 기준년월 × 회원일련번호 × 카드구분키번호 1건 (카드 월 통합 실적)
    primary_key: [기준년월, 회원일련번호, 카드구분키번호]
    synonyms: [카드실적, 카드월별실적, 카드월, 카드이용실적]
    dimensions:
      - name: 회원일련번호
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 당사(KB국민카드)와 계약한 회원을 관리하는 식별번호
        synonyms: [회원번호, 회원ID]
        required: true
      - name: 카드구분키번호
        data_type: VARCHAR
        description: "MFX월카드통합실적집계의 회원별로 부여되는 일련번호에 카드상품 또는 계약별로 추가되는 일련번호이다.2. 기본적으로 카드브랜드구분코드 + 일련번호로 구성된다."
        required: true
      - name: 카드식별자
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 KB카드에서 발급하는 카드의 카드번호를 대체하여 식별하기 위한 중복되지 않는 값
      - name: 카드BIN번호
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드의 발급사를 구분하는 BIN번호이다.
      - name: 고객식별자
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 KB카드의 고객에게 부여하는 10자리 번호체계로 각 고객을 고유하게 식별할 수 있음
        synonyms: [고객ID, 고객번호]
      - name: 고객관리번호
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 고객식별자의 하위 5자리 번호체계
      - name: 카드소유자구분코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드 소유자 유형(본인/가족/대표/공용/개별)
      - name: 개인기업구분코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 개인 또는 기업을 구분하는 코드
      - name: 본인카드구분키번호
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 가족 또는 사업자/사업장카드일 경우 본인 또는 대표에 해당하는 카드구분키번호이다.
      - name: 본인고객식별자
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 고객자신에 대한 식별자
      - name: 본인고객관리번호
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드에 해당하는 소유자에 따른 본인고객관리번호이다.
      - name: 카드브랜드구분코드
        data_type: VARCHAR
        description: "MFX월카드통합실적집계의 카드브랜드구분코드1:로칼(국민)2:마스터3:비자4:JCB"
      - name: 카드등급구분코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 카드의 등급을 관리하는 구분코드
      - name: 상품중분류구분코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 KB카드 전사차원에서 상품의 대분류 하위 중분류를 구분하여 정의한 코드를 관리한다.
      - name: 카드등급그룹코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 KB카드사의 카드상품 등급에 대한 분류의 그룹핑 코드
      - name: 상품코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 상품대분류+상품중분류+템플릿코드별 상품에 대해 고유하게 부여한 일련번호이다
      - name: 제휴관리번호
        data_type: VARCHAR
        description: "MFX월카드통합실적집계의 제휴사에서 관리를 원할하게 하기 위해 고객에게 제공한 관리번호이다.(아시아나항공, GS번호, 대한항공, ABC번호 등...)"
      - name: 관리부점코드
        data_type: VARCHAR
