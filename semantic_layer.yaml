        unit: KRW
        aggregation: sum_at_declared_grain
      - name: 부서잔여한도금액
        data_type: DECIMAL
        description: 기업고객의 부서별 이용한도 잔여금액
        unit: KRW
        aggregation: sum_at_declared_grain
      - name: 기업총한도금액
        data_type: DECIMAL
        description: 해당 기업의 법인카드 총 이용한도 금액
        unit: KRW
        aggregation: sum_at_declared_grain
