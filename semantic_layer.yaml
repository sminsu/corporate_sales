# =============================================================================
# Text2SQL Semantic Layer - KB카드 법인영업 시스템
# =============================================================================
# Source of truth:
#   - 테이블 내용 예시_001.xlsx: 30개 물리 테이블의 엔티티/컬럼 정의
#   - 예시.xlsx: tbdaaat18 교차 검증 + tmdaa1d12 월 스냅샷 79개 컬럼 정의
#   - athena_text2sql_reference.xlsx: 9개 기본 + 3개 추가 질의 의도
#   - 상세 컬럼 예시/*.xlsx: 고객·부점 분류 컬럼 8종의 검증된 코드값·코드명
#
# Runtime contract:
#   - tables: SQL 검증용 전체 business 컬럼 + grain/time/aggregation semantics
#   - canonical_domains / semantic_entities / canonical_metrics: routing·metric SSOT
#   - semantic_query_contracts: 지표·대상·기간·grain을 조합하는 일반 질의 계약
#   - semantic_join_graph.safe_paths: JOIN SSOT
#   - sql_generation_contract: 소형 모델용 Athena 규칙
#   - query_references: 원문 질의 lineage와 external verified query 연결
#
# Legacy metrics/relationships/inline verified_queries와 name=expr 중복은 제거했다.
# 시스템·감사 컬럼은 source_metadata.excluded_technical_columns에 추적한다.
# =============================================================================

semantic_layer_metadata:
  version: "2026-08-04.3"
  sql_dialect: athena_engine_v3
  target_models: [gemma4, gpt-oss]
  sources:
    - file: "테이블 내용 예시_001.xlsx"
      role: "30개 물리 테이블의 2,061개 컬럼 타입·키·필수여부·정의와 엔티티 정의"
    - file: "예시.xlsx"
      role: "기존 tbdaaat18 정의 교차 검증과 tmdaa1d12 월 기업고객 스냅샷 79개 컬럼 타입·키·필수여부·정의"
    - file: "athena_text2sql_reference.xlsx"
      role: "기본 9개와 추가 3개 Text2SQL 의도·참고 SQL 및 source lineage"
    - file: "상세 컬럼 예시/직업유형구분코드.xlsx"
      role: "직업유형구분코드의 유효값·유효값명·유효기간"
    - file: "상세 컬럼 예시/주식상장비상장구분코드.xlsx"
      role: "주식상장비상장구분코드의 유효값·유효값명·유효기간"
    - file: "상세 컬럼 예시/업종구분코드.xlsx"
      role: "고객 업종구분코드의 유효값·유효값명·유효기간"
    - file: "상세 컬럼 예시/본사구분코드.xlsx"
      role: "고객 본점·지점 구분코드의 유효값·유효값명·유효기간"
    - file: "상세 컬럼 예시/기업형태구분코드.xlsx"
      role: "기업형태구분코드의 유효값·유효값명·유효기간"
    - file: "상세 컬럼 예시/부점구분코드.xlsx"
      role: "부점구분코드의 유효값·유효값명·유효기간"
    - file: "상세 컬럼 예시/점포유형구분코드.xlsx"
      role: "부점 점포유형구분코드의 유효값·유효값명·유효기간"
    - file: "상세 컬럼 예시/지주회사구분코드.xlsx"
      role: "부점 소속 KB 계열사 구분코드의 유효값·유효값명·유효기간"
  source_limitations:
    - "테이블 문서는 실제 데이터 예시행이 아니라 메타데이터 정의서이므로 값 분포·유일성·코드 빈도는 Athena 프로파일링 전 확정하지 않는다."
    - "문서의 FK 표시는 전부 비어 있어 join cardinality는 grain과 컬럼 정의로 추론했으며 운영 데이터로 검증해야 한다."
    - "참고 SQL의 미등록 테이블명·컬럼명·스마트 따옴표·조건 우선순위 오류는 문서화된 실제 스키마 기준으로 교정한다."

# =============================================================================
# 1. TABLES - 테이블 및 컬럼 정의
# =============================================================================
  source_inventory:
    physical_tables: 31
    logical_relations: 0
    source_columns: 2140
    queryable_business_columns: 2068
    excluded_technical_columns: 72
tables:
  - name: tbdaa1d12
    physical_table: tbdaa1d12
    korean_name: 기업고객일별기본
    description: "기업(법인)고객의 일자별 기본 정보 스냅샷 테이블. 한 행은 특정 기준년월일에 관측된 하나의 기업고객을 의미한다. 기업명·사업자등록번호·법인등록번호 등 기업 식별정보와 대표자 정보, 그룹등급(MVP/우수 등), 한도금액, 카드/체크 보유 여부, 연체·부실 여부 등 기업 신용·여신 관련 핵심 속성을
      담고 있어 기업고객 현황 분석의 기준 테이블로 사용한다."
    grain: 기준년월일 × 고객식별자 1건 (기업고객 일별 스냅샷)
    primary_key: [기준년월일, 고객식별자]
    synonyms: [기업고객, 법인고객, 기업고객기본, 고객기본]
    dimensions:
      - name: 고객식별자
        data_type: VARCHAR
        description: KB카드의 고객에게 부여하는 10자리 번호체계로 각 고객을 고유하게 식별할 수 있음
        synonyms: [고객ID, 고객번호]
        required: true
      - name: 고객고유번호
        data_type: VARCHAR
        description: 고객을 식별할 수 있는 고유번호 (주민등록번호,운전면허번호,외국인등록번호,사업자등록번호 등)
      - name: 고객고유번호구분코드
        data_type: VARCHAR
        description: 고객고유번호 구분 (주민등록번호, 법인등록번호, 사업자등록번호, 여권번호 등)
      - name: 기업명
        data_type: VARCHAR
        description: "해당 고객식별자에 대한 기업의 명칭을 관리한다. / KED기업정식명 기준으로 먼저 셋팅하며, 해당 값이 없을 경우 당사 기준의 기업명을 셋팅한다."
        synonyms: [회사명, 법인명, 업체명]
      - name: 사업자등록번호
        data_type: VARCHAR
        description: 해당 사업자에 대한 사업자등록번호를 관리한다.
        synonyms: [사업자번호, 사업자등록]
      - name: 사업자과세분류구분코드
        data_type: VARCHAR
        description: 사업자등록번호 4번째자리부터 2자리에 해당되는 값을이용하여 사업자의 과세유형을 재분류한코드 / 사업자과세유형구분코드 와는 유효값 상이함
      - name: 개인사업자여부
        data_type: VARCHAR
        description: "해당 고객이 개인사업자인지 여부를 나타낸다. / 개인사업자 판단 기준의 경우, 사업자등록번호 개인/법인구분(2) 기준으로 판단한다. · 80 ~ 89가 아닌 경우"
      - name: 법인고객식별자
        data_type: VARCHAR
        description: 법인을 구분하기 위한 번호로 법원의 등기소에 법인신청 허가시에 부여되는 번호이다.법인고객식별자 = 채번
      - name: 법인등록번호
        data_type: VARCHAR
        description: 개인의 주민등록번호처럼 법인 설립 시 주어지는 고유번호. 법인등기부등본,사업자등록증으로 확인
        synonyms: [법인번호]
      - name: 법인명
        data_type: VARCHAR
        description: 자연인이 아닌 법에 의하여 권리 또는 능력이 부여된 사단 또는 재단등 법인체의 명
      - name: 표준산업분류코드
        data_type: VARCHAR
        description: 사업체가 주로 수행하는 산업활동을 그 유사성에 따라 체계적으로 분류한 것
      - name: 소매비소매구분코드
        data_type: VARCHAR
        description: "기업을 특정 기준에 따라 소매 또는 비소매로 구분한 정보를 나타낸다. / 신용평가모델 기준으로 먼저 셋팅 후, 해당 값이 없을 경우 충당금영역기준으로 셋팅한다."
      - name: 대표자고객식별자
        data_type: VARCHAR
        description: 해당 기업에 대한 대표자고객식별자를 나타낸다. / 주대표자에 해당하는 식별자 이다.
      - name: 대표자유효신용카드보유여부
        data_type: VARCHAR
        description: "기업 대표(개인) 고객식별자 기준으로 유효신용카드 보유여부를 나타낸다. / 유효신용카드 > 0 일때, '1'로 셋팅한다."
      - name: 대표자유효체크카드보유여부
        data_type: VARCHAR
        description: "기업 대표(개인) 고객식별자 기준으로 유효체크카드 보유여부를 나타낸다. / 유효체크카드 > 0 일때, '1'로 셋팅한다."
      - name: 그룹본인실질고객구분코드
        data_type: VARCHAR
        description: "법인스타클럽 정보로, 법인고객식별자 기준으로 산출된 등급이다. / KB그룹의 거래실적에 따른 고객의 등급(MVP,로얄,우대,프리미엄,잠재,일반등)을 구분하는 구분코드"
      - name: 그룹최고고객구분코드
        data_type: VARCHAR
        description: "법인스타클럽 정보로, 법인고객식별자 기준으로 산출된 등급이다. / KB금융그룹의 거래실적(가족포함)에 따른 고객의 등급(MVP,로얄,우대,프리미엄,잠재,일반등)을 구분하는 코드"
      - name: 소기업여부
        data_type: VARCHAR
        description: "해당 기업이 소기업 인지여부를 판단한다. / TBDAAAA23(DAA고객서비스내역) 내 470(소기업) 으로 등록되어 있는 경우 '1'로 관리한다."
      - name: 세입조치여부
        data_type: VARCHAR
        description: "신용카드업자가 법인회원에게 제공하는 경제적 이익을 세입조치 (수익을 전액 국고로 편입)하는 지침 및 규정이 있는 법인 여부 / TBDAAAA23(DAA고객서비스내역) 내 471(세입조치) 으로 등록되어 있는 경우 '1'로 관리한다."
      - name: 국가지자체여부
        data_type: VARCHAR
        description: "법인회원중 국가 및 지방자치단체인 회원 가.사업자번호 4,5번째 자리가 83인 회원은 국가 및 지방자치단체 나.정부구매카드 소유기업 : 고객기본정보에서 세부고객유형분류구분코드가 '31'(정부구매사업자), '32'(정부구매수서사업자)인 기업"
      - name: 중규모자격법인여부
        data_type: VARCHAR
        description: 해당 사업자번호가 보유한 부서사업장 중 주무부서가 정의한 중규모법인 식별용 회원자격코드가 하나라도 존재하는지의 여부를 관리한다.
      - name: 우수고객구분코드
        data_type: VARCHAR
        description: "480(최우수기업), 482(우수기업), 484(잠재우수기업) 등록된 기업에 한하여 관리한다. · 위 3개 코드의 경우, 전자메뉴얼 기준으로 선정함"
      - name: 기업거래정지여부
        data_type: VARCHAR
        description: "해당 기업이 아래의 거래정지코드로 등록된 경우 '1'로 관리한다. · 027(특수거래정지), 033(신용상태변동), 034(법적절차착수), 036(상각), 037(채무감면), 050(은행연합회 신용관리 대상자), 073(휴페업)"
      - name: 카드결제기관구분코드
        data_type: VARCHAR
        description: "해당 기업고객의 카드결제계좌의 기관구분 (산업은행, 기업은행, 국민은행, 외환은행 등)를 나타낸다. / 회원기본(TBDAAAT03) 결제일 데이터 값과 동일하게 셋팅된다."
      - name: 한도증액가망여부
        data_type: VARCHAR
        description: "해당 기업의 총한도금액을 증액할 수 있는지 가망여부를 나타낸다. / 기업한도전략 및 신용정보를 고려하여 한도증액 가능성이 있는지를 나타낸다. / 해당 값이 '1' 라고해서 한도증액이 가능한 것은 아니며 참고용으로만 사용한다."
      - name: 기업특별한도부여여부
        data_type: VARCHAR
        description: 해당 기업의 특별한도로 부여받은 한도가 있는지 유무를 나타낸다.
      - name: 최근한도변경사유구분코드
        data_type: VARCHAR
        description: 최근 기업총한도(사업자한도)를 변경한 데이터 기준으로, 변경한사유구분코드를 나타낸다.
      - name: 당사가맹점계약여부
        data_type: VARCHAR
        description: "당사와 가맹 계약을 했는지 여부를 나타낸다. / 가맹점거래정지상태구분코드 '1' (거래미정지가맹점 + 정상상태) 일때만 '1'로 관리한다."
      - name: 대표가맹점번호
        data_type: VARCHAR
        description: 해당 사업자번호 기준으로 대표 가맹점번호를 나타낸다. / 기업고객관리번호 오름차순기준으로 첫번째에 해당하는 가맹점번호를 나타낸다.
      - name: 가맹점사업주체구분코드
        data_type: VARCHAR
        description: 위 대표가맹점번호 기준의 데이터이다. / 가맹점의 사업주체가 개인사업자인지 법인사업자(법인포함)인지를 구분하는코드
      - name: 가맹점명
        data_type: VARCHAR
        description: 위 대표가맹점번호 기준의 데이터이다. / 당사와 가맹점 계약을 체결한 사업장의 명칭을 나타낸다.
        synonyms: [가맹점이름, 상호, 상호명]
      - name: 가맹점업종코드
        data_type: VARCHAR
        description: 위 대표가맹점번호 기준의 데이터이다. / 해당 가맹점의 업종코드를 나타낸다.
      - name: MCC업종코드
        data_type: VARCHAR
        description: 위 대표가맹점번호 기준의 데이터이다. / 해당 가맹점의 MCC업종코드를 나타낸다.
      - name: 카드연체여부
        data_type: VARCHAR
        description: "해당 기업 기준으로 카드의 연체가 존재하는지 구분하기 위한 여부이다. / 최초연체회차 > 0 인 건이 존재할 경우 '1'로 셋팅한다."
        value_semantics:
          '1': 카드 연체 존재
        value_semantics_provenance: source_definition
      - name: 여신연체여부
        data_type: VARCHAR
        description: "해당 기업 기준으로 여신 연체가 존재하는지 구분하기 위한 여부이다. / 최초연체회차 > 0 인 건이 존재할 경우 '1'로 셋팅한다."
        value_semantics:
          '1': 여신 연체 존재
        value_semantics_provenance: source_definition
      - name: KB국민은행법인여신여부
        data_type: VARCHAR
        description: "해당 기업이 KB국민은행 여신 잔액이 있는 경우, '1'로 관리한다. · 은행익스포져합계액 > 0 일때"
      - name: 사업자여전법규제1위반여부
        data_type: VARCHAR
        description: "여신전문금융업법에서 사업자기준으로 규제1에 대한 위반 여부 가. 규제1 - 사업자번호기준으로 총수익 < 총비용 ‘Y’ - 사업자번호기준으로 총수익 >= 총비용 ‘N’"
      - name: 사업자여전법규제2위반여부
        data_type: VARCHAR
        description: "여신전문금융업법에서 사업자기준으로 규제2에 대한 위반 여부 가. 규제2 - 사업자번호기준으로 (이용금액-무수익이용금액) · 0.5% < 법인회원경제적이익금액 ‘Y’ - 사업자번호기준으로 (이용금액-무수익이용금액) · 0.5% >= 법인회원경제적이익금액 ‘N’"
      - name: 사업자자산건전성구분코드
        data_type: VARCHAR
        description: 해당 고객(사업자) 기준으로 자산건전성 구분코드를 나타낸다. · 기업고객식별자 기준으로 산출됨
      - name: 폐업여부
        data_type: VARCHAR
        description: "해당 고객(사업자) 폐업여부를 나타낸다. · 자산건전성폐업사유구분코드 184(폐업거래처_추정손실) 일때, '1'로 관리한다."
        value_semantics:
          '1': 폐업
        value_semantics_provenance: source_definition
      - name: 최하자산건전성구분코드
        data_type: VARCHAR
        description: 자산건전성 분류에 있어 최하위 구분 코드를 관리한다.
      - name: 소호로지스틱BSS등급구분코드
        data_type: VARCHAR
        description: "한국신용정보(KCB)로부터 수신받은 소호 로지스틱 BSS 특화된 평가등급 ex)01:1등급 ... 99:기타"
      - name: 그룹최종평가신용등급코드
        data_type: VARCHAR
        description: 법인등록번호 기준으로 산출된 그룹최종평가신용등급코드를 나타낸다. / 그룹 CRS단일신용평가최종등급 기준의 데이터이다.
      - name: 그룹신용등급유효여부
        data_type: VARCHAR
        description: "위 그룹신용등급유효년월일 >= 데이터기준일자 보다 클 경우 '1' 로 셋팅한다(유효하다고 판단) / 그룹 CRS단일신용평가최종등급 기준의 데이터이다."
    measures:
      - name: 기업총한도금액
        data_type: DECIMAL
        description: 해당 기업의 기업총한도금액을 나타낸다. (사업자 단위 한도)
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 기업총잔여한도금액
        data_type: DECIMAL
        description: 해당 기업의 기업총한도 중 잔여한도금액을 나타낸다.(사용분 제외)
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 특별한도금액
        data_type: DECIMAL
        description: 해당 고객이 특별한 사유로 , 특정기간동안 사용하도록 심사하여 부여한 한도금액을 나타낸다.
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 특별한도잔여금액
        data_type: DECIMAL
        description: 2. 해당 고객이 받은 특별한도금액 중 남은 잔여금액을 나타낸다.
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 최근변경전사업자한도금액
        data_type: DECIMAL
        description: 최근 기업총한도(사업자한도)를 변경한 데이터 기준으로, 변경전 사업자한도금액을 나타낸다.
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 최근변경후사업자한도금액
        data_type: DECIMAL
        description: 최근 기업총한도(사업자한도)를 변경한 데이터 기준으로, 변경후 사업자한도금액을 나타낸다.
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 유효기업신용카드수
        data_type: BIGINT
        description: 해당 기업이 소유하고있는 유효 신용카드 좌수를 나타낸다.
        unit: count
        aggregation: semi_additive_latest_snapshot
      - name: 유효기업체크카드수
        data_type: BIGINT
        description: 해당 기업이 소유하고있는 유효 체크카드 좌수를 나타낸다.
        unit: count
        aggregation: semi_additive_latest_snapshot
      - name: 유효기업개별카드수
        data_type: BIGINT
        description: 해당 유효한 기업개별 카드 수를 나타낸다.
        unit: count
        aggregation: semi_additive_latest_snapshot
      - name: 유효기업공용카드수
        data_type: BIGINT
        description: 해당 기업이 소유하고있는 유효 공용카드 좌수를 나타낸다.
        unit: count
        aggregation: semi_additive_latest_snapshot
      - name: 금월신용카드이용금액
        data_type: DECIMAL
        description: "해당 금월기준 발생한 신용카드 이용 매출 금액을 나타낸다. / 당사 매입전표(TBDAABT30) 기준으로 산출된 데이터이다. · 상품중분류구분코드 NOT IN(CP53, CP54)"
        unit: KRW
        aggregation: sum_after_snapshot_dedup
      - name: 금월체크카드이용금액
        data_type: DECIMAL
        description: "해당 금월기준 발생한 회원의 체크카드 이용 매출 금액을 나타낸다. / 당사 매입전표(TBDAABT30) 기준으로 산출된 데이터이다. · 상품중분류구분코드 IN(CP53, CP54)"
        unit: KRW
        aggregation: sum_after_snapshot_dedup
      - name: 금월해외이용금액
        data_type: DECIMAL
        description: "해당 금월 회원이 해외에서 카드로 매출이 발생한 이용금액을 나타낸다. / 당사 매입전표(TBDAABT30) 기준으로 산출된 데이터이다. · 가맹점소속회사구분코드 = '4'"
        unit: KRW
        aggregation: sum_after_snapshot_dedup
      - name: 금월KB페이이용금액
        data_type: DECIMAL
        description: "당월에 이용한 카드 매출 중 KB페이로 결제한 이용금액을 나타낸다. (KB페이 전용 SWIPE구분코드에 한함) / 당사 매입전표(TBDAABT30) 기준으로 산출된 데이터이다."
        unit: KRW
        aggregation: sum_after_snapshot_dedup
      - name: 금월국세이용금액
        data_type: DECIMAL
        description: "당월에 발생한 카드 특화매출 중 국세업종에서 발생한 이용금액을 나타낸다. (업종코드:8219) / 당사 매입전표(TBDAABT30) 기준으로 산출된 데이터이다."
        unit: KRW
        aggregation: sum_after_snapshot_dedup
      - name: 금월지방세이용금액
        data_type: DECIMAL
        description: "당월에 발생한 카드 특화매출 중 지방세업종에서 발생한 이용금액을 나타낸다. (업종코드:8220) / 당사 매입전표(TBDAABT30) 기준으로 산출된 데이터이다."
        unit: KRW
        aggregation: sum_after_snapshot_dedup
      - name: 금월4대보험이용금액
        data_type: DECIMAL
        description: "당월에 발생한 카드 특화매출 중 4대보험업종에서 발생한 이용금액을 나타낸다. (업종코드:8099) / 당사 매입전표(TBDAABT30) 기준으로 산출된 데이터이다."
        unit: KRW
        aggregation: sum_after_snapshot_dedup
      - name: 금월일반매출이용금액
        data_type: DECIMAL
        description: "당월에 발생한 일반매출 이용금액을 나타낸다. · 일반매출 = 신용카드이용금액 + 체크카드이용금액 - 국세이용금액 - 지방세이용금액 - 4대보험이용금액 / 당사 매입전표(TBDAABT30) 기준으로 산출된 데이터이다."
        unit: KRW
        aggregation: sum_after_snapshot_dedup
      - name: 금월전략매출이용금액
        data_type: DECIMAL
        description: "당월에 발생한 전략매출 이용금액을 나타낸다. · 전략매출 = 국세이용금액 + 지방세이용금액 + 4대보험이용금액 / 당사 매입전표(TBDAABT30) 기준으로 산출된 데이터이다."
        unit: KRW
        aggregation: sum_after_snapshot_dedup
      - name: 카드연체원금
        data_type: DECIMAL
        description: 카드 연체건에 대한 원금 합계금액을 나타낸다.
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 여신연체원금
        data_type: DECIMAL
        description: 여신 연체건에 대한 원금 합계금액을 나타낸다.
        unit: KRW
        aggregation: semi_additive_latest_snapshot
    time_dimensions:
      - name: 기준년월일
        data_type: VARCHAR
        description: 데이터 산출 기준일자를 나타낸다.(ODATE)
        synonyms: [기준일, 일자, 날짜]
        required: true
        format: YYYYMMDD
        role: snapshot_date
      - name: 그룹최고고객관리기준년월일
        data_type: VARCHAR
        description: 해당 법인 스타클럽 그룹최고고객을 관리하기 위한 기준년월일이다.
        format: YYYYMMDD
        role: event_date
      - name: 결제일
        data_type: VARCHAR
        description: 해당 기업고객의 카드 결제일을 나타낸다. / 회원기본(TBDAAAT03) 결제일 데이터 값과 동일하게 셋팅된다.
        format: DD
        role: day_of_month
      - name: 최근한도변경년월일
        data_type: VARCHAR
        description: 최근 기업총한도(사업자한도)를 변경한 년월일을 나타낸다.
        format: YYYYMMDD
        role: event_date
      - name: 가맹점신규년월일
        data_type: VARCHAR
        description: 위 대표가맹점번호 기준의 데이터이다. / 가맹점이 신규로 등록된 년월일을 나타낸다.
        format: YYYYMMDD
        role: event_date
      - name: 가맹점재가입년월일
        data_type: VARCHAR
        description: 위 대표가맹점번호 기준의 데이터이다. / 가맹점이 재가입된일자를 나타낸다.
        format: YYYYMMDD
        role: event_date
      - name: 가맹점해지년월일
        data_type: VARCHAR
        description: 위 대표가맹점번호 기준의 데이터이다. / 당사 가맹점의 해지처리된 일자를 나타낸다.
        format: YYYYMMDD
        role: event_date
      - name: 가맹점최종가입년월일
        data_type: VARCHAR
        description: 위 대표가맹점번호 기준의 데이터이다. / 가맹점의 신규가입년월일, 재가입년월일 중 가장최근에 가입한 년월일를 나타낸다.
        format: YYYYMMDD
        role: event_date
      - name: 그룹신용등급확정년월일
        data_type: VARCHAR
        description: 기업이 소속된 그룹의 신용평가모델에 의한 신용등급이 확정된 일자를 나타낸다. / 그룹 CRS단일신용평가최종등급 기준의 데이터이다.
        format: YYYYMMDD
        role: event_date
      - name: 그룹신용등급유효년월일
        data_type: VARCHAR
        description: 기업이 소속된 그룹의 신용평가모델에 의해 산출된 신용등급이 유효한 일자를 나타낸다. / 그룹 CRS단일신용평가최종등급 기준의 데이터이다.

        format: YYYYMMDD
        role: event_date
    table_kind: daily_snapshot
    source_definition: 1. 매일 기준으로 데이터를 집계하여 관리한다. 2. TBDAAAT01(고객기본) 기준으로 개인기업구분코드 '2'(기업)인 경우 모수로 잡고 데이터를 생성한다. 3. 고객식별자, 고객고유번호 기준으로 대표 1건으로 관리한다 * 고객관리번호 오름차순 기준으로 첫번째에 해당하는 값 셋팅
    source_metadata:
      workbook_entity: 고객
      source_column_count: 79
      queryable_column_count: 75
      excluded_technical_columns: [시스템최종갱신일시, 시스템최종갱신식별자, 시스템최종거래일시, ADW시스템최종갱신일시]
    primary_time_dimension: 기준년월일
    aggregation_policy:
      deduplicate_before_aggregation: true
      aggregate_across_time: flow_measures_only
      default_measure_behavior: semi_additive_latest_snapshot
      snapshot_deduplication:
        period_expression: SUBSTR("기준년월일", 1, 6)
        partition_by: [고객식별자, 파생기준년월]
        order_by: '"기준년월일" DESC'
        keep: ROW_NUMBER() = 1
      overlap_groups:
        - name: card_count_axes
          canonical_axis: [유효기업신용카드수, 유효기업체크카드수]
          alternate_axis: [유효기업개별카드수, 유효기업공용카드수]
          rule: 두 축의 네 컬럼을 함께 합산하지 않는다
        - name: usage_breakdowns
          canonical_total: [금월신용카드이용금액, 금월체크카드이용금액]
          overlapping_breakdowns: [해외, KBPay, 국세, 지방세, 4대보험, 일반, 전략]
          rule: 세부 이용금액을 canonical total에 재가산하지 않는다
  - name: tmdaa1d12
    physical_table: tmdaa1d12
    korean_name: 월기업고객기본
    description: "DAA기업고객기본(TBDAA1D12)의 매월 말 데이터를 적재하는 기업고객 월 스냅샷. 기업 식별·대표자·그룹등급·한도·카드 보유·월 이용금액·연체·자산건전성 정보를 고객별로 관리하며, 기준일 현재 기업카드 보유 및 최근 6개월 무실적 대상 조회에도 사용한다."
    grain: 기준년월 × 기준년월일 × 고객식별자 1건 (기업고객 월말 스냅샷)
    primary_key: [기준년월, 기준년월일, 고객식별자]
    synonyms: [월기업고객, 기업고객월스냅샷, 기업회원무실적, 기업카드무실적, 6개월무실적, 6무]
    dimensions:
      - name: 고객식별자
        data_type: VARCHAR
        physical_data_type: VARCHAR2(10)
        description: KB카드의 고객에게 부여하는 10자리 번호체계로 각 고객을 고유하게 식별할 수 있음
        synonyms: [고객ID, 고객번호]
        required: true
      - name: 고객고유번호구분코드
        data_type: VARCHAR
        physical_data_type: VARCHAR2(2)
        description: 고객고유번호 구분 (주민등록번호, 법인등록번호, 사업자등록번호, 여권번호 등)
      - name: 기업명
        data_type: VARCHAR
        physical_data_type: VARCHAR2(70)
        description: "해당 고객식별자에 대한 기업의 명칭을 관리한다. / KED기업정식명 기준으로 먼저 셋팅하며, 해당 값이 없을 경우 당사 기준의 기업명을 셋팅한다."
        synonyms: [회사명, 법인명, 업체명]
      - name: 사업자등록번호
        data_type: VARCHAR
        physical_data_type: VARCHAR2(10)
        description: 해당 사업자에 대한 사업자등록번호를 관리한다.
        synonyms: [사업자번호, 사업자등록]
      - name: 사업자과세분류구분코드
        data_type: VARCHAR
        physical_data_type: VARCHAR2(1)
        description: 사업자등록번호 4번째자리부터 2자리에 해당되는 값을이용하여 사업자의 과세유형을 재분류한코드 / 사업자과세유형구분코드 와는 유효값 상이함
      - name: 개인사업자여부
        data_type: VARCHAR
        physical_data_type: VARCHAR2(1)
        description: "해당 고객이 개인사업자인지 여부를 나타낸다. / 개인사업자 판단 기준의 경우, 사업자등록번호 개인/법인구분(2) 기준으로 판단한다. · 80 ~ 89가 아닌 경우"
      - name: 법인고객식별자
        data_type: VARCHAR
        physical_data_type: VARCHAR2(10)
        description: 법인을 구분하기 위한 번호로 법원의 등기소에 법인신청 허가시에 부여되는 번호이다.법인고객식별자 = 채번
      - name: 법인등록번호
        data_type: VARCHAR
        physical_data_type: VARCHAR2(13)
        description: 개인의 주민등록번호처럼 법인 설립 시 주어지는 고유번호. 법인등기부등본,사업자등록증으로 확인
        synonyms: [법인번호]
      - name: 법인명
        data_type: VARCHAR
        physical_data_type: VARCHAR2(50)
        description: 자연인이 아닌 법에 의하여 권리 또는 능력이 부여된 사단 또는 재단등 법인체의 명
      - name: 표준산업분류코드
        data_type: VARCHAR
        physical_data_type: VARCHAR2(5)
        description: 사업체가 주로 수행하는 산업활동을 그 유사성에 따라 체계적으로 분류한 것
      - name: 소매비소매구분코드
        data_type: VARCHAR
        physical_data_type: VARCHAR2(1)
        description: "기업을 특정 기준에 따라 소매 또는 비소매로 구분한 정보를 나타낸다. / 신용평가모델 기준으로 먼저 셋팅 후, 해당 값이 없을 경우 충당금영역기준으로 셋팅한다."
      - name: 대표자고객식별자
        data_type: VARCHAR
        physical_data_type: VARCHAR2(10)
        description: 해당 기업에 대한 대표자고객식별자를 나타낸다. / 주대표자에 해당하는 식별자 이다.
      - name: 대표자유효신용카드보유여부
        data_type: VARCHAR
        physical_data_type: VARCHAR2(1)
        description: "기업 대표(개인) 고객식별자 기준으로 유효신용카드 보유여부를 나타낸다. / 유효신용카드 > 0 일때, '1'로 셋팅한다."
      - name: 대표자유효체크카드보유여부
        data_type: VARCHAR
        physical_data_type: VARCHAR2(1)
        description: "기업 대표(개인) 고객식별자 기준으로 유효체크카드 보유여부를 나타낸다. / 유효체크카드 > 0 일때, '1'로 셋팅한다."
      - name: 그룹본인실질고객구분코드
        data_type: VARCHAR
        physical_data_type: VARCHAR2(1)
        description: "법인스타클럽 정보로, 법인고객식별자 기준으로 산출된 등급이다. / KB그룹의 거래실적에 따른 고객의 등급(MVP,로얄,우대,프리미엄,잠재,일반등)을 구분하는 구분코드"
      - name: 그룹최고고객구분코드
        data_type: VARCHAR
        physical_data_type: VARCHAR2(1)
        description: "법인스타클럽 정보로, 법인고객식별자 기준으로 산출된 등급이다. / KB금융그룹의 거래실적(가족포함)에 따른 고객의 등급(MVP,로얄,우대,프리미엄,잠재,일반등)을 구분하는 코드"
      - name: 소기업여부
        data_type: VARCHAR
        physical_data_type: VARCHAR2(1)
        description: "해당 기업이 소기업 인지여부를 판단한다. / TBDAAAA23(DAA고객서비스내역) 내 470(소기업) 으로 등록되어 있는 경우 '1'로 관리한다."
      - name: 세입조치여부
        data_type: VARCHAR
        physical_data_type: VARCHAR2(1)
        description: "신용카드업자가 법인회원에게 제공하는 경제적 이익을 세입조치 (수익을 전액 국고로 편입)하는 지침 및 규정이 있는 법인 여부 / TBDAAAA23(DAA고객서비스내역) 내 471(세입조치) 으로 등록되어 있는 경우 '1'로 관리한다."
      - name: 국가지자체여부
        data_type: VARCHAR
        physical_data_type: VARCHAR2(1)
        description: "법인회원중 국가 및 지방자치단체인 회원 가.사업자번호 4,5번째 자리가 83인 회원은 국가 및 지방자치단체 나.정부구매카드 소유기업 : 고객기본정보에서 세부고객유형분류구분코드가 '31'(정부구매사업자), '32'(정부구매수서사업자)인 기업"
      - name: 중규모자격법인여부
        data_type: VARCHAR
        physical_data_type: VARCHAR2(1)
        description: 해당 사업자번호가 보유한 부서사업장 중 주무부서가 정의한 중규모법인 식별용 회원자격코드가 하나라도 존재하는지의 여부를 관리한다.
      - name: 우수고객구분코드
        data_type: VARCHAR
        physical_data_type: VARCHAR2(3)
        description: "480(최우수기업), 482(우수기업), 484(잠재우수기업) 등록된 기업에 한하여 관리한다. · 위 3개 코드의 경우, 전자메뉴얼 기준으로 선정함"
      - name: 기업거래정지여부
        data_type: VARCHAR
        physical_data_type: VARCHAR2(1)
        description: "해당 기업이 아래의 거래정지코드로 등록된 경우 '1'로 관리한다. · 027(특수거래정지), 033(신용상태변동), 034(법적절차착수), 036(상각), 037(채무감면), 050(은행연합회 신용관리 대상자), 073(휴페업)"
      - name: 카드결제기관구분코드
        data_type: VARCHAR
        physical_data_type: VARCHAR2(3)
        description: "해당 기업고객의 카드결제계좌의 기관구분 (산업은행, 기업은행, 국민은행, 외환은행 등)를 나타낸다. / 회원기본(TBDAAAT03) 결제일 데이터 값과 동일하게 셋팅된다."
      - name: 한도증액가망여부
        data_type: VARCHAR
        physical_data_type: VARCHAR2(1)
        description: "해당 기업의 총한도금액을 증액할 수 있는지 가망여부를 나타낸다. / 기업한도전략 및 신용정보를 고려하여 한도증액 가능성이 있는지를 나타낸다. / 해당 값이 '1' 라고해서 한도증액이 가능한 것은 아니며 참고용으로만 사용한다."
      - name: 기업특별한도부여여부
        data_type: VARCHAR
        physical_data_type: VARCHAR2(1)
        description: 해당 기업의 특별한도로 부여받은 한도가 있는지 유무를 나타낸다.
      - name: 최근한도변경사유구분코드
        data_type: VARCHAR
        physical_data_type: VARCHAR2(2)
        description: 최근 기업총한도(사업자한도)를 변경한 데이터 기준으로, 변경한사유구분코드를 나타낸다.
      - name: 당사가맹점계약여부
        data_type: VARCHAR
        physical_data_type: VARCHAR2(1)
        description: "당사와 가맹 계약을 했는지 여부를 나타낸다. / 가맹점거래정지상태구분코드 '1' (거래미정지가맹점 + 정상상태) 일때만 '1'로 관리한다."
      - name: 대표가맹점번호
        data_type: VARCHAR
        physical_data_type: VARCHAR2(15)
        description: 해당 사업자번호 기준으로 대표 가맹점번호를 나타낸다. / 기업고객관리번호 오름차순기준으로 첫번째에 해당하는 가맹점번호를 나타낸다.
      - name: 가맹점사업주체구분코드
        data_type: VARCHAR
        physical_data_type: VARCHAR2(1)
        description: 위 대표가맹점번호 기준의 데이터이다. / 가맹점의 사업주체가 개인사업자인지 법인사업자(법인포함)인지를 구분하는코드
      - name: 가맹점명
        data_type: VARCHAR
        physical_data_type: VARCHAR2(50)
        description: 위 대표가맹점번호 기준의 데이터이다. / 당사와 가맹점 계약을 체결한 사업장의 명칭을 나타낸다.
        synonyms: [가맹점이름, 상호, 상호명]
      - name: 가맹점업종코드
        data_type: VARCHAR
        physical_data_type: VARCHAR2(4)
        description: 위 대표가맹점번호 기준의 데이터이다. / 해당 가맹점의 업종코드를 나타낸다.
      - name: MCC업종코드
        data_type: VARCHAR
        physical_data_type: VARCHAR2(4)
        description: 위 대표가맹점번호 기준의 데이터이다. / 해당 가맹점의 MCC업종코드를 나타낸다.
      - name: 카드연체여부
        data_type: VARCHAR
        physical_data_type: VARCHAR2(1)
        description: "해당 기업 기준으로 카드의 연체가 존재하는지 구분하기 위한 여부이다. / 최초연체회차 > 0 인 건이 존재할 경우 '1'로 셋팅한다."
        value_semantics:
          '1': 카드 연체 존재
        value_semantics_provenance: source_definition
      - name: 여신연체여부
        data_type: VARCHAR
        physical_data_type: VARCHAR2(1)
        description: "해당 기업 기준으로 여신 연체가 존재하는지 구분하기 위한 여부이다. / 최초연체회차 > 0 인 건이 존재할 경우 '1'로 셋팅한다."
        value_semantics:
          '1': 여신 연체 존재
        value_semantics_provenance: source_definition
      - name: KB국민은행법인여신여부
        data_type: VARCHAR
        physical_data_type: VARCHAR2(1)
        description: "해당 기업이 KB국민은행 여신 잔액이 있는 경우, '1'로 관리한다. · 은행익스포져합계액 > 0 일때"
      - name: 사업자여전법규제1위반여부
        data_type: VARCHAR
        physical_data_type: VARCHAR2(1)
        description: "여신전문금융업법에서 사업자기준으로 규제1에 대한 위반 여부 가. 규제1 - 사업자번호기준으로 총수익 < 총비용 ‘Y’ - 사업자번호기준으로 총수익 >= 총비용 ‘N’"
      - name: 사업자여전법규제2위반여부
        data_type: VARCHAR
        physical_data_type: VARCHAR2(1)
        description: "여신전문금융업법에서 사업자기준으로 규제2에 대한 위반 여부 가. 규제2 - 사업자번호기준으로 (이용금액-무수익이용금액) · 0.5% < 법인회원경제적이익금액 ‘Y’ - 사업자번호기준으로 (이용금액-무수익이용금액) · 0.5% >= 법인회원경제적이익금액 ‘N’"
      - name: 사업자자산건전성구분코드
        data_type: VARCHAR
        physical_data_type: VARCHAR2(1)
        description: 해당 고객(사업자) 기준으로 자산건전성 구분코드를 나타낸다. · 기업고객식별자 기준으로 산출됨
      - name: 폐업여부
        data_type: VARCHAR
        physical_data_type: VARCHAR2(1)
        description: "해당 고객(사업자) 폐업여부를 나타낸다. · 자산건전성폐업사유구분코드 184(폐업거래처_추정손실) 일때, '1'로 관리한다."
        value_semantics:
          '1': 폐업
        value_semantics_provenance: source_definition
      - name: 최하자산건전성구분코드
        data_type: VARCHAR
        physical_data_type: VARCHAR2(1)
        description: 자산건전성 분류에 있어 최하위 구분 코드를 관리한다.
      - name: 소호로지스틱BSS등급구분코드
        data_type: VARCHAR
        physical_data_type: VARCHAR2(2)
        description: "한국신용정보(KCB)로부터 수신받은 소호 로지스틱 BSS 특화된 평가등급 ex)01:1등급 ... 99:기타"
      - name: 그룹최종평가신용등급코드
        data_type: VARCHAR
        physical_data_type: VARCHAR2(4)
        description: 법인등록번호 기준으로 산출된 그룹최종평가신용등급코드를 나타낸다. / 그룹 CRS단일신용평가최종등급 기준의 데이터이다.
      - name: 그룹신용등급유효여부
        data_type: VARCHAR
        physical_data_type: VARCHAR2(1)
        description: "위 그룹신용등급유효년월일 >= 데이터기준일자 보다 클 경우 '1' 로 셋팅한다(유효하다고 판단) / 그룹 CRS단일신용평가최종등급 기준의 데이터이다."
    measures:
      - name: 기업총한도금액
        data_type: DECIMAL
        physical_data_type: NUMBER(15)
        description: 해당 기업의 기업총한도금액을 나타낸다. (사업자 단위 한도)
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 기업총잔여한도금액
        data_type: DECIMAL
        physical_data_type: NUMBER(15)
        description: 해당 기업의 기업총한도 중 잔여한도금액을 나타낸다.(사용분 제외)
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 특별한도금액
        data_type: DECIMAL
        physical_data_type: NUMBER(15)
        description: 해당 고객이 특별한 사유로 , 특정기간동안 사용하도록 심사하여 부여한 한도금액을 나타낸다.
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 특별한도잔여금액
        data_type: DECIMAL
        physical_data_type: NUMBER(15)
        description: 2. 해당 고객이 받은 특별한도금액 중 남은 잔여금액을 나타낸다.
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 최근변경전사업자한도금액
        data_type: DECIMAL
        physical_data_type: NUMBER(15)
        description: 최근 기업총한도(사업자한도)를 변경한 데이터 기준으로, 변경전 사업자한도금액을 나타낸다.
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 최근변경후사업자한도금액
        data_type: DECIMAL
        physical_data_type: NUMBER(15)
        description: 최근 기업총한도(사업자한도)를 변경한 데이터 기준으로, 변경후 사업자한도금액을 나타낸다.
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 유효기업신용카드수
        data_type: BIGINT
        physical_data_type: NUMBER(7)
        description: 해당 기업이 소유하고있는 유효 신용카드 좌수를 나타낸다.
        unit: count
        aggregation: semi_additive_latest_snapshot
      - name: 유효기업체크카드수
        data_type: BIGINT
        physical_data_type: NUMBER(7)
        description: 해당 기업이 소유하고있는 유효 체크카드 좌수를 나타낸다.
        unit: count
        aggregation: semi_additive_latest_snapshot
      - name: 유효기업개별카드수
        data_type: BIGINT
        physical_data_type: NUMBER(7)
        description: 해당 유효한 기업개별 카드 수를 나타낸다.
        unit: count
        aggregation: semi_additive_latest_snapshot
      - name: 유효기업공용카드수
        data_type: BIGINT
        physical_data_type: NUMBER(7)
        description: 해당 기업이 소유하고있는 유효 공용카드 좌수를 나타낸다.
        unit: count
        aggregation: semi_additive_latest_snapshot
      - name: 금월신용카드이용금액
        data_type: DECIMAL
        physical_data_type: NUMBER(15)
        description: "해당 금월기준 발생한 신용카드 이용 매출 금액을 나타낸다. / 당사 매입전표(TBDAABT30) 기준으로 산출된 데이터이다. · 상품중분류구분코드 NOT IN(CP53, CP54)"
        unit: KRW
        aggregation: sum_after_snapshot_dedup
      - name: 금월체크카드이용금액
        data_type: DECIMAL
        physical_data_type: NUMBER(15)
        description: "해당 금월기준 발생한 회원의 체크카드 이용 매출 금액을 나타낸다. / 당사 매입전표(TBDAABT30) 기준으로 산출된 데이터이다. · 상품중분류구분코드 IN(CP53, CP54)"
        unit: KRW
        aggregation: sum_after_snapshot_dedup
      - name: 금월해외이용금액
        data_type: DECIMAL
        physical_data_type: NUMBER(15)
        description: "해당 금월 회원이 해외에서 카드로 매출이 발생한 이용금액을 나타낸다. / 당사 매입전표(TBDAABT30) 기준으로 산출된 데이터이다. · 가맹점소속회사구분코드 = '4'"
        unit: KRW
        aggregation: sum_after_snapshot_dedup
      - name: 금월KB페이이용금액
        data_type: DECIMAL
        physical_data_type: NUMBER(15)
        description: "당월에 이용한 카드 매출 중 KB페이로 결제한 이용금액을 나타낸다. (KB페이 전용 SWIPE구분코드에 한함) / 당사 매입전표(TBDAABT30) 기준으로 산출된 데이터이다."
        unit: KRW
        aggregation: sum_after_snapshot_dedup
      - name: 금월국세이용금액
        data_type: DECIMAL
        physical_data_type: NUMBER(15)
        description: "당월에 발생한 카드 특화매출 중 국세업종에서 발생한 이용금액을 나타낸다. (업종코드:8219) / 당사 매입전표(TBDAABT30) 기준으로 산출된 데이터이다."
        unit: KRW
        aggregation: sum_after_snapshot_dedup
      - name: 금월지방세이용금액
        data_type: DECIMAL
        physical_data_type: NUMBER(15)
        description: "당월에 발생한 카드 특화매출 중 지방세업종에서 발생한 이용금액을 나타낸다. (업종코드:8220) / 당사 매입전표(TBDAABT30) 기준으로 산출된 데이터이다."
        unit: KRW
        aggregation: sum_after_snapshot_dedup
      - name: 금월4대보험이용금액
        data_type: DECIMAL
        physical_data_type: NUMBER(15)
        description: "당월에 발생한 카드 특화매출 중 4대보험업종에서 발생한 이용금액을 나타낸다. (업종코드:8099) / 당사 매입전표(TBDAABT30) 기준으로 산출된 데이터이다."
        unit: KRW
        aggregation: sum_after_snapshot_dedup
      - name: 금월일반매출이용금액
        data_type: DECIMAL
        physical_data_type: NUMBER(15)
        description: "당월에 발생한 일반매출 이용금액을 나타낸다. · 일반매출 = 신용카드이용금액 + 체크카드이용금액 - 국세이용금액 - 지방세이용금액 - 4대보험이용금액 / 당사 매입전표(TBDAABT30) 기준으로 산출된 데이터이다."
        unit: KRW
        aggregation: sum_after_snapshot_dedup
      - name: 금월전략매출이용금액
        data_type: DECIMAL
        physical_data_type: NUMBER(15)
        description: "당월에 발생한 전략매출 이용금액을 나타낸다. · 전략매출 = 국세이용금액 + 지방세이용금액 + 4대보험이용금액 / 당사 매입전표(TBDAABT30) 기준으로 산출된 데이터이다."
        unit: KRW
        aggregation: sum_after_snapshot_dedup
      - name: 카드연체원금
        data_type: DECIMAL
        physical_data_type: NUMBER(15)
        description: 카드 연체건에 대한 원금 합계금액을 나타낸다.
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 여신연체원금
        data_type: DECIMAL
        physical_data_type: NUMBER(15)
        description: 여신 연체건에 대한 원금 합계금액을 나타낸다.
        unit: KRW
        aggregation: semi_additive_latest_snapshot
    time_dimensions:
      - name: 기준년월
        data_type: VARCHAR
        physical_data_type: VARCHAR2(6)
        description: 해당 기준년월 말일 시점의 월 스냅샷을 식별하는 년월
        synonyms: [기준월, 년월, 월]
        required: true
        format: YYYYMM
        role: snapshot_month
      - name: 기준년월일
        data_type: VARCHAR
        physical_data_type: VARCHAR2(8)
        description: 데이터 산출 기준일자를 나타낸다.(ODATE)
        synonyms: [기준일, 일자, 날짜]
        required: true
        format: YYYYMMDD
        role: snapshot_date
      - name: 그룹최고고객관리기준년월일
        data_type: VARCHAR
        physical_data_type: VARCHAR2(8)
        description: 해당 법인 스타클럽 그룹최고고객을 관리하기 위한 기준년월일이다.
        format: YYYYMMDD
        role: event_date
      - name: 결제일
        data_type: VARCHAR
        physical_data_type: VARCHAR2(2)
        description: 해당 기업고객의 카드 결제일을 나타낸다. / 회원기본(TBDAAAT03) 결제일 데이터 값과 동일하게 셋팅된다.
        format: DD
        role: day_of_month
      - name: 최근한도변경년월일
        data_type: VARCHAR
        physical_data_type: VARCHAR2(8)
        description: 최근 기업총한도(사업자한도)를 변경한 년월일을 나타낸다.
        format: YYYYMMDD
        role: event_date
      - name: 가맹점신규년월일
        data_type: VARCHAR
        physical_data_type: VARCHAR2(8)
        description: 위 대표가맹점번호 기준의 데이터이다. / 가맹점이 신규로 등록된 년월일을 나타낸다.
        format: YYYYMMDD
        role: event_date
      - name: 가맹점재가입년월일
        data_type: VARCHAR
        physical_data_type: VARCHAR2(8)
        description: 위 대표가맹점번호 기준의 데이터이다. / 가맹점이 재가입된일자를 나타낸다.
        format: YYYYMMDD
        role: event_date
      - name: 가맹점해지년월일
        data_type: VARCHAR
        physical_data_type: VARCHAR2(8)
        description: 위 대표가맹점번호 기준의 데이터이다. / 당사 가맹점의 해지처리된 일자를 나타낸다.
        format: YYYYMMDD
        role: event_date
      - name: 가맹점최종가입년월일
        data_type: VARCHAR
        physical_data_type: VARCHAR2(8)
        description: 위 대표가맹점번호 기준의 데이터이다. / 가맹점의 신규가입년월일, 재가입년월일 중 가장최근에 가입한 년월일를 나타낸다.
        format: YYYYMMDD
        role: event_date
      - name: 그룹신용등급확정년월일
        data_type: VARCHAR
        physical_data_type: VARCHAR2(8)
        description: 기업이 소속된 그룹의 신용평가모델에 의한 신용등급이 확정된 일자를 나타낸다. / 그룹 CRS단일신용평가최종등급 기준의 데이터이다.
        format: YYYYMMDD
        role: event_date
      - name: 그룹신용등급유효년월일
        data_type: VARCHAR
        physical_data_type: VARCHAR2(8)
        description: 기업이 소속된 그룹의 신용평가모델에 의해 산출된 신용등급이 유효한 일자를 나타낸다. / 그룹 CRS단일신용평가최종등급 기준의 데이터이다.

        format: YYYYMMDD
        role: event_date
    table_kind: monthly_snapshot
    source_definition: "DAA기업고객기본(TBDAA1D12)의 매월 말 데이터를 적재한다. TBDAAAT01(고객기본)에서 개인기업구분코드 '2'(기업)를 모집단으로 삼고, 원천의 고객식별자·고객고유번호 기준 대표 1건은 고객관리번호 오름차순 첫 값을 사용한다. 고객고유번호 자체는 이 월 테이블의 조회 가능 컬럼에 포함되지 않는다."
    entity_occurrence_rules:
      insert: 매월 말 월 스냅샷 적재
      update: 해당 없음 (월 스냅샷)
      delete: 해당 없음
    source_metadata:
      workbook_entity: DAA월기업고객기본
      source_file: 예시.xlsx
      source_column_count: 79
      queryable_column_count: 75
      excluded_technical_columns: [시스템최종갱신일시, 시스템최종갱신식별자, 시스템최종거래일시, ADW시스템최종갱신일시]
    primary_time_dimension: 기준년월
    aggregation_policy:
      deduplicate_before_aggregation: true
      aggregate_across_time: flow_measures_only
      default_measure_behavior: semi_additive_latest_snapshot
      snapshot_deduplication:
        period_expression: '"기준년월"'
        partition_by: [고객식별자, 기준년월]
        order_by: '"기준년월일" DESC'
        keep: ROW_NUMBER() = 1
      overlap_groups:
        - name: card_count_axes
          canonical_axis: [유효기업신용카드수, 유효기업체크카드수]
          alternate_axis: [유효기업개별카드수, 유효기업공용카드수]
          rule: 두 축의 네 컬럼을 함께 합산하지 않는다
        - name: usage_breakdowns
          canonical_total: [금월신용카드이용금액, 금월체크카드이용금액]
          overlapping_breakdowns: [해외, KBPay, 국세, 지방세, 4대보험, 일반, 전략]
          rule: 세부 이용금액을 canonical total에 재가산하지 않는다
  - name: tbdaaac67
    physical_table: tbdaaac67
    korean_name: 부서사업장회원
    description: "부서·사업장 단위 회원 정보를 관리하는 테이블. 한 행은 하나의 부서사업장 회원을 의미하며, 회원일련번호에 연결된 상품번호·법인고객식별자·BC카드 기업회원번호·연구비 과제 고유번호 등을 보관한다. 법인 내 부서/사업장 단위 카드 발급 체계를 식별할 때 사용한다."
    grain: 회원일련번호 1건 (부서/사업장 회원)
    primary_key: [회원일련번호]
    synonyms: [부서사업장, 사업장회원, 부서회원]
    dimensions:
      - name: 회원일련번호
        data_type: VARCHAR
        description: 부서사업장의 회원일련번호를 관리한다.
        synonyms: [회원번호, 회원ID]
        required: true
      - name: 상품번호
        data_type: VARCHAR
        description: 상품코드의 마지막 5자리로 정의, 상품코드를 그대로 사용함으로 별도 목록성 테이블은 관리하지 않고, 코드로 표기하고자 함
      - name: 법인고객식별자
        data_type: VARCHAR
        description: 법인을 구분하기 위한 번호로 법원의 등기소에 법인신청 허가시에 부여되는 번호이다.법인고객식별자 = 채번
      - name: BC카드기업회원번호
        data_type: VARCHAR
        description: BC카드에서 기업회원을 관리하는 고유번호
      - name: 연구비과제고유번호
        data_type: VARCHAR
        description: 한국연구재단에서 제공하는 연구개발과제고유번호(카드발급 및 한도 관리에 사용)

    table_kind: master
    source_definition: 2. 고객 적립포인트를 포인트구분별, 포인트 서비스별 점수로 환산한 내역을 관리한다. 3. 매출, 비매출성 적립거래를 관리한다.
    source_metadata:
      workbook_entity: 고객_회원_카드
      source_column_count: 9
      queryable_column_count: 5
      excluded_technical_columns: [시스템최종갱신일시, 시스템최종갱신식별자, 시스템최종거래일시, ADW시스템최종갱신일시]
    aggregation_policy:
      deduplicate_before_aggregation: false
      aggregate_across_time: false
      default_measure_behavior: use_declared_grain
  - name: tbdaaat01
    physical_table: tbdaaat01
    korean_name: 고객기본
    description: "당사(KB국민카드) 고객의 기본 정보를 관리하는 고객 마스터 테이블. 한 행은 하나의 고객(고객식별자+고객관리번호)을 의미한다. 개인기업구분코드로 개인/법인을 구분하며, 법인고객식별자·본사사업자등록번호·법인등록번호·고객유형·대표자 정보 등 고객 식별 및 분류의 핵심 속성을 담는다. 고객 기준
      분석과 회원/카드/가맹점 테이블 조인의 출발점이다."
    grain: 고객식별자 × 고객관리번호 1건 (고객 마스터)
    primary_key: [고객식별자, 고객관리번호]
    synonyms: [고객, 고객마스터, 고객정보, 고객원장]
    dimensions:
      - name: 고객식별자
        data_type: VARCHAR
        description: KB카드의 고객에게 부여하는 10자리 번호체계로 각 고객을 고유하게 식별할 수 있음
        synonyms: [고객ID, 고객번호]
        required: true
      - name: 고객관리번호
        data_type: VARCHAR
        description: 고객식별자의 하위 5자리 번호체계
        required: true
      - name: 회원일련번호
        data_type: VARCHAR
        description: 당사(KB국민카드)와 계약한 회원을 관리하는 식별번호
        synonyms: [회원번호, 회원ID]
      - name: 개인기업구분코드
        data_type: VARCHAR
        description: 개인 또는 기업을 구분하는 코드
        value_semantics:
          '2': 기업
        value_semantics_provenance: source_definition
      - name: 고객상태구분코드
        data_type: VARCHAR
        description: CIF에서 상태를 보고 거래불가 처리 함.
      - name: 고객고유번호구분코드
        data_type: VARCHAR
        description: 00(해당무)가 있으면 안됨. 99(기타)를 사용해야 함
      - name: 고객고유번호
        data_type: VARCHAR
        description: 고객을 식별할 수 있는 고유번호 (주민등록번호,운전면허번호,외국인등록번호,사업자등록번호 등)
      - name: 법인고객식별자
        data_type: VARCHAR
        description: 법인을 구분하기 위한 번호로 법원의 등기소에 법인신청 허가시에 부여되는 번호이다.법인고객식별자 = 채번
      - name: 본사사업자등록번호
        data_type: VARCHAR
        description: 기업 본사의 사업자등록번호
      - name: 법인등록번호
