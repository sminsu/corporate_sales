        description: 국내 신용카드사(KB국민카드 포함) 들이 승인 시 생성하는 8자리 관리번호
      - name: 원인매출승인번호
        data_type: VARCHAR
        description: 취소매출전표 매입시 해당 승인건 정상 매출전표원장의 매출전표승인번호
      - name: 매출승인시각
        data_type: VARCHAR
        description: 고객의 카드거래가 발생하는 시점의 시각. 일시불, 할부, 단기카드대출 외 카드로 거래하는 모든거래가 발생할 때를 의미한다.
      - name: 승인한도반영구분코드
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 승인반영 종류를 구분하는 코드
      - name: 승인대외기관구분코드
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 승인 대외기관을 구분하는 코드
      - name: 채널세부업무구분코드
        data_type: VARCHAR
        description: "다양한 형태의 채널과 매체를 통해 내.외부로 처리되는 개별업무에 대한 세부정보를 구분 / 실적정보 및 각종 보고서 작성시 기초 데이터로 사용 / 대외결제업무(타행환,CD공동망,전자금융공동망 등)에서 처리되는 계좌의 계정처리시 사용"
      - name: SWIPE구분코드
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 카드입력형태에 따른 구분
      - name: 원인매출전표번호
        data_type: VARCHAR
        description: 취소매출전표 매입시 해당 승인건 정상매출전표원장의 매출전표번호
      - name: 전표취소구분코드
        data_type: VARCHAR
        description: 취소전표의 사유를 관리하는 코드
      - name: 강제입력사유구분코드
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 매출전표의 강제입력관리코드
      - name: 회원자산관리부점코드
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 회원의 자산을 관리하는 부점코드
      - name: 매입카드종류구분코드
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 KB카드,KB체크카드 구분
      - name: 가맹점사업자등록번호
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 가맹점의 사업자번호이다.
      - name: 기업고객식별자
        data_type: VARCHAR
        description: KB카드의 고객에게 부여하는 10자리 식별번호중 기업고객에 대한 식별번호
      - name: 기업고객관리번호
        data_type: VARCHAR
        description: 개인이 아닌 기업체에 대한 고객관리번호
      - name: 가맹점모집부점코드
        data_type: VARCHAR
        description: 가맹점을 모집한 부점을 관리하는 코드이다.
      - name: 가맹점관리부점코드
        data_type: VARCHAR
        description: 가맹점 대금지급 대상건의 가맹점을 관리하는 지점의 부점코드
      - name: 가맹점업종코드
        data_type: VARCHAR
        description: 가맹점업종코드를 관리하는 항목
      - name: 가맹점유형구분코드
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 가맹점의 유형(일반,통판등)구분
      - name: 제휴업체코드
        data_type: VARCHAR
        description: 제휴된 업체코드를 관리하는 코드이다.
      - name: 가맹여부구분코드
        data_type: VARCHAR
        description: 공동망매출전표 접수가맹점의 공동망가맹점 가맹여부
      - name: 가맹점특약등록여부
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 가맹점 특약정보 등록여부
      - name: 가맹점수수료구분코드
        data_type: VARCHAR
        description: 가맹점의 수수료를 가맹점에 적용 관리하는 코드이다.
      - name: 가맹점결제기관구분코드
        data_type: VARCHAR
        description: 가맹점의 대금지급에 대한 결제기관을 구분하는 코드
      - name: MCC업종코드
        data_type: VARCHAR
        description: 해외기준에 매핑되는가맹점업종 코드이다.
      - name: 해외업종그룹구분코드
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 해외 MCC 업종코드 그룹 구분코드
      - name: 가맹점고객서비스구분코드
        data_type: VARCHAR
        description: 카드 고객의 고객서비스구분코드 중 가맹점의 서비스구분코드를 관리하는 항목
      - name: 회수방법구분코드
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 결제 대금 회수방법구분코드
      - name: 카드브랜드구분코드
        data_type: VARCHAR
        description: "카드브랜드구분코드 1:로칼(국민) 2:마스터 3:비자 4:JCB"
      - name: 카드소유자구분코드
        data_type: VARCHAR
        description: 카드 소유자 유형 (본인/가족/대표/공용/개별)
      - name: 카드등급구분코드
        data_type: VARCHAR
        description: 신용카드의 등급을 구분하는 코드이다.
      - name: 카드칩구분코드
        data_type: VARCHAR
        description: "카드자재 칩 탑재 및 종류 구분코드 (1:칩무 2:RF 3:IC 4:RF + IC)를 나타낸 코드이다."
      - name: 카드환율적용구분코드
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 환율적용관리 코드
      - name: 우수고객서비스구분코드
        data_type: VARCHAR
        description: 관리회계에서 사용하는 우수고객서비스구분코드 속성을 관리한다.
      - name: 등록부점코드
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 등록처리한 부점코드이다.
      - name: 직업구분코드
        data_type: VARCHAR
        description: 직업정보를 구분하는 코드이다.
      - name: 선취후취구분코드
        data_type: VARCHAR
        description: 선취나 후취 등을 구분하는 코드이다.
      - name: 매입자료구분코드
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 매입전표의 자료 종류
      - name: RF매체구분코드
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 RF기관을 관리하는 코드
      - name: 교통매체코드
        data_type: VARCHAR
        description: 전표 매입시 교통매체를 구분하는 코드이다.
      - name: 전표참조번호
        data_type: VARCHAR
        description: 공동망에서 거래된 매출전표의 당사,타사의 참조번호로 전문을 통해 여신협회에 송수신된다.
      - name: 전자서명전표여부
        data_type: VARCHAR
        description: 전자적으로 서명한 전표인지의 여부
      - name: RF차량번호
        data_type: VARCHAR
        description: RF사업자로부터 수신한 후불교통/하이패스 이용차량의 번호
      - name: 호스트DDC여부
        data_type: VARCHAR
        description: "VAN사의 매출전표접수자료 및 매입반송자료 데이터에 기재된 호스트DDC여부 / HOST DDC는 가맹점에서 신판내역을 VAN으로 전송하고 VAN에서 카드사로 전송하는 일련의 업무 방식을 말함."
      - name: 바우처신용구분코드
        data_type: VARCHAR
        description: 바우처 전표를 구분하기위한 코드이다.
      - name: 항공권번호
        data_type: VARCHAR
        description: BSP항공 매출전표 매입처리시 사용되는 항공권번호
      - name: 출발항공지역코드
        data_type: VARCHAR
        description: BSP매출전표 매입시 관리되는 항공권 출발지역코드
      - name: 도착항공지역코드
        data_type: VARCHAR
        description: BSP매출전표 매입시 관리되는 항공권 도착지역코드
      - name: 항공기탑승시각
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 승객이 항공기에 탑승한 시각
      - name: 바우처서비스유형코드
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 바우처서비스유형
      - name: 청구회수바우처사업구분코드
        data_type: VARCHAR
        description: 바우처사업을 구분하는 코드 / 바우처 국고지원시 아이사랑전표와 국방복지전표를 구분하기 위한 용도로 국방복지기금바우처, 아이사랑바우처를 구분한다.
      - name: 가상카드구분코드
        data_type: VARCHAR
        description: 가상으로 일회성 또는 한시적으로 사용한 가상카드의 구분코드이다.
      - name: 온라인거래여부
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 온라인 거래 여부식별값
      - name: 가맹점우편번호
        data_type: VARCHAR
        description: 가맹점이 소재한 주소가 속해있는 우편담당구역
      - name: 정부구매카드고객번호
        data_type: VARCHAR
        description: "고객을 식별할 수 있는 고유번호 (주민등록번호,운전면허번호,외국인등록번호,사업자등록번호 등) 중 - 1.사업자번호(10) - / 정부구매번호[정부구매출납관서코드(11)+지출목코드(4)+브랜드구분/회사구분(1) = 16] - / 정부구매카드번호[정부구매출납관서코드(11)+지출목코드(4)+카드구분번호(4)
          = 19] (암호화 미대상)을 관리한다."
      - name: 아파트코드
        data_type: VARCHAR
        description: 카드결제로 자동납부 신청이 가능한 아파트코드를 관리한다
      - name: 가상카드번호
        data_type: VARCHAR
        description: 가상으로 일회성 또는 한시적으로 사용하는 카드번호
      - name: 자동납부아파트동호코드
        data_type: VARCHAR
        description: 자동납부를 위해서 외부기관에서 수신 받은 아파트의 동/호 정보를 관리 하기 위한 코드
      - name: 자동납부구분코드
        data_type: VARCHAR
        description: 자동납부를 구분하는 코드를 관리한다.
      - name: 자동납부구분명
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 자동납부 구분코드의 코드명
      - name: 통신요금자동납부전화번호
        data_type: VARCHAR
        description: 통신요금 자동납부시 고객전화번호를 말한다.
      - name: 배치작업내용
        data_type: VARCHAR
        description: 배치작업시 영역별 데이터 구분할수있는 내용
      - name: 업무유형구분코드
        data_type: VARCHAR
        description: KB당사 매출(매입)전표상의 업무 유형을 관리하기 위한 매입전표의 업무유형관리코드
      - name: 카드론거래매체구분코드
        data_type: VARCHAR
        description: 카드론 신청, 소개 시 인입되는 매체가 마케팅톡, Liiv Mate LGU+ 고객,테블릿브런치 등 인지를 구분하는 코드
      - name: 앱구분코드
        data_type: VARCHAR
        description: 간편결제구분을 위한 SWIPE구분코드를 포함하는 상위개념의 앱결제 구분코드
      - name: 가맹점명
        data_type: VARCHAR
        description: 해당 전표를 사용한 가맹점명 정보를 나타낸다. VAN사에서 보낸 전문 데이터를 가공없이 적재한다.
        synonyms: [가맹점이름, 상호, 상호명]
      - name: PG입점업체사업자등록번호
        data_type: VARCHAR
        description: 승인전표 내역의 PG가맹점 입점업체 사업자등록번호를 나타낸다.
      - name: 대외실적미포함대상여부
        data_type: VARCHAR
        description: 대외 실적 집계시 포함하지않는 대상을 나타낸다. - 알파영(리브NEXT) 카드
      - name: 가맹점수수료율구분코드
        data_type: VARCHAR
        description: 가맹점에 적용되는 신용, 체크, 해외, 공동망수수료율 등을 분류하는 구분
    measures:
      - name: 매출금액
        data_type: DECIMAL
        description: 회원이 사용하여 발생된 매출에 대한 금액 정보를 관리함
        synonyms: [매출, 매출액, 이용금액]
        required: true
        unit: KRW
        aggregation: sum_at_transaction_grain
      - name: 봉사료
        data_type: DECIMAL
        description: 매출전표상의 봉사료
        required: true
        unit: KRW
        aggregation: sum_at_transaction_grain
      - name: 매출미화금액
        data_type: DECIMAL
        description: 접수기관 또는 가맹점에서 매입요청한 매출전표의 미화금액
        required: true
        unit: KRW
        aggregation: sum_at_transaction_grain
      - name: 미화봉사료
        data_type: DECIMAL
        description: 접수기관 또는 가맹점에서 매입요청한 매출전표의 미화 봉사료(TIP)
        required: true
        unit: KRW
        aggregation: sum_at_transaction_grain
      - name: 할부기간개월수
        data_type: BIGINT
        description: 처리대상 매출건의 할부기간 개월수
        required: true
        unit: month
        aggregation: sum_at_transaction_grain
      - name: 할부수수료율
        data_type: DECIMAL
        description: 할부 매출에서 발생된 수수료율이다.
        required: true
        unit: ratio
        aggregation: recompute_or_weighted_avg
      - name: CA수수료율
        data_type: DECIMAL
        description: 단기카드대출(현금서비스)에 대한 수수료율 (24.01부터 소급적용)
        required: true
        unit: ratio
        aggregation: recompute_or_weighted_avg
      - name: CA수수료
        data_type: DECIMAL
        description: 단기카드대출(현금서비스) 시점에 발생된 수수료 (24.01부터 소급적용)
        required: true
        unit: KRW
        aggregation: sum_at_transaction_grain
      - name: 카드승인금액
        data_type: DECIMAL
        description: MFX_KB카드전표입력내역의 카드승인 처리된 금액
        required: true
        unit: KRW
        aggregation: sum_at_transaction_grain
      - name: 취소매출현금환입금액
        data_type: DECIMAL
        description: 취소매출전표 단말매입시 가맹점대금중 현금으로 환입된 금액
        required: true
        unit: KRW
        aggregation: sum_at_transaction_grain
      - name: 가맹점수수료율
        data_type: DECIMAL
        description: 매출전표 매입시 가맹점이 카드사에 지급해야 할 수수료율을 관리
        required: true
        unit: ratio
        aggregation: recompute_or_weighted_avg
      - name: 가맹점수수료
        data_type: DECIMAL
        description: "매출전표 매입시 매출금액을 기준으로 가맹점수수료율을 반영하여 산출한 가맹점이 카드사에게 지급하는 수수료 / 카드사는 매출금액에서 가맹점수수료를 차감한 금액을 대금지급처리"
        required: true
        unit: KRW
        aggregation: sum_at_transaction_grain
      - name: RF이용건수
        data_type: BIGINT
        description: RF매출전표 매입시 해당건이 포함하는 RF이용건수
        required: true
        unit: count
        aggregation: sum_at_transaction_grain
      - name: 출산장려지원금액
        data_type: DECIMAL
        description: 고운맘카드가 사용되었을때 정부에서 지원된 출산장려지원금액
        required: true
        unit: KRW
        aggregation: sum_at_transaction_grain
      - name: 소득공제제외대상금액
        data_type: DECIMAL
        description: 소득공제 산정제외대상 금액을 관리하는 항목
        required: true
        unit: KRW
        aggregation: sum_at_transaction_grain
      - name: 원천징수소득세금액
        data_type: DECIMAL
        description: 매출전표에서 아이사랑등 바우쳐 관련 특정 매출에 적용되는 소득세 합계를 의미.
        unit: KRW
        aggregation: sum_at_transaction_grain
      - name: 원천징수주민세금액
        data_type: DECIMAL
        description: 매출전표에서 아이사랑등 바우쳐 관련 특정 매출에 적용되는 주민세의 합계를 의미.
        unit: KRW
        aggregation: sum_at_transaction_grain
      - name: 최종CA수수료율
        data_type: DECIMAL
        description: "할인수수료율을 적용한 최종/실질 CA수수료율을 나타낸다(24.01부터 소급적용) . ※ 산출방식 : CA수수료율 · (100 - 할인수수료율) / 100"
        unit: ratio
        aggregation: recompute_or_weighted_avg
      - name: 해외서비스원화수수료
        data_type: DECIMAL
        description: 해외서비스(거래)이용시 부여되는 원화수수료 금액 (24.01부터 소급적용)
        unit: KRW
        aggregation: sum_at_transaction_grain
      - name: 부가가치세
        data_type: DECIMAL
        description: 세법에 근거하여 재화의 10%에 해당하는 세액이다 (BF151전문에서 수신받은 세금)
        unit: KRW
        aggregation: sum_at_transaction_grain
    time_dimensions:
      - name: 기준년월
        data_type: VARCHAR
        description: KB카드전표입력의 매입년월일 기준으로 생성 되는 기준년월
        synonyms: [년월, 월, 기준월]
        required: true
        format: YYYYMM
        role: snapshot_month
      - name: 전표매입년월일
        data_type: VARCHAR
        description: 카드전표의 매입이 발생한 년월일
        format: YYYYMMDD
        role: event_date
      - name: 매출전표접수년월일
        data_type: VARCHAR
        description: "접수기관(VAN, RF교통기관, 직라인 등)으로부터 일괄매입DATA를 전송받아 원장에 반영하는 일자 / 가맹점으로부터 매출전표를 접수후 영업점에서 온라인 매입을 등록한 일자"
        format: YYYYMMDD
        role: event_date
      - name: 전표매출년월일
        data_type: VARCHAR
        description: MFX_KB카드전표입력내역의 카드전표의 매출년월일
        format: YYYYMMDD
        role: event_date
      - name: 취소년월일
        data_type: VARCHAR
        description: 국내 또는 해외 현지에서 취소가 발생한 일자
        format: YYYYMMDD
        role: event_date
      - name: 가맹점대금지급예정년월일
        data_type: VARCHAR
        description: 매출전표 매입처리시 가맹점지급주기에 따라 확정되는 가맹점에 대금을 지급할 예정일자
        format: YYYYMMDD
        role: event_date
      - name: 대금지급년월일
        data_type: VARCHAR
        description: 가맹점에 실제 대금지급이 이루어진 년월일
        format: YYYYMMDD
        role: event_date
      - name: 기산년월일
        data_type: VARCHAR
        description: 거래에 기준이 되는 년/월/일이다
        format: YYYYMMDD
        role: event_date
      - name: 결제일
        data_type: VARCHAR
        description: 사용한카드의 결제일이다.

        format: DD
        role: day_of_month
    table_kind: transaction_fact
    source_definition: 1.당사에서 매입한 당사 전표를 관리하는 기초원장입니다 1) 대상전표 범주는 아래와 같습니다. 01.당사매출전표내역 - 당사회원의 매출전표(RF교통포함) 매입정보를 관리합니다. - 카드승인, 매입가맹점 정보등을 기본으로 수수료와 대금지급 정보등을 관리합니다. 02.BC카드매출전표내역
      - BC카드사에서 매입한 기준으로 전건매입처리합니다. - BF151 전문 수신하여 매입처리후 당사BC 매출내역을 생성된 정보를 관리합니다. 03.현금서비스 - GBH/카드이용에서 FILE로 입수받은 현금서비스 정보를 관리합니다. 04.국제전표(신용/체크) - INBOUND/OUTBOUND국제매입전표기본내역을 관리한다.
      - 해외 브랜드와 송/수신 전문 기준의 현지거래내역 및 가맹점 정보를 관리합니다. - OUTBOUND 해외매출내역에 대한 회원정보를 매입심사시점에 반영합니다. - 매입심사 시점에 산정된 청구금액 및 수수료금액 관리합니다. - OUTBOUND 해외매출에 대한 비정상 전표에 대한 심사오류 상태를 관리합니다. 05.선불카드
      - 선불카드 관련 거래내역을 관리합니다. 2) ASIS의 입수된 전표와 TOBE 전표의 차이점은 다음과 같습니다. 01.당사매출전표내역(ASIS대비 모수증가) - 매입경로구분코드 IN ('01','02') [ KB카드창구 / KB은행창구 ] 센터처리기관구분코드 = '14' [ RF ] 02.BC카드매출전표내역(ASIS대비...
    source_metadata:
      workbook_entity: 전표 정산(카드전표입력내역)
      source_column_count: 130
      queryable_column_count: 129
      excluded_technical_columns: [ADW시스템최종갱신일시]
    primary_time_dimension: 전표매출년월일
    aggregation_policy:
      deduplicate_before_aggregation: false
      aggregate_across_time: true
      default_measure_behavior: sum_at_transaction_grain
      canonical_formulas:
        카드매출금액: SUM("매출금액")
      business_time_dimension: 전표매출년월일
  - name: tbdaacb02
    physical_table: tbdaacb02
    korean_name: 부점
    description: "당사 부점(지점/영업점) 마스터 테이블. 한 행은 특정 적용기간의 하나의 부점을 의미한다. 부점명(국/영문)·주소·전화번호·부점구분·개점/폐쇄 년월일 등을 담아 부점(지점) 기준 분석과 부점명 조인에 사용한다."
    grain: 부점코드 × 적용시작년월일 1건 (부점 마스터, 기간 이력)
    primary_key: [부점코드, 적용시작년월일]
    synonyms: [부점, 지점, 영업점, 점포]
    dimensions:
      - name: 부점코드
        data_type: VARCHAR
        description: 부점에 부여된 고유번호
        required: true
      - name: 은행코드
        data_type: VARCHAR
        description: 해당부점에 해당하는 은행코드를 관리하는 속성이다
      - name: 한글부점명
        data_type: VARCHAR
        description: 당사(KB국민카드) 또는 KB국민은행 부점코드의 한글명
      - name: 한글약어부점명
        data_type: VARCHAR
        description: 한글 약어 부점코드의 명칭
      - name: 영문부점명
        data_type: VARCHAR
        description: 부점의 영문명을 관리하는 속성이다
      - name: 우편번호
        data_type: VARCHAR
        description: 부점의 우편번호를 관리하는 속성이다
      - name: 한글부점상세주소
        data_type: VARCHAR
        description: 부점의 한글 상세주소를 관리하는 속성이다.
      - name: 영문부점상세주소
        data_type: VARCHAR
        description: 부점의 영문 상세주소를 관리하는 속성이다.
      - name: 부점구분코드
        data_type: VARCHAR
        description: 부점의 부점구분코드의 속성을 관리하는 속성이다 (부점유형구분코드)
        codebook_ref: branch_classification
      - name: 출장소모점부점코드
        data_type: VARCHAR
        description: 출장소인 경우 모점코드를 관리하는 속성이다
      - name: 부점전화번호
        data_type: VARCHAR
        description: 해당부점의 지역전화번호를 관리하기 위한 속성이다
      - name: 부점ARS전화번호
        data_type: VARCHAR
        description: 해당부점의 ARS 전용전화번호를 관리하기 위한 속성이다
      - name: 부점팩스번호1
        data_type: VARCHAR
        description: 해당부점의 FAX 전용전화번호1를 관리하기 위한 속성이다
      - name: 부점팩스번호용도내용1
        data_type: VARCHAR
        description: 해당부점의 팩스번호1의 용도를 관리하기 위한 속성이다
      - name: 부점팩스번호2
        data_type: VARCHAR
        description: 해당부점의 FAX 전용전화번호2를 관리하기 위한 속성이다
      - name: 부점팩스번호용도내용2
