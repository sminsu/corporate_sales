glossary:
  - term: "법인카드"
    canonical: "개인기업구분코드 = '2' 인 카드/회원"
    description: "기업(법인) 명의로 발급·이용되는 카드. 개인기업구분코드가 '2'(기업)인 레코드를 의미한다."
    aliases: ["기업카드", "법인", "기업"]
    sql_hint: "법인/기업 조건은 \"개인기업구분코드\" = '2' 를 사용한다."
  - term: "기업규모"
    canonical: "enterprise_size.value_semantics로 해석한 기업규모구분코드"
    description: "기업규모산정미대상=0, 대기업=1, 중소기업=2, 중소기업간주=3, 외부감사대상 중소기업=4, 외부감사비대상 중소기업=5, 영세기업=6, 공공기업=7, 가계=8, 기타=9로 해석한다."
    aliases: ["대기업", "중소기업", "중소기업간주", "외부감사대상 중소기업", "외부감사비대상 중소기업", "영세기업", "공공기업", "대규모기업", "large enterprise"]
    sql_hint: "기업규모는 tbdaaat01의 현재 기업규모구분코드를 사용한다. 당시 또는 월별 과거 기업규모를 명시한 경우에만 tmdaa1d01을 사용한다."
    domains: [card_usage, customer_card_portfolio]
  - term: "개인카드"
    canonical: "개인기업구분코드 = '1' 인 카드/회원"
    description: "개인 명의로 발급된 카드. 개인기업구분코드가 '1'(개인)인 레코드."
    aliases: ["개인", "개인회원"]
    sql_hint: "개인 조건은 \"개인기업구분코드\" = '1' 을 사용한다."
  - term: "활성가맹점"
    canonical: "가맹점거래정지여부 = 'N' 인 가맹점"
    description: "거래정지 상태가 아닌(영업 중인) 가맹점."
    aliases: ["정상가맹점", "거래중가맹점", "영업중가맹점"]
    sql_hint: "활성 조건은 (\"가맹점거래정지여부\" = 'N' OR \"가맹점거래정지여부\" IS NULL) 를 사용한다."
  - term: "연체"
    canonical: "연체회차 > 0 또는 연체발생년월일 존재"
    description: "카드/여신 대금을 약정일까지 상환하지 못한 상태. 카드연체일별(tddaa3l01)의 연체회차/연체일수로 판단한다."
    aliases: ["연체상태", "미납", "delinquency"]
    sql_hint: "연체 조건은 \"신용카드연체회차\" > 0 또는 \"연체일수\" > 0 으로 본다."
  - term: "신규고객"
    canonical: "해당 기준년월에 최초 등록된 고객"
    description: "특정 기준년월/년월일에 신규로 등록·발급된 고객 또는 카드."
    aliases: ["신규", "신규등록", "신규회원", "신규발급"]
    sql_hint: "신규는 등록년월일/신규발급년월일이 조회 기간에 속하는 레코드를 사용한다."
  - term: "기준년월"
    canonical: "YYYYMM 형식의 집계 기준 월"
    description: "월별 집계 테이블의 시점 기준. 'YYYYMM' 6자리 문자열이다. (예: '202512')"
    aliases: ["년월", "월", "기준월", "집계월"]
    sql_hint: "월 조건은 \"기준년월\" = '202512' 형식, 기간은 BETWEEN '202501' AND '202512'."
  - term: "기준년월일"
    canonical: "YYYYMMDD 형식의 일자 기준"
    description: "일별 스냅샷 테이블의 시점 기준. 'YYYYMMDD' 8자리 문자열."
    aliases: ["기준일", "일자", "날짜", "기준일자"]
    sql_hint: "일자 조건은 \"기준년월일\" = '20251231' 형식을 사용한다."
  - term: "6무"
    canonical: "기준월 유효 기업 신용/체크카드 수 > 0 이고, 기준월 포함 최근 6개월 월 최신 스냅샷의 신용+체크 이용금액이 모두 0"
    description: "기업카드는 보유하지만 최근 6개월 동안 기업 신용·체크카드 이용 실적이 없는 신규 영업 대상군."
    aliases: ["6개월 무실적", "최근 6개월 미이용", "기업카드 무실적"]
    sql_hint: "tmdaa1d12를 고객×파생 기준년월별 최신행으로 축소한 뒤 입력 기준년월일의 보유 조건과 6개월 NOT EXISTS 이용이력 조건을 함께 적용한다. 기준년월일이 없으면 입력을 요청한다."
  - term: "유실적"
    canonical: "지정 기준월의 고객별 최신 스냅샷에서 금월신용카드이용금액 + 금월체크카드이용금액 > 0"
    description: "법인회원에게 카드 이용 실적이 있다는 뜻이다. 업체 수는 고객별 월 최신행으로 중복을 제거한 뒤 고객식별자를 고유 집계한다."
    aliases: ["실적 있음", "실적이 있는", "이용실적 있음", "이용 실적이 있는"]
    sql_hint: "tbdaa1d12를 지정 월의 고객별 최신 기준년월일 1건으로 축소하고 신용+체크 이용금액 합계가 0보다 큰 고객식별자를 COUNT(DISTINCT)한다."
  - term: "이탈회원"
    canonical: "기준월 유효 기업 신용+체크카드 수 = 0 이고 최근 조회기간 신용+체크 이용이력 > 0"
    description: "참고 질의의 영업용 대리 정의이며 실제 탈회 상태코드 자체를 의미하지 않는다."
    aliases: ["탈회회원", "해지회원", "과거이용 현재미보유"]
    sql_hint: "현재 카드수 0과 과거 이용이력을 함께 확인하고 마지막 이용월을 계산한다."
  - term: "기업카드보유"
    canonical: "유효기업신용카드수 + 유효기업체크카드수 > 0"
    description: "신용/체크는 카드 종류 축이고 개별/공용은 소유 형태 축이므로 네 컬럼을 모두 더하지 않는다."
    aliases: ["기업카드 소지", "법인카드 보유"]
    sql_hint: "COALESCE(유효기업신용카드수,0) + COALESCE(유효기업체크카드수,0) > 0"
  - term: "한도소진율"
    canonical: "1 - 기업총잔여한도금액 / 기업총한도금액"
    description: "부여 한도 중 이미 소진된 비율. 고객별 값은 고객의 최신 snapshot에서 계산하고, 여러 기업의 포트폴리오 값은 잔여한도 합계와 총한도 합계의 비율로 다시 계산한다. 총한도가 0인 행은 계산 대상에서 제외한다."
    aliases: ["한도사용률", "한도사용비율"]
    sql_hint: "고객별은 (1.0 - CAST(잔여한도 AS DOUBLE) / NULLIF(CAST(총한도 AS DOUBLE), 0.0)) * 100, 포트폴리오는 (1.0 - SUM(잔여한도) / NULLIF(SUM(총한도), 0.0)) * 100으로 계산한다."
  - term: "기업한도"
    canonical: "tbdaa1d12의 기업총한도금액·기업총잔여한도금액"
    description: "기업고객에게 부여된 총한도와 현재 남은 잔여한도. 일별 snapshot이므로 기준월 고객별 최신행을 먼저 선택한다."
    aliases: ["기업 총한도", "법인 한도", "잔여한도", "가용한도", "한도 현황"]
    sql_hint: "SUBSTR(기준년월일,1,6)으로 월을 제한하고 고객식별자별 기준년월일 DESC ROW_NUMBER() = 1을 적용한 뒤 총한도와 잔여한도를 조회한다."
  - term: "월평균이용금액"
    canonical: "요청 기간 신용+체크 이용금액 합계 / 요청 기간 달력 월수"
    description: "기업별 월평균은 데이터가 없는 월도 0원으로 포함한다. 사용월 평균·실적월 평균을 명시한 경우에만 이용실적이 있는 월수를 분모로 사용한다."
    aliases: ["월 평균 이용금액", "월평균 사용금액", "월 평균 사용액", "월평균 카드이용액"]
    sql_hint: "tbdaa1d12를 고객×월 최신행으로 축소하고 신용+체크 이용금액을 합산한 뒤 DATE_DIFF('month', 시작월, 종료월) + 1로 나눈다."
  - term: "관리기업"
    canonical: "현재 요청에서 파라미터로 직접 입력한 사업자등록번호 목록에 포함된 담당 기업"
