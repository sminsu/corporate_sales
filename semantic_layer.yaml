    semantic_cautions:
      - 현재 고객 속성은 tbdaaat01을 사용하고 특정 기준년월의 과거 속성은 tmdaa1d01을 사용한다.
      - 직업유형구분코드는 직업구분코드나 업종구분코드와 다른 분류축이므로 서로 대체하지 않는다.
      - 주부는 업종구분코드에도 존재하므로 직업유형 또는 고객업종 문맥이 없으면 코드를 임의 확정하지 않는다.
