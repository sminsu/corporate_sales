    dimensions:
      - name: 충당금식별번호
        data_type: VARCHAR
        description: 대손충당금개별자산(여신,카드등)을unique하게인식할수있도록동일한구분원칙에의해생성시킨식별자
        required: true
      - name: 충당금차주구분코드
        data_type: VARCHAR
        description: "충당금익스포져분류에따라차주 01:개인카드 02:기업카드 03:카드론 04:할부금융 05:팩토링개인 06:팩토링기업 07:기타금융자산"
        required: true
      - name: 회원일련번호
        data_type: VARCHAR
        description: 카드회원일련번호(카드시스템관리.8자리)
        synonyms: [회원번호, 회원ID]
      - name: 충당금채권관리번호
        data_type: VARCHAR
        description: "IFRS대손충당금 산출대상인 대여금 및 수취채권을 식별하고 관리하기위한 번호 (신용카드,할부금융,팩토링,리스,일반여신,KDSB채권,외화사모사채,비원장성 여신,BS계정관리여신,특수채권등의 여신 또는 채권관리번호)"
      - name: 충당금산출계정관리구분코드
        data_type: VARCHAR
        description: "카드자산에대한충당금산출단위를구분하여관리하는코드(이월/미이월을구분,유이자할부/무이자할부를구분)(ISBI100000000.KB카드할부대급금(유이자할부),ISIF100000000.KB카드할부대급금(무이자할부),ISBI200000000.BC카드할부대급금(유이자할부)등)"
      - name: 회계계정과목코드
        data_type: VARCHAR
        description: 회계적인 사건을 기록하기 위해 사전에 회계기준에 의해 정의한 코드를 의미한다 (KB카드계리 및 결산을위한 계정과목코드)
      - name: 상품코드
        data_type: VARCHAR
        description: "상품대분류+상품중분류+템플릿코드별상품에대해고유하게부여한일련번호이다(상품팩토리의상품코드를관리함) (ex상품대분류코드(2)||상품중분류코드(2)||상품템플릿코드(2)||상품번호(5)"
      - name: 금융회계구분코드
        data_type: VARCHAR
        description: "자산의회계처리에따른구분을입/출력하는항목 '0'해당무 '1'일반여신 '2'기타금융자산 '3'당기손익인식금융자산 '4'매도가능금융자산 '5'만기보유금융자산 '6'지분법적용투자주식 '7'파생상품 '8'비금융자산 '9'난외"
      - name: 고객식별자
        data_type: VARCHAR
        description: "고객에게부여되는중복되지않는고객의식별자이다.구성:고객유형구분(1)+일련번호(8)+체크디지트(1)고객유형구분:0~6개인,7~8기업,9예비"
        synonyms: [고객ID, 고객번호]
      - name: 개인기업구분코드
        data_type: VARCHAR
        description: 카드자산의개인또는기업을구분하는코드 0해당무 1개인 2기업 3공용
      - name: 유효회원구분코드
        data_type: VARCHAR
        description: 해당회원의무효,유효회원구분0무효1유효
    measures:
      - name: 원화대출잔액
        data_type: DECIMAL
        description: 해당익스포져의원화대출잔액
        unit: KRW
        aggregation: sum_at_declared_month_grain
      - name: 기대1년PD율
        data_type: DECIMAL
        description: (대손충당금산출보정월명세기본) 1년 경험 PD적용값
        unit: ratio
        aggregation: recompute_or_weighted_avg
      - name: 충당금기대LGD율
        data_type: DECIMAL
        description: (대손충당금산출보정월명세기본) 경험LGD적용값
        unit: ratio
        aggregation: recompute_or_weighted_avg
      - name: 기대대손충당금
        data_type: DECIMAL
        description: 충당금평가방법(개별/집합)에따라서B/S에적용할해당계좌의최종기대대손충당금액
        unit: number
        aggregation: sum_at_declared_month_grain
    time_dimensions:
      - name: 기준년월
        data_type: VARCHAR
        description: 해당 데이터의 기준년월로 결정 및 판단의 기준이 되는 년월
        synonyms: [년월, 월, 기준월]
        required: true
        format: YYYYMM
        role: snapshot_month
      - name: 대출신규년월일
        data_type: VARCHAR
        description: 대출 계약이 발생한 신규년월일 값 (yyyymmdd)
        format: YYYYMMDD
        role: event_date
      - name: 대출만기년월일
        data_type: VARCHAR
        description: 대출계좌의만기일자를관리한다

        format: YYYYMMDD
        role: event_date
    table_kind: monthly_aggregate
    source_definition: '원천테이블 : MEW대손충당금산출보정월명세기본 테이블 1:1 적재 충당금산출대상자산별로해당하는충당금산출방법(집합평가,개별평가,기타평가)을이용하여산출된최종충당금산출정보를관리한다'
    source_metadata:
      workbook_entity: 수집(대손충당금산출보정월명세기본)
      source_column_count: 19
      queryable_column_count: 18
      excluded_technical_columns: [BDP시스템최종갱신일시]
    primary_time_dimension: 기준년월
    aggregation_policy:
      deduplicate_before_aggregation: false
      aggregate_across_time: true
      default_measure_behavior: sum_at_declared_month_grain
  - name: tddaa3d01
    physical_table: tddaa3d01
    korean_name: 카드일별기본
    description: "카드 기본 정보의 일자별 스냅샷 테이블. 한 행은 특정 기준년월일에 관측된 하나의 카드를 의미한다. tbdaaat05(회원카드기본)과 유사한 카드 속성을 일자 시점으로 보관해, 특정 일자 시점의 카드 보유/상태 분석에 사용한다."
    grain: 기준년월일 × 회원일련번호 × 카드구분키번호 1건 (카드 일별 스냅샷)
    primary_key: [기준년월일, 회원일련번호, 카드구분키번호]
    synonyms: [카드일별, 카드스냅샷, 일별카드]
    dimensions:
      - name: 회원일련번호
        data_type: VARCHAR
        description: 당사(KB국민카드)와 계약한 회원을 관리하는 식별번호
        synonyms: [회원번호, 회원ID]
        required: true
      - name: 카드구분키번호
        data_type: VARCHAR
        description: 회원별로 부여되는 일련번호에 카드상품 또는 계약별로 추가되는 일련번호이다. / 기본적으로 카드브랜드구분코드 + 일련번호로 구성된다.
        required: true
      - name: 개인기업구분코드
        data_type: VARCHAR
        description: 개인 또는 기업을 구분하는 코드
      - name: 카드소유자구분코드
        data_type: VARCHAR
        description: 카드 소유자 유형 (본인/가족/대표/공용/개별)
      - name: 본인카드구분키번호
        data_type: VARCHAR
        description: 가족 또는 사업자/사업장카드일 경우 본인 또는 대표에 해당하는 카드구분키번호이다.
      - name: 소유자고객식별자
        data_type: VARCHAR
        description: 소유자고객식별자를관리한다.
      - name: 소유자고객관리번호
        data_type: VARCHAR
        description: 소유자고객관리번호를관리한다.
      - name: 본인고객식별자
        data_type: VARCHAR
        description: 고객자신에 대한 식별자
      - name: 본인고객관리번호
        data_type: VARCHAR
        description: 카드에 해당하는 소유자에 따른 본인고객관리번호이다.
      - name: 최종카드식별자
        data_type: VARCHAR
        description: 카드상품에 해당하는 카드 중 재발급, 갱신시 최종카드를 나타내는 식별자이다.
      - name: 최종카드상세일련번호
        data_type: DECIMAL
        description: 연회비환급삭제의 기준이 되는 최종 발급 카드번호의 상세일련번호
      - name: 상품코드
        data_type: VARCHAR
        description: 상품대분류+상품중분류+템플릿코드별 상품에 대해 고유하게 부여한 일련번호이다
      - name: 상품대분류구분코드
        data_type: VARCHAR
        description: KB카드 전사차원에서 상품의 대분류를 구분하여 정의한 코드를 관리한다.
      - name: 상품중분류구분코드
        data_type: VARCHAR
        description: KB카드 전사차원에서 상품의 대분류 하위 중분류를 구분하여 정의한 코드를 관리한다.
      - name: 카드등급그룹코드
        data_type: VARCHAR
        description: KB카드사의 카드상품 등급에 대한 분류의 그룹핑 코드
      - name: 제휴코드
        data_type: VARCHAR
        description: 상품코드의 마지막 5자리로 정의, 상품코드를 그대로 사용함으로 별도 목록성 테이블은 관리하지 않고, 코드로 표기하고자 함
      - name: 카드브랜드구분코드
        data_type: VARCHAR
        description: "카드브랜드구분코드 1:로칼(국민) 2:마스터 3:비자 4:JCB"
      - name: KB카드BC카드구분코드
        data_type: VARCHAR
        description: KB카드와 BC카드를 구분하는코드
      - name: 카드등급구분코드
        data_type: VARCHAR
        description: 카드의 등급을 구분하는코드(일반,실버,골드,플래티늄 등)
      - name: 알파원카드여부
        data_type: VARCHAR
        description: 알파원카드로 등록된 카드인지에 대한 여부
      - name: 카드BIN번호
        data_type: VARCHAR
        description: 카드의 발급사를 구분하는 BIN 번호이다.
      - name: 구카드식별자
        data_type: VARCHAR
        description: 이전 카드에 해당하는 카드식별지이다.
      - name: 유효신용카드여부
        data_type: VARCHAR
        description: 카드가 만료년월일이 경과하지 않고 통합한도가 존재하는 유효한 신용카드인지여부
      - name: 유효체크카드여부
        data_type: VARCHAR
        description: 체크카드가 만료년월일이 경과하지 않은 유효한 체크카드인지여부
      - name: 결제정보이원화구분코드
        data_type: VARCHAR
        description: 카드 결제단위 청구방식이 통합 및 이원화하고 있는지를 구분하는 코드 (KB카드/KB비씨카드,신용카드/체크카드,일반카드/특정카드)
      - name: 카드결제기관구분코드
        data_type: VARCHAR
        description: 카드결제계좌의 기관구분코드
      - name: 청구번호
        data_type: VARCHAR
        description: 회원일련번호+청구일련번호
      - name: 지로코드
        data_type: VARCHAR
        description: 금융결제원에서 대한민국에 소재하는 금융기관의 각 본지점에 부여하는 번호
      - name: 회수방법구분코드
        data_type: VARCHAR
        description: 결제 대금 회수방법구분코드
      - name: 청구지주소구분코드
        data_type: VARCHAR
        description: 자택, 직장,이메일 등 청구지 주소를 구분하는 코드
      - name: 카드이용한도구분코드
        data_type: VARCHAR
        description: 카드별 이용한도를 구분하는 코드
      - name: 카드당한도사용여부
        data_type: VARCHAR
        description: 카드에 해당하는 한도를 카드당 한도를 사용할지에 대한 여부
      - name: 부서사업장한도사용여부
        data_type: VARCHAR
        description: 카드에 해당하는 한도를 부서사업장한도를 사용할지에 대한 여부
      - name: 통합한도등급코드
        data_type: VARCHAR
        description: 현금서비스를 포함하여 부여한 총 한도등급코드
      - name: CA한도등급코드
        data_type: VARCHAR
        description: 단기카드대출(현금서비스)을 받을 수 있는 한도의 등급코드
      - name: 역할유형구분코드
        data_type: VARCHAR
        description: 권유자 역할 유형 코드 (배우자/직원/알바/..)
      - name: 권유자번호
        data_type: VARCHAR
        description: "회원가입신청서 작성시 권유 모집인 식별을 위해 사용하는 번호 역할구분과 모집인번호가 조합 권유자식별자 -모집인구분(역할유형구분코드) +모집인번호(모집인식별내용(M) + 모집인코드)"
      - name: 모집부점코드
        data_type: VARCHAR
        description: 신용카드, 가맹점, 자동납부 신청을 모집한 부점코드
      - name: 입력부점코드
        data_type: VARCHAR
        description: 입력을 발생 시킨 부점코드
      - name: 관리부점코드
        data_type: VARCHAR
        description: 고객이나 채권,가맹점 등을 관리하는 부점코드
      - name: 리볼빙대상여부
        data_type: VARCHAR
        description: 회원 카드상품별 리볼빙 대상인지를 판단하는 여부이다.
      - name: 교체카드여부
        data_type: VARCHAR
        description: 카드 만료일이 되어서 갱신된 경우와 분실/도난으로 카드를 교체한 여부이다.
      - name: 카드등급변경여부
        data_type: VARCHAR
        description: 카드 재발급 또는 갱신시 카드등급을 변경하여 받은 여부이다.
      - name: 갱신카드여부
        data_type: VARCHAR
        description: 카드 만료일에 갱신발급 받은 여부이다.
      - name: 카드우선발급여부
        data_type: VARCHAR
        description: 카드 제작시 우선(긴급) 발급을 하기 위한 여부이다.
      - name: 모바일카드여부
        data_type: VARCHAR
        description: 카드상품이 모바일카드인지를 판단하는 여부이다.
      - name: 자동갱신비대상사유구분코드
        data_type: VARCHAR
        description: 카드 자동갱신 대상에서 제외된 사유를 구분하는 코드
      - name: 카드정보변경유형일련번호
        data_type: VARCHAR
        description: "카드의 정보변경 내용을 구분하는 카드처리유형구분코드(발급비청구, 비밀번호변경, 사용등록, 카드해지 등)중 카드해지에 대한 상세사유이다. (03:연회비관련 불만,04:당행카드2개이상소지,11:거래정지관련 불만 등등)"
      - name: BC카드관리구분코드
        data_type: VARCHAR
        description: 동남카드/비씨카드 를 구분하는 코드
      - name: 제휴관리번호
        data_type: VARCHAR
        description: 제휴사에서 관리를 원할하게 하기 위해 고객에게 제공한 관리번호이다.(아시아나항공, GS번호, 대한항공, ABC번호 등...)
      - name: 신청서접수번호
        data_type: VARCHAR
        description: "카드(개인,기업),한도(개인,기업),가맹점,장기카드대출 신청서 접수단위로 부여되는 번호 / 각 업무별 용어사용 예시 -카드신청서접수번호 -한도신청서접수번호 -가맹점신청서접수번호 -카드론신청서접수번호"
      - name: 신청서접수대상여부
        data_type: VARCHAR
        description: 카드신청시 신청서로 들어온 대상인지를 판단하는 여부이다.
      - name: 카드신청서이미지저장여부
        data_type: VARCHAR
        description: 카드신청서를 이미지로 저장되어 있는지 여부
      - name: 카드거래매체구분코드
        data_type: VARCHAR
        description: 거래 매체별 종류
      - name: 교부유형구분코드
        data_type: VARCHAR
        description: 카드 교부방법 종류 (인편/우편/지점방문/등등)
      - name: 발급유형구분시기구분코드
        data_type: VARCHAR
        description: 카드가 발급된 유형및 시기를 분류한 구분코드(선발급,즉시발급,일괄발급 등)
      - name: 발급유형구분코드
        data_type: VARCHAR
        description: 카드의 발급유형을 구분하는 코드(신규발급,재발급 등)
      - name: 카드도난분실발급여부
        data_type: VARCHAR
        description: 카드를 도난 분실시 거래정지를 등록하고 재발급 받은 여부이다.
      - name: 유선발급구분코드
        data_type: VARCHAR
        description: 카드 유선 발급 구분 (임시/재발급/교체..)
      - name: 발송기관구분코드
        data_type: VARCHAR
        description: 회원에게 카드를 발송해주는 기관구분코드
      - name: 수령지주소구분코드
        data_type: VARCHAR
        description: 자택, 직장, 제3청구지 등 카드 수령시 수령지 주소를 구분하는 코드
      - name: 카드교부희망부점코드
        data_type: VARCHAR
        description: 카드 교부시 고객이 희망(요청)하는 부점코드
      - name: 카드실물보유부점코드
        data_type: VARCHAR
        description: 카드를 실물 부유하고 있는 영업점부점코드이다.
      - name: 실물보유구분코드
        data_type: VARCHAR
        description: 실물 카드 보유/미보유 구분
      - name: CD기기능구분코드
        data_type: VARCHAR
        description: CD기능 연결 계좌를 구분하는 코드 (결제계좌/별도계좌)
      - name: CD상태구분코드
        data_type: VARCHAR
        description: CD기능 등록/해지 상태 구분코드
      - name: 카드신용체크이원화구분코드
        data_type: VARCHAR
        description: 카드의 결제단위가 신용카드/체크카드이원화 인지 통합인지 구분하는코드
      - name: 카드일반특정이원화구분코드
        data_type: VARCHAR
        description: 카드의 결제단위가 일반카드/특정카드이원화 인지 통합인지 구분하는 코드 이다.
      - name: 결제다원화카드여부
        data_type: VARCHAR
        description: 결제계좌 다원화를 이용하는 회원에 대한 카드 여부를 나타낸다.
      - name: 고객선택자재구분코드
        data_type: VARCHAR
        description: 카드를 신청시 고객이 선택한 상품의 제휴코드이다. (자재구분코드)
      - name: 비계좌선불카드여부
        data_type: VARCHAR
        description: 비계좌 선불카드 여부 인지를 나타낸다. ※ 선불전자지급수단을 충전계정(결제계좌)으로 하는 선불카드 (은행의 리브포켓, 당사의 머니 등)
      - name: 유효비계좌선불카드여부
        data_type: VARCHAR
        description: 유효한 비계좌 선불카드인지를 나타난다.
    measures:
      - name: 기업카드신용한도금액
        data_type: DECIMAL
        description: 기업(법인, 사업자, 사업장)카드의 카드별로 부여된 신용한도 금액을 의미한다.
        required: true
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 카드반송회차
        data_type: BIGINT
        description: 카드를 발송하고 다양한 사유에 의해 반송된 회차이다.
        required: true
        unit: count
        aggregation: semi_additive_latest_snapshot
    time_dimensions:
      - name: 기준년월일
        data_type: VARCHAR
        description: 카드정보 데이터를 매일 시점의 스냅샷 데이터를 생성하기 위해 사용하는 일자 정보로 해당 기준년월일의 카드정보기본 데이터를 적재한다.
        synonyms: [기준일, 일자, 날짜]
        required: true
        format: YYYYMMDD
        role: snapshot_date
      - name: 결제일
        data_type: VARCHAR
        description: 회원이 사용한 카드대금이 매월 결제되는 일
        format: DD
        role: day_of_month
      - name: 카드신규발급년월일
        data_type: VARCHAR
        description: 카드가 신규로 발급된 일자이다.
        format: YYYYMMDD
        role: event_date
      - name: 최종카드발급년월일
        data_type: VARCHAR
        description: 상품에 해당하는 카드가 최종 카드발급 접수된 일자이다.
        format: YYYYMMDD
        role: event_date
      - name: 등록년월일
        data_type: VARCHAR
        description: 해당테이블에 데이터가 등록된 년월일
        format: YYYYMMDD
        role: event_date
      - name: 카드만료년월일
        data_type: VARCHAR
        description: 카드 유효기간의 종료일
        format: YYYYMMDD
        role: effective_to
      - name: 이전카드만료년월일
        data_type: VARCHAR
        description: 카드가 해지및 갱신으로인해 만료년월이 변경될경우 변경되기 이전의 만료년월일을 말함
        format: YYYYMMDD
        role: effective_to
      - name: 실제카드만료년월일
        data_type: VARCHAR
        description: 카드가 실제만료(만료년월이 적용 되었거나 해지년월이 적용)되는 최종년월일
        format: YYYYMMDD
        role: effective_to
      - name: 해지년월일
        data_type: VARCHAR
        description: 회원의 카드가 해지된 년월일
        format: YYYYMMDD
        role: event_date
      - name: 신청서접수년월일
        data_type: VARCHAR
        description: 카드신청 또는 카드한도의 신청서 정보를 접수 처리(온라인,배치)한 일자
        format: YYYYMMDD
        role: event_date
      - name: 카드교부년월일
        data_type: VARCHAR
        description: 해당카드를 발급받고 영업점에서 교부한 일자이다.
        format: YYYYMMDD
        role: event_date
      - name: 카드반송년월일
        data_type: VARCHAR
        description: 고객이 카드 실물을 반송한 일자이다.

        format: YYYYMMDD
        role: event_date
    table_kind: daily_snapshot
    source_definition: 1. DAA카드정보기본 의 일 스냅샷 정보 엔티티
    source_metadata:
      workbook_entity: 카드(일카드정보기본시점정보)
      source_column_count: 87
      queryable_column_count: 86
      excluded_technical_columns: [ADW시스템최종갱신일시]
    primary_time_dimension: 기준년월일
    aggregation_policy:
      deduplicate_before_aggregation: true
      aggregate_across_time: flow_measures_only
      default_measure_behavior: semi_additive_latest_snapshot
  - name: tddaa3e21
    physical_table: tddaa3e21
    korean_name: 모집최초회원카드일별
    description: "최초 모집 회원(신규 모집 카드)에 대한 일자별 정보를 적재하는 테이블. 한 행은 특정 일자에 최초회원으로 분류된 카드를 의미한다. 카드 발급/만료 년월일, 카드등급·브랜드·BIN 등을 담아 신규 모집·신규 발급 분석에 사용한다."
    grain: 기준년월일 × 최종카드발급년월일 × 회원 × 카드 1건
    primary_key: [기준년월일, 최종카드발급년월일, 회원일련번호, 카드구분키번호]
    synonyms: [신규모집, 최초모집, 모집회원, 신규발급카드]
    dimensions:
      - name: 회원일련번호
        data_type: VARCHAR
        description: 당사(KB국민카드)와 계약한 회원을 관리하는 식별번호
        synonyms: [회원번호, 회원ID]
        required: true
      - name: 카드구분키번호
        data_type: VARCHAR
        description: 회원별로 부여되는 일련번호에 카드상품 또는 계약별로 추가되는 일련번호이다. / 기본적으로 카드브랜드구분코드 + 일련번호로 구성된다.
        required: true
      - name: 본인카드구분키번호
        data_type: VARCHAR
        description: 가족 또는 사업자/사업장카드일 경우 본인 또는 대표에 해당하는 카드구분키번호이다.
      - name: 소유자고객식별자
        data_type: VARCHAR
        description: 소유자고객식별자를관리한다.
      - name: 소유자고객관리번호
        data_type: VARCHAR
        description: 소유자고객관리번호를관리한다.
      - name: 본인고객식별자
        data_type: VARCHAR
        description: 고객자신에 대한 식별자
      - name: 본인고객관리번호
        data_type: VARCHAR
        description: 카드에 해당하는 소유자에 따른 본인고객관리번호이다.
      - name: 개인기업구분코드
        data_type: VARCHAR
        description: 개인 또는 기업을 구분하는 코드
      - name: 카드소유자구분코드
        data_type: VARCHAR
        description: 카드 소유자 유형 (본인/가족/대표/공용/개별)
      - name: 카드식별자
        data_type: VARCHAR
        description: KB카드에서 발급하는 카드의 카드번호를 대체하여 식별하기 위한 중복되지 않는 값
      - name: 카드BIN번호
        data_type: VARCHAR
        description: 카드의 발급사를 구분하는 BIN 번호이다.
      - name: 카드브랜드구분코드
        data_type: VARCHAR
        description: "카드브랜드구분코드 1:로칼(국민) 2:마스터 3:비자 4:JCB"
      - name: 카드등급구분코드
        data_type: VARCHAR
        description: 카드의 등급을 구분하는 코드로 일반/실버/골드/플래티늄등으로 카드를 구분하는 코드
      - name: 모집카드등급구분코드
        data_type: VARCHAR
        description: 모집이 이루어진 카드의 등급을 구분하는 코드
      - name: 상품코드
        data_type: VARCHAR
        description: 상품대분류+상품중분류+템플릿코드별 상품에 대해 고유하게 부여한 일련번호이다
      - name: 상품대분류구분코드
        data_type: VARCHAR
        description: KB카드 전사차원에서 상품의 대분류를 구분하여 정의한 코드를 관리한다.
      - name: 상품중분류구분코드
        data_type: VARCHAR
        description: KB카드 전사차원에서 상품의 대분류 하위 중분류를 구분하여 정의한 코드를 관리한다.
      - name: 카드등급그룹코드
        data_type: VARCHAR
        description: KB카드사의 카드상품 등급에 대한 분류의 그룹핑 코드
      - name: 제휴코드
        data_type: VARCHAR
        description: 상품코드의 마지막 5자리로 정의,상품코드를 그대로 사용함으로 별도 목록성 테이블은 관리하지 않고 코드로 표기하고자 함
      - name: 관리부점코드
        data_type: VARCHAR
        description: 고객이나 채권,가맹점 등을 관리하는 부점코드
      - name: 최초모집카드여부
        data_type: VARCHAR
        description: 개인과 기업의 카드 중 최초로 모집된 카드
      - name: 유효신용카드여부
        data_type: VARCHAR
        description: 카드가 만료년월일이 경과하지 않고 통합한도가 존재하는 유효한 신용카드인지여부
      - name: 발급유형구분코드
        data_type: VARCHAR
        description: 카드가 발급되는 경우 신규/재발급/자동갱신으로 발급유형을 구분하는 코드
      - name: 도난분실발급여부
        data_type: VARCHAR
        description: 모집카드의 도난분실발급여부
      - name: 교체카드여부
        data_type: VARCHAR
        description: 카드 만료일이 되어서 갱신된 경우와 분실/도난으로 카드를 교체한 여부이다.
      - name: 카드등급변경여부
        data_type: VARCHAR
        description: 카드 재발급 또는 갱신시 카드등급을 변경하여 받은 여부이다.
      - name: 갱신카드여부
        data_type: VARCHAR
        description: 카드 만료일에 갱신발급 받은 여부이다.
      - name: 입력부점코드
        data_type: VARCHAR
        description: 입력을 발생 시킨 부점코드
      - name: 역할유형구분코드
        data_type: VARCHAR
        description: 권유자 역할 유형 코드 (배우자/직원/알바/..)
      - name: 권유자번호
        data_type: VARCHAR
        description: "회원가입신청서 작성시 권유 모집인 식별을 위해 사용하는 번호 역할구분과 모집인번호가 조합 권유자식별자 -모집인구분(역할유형구분코드) +모집인번호(모집인식별내용(M) + 모집인코드)"
      - name: 청구지주소구분코드
        data_type: VARCHAR
        description: 자택, 직장, 제3청구지 등 청구지 주소를 구분하는 코드
      - name: 카드청구지우편번호
        data_type: VARCHAR
        description: 카드 청구지 주소의 우편번호 이다.
      - name: 모집부점코드
        data_type: VARCHAR
        description: 신용카드, 가맹점, 자동납부 신청을 모집한 부점코드
      - name: 회원자격코드
        data_type: VARCHAR
        description: 통합코드의 회원자격코드
      - name: 카드결제기관구분코드
        data_type: VARCHAR
        description: 카드결제계좌의 기관구분코드
      - name: 직업구분코드
        data_type: VARCHAR
        description: 고객의 직업을 구분하는 직업구분코드
      - name: 모집인소속부점코드
        data_type: VARCHAR
        description: 카드모집인의 소속 부점코드이다.
      - name: 회원거래정지여부
        data_type: VARCHAR
        description: 거래정지 범위구분 중 회원제재여부
      - name: 카드거래정지여부
        data_type: VARCHAR
        description: 거래정지 범위구분 중 카드 제재여부를 관리
      - name: 최초모집회원여부
        data_type: VARCHAR
        description: 개인과 기업 중 기존에 발급받은 카드가 없이 최초로 카드가 발급된 회원이지를 관리하는 여부컬럼
      - name: 업체가맹점구분코드
        data_type: VARCHAR
        description: "회원일련번호의 개인기업구분코드가 '2'(기업) 인 경우 해당 회원이 업체인지 가맹점인지 구분하는 코드"
      - name: 통합BSS한도등급
        data_type: VARCHAR
        description: 고객의 연체정보,사용실적,외부평가정보등 통합적인 정보를 활용하여 산출한 BSS(Behavior Score System)한도등급
      - name: 해지후3개월내신규발급여부
        data_type: VARCHAR
        description: 해지 후 3개월 이내에 신규발급인지를 구분한다.
      - name: 카드청구지도로명우편번호
        data_type: VARCHAR
        description: 카드 청구지 주소의 도로명우편번호 이다.
      - name: 카드청구지우편일련번호
        data_type: DECIMAL
        description: 카드 청구지 주소의 우편일련번호 이다.
      - name: 카드청구지도로명우편읍면번호
        data_type: VARCHAR
        description: 카드 청구지 도로명 주소의 우편읍면번호 이다.
      - name: 카드청구지도로명우편보조번호
