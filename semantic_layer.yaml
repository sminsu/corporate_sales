  - name: tbdaaus01
    physical_table: tbdaaus01
    korean_name: 가맹점일별요약
    description: "가맹점의 일자별 요약 정보 스냅샷 테이블. 한 행은 특정 기준년월일의 하나의 가맹점을 의미한다. 가맹점명·지점명·사업자등록번호·가맹점상태·과세유형·관리대상 여부와 유효 기업신용카드 수 등 가맹점 일별 현황 속성을 담아, 일자 시점의 가맹점 현황 분석에 사용한다."
    grain: 기준년월일 × 가맹점번호 1건 (가맹점 일별 스냅샷)
    primary_key: [기준년월일, 가맹점번호]
    synonyms: [가맹점일별, 가맹점요약, 가맹점현황]
    dimensions:
      - name: 가맹점번호
        data_type: VARCHAR
        description: KB카드와 가맹점 계약을 체결한 사업장에 부여하는 식별번호를 나타낸다.
        synonyms: [가맹점ID, 가맹점코드]
        required: true
      - name: 가맹점명
        data_type: VARCHAR
        description: 당사와 가맹점 계약을 체결한 사업장의 명칭을 나타낸다.
        synonyms: [가맹점이름, 상호, 상호명]
      - name: 외부가맹점명
        data_type: VARCHAR
        description: "외부에서 관리하는 소비처(가맹점)의 최신 간판명 혹은 상호명을 나타낸다. / 해당 테이블의 경우, 가맹점 풍성화(왓섭) 기반의 데이터로 셋팅한다."
      - name: 지점명
        data_type: VARCHAR
        description: 해당 가맹점에 대한 지점명을 나타낸다. / 가맹점명내 ~점, ~센터로 끝날 경우, 해당 부분을 추출하여 관리한다.
      - name: 사업자등록번호
        data_type: VARCHAR
        description: 개인기업 또는 법인의 사업자등록증번호
        synonyms: [사업자번호, 사업자등록]
      - name: 법인등록번호
        data_type: VARCHAR
        description: 개인의 주민등록번호처럼 법인 설립 시 주어지는 고유번호. 법인등기부등본,사업자등록증으로 확인
        synonyms: [법인번호]
      - name: 가맹점상태구분코드
        data_type: VARCHAR
        description: 해당 가맹점에 대한 상태구분코드를 나타낸다.
      - name: 가맹점사업주체구분코드
        data_type: VARCHAR
        description: 가맹점의 사업주체가 개인사업자인지 법인사업자(법인포함)인지를 구분하는코드
        value_semantics:
          '2': 법인사업자
        value_semantics_provenance: athena_reference_assumption
      - name: 사업자과세유형구분코드
        data_type: VARCHAR
        description: 해당 가맹점의 사업자 과세유형을 구분하는 코드(일반과세,간이과세 등)를 나타낸다.
      - name: 가맹점관리대상구분코드
        data_type: VARCHAR
        description: "가맹점 관리대상 구분코드를 나타낸다. / 해당 테이블의 경우 [145, 147, 160, 165, 166, 167, 168, 187] 코드에 한하여 셋팅한다. 즉, 영세/중소/대형/일반우대 가맹점 분류용으로 사용한다."
      - name: 적격비용차감가맹점여부
        data_type: VARCHAR
        description: "원가항목을 기준으로 계산된 적격비용을 차감하는 가맹점인지를 여부로 관리한다. / 가맹점관리대상구분코드 146 일 경우, '1'로 셋팅한다."
      - name: 가맹점거래정지여부
        data_type: VARCHAR
        description: 거래정지 범위구분 중 가맹점 제재여부를 관리
      - name: 기업고객식별자
        data_type: VARCHAR
        description: KB카드의 고객에게 부여하는 10자리 식별번호중 기업고객에 대한 식별번호
      - name: 기업고객관리번호
        data_type: VARCHAR
        description: 개인이 아닌 기업체에 대한 고객관리번호
      - name: 대표고객식별자
        data_type: VARCHAR
        description: 해당 가맹점 대표에 대한 고객식별자를 나타낸다. (주대표자 기준)
      - name: 대표고객관리번호
        data_type: VARCHAR
        description: 해당 가맹점 대표에 대한 고객관리번호를 나타낸다. (주대표자 기준)
      - name: 가맹점업종코드
        data_type: VARCHAR
        description: 해당 가맹점에 대한 업종코드를 나타낸다.
      - name: MCC업종코드
        data_type: VARCHAR
        description: 헤당 가맹점에 대한 MCC(Merchant Category Code) 업종코드를 나타낸다.
      - name: 가맹점상품권업종여부
        data_type: VARCHAR
        description: "해당 가맹점 업종코드가 상품권(4200) / 전사상품권(4124,4125,4126) 일때, 상품권업종여부를 '1' 셋팅한다."
      - name: 제휴업체소분류구분코드
        data_type: VARCHAR
        description: 제휴업체를 분류하기 위한 기초자료에 대한 상세분류구분(소분류) 이다.
      - name: 카드대금지급주기구분코드
        data_type: VARCHAR
        description: 해당 가맹점 대금지급주기를 관리하는 코드이다. / TBDAADT01 (가맹점기본)과 산출로직은 동일하다.
      - name: 현금카드결제기관구분코드
        data_type: VARCHAR
        description: 해당 가맹점의 대금지급 결제기관구분코드를 나타낸다. (원화 기준)
      - name: 미화카드결제기관구분코드
        data_type: VARCHAR
        description: 해당 가맹점의 대금지급 결제기관구분코드를 나타낸다. (미화 기준)
      - name: 이용1순위고객연령대구분코드
        data_type: VARCHAR
        description: 전월 당사 매입전표(TBDAABT30) 집계 기준으로 이용금액 1순위 고객 연령대 구분코드를 나타낸다.
      - name: 이용2순위고객연령대구분코드
        data_type: VARCHAR
        description: 전월 당사 매입전표(TBDAABT30) 집계 기준으로 이용금액 2순위 고객 연령대 구분코드를 나타낸다.
      - name: 이용3순위고객연령대구분코드
        data_type: VARCHAR
        description: 전월 당사 매입전표(TBDAABT30) 집계 기준으로 이용금액 3순위 고객 연령대 구분코드를 나타낸다.
      - name: 법정시군구코드
        data_type: VARCHAR
        description: 행안부에서 행정동(법정동)에 부여한 시군구 코드 (시도(2자리) + 시군구(3자리))
      - name: 한글시도명
        data_type: VARCHAR
        description: 행안부 기준으로 맵핑한 한글 시도명을 나타낸다.
      - name: 한글시군구명
        data_type: VARCHAR
        description: 행안부 기준으로 맵핑한 한글 시군구명을 나타낸다.
      - name: 법정동명
        data_type: VARCHAR
        description: 행안부 기준으로 맵핑한 법정동명을 나타낸다. (법률로 지정된 구역 단위의 명)
      - name: 행정동명
        data_type: VARCHAR
        description: 행안부 기준으로 맵핑한 행정동명을 나타낸다. (주민들의 거주지역을 행정상의 편의에 의하여 설정한 행정구역의 단위명)
      - name: KB왓섭매핑여부
        data_type: VARCHAR
        description: KB와 왓섭에서 제공하는 가맹점 부가정보 매핑여부 를 관리한다. · · 가맹점 풍성화(왓섭) 기반의 데이터이다.
      - name: 왓섭KB가맹점매핑정확도등급
        data_type: VARCHAR
        description: "왓섭가맹점에서 사용하는 가맹점 매핑 정확도 등급 (1: 정확도 99% 이상, 2: 정확도 90% 이상, 3: 정확도 90% 미만) · · 가맹점 풍성화(왓섭) 기반의 데이터이다."
      - name: 마케팅업종대분류구분명
        data_type: VARCHAR
        description: 대분류에 속하는 서비스의 세부 업종 또는 사업 형태를 구분한 카테고리를 나타낸다. · · 가맹점 풍성화(왓섭) 기반의 데이터이다.
      - name: 마케팅업종중분류구분명
        data_type: VARCHAR
        description: 중분류에 속하는 핵심 서비스 또는 주력 상품군을 정의한 카테고리를 나타낸다. · · 가맹점 풍성화(왓섭) 기반의 데이터이다.
      - name: 마케팅업종소분류구분명
        data_type: VARCHAR
        description: 소분류 상품군을 목적이나 형태에 따라 상세히 분류한 카테고리를 나타낸다. · · 가맹점 풍성화(왓섭) 기반의 데이터이다.
      - name: 마케팅업종세분류구분명
        data_type: VARCHAR
        description: 세분류 상품군에 대해 특정 상품을 식별할 수 있는 최종 분류 카테고리를 나타낸다. · · 가맹점 풍성화(왓섭) 기반의 데이터이다.
      - name: 마케팅업종세세분류구분명
        data_type: VARCHAR
        description: 세세분류 상품군에 대해 특정 상품을 식별할 수 있는 최종 분류 카테고리를 나타낸다. · · 가맹점 풍성화(왓섭) 기반의 데이터이다.
      - name: 왓섭브랜드코드
        data_type: VARCHAR
        description: "왓섭가맹점부가정보내역 에서 사용하는 BRD(3) + 섹터(4) + 브랜드약자(3) + 시퀀스(3) = 13자리 (ex.뚜레쥬르) · · 가맹점 풍성화(왓섭) 기반의 데이터이다."
      - name: 브랜드명
        data_type: VARCHAR
        description: "해당 가맹점/소비처가 소속된 브랜드에 대해 소비자가 일반적으로 인지가능한 공식 브랜드명 / 해당 테이블의 경우 가맹점 풍성화(왓섭) 기반의 데이터로 셋팅한다."
      - name: 왓섭카테고리코드
        data_type: VARCHAR
        description: "왓섭가맹점부가정보내역에서 사용하는 대/중/소/세/세세 카테고리에 대한 코드값 ('CAT+카테고리Depth별 각 2자리 코드) · · 가맹점 풍성화(왓섭) 기반의 데이터이다."
      - name: 직영점여부
        data_type: VARCHAR
        description: "브랜드 소속 소비처의 운영 형태가 본사 직영점인지, 개인 사업자가 운영하는 가맹점인지 여부를 나타낸다. / 해당 테이블의 경우 가맹점 풍성화(왓섭) 기반의 데이터로 셋팅한다."
      - name: 가맹점예약가능여부
        data_type: VARCHAR
        description: "해당 가맹점/소비처에서 온라인(K사, N사 지도)에 명시한 예약 가능 여부를 나타낸다. / 해당 테이블의 경우 가맹점 풍성화(왓섭) 기반의 데이터로 셋팅한다."
      - name: 가맹점배달가능여부
        data_type: VARCHAR
        description: "해당 가맹점/소비처에서 온라인(K사, N사 지도)에 명시한 배달 가능 여부를 나타낸다. / 해당 테이블의 경우 가맹점 풍성화(왓섭) 기반의 데이터로 셋팅한다."
      - name: 가맹점포장가능여부
        data_type: VARCHAR
        description: "해당 가맹점/소비처에서 온라인(K사, N사 지도)에 명시한 포장 가능 여부를 나타낸다. / 해당 테이블의 경우 가맹점 풍성화(왓섭) 기반의 데이터로 셋팅한다."
      - name: 가맹점주차가능여부
        data_type: VARCHAR
        description: "해당 가맹점/소비처에서 온라인(K사, N사 지도)에 명시한 주차 가능 여부를 나타낸다. / 해당 테이블의 경우 가맹점 풍성화(왓섭) 기반의 데이터로 셋팅한다."
      - name: 가맹점반려동물출입가능여부
        data_type: VARCHAR
        description: "해당 가맹점/소비처에서 온라인(K사, N사 지도)에 명시한 동물 출입 가능 여부를 나타낸다. / 해당 테이블의 경우 가맹점 풍성화(왓섭) 기반의 데이터로 셋팅한다."
      - name: 평일24시간운영여부
        data_type: VARCHAR
        description: "월~금(평일)의 영업시간 기반으로 산출한 데이터로 (휴무일 없이) 00:00 ~24:00 일 경우 '1' 로 관리한다. / 해당 테이블의 경우 가맹점 풍성화(왓섭) 기반의 데이터로 셋팅한다."
      - name: 주말24시간운영여부
        data_type: VARCHAR
        description: "토~일(주말)의 영업시간 기반으로 산출한 데이터로 (휴무일 없이) 00:00 ~24:00 일 경우 '1' 로 관리한다. / 해당 테이블의 경우 가맹점 풍성화(왓섭) 기반의 데이터로 셋팅한다."
      - name: 가맹점카드결제가능여부
        data_type: VARCHAR
        description: "해당 가맹점/소비처에서 온라인(K사, N사 지도)에 명시한 카드 결제 가능 여부를 나타낸다. / 해당 테이블의 경우 가맹점 풍성화(왓섭) 기반의 데이터로 셋팅한다."
      - name: 가맹점카카오페이결제가능여부
        data_type: VARCHAR
        description: "해당 가맹점/소비처에서 온라인(K사, N사 지도)에 명시한 카카오페이 결제 가능 여부를 나타낸다. / 해당 테이블의 경우 가맹점 풍성화(왓섭) 기반의 데이터로 셋팅한다."
      - name: 가맹점네이버페이결제가능여부
        data_type: VARCHAR
        description: "해당 가맹점/소비처에서 온라인(K사, N사 지도)에 명시한 네이버페이 결제 가능 여부를 나타낸다. / 해당 테이블의 경우 가맹점 풍성화(왓섭) 기반의 데이터로 셋팅한다."
      - name: 가맹점제로페이결제가능여부
        data_type: VARCHAR
        description: "해당 가맹점/소비처에서 온라인(K사, N사 지도)에 명시한 제로페이 결제 가능 여부를 나타낸다. / 해당 테이블의 경우 가맹점 풍성화(왓섭) 기반의 데이터로 셋팅한다."
      - name: 가맹점온누리상품권결제가능여부
        data_type: VARCHAR
        description: "해당 가맹점/소비처에서 온라인(K사, N사 지도)에 명시한 온누리상품권 결제 가능 여부를 나타낸다. / 해당 테이블의 경우 가맹점 풍성화(왓섭) 기반의 데이터로 셋팅한다."
      - name: 가맹점지역화폐결제가능여부
        data_type: VARCHAR
        description: "해당 가맹점/소비처에서 온라인(K사, N사 지도)에 명시한 지역화폐 결제 가능 여부를 나타낸다. / 해당 테이블의 경우 가맹점 풍성화(왓섭) 기반의 데이터로 셋팅한다."
      - name: 휴폐업여부
        data_type: VARCHAR
        description: "'국세청 기준으로 사업자등록상태가 '폐업자' 또는 '국세청 미등록'인지 여부를 나타낸다. / 해당 테이블의 경우 가맹점 풍성화(왓섭) 기반의 데이터로 셋팅한다."
        value_semantics:
          '0': 정상 영업
        value_semantics_provenance: athena_reference_assumption
    measures:
      - name: 유효기업신용카드수
        data_type: BIGINT
        description: 해당 가맹점(본인고객식별자, 고객관리번호) 기준으로 소유하고있는 유효 신용카드 좌수를 나타낸다.
        unit: count
        aggregation: semi_additive_latest_snapshot
      - name: 유효기업체크카드수
        data_type: BIGINT
        description: 해당 가맹점(본인고객식별자, 고객관리번호) 기준으로 소유하고있는 유효 체크카드 좌수를 나타낸다.
        unit: count
        aggregation: semi_additive_latest_snapshot
      - name: 유효기업개별카드수
        data_type: BIGINT
        description: 해당 가맹점(본인고객식별자, 고객관리번호) 기준으로 소유하고있는 유효 기업개별카드 좌수를 나타낸다.
        unit: count
        aggregation: semi_additive_latest_snapshot
      - name: 유효기업공용카드수
        data_type: BIGINT
        description: 해당 가맹점(본인고객식별자, 고객관리번호) 기준으로 소유하고있는 유효 기업공용카드 좌수를 나타낸다.
        unit: count
        aggregation: semi_additive_latest_snapshot
      - name: 신용카드가맹점수수료율
        data_type: DECIMAL
        description: 신용카드로 가맹점에서 매출이 발생시 카드사의 수입이 되는 수수료의 비율.
        unit: ratio
        aggregation: recompute_or_weighted_avg
      - name: 체크카드가맹점수수료율
        data_type: DECIMAL
        description: 체크카드로 가맹점에서 매출이 발생시 카드사의 수입이 되는 수수료의 비율.
        unit: ratio
        aggregation: recompute_or_weighted_avg
      - name: MASTER카드수수료율
        data_type: DECIMAL
        description: MASTER카드 사용시 일정비율로 부과하는 수수료에 대한 산정비
        unit: ratio
        aggregation: recompute_or_weighted_avg
      - name: VISA카드수수료율
        data_type: DECIMAL
        description: VISA카드 사용시 일정비율로 부과하는 수수료에 대한 산정비
        unit: ratio
        aggregation: recompute_or_weighted_avg
      - name: JCB카드수수료율
        data_type: DECIMAL
        description: JCB카드 사용시 일정비율로 부과하는 수수료에 대한 산정비
        unit: ratio
        aggregation: recompute_or_weighted_avg
      - name: 전월일시불매입건수
        data_type: BIGINT
        description: 전월 기준의 입력 기준의 일시불매입건수를 나타낸다. / 원천은 TMDAA5E03[DAA월가맹점실적기간별입력월실적집계] 이다.
        unit: count
        aggregation: semi_additive_latest_snapshot
      - name: 전월일시불매입금액
        data_type: DECIMAL
        description: 전월 기준의 입력 기준의 일시불매입금액를 나타낸다. / 원천은 TMDAA5E03[DAA월가맹점실적기간별입력월실적집계] 이다.
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 전월할부매입건수
        data_type: BIGINT
        description: 전월 기준의 입력 기준의 할부매입건수를 나타낸다. / 원천은 TMDAA5E03[DAA월가맹점실적기간별입력월실적집계] 이다.
        unit: count
        aggregation: semi_additive_latest_snapshot
      - name: 전월할부매입금액
        data_type: DECIMAL
        description: 전월 기준의 입력 기준의 합루매입금액를 나타낸다. / 원천은 TMDAA5E03[DAA월가맹점실적기간별입력월실적집계] 이다.
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 대금지급주기일수
        data_type: BIGINT
        description: 해당 가맹점 대금지급주기일수를 나타낸다. / TBDAADT01 (가맹점기본)과 산출로직은 동일하다.
        unit: day
        aggregation: semi_additive_latest_snapshot
      - name: 가맹점일시불지급금액
        data_type: DECIMAL
        description: "당월 기준의 일시불 지급 기준 실적을 나타낸다. / 매출유형별지급현황조회 , TBDAABA12 기준이다. · 대금지급예정년월일이 기준년월보다 클때 + 대금지급예정년월일 기준년월일 보다 작거나 같을때 합산한 금액"
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 가맹점할부지급금액
        data_type: DECIMAL
        description: "당월 기준의 할부 지급 기준 실적을 나타낸다. / 매출유형별지급현황조회 , TBDAABA12 기준이다. · 대금지급예정년월일이 기준년월보다 클때 + 대금지급예정년월일 기준년월일 보다 작거나 같을때 합산한 금액"
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 가맹점총지급금액
        data_type: DECIMAL
        description: "당월 기준의 총지급(일시불+할부) 기준 실적을 나타낸다. / 매출유형별지급현황조회 , TBDAABA12 기준이다. · 대금지급예정년월일이 기준년월보다 클때 + 대금지급예정년월일 기준년월일 보다 작거나 같을때 합산한 금액"
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 가맹점일시불지급예정금액
        data_type: DECIMAL
        description: "당월 기준의 일시불 지급 기준 실적을 나타낸다. / 매출유형별지급현황조회 , TBDAABA12 기준이다. · 대금지급예정년월일이 기준년월보다 클때 + 대금지급예정년월일 기준년월일 보다 클때 합산한 금액"
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 가맹점할부지급예정금액
        data_type: DECIMAL
        description: "당월 기준의 할부 지급 기준 실적을 나타낸다. / 매출유형별지급현황조회 , TBDAABA12 기준이다. · 대금지급예정년월일이 기준년월보다 클때 + 대금지급예정년월일 기준년월일 보다 클때 합산한 금액"
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 가맹점총지급예정금액
        data_type: DECIMAL
        description: "당월 기준의 총지급(일시불+할부) 기준 실적을 나타낸다. / 매출유형별지급현황조회 , TBDAABA12 기준이다. · 대금지급예정년월일이 기준년월보다 클때 + 대금지급예정년월일 기준년월일 보다 클때 합산한 금액"
        unit: KRW
        aggregation: semi_additive_latest_snapshot
      - name: 영업일카드이용비중
        data_type: BIGINT
        description: 전월 당사 매입전표(TBDAABT30) 집계 기준으로 영업일 카드 사용 비중을 나타낸다.(취소금액은제외)
        unit: ratio
        aggregation: recompute_or_weighted_avg
      - name: 휴일카드이용비중
        data_type: BIGINT
        description: 전월 당사 매입전표(TBDAABT30) 집계 기준으로 휴일 카드 사용 비중을 나타낸다.(취소금액은제외)
        unit: ratio
        aggregation: recompute_or_weighted_avg
      - name: 남성카드이용비중
        data_type: BIGINT
        description: "전월 당사 매입전표(TBDAABT30) 집계 기준으로 남성 카드 사용 비중을 나타낸다.(취소금액은제외) · 남성/여성 합산은 100% 아닐수있다. 성별 판단 불가 케이스가 있음"
        unit: ratio
        aggregation: recompute_or_weighted_avg
      - name: 여성카드이용비중
        data_type: BIGINT
        description: "전월 당사 매입전표(TBDAABT30) 집계 기준으로 여성 카드 사용 비중을 나타낸다.(취소금액은제외) · 남성/여성 합산은 100% 아닐수있다. 성별 판단 불가 케이스가 있음"
        unit: ratio
        aggregation: recompute_or_weighted_avg
      - name: 브랜드가맹점수
        data_type: BIGINT
        description: 당사 가맹점 내, 해당 브랜드의 전체 가맹점 수를 나타낸다.
        unit: point
        aggregation: semi_additive_latest_snapshot
    time_dimensions:
      - name: 기준년월일
        data_type: VARCHAR
        description: 해당 데이터를 산출한 기준일자를 나타낸다. (ODATE)
        synonyms: [기준일, 일자, 날짜]
        required: true
        format: YYYYMMDD
        role: snapshot_date

    table_kind: daily_snapshot
    source_definition: 1. TBDAADT01(가맹점기본) + TBDAAUH02(DAA왓섭가맹점부가정보내역) 결합한 가맹점기본이다. 2. 가맹점풍성화(왓섭-TBDAAUH02)의 경우, 월배치임에 따라 가장 최근 데이터 기준으로 집계하여 관리한다. 3. 법정동/행정동 데이터의 경우, 주소표준화 결과값 기준으로
      맵핑한 결과값이다. 4. 가맹점 이용고객에 대한 특성정보는 당사 매입전표(TBDAABT30) 기준으로 집계한다. 5. 자동납부 관련 제휴업체소분류구분코드 로직의 경우, 표준화된 Keasy 화면/테이블과 연계하여 관리한다. (TBDAADA18) * 가맹점번호로 관리되는 제휴업체에 한해서만 매핑된 정보로, 전체 실적은
      TBDAADA18 가맹점번호, PG하위사업자번호, 가맹점번호+PG하위사업자번호로 맵핑하여 산출이 필요하다.
    source_metadata:
