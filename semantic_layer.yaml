        description: MFX월카드통합실적집계의 고객 주소 중 직장의 도로명 우편 읍면번호를 정의한다.
      - name: 직장도로명우편보조번호
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 고객 직장주소 도로명우편보조번호
      - name: 직장도로명구역번호
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 고객 직장주소 도로명구역번호
      - name: 직장주소표시구분코드
        data_type: VARCHAR
        description: MFX월카드통합실적집계의 고객의 직장주소를 보여줄때 일반주소 또는 도로명주소로 표시할지의 구분코드
      - name: 자택우편일련번호
        data_type: DECIMAL
        description: MFX월카드통합실적집계의 고객의 자택주소의 대량배송처별 우편일련번호
      - name: 직장우편일련번호
        data_type: DECIMAL
