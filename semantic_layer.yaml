      explicit_period: 질문에 지정된 연월 범위를 사용
      last_year: 현재 연도 직전 달력연도의 01월부터 12월
      when_missing: 기간이 없으면 조회기간을 확인
      current_date_example: 2026년 실행 시 202501부터 202512
      temporal_attribute_rule: tbdaaat01의 현재 기업규모를 요청 기간 전체의 이용실적에 적용
    deduplication:
      current_customer_size:
        source_grain: tbdaaat01 고객식별자 × 고객관리번호
        target_grain: 고객식별자
        group_by: [고객식별자]
        consistency_guard: COUNT(DISTINCT 기업규모구분코드) = 1
        selected_value: MAX(기업규모구분코드)
      card_customer_month:
        source_grain: tmdaa3e16 기준년월 × 회원일련번호 × 카드구분키번호
        target_grain: 기준년월 × 고객식별자
        group_by: [기준년월, 고객식별자]
        calculation: SUM(COALESCE(금월이용합계금액, 0))
      join_order: 현재 기업규모와 카드 고객×월 이용금액을 각각 목표 grain으로 먼저 축소한 뒤 고객식별자로 JOIN
    filters:
      - tmdaa3e16.개인기업구분코드 = '2'
      - current_customer_size.기업규모구분코드를 질문의 enterprise_size 코드값으로 필터
      - 대기업은 기업규모구분코드 = '1'
      - 여러 기업규모를 요청하면 해당 코드들을 IN 조건으로 적용
      - tmdaa3e16의 기준년월이 요청 기간 사이
    calculation:
      monthly_usage_amount: SUM(카드고객월이용금액)
    result_fields: [기준년월, 기업규모구분코드, 법인카드월이용금액]
    ambiguity_policy:
